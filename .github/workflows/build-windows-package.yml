name: Build Windows package

# Builds a ready-to-run Windows zip (app + its own portable Node + class library).
# Download it from the finished run's "Artifacts" section, or from Releases when a tag like v0.1.0 is pushed.
on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # lets the tag build attach the zip to a Release

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install and build the app
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Assemble the package folder
        run: |
          $out = "ClassroomApp"
          New-Item -ItemType Directory -Force $out | Out-Null
          # The app server (Next.js standalone output) with its dependencies, including the Windows database engine
          Copy-Item -Recurse -Force "app/.next/standalone/*" $out
          # Never ship a database that the build may have created
          Remove-Item -Recurse -Force "$out/data" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$out/.next" | Out-Null
          Copy-Item -Recurse -Force "app/.next/static" "$out/.next/static"
          if (Test-Path "app/public") { Copy-Item -Recurse -Force "app/public" "$out/public" }
          # Portable Node: the exact version that built the app, so the database engine matches it
          New-Item -ItemType Directory -Force "$out/node" | Out-Null
          Copy-Item (Get-Command node).Source "$out/node/node.exe"
          # The class library (read-only teaching files)
          $lib = "$out/library"
          New-Item -ItemType Directory -Force $lib | Out-Null
          foreach ($p in "index.html","simulations","chemistry_notes","organic-chemistry","4-year-course-planner","ap-chemistry","honors-chemistry") {
            if (Test-Path $p) { Copy-Item -Recurse -Force $p $lib }
          }
          foreach ($must in "server.js", ".next/server", ".next/static", "node/node.exe", "node_modules/better-sqlite3") {
            if (-not (Test-Path "$out/$must")) { throw "Package is missing $must" }
          }
          Copy-Item "packaging/Start App.bat" $out
          Copy-Item "packaging/READ ME FIRST.txt" $out
          "Built from commit ${env:GITHUB_SHA} on $(Get-Date -Format u)" | Set-Content "$out/VERSION.txt"

      - name: Check the package starts and every page answers on 127.0.0.1
        run: |
          $env:HOSTNAME = "127.0.0.1"; $env:PORT = "3000"; $env:NODE_ENV = "production"
          $env:CLASSROOM_LIBRARY_DIR = "$PWD/ClassroomApp/library"
          $p = Start-Process -FilePath "$PWD/ClassroomApp/node/node.exe" -ArgumentList "server.js" `
                -WorkingDirectory "$PWD/ClassroomApp" -PassThru -RedirectStandardOutput server.log -RedirectStandardError server.err
          Start-Sleep -Seconds 10
          $bad = @()
          $paths = "/", "/settings", "/library", "/library?q=titration", "/worksheets", "/seating", "/calendar", "/todos", "/lessons", "/pacing", "/share", "/tools",
                   "/gradebook", "/tests", "/rosters", "/files/class/index.html"
          foreach ($path in $paths) {
            try { $code = (Invoke-WebRequest "http://127.0.0.1:3000$path" -UseBasicParsing).StatusCode } catch { $code = $_.Exception.Response.StatusCode.value__ }
            "$path -> $code"
            if ($code -ne 200) { $bad += $path }
          }
          # The localhost lock must refuse a request addressed to some other host name
          try { $r = Invoke-WebRequest "http://127.0.0.1:3000/" -Headers @{ Host = "evil.example.com" } -UseBasicParsing; $lock = $r.StatusCode } catch { $lock = $_.Exception.Response.StatusCode.value__ }
          "host lock -> $lock"
          if ($lock -ne 403) { $bad += "host-lock" }
          # The database file must have been created next to the app
          if (-not (Test-Path "ClassroomApp/data/scoring.db")) { $bad += "database-not-created" }
          Stop-Process $p -Force
          Get-Content server.log, server.err -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "ClassroomApp/data" -ErrorAction SilentlyContinue
          if ($bad.Count) { throw "Smoke test failed: $($bad -join ', ')" }

      - name: Zip it
        run: Compress-Archive -Path ClassroomApp -DestinationPath ClassroomApp-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ClassroomApp-windows
          path: ClassroomApp-windows.zip
          retention-days: 30

      - name: Attach to a Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ClassroomApp-windows.zip
