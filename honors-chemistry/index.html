hree IMFs Complete the table. Draw the Lewis structure, label the molecule polar or non-polar, give the main IMF, and say whether the molecule has a temporary or a permanent dipole. Substance Lewis structure Polarity Main IMF Dipole type Boiling point Water (H₂O) polar hydrogen bonding permanent 100 °C Methyl chloride (CH₃Cl) polar dipole–dipole permanent −24 °C Methane (CH₄) non-polar LDF temporary −161 °C Answers: H₂O (bent), CH₃Cl (tetrahedral), CH₄ (tetrahedral) 2. Draw two CH₃Cl molecules and show the attraction between them. Label the partial charges. Two CH₃Cl molecules oriented so the δ− Cl end of one is near the δ+ (C/H) end of the other; a dashed line between them is the dipole–dipole attraction. 3. Using the strength of the IMFs, explain the boiling point differences in the table. Water has hydrogen bonding (strongest IMF), so it boils at 100 °C; CH₃Cl has dipole–dipole forces, which are weaker, so it boils at −24 °C; methane has only LDF (weakest), so −161 °C. The stronger the IMF, the more energy is needed to separate the molecules. Practice: draw, classify, and list ALL IMFs For each molecule, draw the Lewis structure, decide polar or non-polar, and write every IMF it forms. Molecule Lewis structure Polarity All IMFs Carbon tetrachloride, CCl₄ non-polar LDF Carbon monoxide, CO polar dipole–dipole, LDF Carbon disulfide, CS₂ non-polar LDF Honors Chemistry • Unit 8: Intermolecular Forces • page 9 TEACHER EDITION • ANSWER KEY & NOTES Molecule Lewis structure Polarity All IMFs Hydrogen sulfide, H₂S polar dipole–dipole, LDF Hydrogen fluoride, HF polar hydrogen bonding, dipole– dipole, LDF Oxygen gas, O₂ non-polar LDF Diethyl ether, (CH₃CH₂)₂O polar dipole–dipole, LDF (no O–H, so no H-bonding) Hydrogen cyanide, HCN polar dipole–dipole, LDF (H is on C, not N) Answers: CCl₄, CO, CS₂, H₂S Answers: HF, O₂, diethyl ether, HCN TEACHER NOTE Common slips: HCN — the H is bonded to carbon, so no hydrogen bonding (dipole–dipole + LDF). H₂S — S is not electronegative enough; no hydrogen bonding. Diethyl ether has an O but no O–H, so it accepts but cannot donate Hbonds with itself (its pure-liquid IMFs are dipole–dipole + LDF). CO is only weakly polar; accept dipole–dipole + LDF. 4. Which molecule can form hydrogen bonds with other molecules of its own kind? A) CH₄ B) CH₃Cl C) NH₃ D) H₂S 5. Which of these has only LDF? A) HCl B) CCl₄ C) NH₃ D) H₂O 6. The main IMF in CH₃Cl is… A) LDF B) dipole–dipole C) hydrogen bonding D) ionic bonding 7. Which molecule has a temporary dipole only? A) H₂O B) HF C) CH₄ D) CH₃Cl 8.3 IMFs and the Properties of Liquids Surface tension • evaporation • volatility • hydrogen-bond drawings Honors Chemistry • Unit 8: Intermolecular Forces • page 10 TEACHER EDITION • ANSWER KEY & NOTES BIG IDEA The stronger the IMFs, the harder it is for molecules to leave the liquid or slide past each other. So strong IMFs mean: higher boiling point, lower volatility (evaporates slowly), lower vapor pressure, higher surface tension and higher viscosity. Property What it means Strong IMF → ? Boiling point temperature at which vapor pressure = outside pressure higher Volatility / evaporation rate how quickly a liquid turns to vapor lower Vapor pressure pressure of the vapor above a liquid at equilibrium lower Surface tension how strongly the surface resists being broken (beads up) higher Viscosity resistance to flow (thickness) higher ΔHvap energy needed to vaporize 1 mol of liquid higher LAB CORNER • Three drops on a flat surface A student places 1 drop of each substance (water, pentane and acetone) on a flat surface and draws what they see. The drawings are not labeled with the names. [ IMAGE GOES HERE ] Optional: the three Lewis structures (water, pentane, acetone) from the homework Molecule Main IMF Prediction: drop shape Water hydrogen bonding tall bead (A) Acetone (CH₃)₂C=O dipole–dipole medium (B) Pentane C₅H₁₂ LDF flat, spread out (C) 1. What property is this student testing? How can the student figure out which drop is which substance? Surface tension (and cohesion). The stronger the IMFs, the more the molecules pull toward each other and the more the drop beads up: strongest IMF (water) = tallest drop, weakest (pentane) = flattest. 2. Identify Substance A, B and C. Then explain which of the three would evaporate fastest if left out for 10 minutes. A = water, B = acetone, C = pentane. Pentane evaporates first: it has only LDF, the weakest IMF, so its molecules escape into the gas phase most easily. (Water has the strongest IMF and evaporates slowest.) Honors Chemistry • Unit 8: Intermolecular Forces • page 11 TEACHER EDITION • ANSWER KEY & NOTES Drawing hydrogen bonds 3. Draw two water molecules and show how they are attracted to each other (label δ+, δ− and the hydrogen bond). O δ− of one molecule and an H δ+ of the other, joined by a dashed line (the hydrogen bond), with the H lying roughly on the line O–H···O. The structure of ethanol is CH₃CH₂–O–H. Which diagram correctly shows how ethanol hydrogen-bonds with water? (Dashes = hydrogen bond.) A B C 4. Circle the correct diagram and explain why the other two are wrong. A is correct: the H bonded to O in ethanol (δ+) is attracted to the lone pair on water’s O (δ−). B uses an H bonded to carbon (not N, O or F); C joins two oxygen atoms (δ− with δ−: they repel). (Water’s H pointing to ethanol’s O would also be a correct hydrogen bond.) LAB CORNER • Evaporative cooling Three thermometers are wrapped in cotton soaked with Liquid A, B or C (water, pentane or acetone in some order). All start at 22.0 °C and are held in the air for 3 minutes. Liquid Start (°C) After 3 min (°C) Change (°C) Which liquid? (water / acetone / pentane) A 22.0 3.0 −19.0 pentane B 22.0 8.5 −13.5 acetone C 22.0 18.5 −3.5 water 5. Complete the table, then identify each liquid. Explain how evaporation cools the thermometer and why the liquid with the weakest IMF cooled the most. Evaporation takes the highest-energy molecules (they can overcome the IMFs and escape), so the energy that leaves the liquid cools the thermometer. A liquid with weak IMFs (pentane) evaporates fastest, so it removes energy fastest and cools the most. Water’s strong hydrogen bonds make it evaporate slowly (smallest cooling). Honors Chemistry • Unit 8: Intermolecular Forces • page 12 TEACHER EDITION • ANSWER KEY & NOTES TEACHER NOTE — LAB Sample data (typical for 3-minute trials with filter paper or cotton): pentane ≈ −15 to −20 °C change, acetone ≈ −10 to −15 °C, ethanol ≈ −8 to −10 °C, water ≈ −3 to −5 °C. Safety: no flames (pentane, acetone and ethanol are flammable), good ventilation, goggles. Hexane or hexanes can replace pentane. Students may also wrap the bulb with filter paper and a rubber band. 6. Which liquid should have the highest surface tension? A) pentane B) acetone C) water D) hexane 7. Which substance is the most volatile? A) C₂H₆ B) H₂O C) CH₃OH 8.4 D) NaCl(aq) Putting It All Together Ranking • boiling point • ΔHvap • calculations BIG IDEA When comparing substances: (1) list every IMF each one has; (2) compare the strongest type (hydrogen bonding > dipole–dipole > LDF); (3) if the type is the same, the one with more electrons (bigger molecules) wins. 1. Look at the graph. In groups 14, 15, 16 and 17 the boiling point generally increases down a group. Why? Which three compounds break this trend ","id":22},{"kind":"file","unit":"Course-wide","type":"Notes","title":"Nomenclature Notes","file":"Nomenclature Notes.docx","path":"Units/Course-wide/Notes/Nomenclature Notes.docx","ext":"docx","size":43076,"teacher":false,"pdf":"_pdf/84307de7822e.pdf","text":"Chemical Nomenclature Honors Chemistry Notes: naming compounds and writing formulas Ionic vs. covalent: A metal + nonmetal (or a polyatomic ion) forms an ionic compound. Two nonmetals form a covalent (molecular) compound. Acids are hydrogen compounds that produce H⁺ in water. 1. Binary Ionic Compounds A binary ionic compound contains exactly two elements: a metal (cation) and a nonmetal (anion). Use this section for metals with only one possible charge (Groups 1, 2, and Al, Zn, Ag). Naming 1. Name the metal (cation) first, using its element name unchanged. 2. Name the nonmetal (anion) second, changing the ending to -ide. 3. Do not use prefixes. The charges already determine the ratio. Writing the formula 4. Write the symbol and charge of each ion (cation first). 5. Balance the charges: decide how many of each ion are needed so the total positive charge equals the total negative charge. Use the smallest numbers that work. 6. Write those numbers as subscripts. Leave out subscripts of 1. 7. Check that the total positive charge equals the total negative charge. Common charges Group 1 2 13 15 16 17 Other fixed Charge 1+ 2+ 3+ 3− 2− 1− Examples Li⁺, Na⁺, K⁺ Mg²⁺, Ca²⁺, Ba²⁺ Al³⁺ N³⁻, P³⁻ O²⁻, S²⁻ F⁻, Cl⁻, Br⁻, I⁻ Zn²⁺, Ag⁺ Worked examples: naming Example: Name NaCl Step 1: Name the metal. Na is sodium. Step 2: Name the nonmetal with -ide. Cl is chlorine, which becomes chloride. Step 3: No prefixes. Do not say \"monosodium.\" Answer: sodium chloride Example: Name CaBr₂ Step 1: Name the metal. Ca is calcium. Step 2: Name the nonmetal with -ide. Br is bromine, which becomes bromide. Step 3: No prefixes. The subscript 2 is not stated in the name. Answer: calcium bromide Example: Name Li₃N Step 1: Name the metal. Li is lithium. Step 2: Name the nonmetal with -ide. N is nitrogen, which becomes nitride. Step 3: No prefixes. The 3 is not stated. Answer: lithium nitride Worked examples: writing formulas Example: Formula for magnesium oxide Step 1: Write the ions with charges. Mg²⁺ and O²⁻. Step 2: Balance the charges. One Mg²⁺ gives 2+. One O²⁻ gives 2−. One of each already cancels. Step 3: Write the subscripts. One of each, so no subscripts are written: MgO. Step 4: Check charges. (2+) + (2−) = 0. Answer: MgO Example: Formula for aluminum sulfide Step 1: Write the ions with charges. Al³⁺ and S²⁻. Step 2: Balance the charges. One Al³⁺ gives 3+, but one S²⁻ gives only 2−. Find the smallest charge both can reach: 6. Two Al give 2 × (3+) = 6+. Three S give 3 × (2−) = 6−. Step 3: Write the subscripts. 2 Al and 3 S: Al₂S₃. Step 4: Check charges. 6+ + 6− = 0. Answer: Al₂S₃ Example: Formula for sodium sulfide Step 1: Write the ions with charges. Na⁺ and S²⁻. Step 2: Balance the charges. One S²⁻ gives 2−. Each Na⁺ gives only 1+, so two Na are needed to reach 2+. Step 3: Write the subscripts. 2 Na and 1 S (the 1 is not written): Na₂S. Step 4: Check charges. 2(1+) + (2−) = 0. Answer: Na₂S 2. Ionic Compounds with Polyatomic Ions A polyatomic ion is a group of atoms that carries an overall charge and behaves as a single unit. The ion names and charges must be memorized. Name Ammonium Nitrate Sulfate Phosphate Carbonate Formula NH₄⁺ NO₃⁻ SO₄²⁻ PO₄³⁻ CO₃²⁻ Acetate Chlorate Chlorite Permanganate Dichromate C₂H₃O₂⁻ ClO₃⁻ ClO₂⁻ MnO₄⁻ Cr₂O₇²⁻ Name Hydroxide Nitrite Sulfite Phosphite Hydrogen carbonate (bicarbonate) Cyanide Perchlorate Hypochlorite Chromate Peroxide Formula OH⁻ NO₂⁻ SO₃²⁻ PO₃³⁻ HCO₃⁻ CN⁻ ClO₄⁻ ClO⁻ CrO₄²⁻ O₂²⁻ Pattern for oxyanions (chlorine): per___ate (most O) → ___ate → ___ite → hypo___ite (least O). The charge stays the same; only the number of oxygens changes. Naming 8. Name the cation, then the anion. 9. Keep the polyatomic ion name exactly as is. Do not change its ending to -ide. 10. If a monatomic ion is paired with a polyatomic ion, only the monatomic one takes -ide (for example, NH₄Cl is ammonium chloride). Writing the formula 11. Write each ion with its charge. 12. Balance the charges: decide how many of each ion are needed so the total positive charge equals the total negative charge. Treat each polyatomic ion as one unit. 13. Write those numbers as subscripts. If a polyatomic ion is needed more than once, put it in parentheses: (NO₃)₂. Never change the subscripts inside the ion. 14. Check that the total positive and negative charges cancel. Worked examples: naming Example: Name K₂SO₄ Step 1: Name the cation, then the anion. K is potassium. SO₄ is a polyatomic ion. Step 2: Keep the polyatomic name. SO₄²⁻ is sulfate (no -ide). Answer: potassium sulfate Example: Name Ca(NO₃)₂ Step 1: Name the cation. Ca is calcium. Step 2: Find the polyatomic ion. The group in parentheses is NO₃⁻, nitrate. The 2 outside the parentheses only tells how many, so it is not in the name. Answer: calcium nitrate Example: Name NH₄Cl Step 1: Name the cation. NH₄⁺ is ammonium (a polyatomic cation). Step 2: Name the anion. Cl⁻ is a monatomic ion, so it takes -ide: chloride. Answer: ammonium chloride Worked examples: writing formulas Example: Formula for ammonium phosphate Step 1: Write the ions with charges. NH₄⁺ and PO₄³⁻. Step 2: Balance the charges. One PO₄³⁻ gives 3−. Each NH₄⁺ gives only 1+, so three NH₄ are needed to reach 3+. Step 3: Write the subscripts. 3 NH₄ and 1 PO₄. Only NH₄ is repeated, so only it gets parentheses: (NH₄)₃PO₄. Step 4: Check charges. 3(1+) + (3−) = 0. Answer: (NH₄)₃PO₄ Example: Formula for aluminum hydroxide Step 1: Write the ions with charges. Al³⁺ and OH⁻. Step 2: Balance the charges. One Al³⁺ gives 3+. Each OH⁻ gives only 1−, so three OH are needed to reach 3−. Step 3: Write the subscripts. 1 Al and 3 OH. OH is repeated, so it goes in parentheses: Al(OH)₃. Step 4: Check charges. (3+) + 3(1−) = 0. Answer: Al(OH)₃ Example: Formula for calcium carbonate Step 1: Write the ions with charges. Ca²⁺ and CO₃²⁻. Step 2: Balance the charges. One Ca²⁺ gives 2+. One CO₃²⁻ gives 2−. One of each already cancels. Step 3: Write the subscripts. One of each, so no subscripts and no parentheses: CaCO₃. Step 4: Check charges. (2+) + (2−) = 0. Answer: CaCO₃ 3. Ionic Compounds with Transition Metals Most transition metals (and some others, such as Sn and Pb) can form more than one cation, so the name must show which charge the metal has. We use a Roman numeral in parentheses equal to the metal ion's charge. Ion Fe²⁺ Cu⁺ Sn²⁺ Pb²⁺ Co²⁺ Mn²⁺ Hg²⁺ Stock name iron(II) copper(I) tin(II) lead(II) cobalt(II) manganese(II) mercury(II) Ion Fe³⁺ Cu²⁺ Sn⁴⁺ Pb⁴⁺ Co³⁺ Cr³⁺ Hg₂²⁺ Stock name iron(III) copper(II) tin(IV) lead(IV) cobalt(III) chromium(III) mercury(I) Exceptions with a single charge (no Roman numeral): Ag⁺, Zn²⁺, Cd²⁺, and Al³⁺. Naming: find the metal's charge 15. Identify the anion and its charge (from the periodic table or polyatomic ion list). 16. Multiply the anion charge by its subscript to get the total negative charge. 17. The total positive charge must equal this. Divide by the number of metal atoms to get the charge on each metal ion. 18. Write the metal name with the Roman numeral, then the anion name. Writing the formula 19. Write the metal ion using the charge given by the Roman numeral, and the anion with its charge. 20. Balance the charges: decide how many of each ion are needed so the total positive charge equals the total negative charge. 21. Write those numbers as subscripts (use parentheses for a repeated polyatomic ion). 22. Check that the total positive and negative charges cancel. Worked examples: naming Example: Name FeCl₃ Step 1: Anion and charge. Cl⁻ (chloride), 1−. Step 2: Total negative charge. 3 × (1−) = 3−. Step 3: Charge on each metal. One Fe must balance 3−, so Fe is 3+. Step 4: Write the name. Iron(III) plus chloride. Answer: iron(III) chloride Example: Name Cu₂O Step 1: Anion and charge. O²⁻ (oxide), 2−. Step 2: Total negative charge. 1 × (2−) = 2−. Step 3: Charge on each metal. Two Cu must total 2+, so each is 2+ ÷ 2 = 1+. Step 4: Write the name. Copper(I) plus oxide. Answer: copper(I) oxide Example: Name Fe₂(SO₄)₃ Step 1: Anion and charge. SO₄²⁻ (sulfate), 2−. Step 2: Total negative charge. 3 × (2−) = 6−. Step 3: Charge on each metal. Two Fe must total 6+, so each is 6+ ÷ 2 = 3+. Step 4: Write the name. Iron(III) plus sulfate. Answer: iron(III) sulfate Worked examples: writing formulas Example: Formula for lead(IV) oxide Step 1: Write the ions with charges. Roman numeral IV means Pb⁴⁺. Oxide is O²⁻. Step 2: Balance the charges. One Pb⁴⁺ gives 4+. Each O²⁻ gives 2−, so two O are needed to reach 4−. Step 3: Write the subscripts. 1 Pb and 2 O: PbO₂. Step 4: Check charges. (4+) + 2(2−) = 0. Answer: PbO₂ Example: Formula for copper(II) nitrate Step 1: Write the ions with charges. Cu²⁺ and NO₃⁻. Step 2: Balance the charges. One Cu²⁺ gives 2+. Each NO₃⁻ gives 1−, so two NO₃ are needed to reach 2−. Step 3: Write the subscripts. 1 Cu and 2 NO₃. NO₃ is repeated, so it goes in parentheses: Cu(NO₃)₂. Step 4: Check charges. (2+) + 2(1−) = 0. Answer: Cu(NO₃)₂ Example: Formula for iron(III) oxide Step 1: Write the ions with charges. Fe³⁺ and O²⁻. Step 2: Balance the charges. One Fe³⁺ gives 3+, but one O²⁻ gives only 2−. Find the smallest charge both can reach: 6. Two Fe give 2 × (3+) = 6+. Three O give 3 × (2−) = 6−. Step 3: Write the subscripts. 2 Fe and 3 O: Fe₂O₃. Step 4: Check charges. 2(3+) + 3(2−) = 0. Answer: Fe₂O₃ 4. Covalent (Molecular) Compounds Covalent compounds contain two nonmetals. Because nonmetals can combine in several ratios, prefixes show how many atoms of each element are present. Number 1 2 3 4 Prefix monoditritetra- Number 6 7 8 9 Prefix hexaheptaoctanona- 5 penta- 10 deca- Naming 23. Name the first element with a prefix for its count, except omit mono- on the first element. 24. Name the second element with a prefix (always, including mono-) and the ending -ide. 25. Drop the final a or o of the prefix when the element name begins with a vowel (monoxide, pentoxide, not monooxide, pentaoxide). Writing the formula 26. Write the symbols in the same order as in the name. 27. Turn each prefix into a subscript (no prefix on the first element means 1). 28. Do not balance charges or reduce. Worked examples: naming Example: Name CO₂ Step 1: First element. One C, so no prefix: carbon. Step 2: Second element. Two O, so di- plus oxide: dioxide. Answer: carbon dioxide Example: Name CO Step 1: First element. One C, no prefix: carbon. Step 2: Second element. One O, so mono- is used on the second element, and the a drops before a vowel: monoxide. Answer: carbon monoxide Example: Name N₂O₄ Step 1: First element. Two N: dinitrogen (the first element uses a prefix when the count is above 1). Step 2: Second element. Four O: tetra- plus oxide, and the a drops: tetroxide. Answer: dinitrogen tetroxide Example: Name PCl₅ Step 1: First element. One P, no prefix: phosphorus. Step 2: Second element. Five Cl: penta- plus chloride. Answer: phosphorus pentachloride Worked examples: writing formulas Example: Formula for sulfur hexafluoride Step 1: Write the symbols in order. S then F. Step 2: Prefixes to subscripts. Sulfur has no prefix, so 1. Hexa- means 6. Answer: SF₆ Example: Formula for diphosphorus pentoxide Step 1: Write the symbols in order. P then O. Step 2: Prefixes to subscripts. Di- means 2, and penta- means 5. Answer: P₂O₅ (do not reduce) Example: Formula for carbon tetrachloride Step 1: Write the symbols in order. C then Cl. Step 2: Prefixes to subscripts. No prefix means 1, and tetra- means 4. Answer: CCl₄ Note: some covalent compounds have common names used instead: H₂O (water), NH₃ (ammonia), CH₄ (methane). 5. Acids An acid is a compound that releases H⁺ in water. Acid formulas are written with H first, followed by an anion. The acid name comes from the name of that anion. The one rule to remember Look at the ending of the anion, then swap it as shown: If the anion ends in… -ide The acid name is… hydro- + root + -ic acid -ate -ite root + -ic acid root + -ous acid Example (anion → acid) chloride → hydrochloric acid (HCl) nitrate → nitric acid (HNO₃) nitrite → nitrous acid (HNO₂) Memory aid: \"I ate something icky.\" -ate becomes -ic, so -ite becomes -ous. Only the -ide acids get the hydro- prefix, and they contain no oxygen. Root note: for sulfur and phosphorus the root is longer: sulfate → sulfuric, phosphate → phosphoric. Naming an acid from its formula 29. Find the anion. It is everything after the H. (HCl: Cl⁻. H₂SO₄: SO₄²⁻.) 30. Name the anion, including its ending (chloride, sulfate). 31. Look up the ending in the table above and build the acid name. 32. Write \"acid\" as a separate word. Writing an acid formula from its name 33. Work backward using the table: hydro-…-ic means the anion ends in -ide; -ic means -ate; ous means -ite. 34. Write the anion and its charge. 35. Write H first. The number of H⁺ needed equals the size of the anion charge, so that the total charge is zero. 36. Do not write the charges in the final formula. Worked examples: naming Example: Name HBr Step 1: Find the anion. After H is Br⁻. Step 2: Name the anion. Bromide, which ends in -ide. Step 3: Use the table. -ide → hydro- + root + -ic: hydrobromic. Answer: hydrobromic acid Example: Name H₂SO₄ Step 1: Find the anion. After H₂ is SO₄²⁻. Step 2: Name the anion. Sulfate, which ends in -ate. Step 3: Use the table. -ate → root + -ic (keep the longer root for sulfur): sulfuric. Answer: sulfuric acid Example: Name HClO₂ Step 1: Find the anion. After H is ClO₂⁻. Step 2: Name the anion. Chlorite, which ends in -ite. Step 3: Use the table. -ite → root + -ous: chlorous. Answer: chlorous acid Worked examples: writing formulas Example: Formula for phosphoric acid Step 1: Work backward. -ic means the anion ends in -ate: phosphate. Step 2: Write the anion and charge. PO₄³⁻. Step 3: Add H. The anion has a 3− charge, so three H⁺ are needed. Answer: H₃PO₄ Example: Formula for hydrosulfuric acid Step 1: Work backward. hydro-…-ic means the anion ends in -ide: sulfide. Step 2: Write the anion and charge. S²⁻. Step 3: Add H. The anion has a 2− charge, so two H⁺ are needed. Answer: H₂S Example: Formula for nitrous acid Step 1: Work backward. -ous means the anion ends in -ite: nitrite. Step 2: Write the anion and charge. NO₂⁻. Step 3: Add H. The anion has a 1− charge, so one H⁺ is needed. Answer: HNO₂ Quick Decision Guide Compound type Binary ionic With polyatomic ions With transition metals Covalent Acid Clue Metal + nonmetal Contains a polyatomic ion Metal that has multiple charges Two nonmetals H first, in water Naming rule metal + nonmetal-ide use ion names as they are Roman numeral for the metal charge prefixes, no reduction hydro-ic, -ic, or -ous","id":23},{"kind":"link","unit":"Course-wide","type":"Virtual Labs","title":"Enthalpy of Dissolution Virtual Lab","url":"https://davidmoriarty-lab.github.io/School_Stuff/simulations/enthalpy-dissolution-lab/","text":"Virtual lab: measure the temperature change when different salts dissolve in water.","teacher":false,"id":24},{"kind":"link","unit":"Course-wide","type":"Virtual Labs","title":"Periodic Table Highway","url":"https://davidmoriarty-lab.github.io/School_Stuff/simulations/periodic-table-highway/","text":"Lane-switching driving game for learning element symbols.","teacher":false,"id":25},{"kind":"file","unit":"Unsorted","type":"Homework","title":"Bonding Homework Modified","file":"Bonding Homework Modified.docx.pdf","path":"Units/Unsorted/Homework/Bonding Homework Modified.docx.pdf","ext":"pdf","size":298253,"teacher":false,"pdf":"Units/Unsorted/Homework/Bonding Homework Modified.docx.pdf","text":"Topic 9.1 – Types of Chemical Bonds 1.​ Atoms form bonds to achieve a full octet. What does it mean for an atom to obtain a full octet? 2.​ An ionic bond is formed between two atoms, a cation and an anion. Answer the following questions regarding an ionic bond. a.​ What type of element typically forms a cation? Does the atom give or take electrons? b.​ What type of element typically forms an anion? Does the atom give or take electrons? 3.​ Complete the table below. Element # of Valence e- lose or take e-? Cation or Anion? Ion Charge Sodium Fluorine Aluminum Boron Nitrogen Sulfur 4.​ A covalent bond is another method that atoms can use to achieve a full octet. a.​ How does a covalent bond differ from an ionic bond? Talk about the elements that form this bond and the behavior of the electrons. b.​ Some compounds contain single, double, and triple bonds. What is the difference between a single, double, and triple bond? 5.​ Complete the table below. Determine if each compound will form an ionic bond or a covalent bond. Compound NO2 MgBr2 CaO PI3 SO2 CaI2 1st Element – Metal or Non-metal? 2nd Element – Metal or Non-Metal? Ionic or covalent bond between the atoms? Topic 9.2 – Properties of Chemical Bonds 1.​ A data table has been provided to the right. Answer the questions below regarding the table. a.​ Identify each compound as ionic or covalent in the space provided. b.​ Some compounds have a large discrepancy in the melting point. Provide an explanation using the bond found within those compounds. Substance Ionic or Covalent? CaCl2 Melting Point 772oC State at Room Temperature Solid H2O 0oC Liquid MgO 2852oC Solid NH3 o -77 C Gas SrO o 2531 C Solid 146oC Solid H2S C6H12O6 c.​ Based on the trend discussed in part b, do you expect H2S to have a low or high melting point? Explain your answer by discussing the bond found within H2S. 2.​ A student is testing the conductivity of certain compounds in their different states of matter. The beakers provided below show the different substances the student is testing. a.​ For a substance to conduct electricity, what must be present? b.​ Which substances should the student expect to conduct electrical current? Explain your answer. c.​ For the solutions that you did not choose in part B, explain why you don’t expect them to conduct an electrical current. Topic 9.3 – Lewis Diagrams for Ionic and Covalent Compounds 1.​ A student obtains bottles of potassium oxide and calcium oxide. a.​ What kind of chemical bond is found in both compounds?_____________ b.​ What state of matter do you expect these compounds to be in?_____________ c.​ The formulas for potassium oxide and calcium chloride are K2O and CaO respectively. i.​ Using Lewis dot diagrams, model the bonding that occurs in each compound to explain why the chemical formulas are different. d.​ The student grabs another compound that is similar to the ones mentioned above. The label has worn off, but the student knows that this compound contains lithium and nitrogen. Use a Lewis dot diagram to derive the chemical formula of this compound. 2.​ A student is interested in learning about the bond lengths of 3 compounds. a.​ The first diagram is complete, but the 2nd and 3rd are incomplete. Finish the diagrams by adding in the correct number of electrons and bonds. b.​ Which of the carbon-carbon bonds is the shortest? Explain your answer by discussing the attraction between the protons and electrons. 3.​ Complete more practice below over drawing Lewis structures! Topic 9.4 – Lewis Structures and VSEPR Theory 1.​ VSEPR Theory provides an explanation as to how molecules can form different shapes. In your own words, explain the big idea behind VSEPR theory and why molecules arrange themselves into specific orientations. 2.​ Complete the Lewis structures below and identify the shape and the angles present in each. Compound Lewis Structure/Shape/Angle(s) NO3-1 Compound Lewis Structure/Shape/Angle(s) OF2 Shape: Angle: PF5 Shape: Angle: CO2 Shape: Angle: PH3 SCl6 Shape: Angle: Shape: Angle: 3.​ Identify the shape and angle of each provided Lewis Structure 4.​ The molecule provided below contains many bonds and atoms. Determine the shape around each atom indicated. Topic 9.5 – Lewis Structures/VSEPR/Polarity Read this first! 1)​ Carbon and hydrogen are VERY CLOSE in electronegativity values. Therefore, the carbon-hydrogen bond does NOT form a dipole. You DO NOT need to draw an arrow for a carbon-hydrogen bond. 2)​ The order of the top 4 electronegativities a.​ Fluorine > oxygen > chlorine > nitrogen For the problems below, draw arrows for each bond indicated the pull of the electrons. Determine if the molecule is polar or non-polar. If the molecule is polar, assign partial charges to each element in the molecule.","id":26},{"kind":"file","unit":"Unsorted","type":"Homework","title":"Cover Page and HW","file":"Cover Page and HW.docx.pdf","path":"Units/Unsorted/Homework/Cover Page and HW.docx.pdf","ext":"pdf","size":227175,"teacher":false,"pdf":"Units/Unsorted/Homework/Cover Page and HW.docx.pdf","text":"Unit 1 Atomic Structure Topic Breakdown 1.1​ – ​ Atomic Structure​ ​ ​ ​ Due Date: ______________ 1.2​ – ​ Atomic History​ ​ ​ Due Date: ______________ 1.3​ – ​ Isotopes and Atomic Mass​ ​ Due Date: ______________ 1.4​ – ​ Avogadro’s Number​ Due Date: ______________ ​ ​ ​ Test Date: Wednesday, September 3rd To be eligible for retakes, all homework must be completed and submitted. If you have any missing assignments for that unit, you will not be permitted to retake the assessment. Topic homework must be scanned as a PDF and uploaded to Schoology by the assigned due date. Submissions will be locked once the deadline has passed. If you miss the deadline, you may earn up to 50% credit by showing your work to me in person. This will allow you to maintain your eligibility for a retake. 1.1​Atomic Structure and Properties 1.​ What are the 3 subatomic particles present in an atom? ___________________________________________________ 2.​ Briefly describe the location of each subatomic particle that you listed above. Be specific about where they are found. a.​ ________________________________________________ b.​ ________________________________________________ c.​ ________________________________________________ 3.​ 4.​ 5.​ 6.​ Which particle controls the identity of the atom? _______________________ Which particle(s) control the mass of the atom? ________________________ Which particle(s) control the overall charge of the atom? _______________________ Label the parts of the following diagram 7.​ Fill in the table below with the appropriate information. Assume all atoms contain a neutral charge. Isotope Name Nuclear Symbol Atomic Number Mass Number 12 24 # of Protons # of # of Electrons Neutrons 1.​ calcium-40 2.​ 1 3.​ 2 4.​ 26 5.​ 201 6.​ 7.​ 17 30 80 18 8.​ How does an atom form an ion? __________________________________________ 9.​ What are the two types of ions? __________________________ 10.​ Identify each of the following as one of the types of ions you listed above. List out the number of protons and electrons for each. a.​ Mg+2 ​ ____________​ ​ p+ : _____​​ e- : _____ b.​ F-​ ​ ____________​ ​ p+ : _____​​ e- : _____ -2​ ​ + c.​ S ____________​ ​ p : _____​​ e- : _____ d.​ Li+​ ​ ____________​ ​ p+ : _____​​ e- : _____ 1.2​ – Atomic History 1.​ When 24.0 g magnesium burns in the presence of oxygen according to the reaction below, the final product has a mass of 40.0 grams. Calculate the amount of oxygen gas that was reacted. 2Mg + O2 2MgO 24 g​ 40.0 g _____g​ a.​ Calculate the amount of oxygen that reacted with the magnesium. b.​ Explain your answer above using one Dalton’s Atomic Theory. 2.​ Dalton believed that atoms were the smallest form of matter and that they were indivisible. Refute that idea with modern atomic theory. 3.​ J.J. Thomson was an English scientist who performed research using a cathode ray tube (Crooke’s tube). a.​ What major subatomic particle did J.J. Thomson discover? _______________ b.​ J.J. Thomson determined that this subatomic particle had a charge. What evidence did J.J. Thomson use to determine the charge of the particle he discovered? c.​ J.J. Thomson developed a model for the atomic based on his discovery. Write the name for the model and draw it below. Provide a brief description of the model. 4.​ Ernest Rutherford conducted a famous experiment using gold foil and a beam of alpha particles produced by a radioactive source of radium. Alpha particles are positively charged Helium atoms that are ejected from a radioactive element. Thomson believed that these alpha particles had enough energy to pass through atoms. a.​ The alpha particles were predicted to pass right through atoms based on the model developed by J.J. Thomson. Why did Rutherford believe this? Remember that positive charges repel each other. Why would Rutherford expect a positive alpha particle to travel right through the positive charge of the plum pudding model? b.​ Discuss the results of the experiment. Be specific about what occurred to the alpha particles. c.​ Based on the experiment, describe what Rutherford proposed about the atom and draw his model that he developed. ​ Topic 1.3 – Isotopes and Atomic Mass 1.​ What is an isotope? 2.​ Why are the atomic masses of each element typically a decimal? 3.​ Carbon has 3 known naturally occurring isotopes: C-12, C-13, and C-14. The table provided below indicates the abundance for each known isotope. C-12 98.9% a.​ A student obtains 1000 atoms of a carbon sample. Assume that the C-13 1.1% sample contains no atoms of C-14. How many atoms of C-12 and C-14 Trace C-13 are assumed to be present in the sample of carbon? C-12: _____​ ​ C-13: _____ b.​ Explain why the atomic mass of carbon is closer to C-12 than C-13 or C-14. 4.​ A student is analyzing a sample of an unknown element X. Element X has 3 isotopes with the abundances provided below in the data table. Calculate the atomic mass of element X and determine the identity of the X-29 35.5% element. X-30 42.6% X-31 21.9% 5.​ Calculate the average atomic mass for the following element given information about the relevant isotopes. Identify unknown element. (Isotope 1) Mass = 20 amu; Isotopic abundance = 90.92% (Isotope 2) Mass = 21 amu; Isotopic abundance = 0.257% (Isotope 3) Mass = 22 amu; Isotopic abundance = 8.82% 6.​ In the world of chemistry, atoms are so small that we need a unit to quantify a collection of atoms, just like we use a dozen to quantify items. a.​ What is the unit we use to quantify atoms? _____________ b.​ What is the relationship between the number of atoms and the unit you answered above? 7.​ A student obtains 1 mole of element X (from problem number 4). a.​ How many atoms of X are present? b.​ The student wishes to calculate the number of atoms of each isotope present in 1 mole of element X. Use the percentages in the data table in problem 4 to help. Atoms of X-29 : __________ Atoms of X-30: ___________ Atoms of X-31: ___________ Topic 1.4 – Avogadro’s Number and Molar Mass 1.​ In the world of chemistry, atoms are so small that we need a unit to quantify a collection of atoms, just like we use a dozen to quantify items. a.​ What is the unit we use to quantify atoms? _____________ b.​ What is the relationship between the number of atoms and the unit you answered above? 2.​ A student obtains 1 mole of element X (from problem number 4). a.​ How many atoms of X are present? b.​ The student wishes to calculate the number of atoms of each isotope present in 1 mole of element X. Use the percentages in the data table in problem 4 to help. Atoms of X-29 : __________ Atoms of X-30: ___________ Atoms of X-31: ___________ 3.​ For the following elements, how many grams are present in 1 mole of each substance? a.​ Carbon: _________ d.​ Sodium: ________ b.​ Oxygen: _________ e.​ Potassium: _______ c.​ Neon: ________ f.​ Phosphorus: ________ 4.​ Using avogadro’s number, perform the following conversions. a.​ Convert 2.50 moles of carbon to atoms of carbon. An outline for the dimensional analysis has been started for you. b.​ Convert 1.50 moles of lithium to atoms of lithium. c.​ Convert 5.15x1023 atoms of sulfur to moles of sulfur d.​ Convert 1.25x1024 atoms of silicon to moles of silicon.","id":27},{"kind":"file","unit":"Unsorted","type":"Homework","title":"Honors Thermo Topic HW","file":"Honors Thermo Topic HW.pdf","path":"Units/Unsorted/Homework/Honors Thermo Topic HW.pdf","ext":"pdf","size":362592,"teacher":false,"pdf":"Units/Unsorted/Homework/Honors Thermo Topic HW.pdf","text":"6.1 – Heat/Temperature/Energy 1. ​ ​ ​ ​ ​ Define the following terms Energy: Temperature: Heat: 2. ​ Discuss how a substance transfers energy. Think about what occurs at the molecular level. 3. ​ Describe the difference between an endothermic and exothermic process. 4. ​ Write out 2 scenarios where one is an endothermic process, and one is an exothermic process. 5. ​ Use the diagram to the right to answer parts a through … a. ​ Which beaker contains particles with the highest average kinetic energy. _____ b. ​ Describe the average kinetic energy of beakers P, R, and S. 6. ​ A student places an ice cube on their hand. Describe the scenario and use the following terms in your description: energy, temperature, system, surroundings, endothermic OR exothermic. Draw a diagram to support your explanation. 7. ​ 0 Kelvin is the temperature at which “absolute zero” is achieved. Describe the behavior of the molecules at this temperature. Topic 6.2 - Specific Heat Calculations 1.​ Define specific heat. _____________________________________________________ 2.​ Specific heat equation is __________________________________________________. 3.​ What does each variable in the specific heat equation represent? Use the table on the right to answer the following questions. 4.​ Which metal requires the least energy to raise its temperature? The most energy? 5.​ If you heated 2 grams of each material at the same temperature, which metal would be the hottest after 10 minutes? Element J/g℃ Aluminum 0.9012 Tin 0.2167 Magnesium 0.4686 Lead 0.1289 Zinc 0.3883 6.​ If 200 grams of water is to be heated from 24.0°C to 100.0°C to make a cup of tea, how much heat must be added? The specific heat of water is 4.18 J/g∙C 7.​ The specific heat of wood is 2.03 J/g∙°C. How much heat is needed to convert 550.0 g of wood at -15.0°C to 10.0°C? 8.​ What is the specific heat of a substance that absorbs 2505 joules of heat when a sample of 100 g of the substance increases in temperature from 10 °C to 70°C? 9.​ How many grams of water would require 2230 joules of heat to raise its temperature from 34.0°C to 100.0b°C? The specific heat of water is 4.18 J/g∙C 10.​ A block of aluminum weighing 140.0 g is cooled from 98.4°C to 62.2°C with the release of 1080 joules of heat. From this data, calculate the specific heat of aluminum. 11.​ A 55 kg block of metal has an original temperature of 15.0°C and 0.45 J/g∙°C. What will be the final temperature of this metal if 450 J of heat energy are added? 12.​ Granite has a specific heat of 800 J/g∙°C. What mass of granite is needed to store 150,000 J of heat if the temperature of the granite is to be increased by 15.5°C? 6.3 – Heating and Cooling Curves 1. ​ Indicate the states of matter that exist at points A, C, and E ​ A: ______________ ​ C: ______________ ​ E: ______________ 2. ​ A student heats 2.5 grams of ice from -15oC to -5oC. The student sets up the following equation to solve for q. Is the student correct? If not, describe the change the student needs to make. 3. ​ What processes occur at position B on the graph? Why does the temperature not change during this process? 4. ​ What processes occur at position D on the graph? 5. ​ Describe enthalpy of fusion and what the value represents. What position on the graph indicates the point when the enthalpy of fusion value is needed in your calculations? 6. ​ Describe enthalpy of vaporization and what the value represents. What position on the graph indicates the point when the enthalpy of vaporization is needed in your calculations? 7. ​ A 25.0 gram sample of water is heated from 75.0oC to 115.0oC. Calculate the amount of energy needed to perform this process. a) ​ How many q values do you need to calculate? Indicate each q value on the blank graph provided. Label as q1, q2, q3, etc… b) ​ Write out each equation below that is needed to solve the problem. Calculate each q value. c) ​ Calculate the total amount of energy, in kJ, needed to complete this process. 8. ​ 15.0 grams of water is cooled from 105.0oC to 85oC. Calculate the total change in energy, in kJ, for the process occurring. Similar math to what was done in question 7. One note though: you are cooling the water down. Consider how it affects your equations! Topic 6.4 - Thermochemical Equations and Calculations 1)​ What is the enthalpy of a reaction? 2)​ Use the equation below to answer parts a through d. ​ ___C3H8 + ___O2 → ___CO2 + ___H2O​ ​ ∆H = -2043 kJ/mol rxn a)​ Is the reaction endothermic or exothermic? Justify your answer. b)​ Calculate the energy released if 0.150 moles of oxygen gas is combusted in the presence of excess propane c)​ How many grams of propane were combusted if 3525 kJ of energy were released in a reaction. d)​ On the axis provided, draw a reaction profile diagram for the combustion of propane. Label the parts of the diagram. 3) Use the equation below to answer parts a through e. ​ ___CO2 + ___H2O —> ___C6H12O6 + ___O2​ ​ ∆H = 2814 kJ/mol rxn a)​ Is the reaction endothermic or exothermic? Justify your answer. b)​ How many grams of CO2 are reacted if the reaction absorbs 755 kJ of energy? c)​ The above reaction represents photosynthesis. A mature oak tree can produce 274 liters of oxygen gas a day. How much energy, in kJ, is absorbed by the tree to produce that much oxygen per day? d)​ On the axis provided, draw a reaction profile diagram for the photosynthesis reaction. Label the parts of the diagram. Topic 6.5 - Calculating Enthalpy of Reaction Through Calorimetry 1)​ A student performs an experiment where the combustion of methane is used to heat a beaker full of water. A diagram is provided below that illustrates the setup of the equipment. In the experiment, we are assuming that all energy is transferred between the reaction and the beaker of water. No heat is lost to the air. Use this experiment to answer parts a through … ​ ​ ___CH4 + ___O2 —> ___CO2 + ___H2O​ ∆H=___ kJ/mol rxn a)​ The student burns 3.75 grams of methane (CH4) with excess oxygen gas. Calculate the mol rxn. b)​ Calculate the energy change of the water. (qsurroundings) c)​ Find the enthalpy of the reaction in kJ/mol rxn 2) A student performs an experiment according to the diagram to the right. Nitrogen and hydrogen gas are combined in a chamber and reacted below a beaker of water. Assume that energy is being transferred between the reaction chamber and the beaker of water. Assume that no energy is lost to the air. Reaction:​​ ___N2 + ___H2 → ___NH3​ ​ ∆H = -46.0 kJ/mol rxn a)​ 5.0 grams of hydrogen gas are reacted with XS nitrogen gas. Calculate the energy of the reaction and label it as endothermic or exothermic. b)​ Assuming that all the energy is transferred to the water. Calculate the final temperature of the water if there are 250.0 grams of water at an initial temperature of 25.0oC. c)​ How many grams of hydrogen would need to be reacted to raise the temperature of the water to its boiling point starting at an initial temperature of 25.0oC? Topic 6.6 - Extra Practice (Putting it all together) 1.​ Knowing that the water melts at 0oC and boils at 100oC, how much energy must be added to 12.0 g of ice at -15oC to form steam at 115oC? The specific heat of liquid water is 4.18 J/g0C. The specific heat of gaseous water is 2.03 J/g0C. The specific heat of solid water is 2.09 J/g0C.The heat of fusion is 2260 J/g. The heat of vaporization 2,260 J/goC. 2.​ Explain why an increase in pressure will affect the boiling point of a liquid.","id":28},{"kind":"file","unit":"Unsorted","type":"Homework","title":"Honors Topic HW Updated","file":"Honors Topic HW Updated.docx.pdf","path":"Units/Unsorted/Homework/Honors Topic HW Updated.docx.pdf","ext":"pdf","size":143309,"teacher":false,"pdf":"Units/Unsorted/Homework/Honors Topic HW Updated.docx.pdf","text":"9.1 – Solutions and Molarity 1. A solution is a _____________________ mixture that consists of two parts. Write out the parts below and define each. ​ a. __________________: ​ b. __________________: 2. Write an equation for each of the following substances below when they dissolve in water. ​ a. NaCl (s) ​ b. CH3OH (l) ​ c. MgCl2 (s) ​ d. Mg(OH)2 3. We can quantitatively describe a solution using molarity. What needs to be known about the solution to determine the molarity? ​ a. molarity: 4. A student prepares a potassium fluoride solution by dissolving 1.00 moles of potassium fluoride to make 0.100 liters of solution. What is the molarity of that solution? 5. A student dissolves 15.0 grams of solid magnesium nitrate to make 0.250 liters of solution. Calculate the molarity of that solution. 6. How many grams of calcium chloride are present in 150.0 mL of a 1.25 M solution of calcium chloride? 7. How many liters of NaCl solution can be prepared with a concentration of 0.750 molar using 1.50 moles of NaCl? 8. An aqueous solution is prepared by diluting 3.0 mL of acetone(C3H6O) (density = 0.789 g/mL) with water to a final volume of 75.0 mL. The density of water is 1.00 g/mL. ​ a. Calculate the molarity of the solution above. 9.2 – Solution Creation 1. A student wishes to perform an experiment with a solution of aluminum nitrate. The student needs to prepare 500.0 mL of 0.750 M aluminum nitrate. The student only has access to 5.00 M aluminum nitrate. a. Calculate the number of mL of 5.00 M aluminum nitrate that needs to be diluted to prepare 500.0 mL of 0.750 M aluminum nitrate. b. Discuss the steps that the student should take to prepare this solution. c. The aqueous aluminum nitrate reacts with sodium hydroxide in a double replacement reaction. Write the balanced chemical equation for this reaction. 2. A student prepares a solution of calcium chloride by dissolving 25.0 grams of calcium chloride to make 750.0 mL of solution. ​ a. Write the equation for the dissociation of calcium chloride. b. In the beaker provided, show how the water molecules interact with the ions in solution. Consider the charges of each and how they will arrange themselves. Draw at least 2 water molecules around each ion. c. Calculate the molarity of the solution created above. d. The solution is left outside in the sun and 150.0 mL of water evaporates from the solution. Calculate the new molarity of the solution. 3. A student needs to prepare 500.0 mL of 1.77 M nitric acid. ​ a. The formula for nitric acid is: __________ ​ b. What part of the formula makes this substance an acid? ______________________________ c. The student has access to a 10.0 M stock solution of nitric acid. Determine how many mL of 10.0 M needs to be diluted to prepare 500.0 mL of 1.77 M nitric acid ​ d. Discuss the steps the student should take to prepare this solution. 9.3 – Solution Stoichiometry 1.​ 2.​ 3.​ Aqueous Silver nitrate reacts with aqueous potassium chloride to form aqueous potassium nitrate and solid silver chloride. a.​ Write the balanced chemical equation for the reaction. b.​ What mass of silver chloride will form if 50.0 mL of 0.225 M silver nitrate reacts with excess potassium chloride? c.​ How many moles of potassium chloride will react with 50.0 mL of 0.225 M silver nitrate? d.​ Using your answer from part C, determine what volume, in mL, of potassium chloride reacted if the concentration is 0.500 M. Aqueous barium chloride reacts with aqueous aluminum sulfate to produce solid barium sulfate and aqueous aluminum chloride. a.​ Write the balanced chemical equation for the reaction. b.​ What mass of solid barium sulfate will form if 15.0 mL of 0.750 M aluminum sulfate reacts with XS barium chloride. c.​ How many moles of barium chloride reacted with the 15.0 mL of 0.750 M aluminum sulfate? d.​ Using your answer from part C, determine what volume, in mL, of barium chloride reacted if the concentration used was 0.225 M. Aqueous hydrochloric acid reacts with sodium hydroxide to form water and aqueous sodium chloride. a.​ Write the balanced chemical equation for the reaction. b.​ What volume, in mL, of 0.150 M HCl will be needed to react with 35.0 mL of 0.325 M sodium hydroxide? 9.4 – Titrations 1. Describe the purpose of a titration: 2. Why are indicators necessary for titrations? What is the purpose of an indicator? 2. A solution of HCl with an unknown concentration is analyzed. A titration will be performed to determine the concentration of the acid. The diagram provided below shows the student’s experimental setup. The data table provides all necessary information to calculate the concentration of the unknown acid. ​ ​ ​ Chemical Reaction: HCl + NaOH Volume of Acid Conc. of NaOH mL of base to reach end point a.​ H2O + NaCl 25.0 mL 0.650 M 12.75 mL The student performs the titration and the data above are obtained. The end point is reached after 12.75 mL of the NaOH solution is added. i.​ Calculate the number of moles of HCl that was present in the original unknown acid solution. ii.​ Calculate the concentration of the HCl solution. 4. A student performs a titration with acetic acid (HC2H3O2) and sodium hydroxide (NaOH) ​ a. Write a balanced chemical equation for this reaction. The student titrations 10.0 mL of the acetic acid solution with an unknown concentration. The student uses 0.100 M NaOH to perform the titration. The pH of the solution is monitored, and the following data is obtained. ​ a. How many mL of the sodium hydroxide solution were required to reach the end point? ________ ​ b. Calculate the number of moles of sodium hydroxide used to reach the end point. ​ c. Calculate the original concentration of the acetic acid solution.","id":29},{"kind":"file","unit":"Unsorted","type":"Homework","title":"Nuclear Homework","file":"Nuclear Homework.pdf","path":"Units/Unsorted/Homework/Nuclear Homework.pdf","ext":"pdf","size":336549,"teacher":false,"pdf":"Units/Unsorted/Homework/Nuclear Homework.pdf","text":"Nuclear Unit Homework #1 Name: ___________________________________ 1. In this unit, we are focusing on processes that occur in what part of the atom? _________________ 2. Explain how a nuclear process differs from a chemical reaction? What particles are usually involved in a chemical reaction? 3. Explain what forces are occurring in the nucleus that lead to stability and instability. 4. An isotope that is considered not radioactive: _______________ 5. Every element past _______________ contains no isotopes that are stable. 6. Elements that are radioactive will undergo what process and why? C 7. The graph to the right shows the band of stability for known isotopes of every element. Match each arrow with the descriptions below. ____ The isotope is proton rich and will want to change a proton to a neutron B A ___ The isotope is too heavy to be stable and will want to lose protons and neutrons ___ The proton to neutron ratio is stable and the isotope is not radioactive. ___ The isotope is neutron rich and will want to change a neutron to proton. There is an interactive band of stability website that is linked in Schoology. D Nuclear Homework #2 Name: ______________________________________ We have learned that an unstable nucleus will want to undergo radioactive decay to become more stable. 1) What are the 3 main types of radioactive decay we have discussed and how does each type change the nucleus? 2) A students sets up an experiment where they use shoot alpha particles through an electromagnetic field created by 2 magnets. On the diagram below, draw how the alpha particles behave in the magnetic field and write a short explanation why. Alpha Radiation Source 3) A radioactive source that produces alpha particles is only dangerous if somehow ingested. Alpha particles carry a lot of energy and can ionize many atoms in your cells. Why are alpha particles not dangerous outside your body? 4) Beta radiation, beta minus specifically, can penetrate through your skin. What material can absorb beta radiation? 5) Many nuclear reactions can produce gamma radiation which is extremely dangerous because it passes through everything. What properties of gamma radiation allows for this and what kind of material do you need to use to absorb gamma radiation? 6) For each problem below, write the decay equation(s) for the radioactive isotope. a. Cl-34 is proton rich and will undergo beta plus decay b. Mn-54 is neutron rich and will undergo beta minus decay c. Rn-216 will undergo two successive alpha decays to become a stable isotope. Nuclear Homework #3 Name: ______________________________________ 1. What is the half-life of a substance? 2. A radioactive isotope has a half-life of 25 seconds. How many half-lives would 200.0 grams of that substance need to undergo to only have 12.5 grams remain? How many seconds would it take for that change to occur? 3. The following diagrams show the change of element A (solid circle) into element B . There are 24 atoms total of element A at a time of 0 seconds. Time = 0 4. Time = 10 seconds Time = 20 Seconds Time = 30 seconds a. What is the half-life of element A? Justify your answer using the data provided in the diagrams above. b. Draw the diagram for the sample if a total of 60 seconds has passed since the first diagram. Use the graph provided to the right to answer the questions below. a. What is the half-life for Iodine-131? b. How many grams of iodine are left after it undergoes 3 half-lives? 5. What is the half-life of an isotope that has an initial mass of 100 grams and a final mass of 3.13 grams after 30 days? 6. An isotope has a half-life of 20 seconds. How many seconds have passed if the isotope decreases from 75.0 grams to 9.38 grams? Nuclear Homework #4 1. Both nuclear fission and nuclear fusion involve changes to the nucleus which release energy. Briefly describe how each of the processes change the nucleus. Talk about what types of isotopes undergo these processes. 2. Nuclear fusion requires EXTREME temperature and pressure to occur. Explain why these conditions are necessary for nuclear fusion to occur. Think about the forces that exist inside the nucleus and why it would be hard to fuse one nucleus to another nucleus. 3. In a nuclear fission reaction, explain how the fission produces a chain reaction. Be specific by talking about what is produced in the reaction and how that continues the process. 4. Balance the following fission/fusion reactions. Remember that the products of the process need to balance with the reactants!","id":30},{"kind":"file","unit":"Unsorted","type":"Homework","title":"Unit 1 Topic Homework","file":"Unit 1 Topic Homework.docx.pdf","path":"Units/Unsorted/Homework/Unit 1 Topic Homework.docx.pdf","ext":"pdf","size":438398,"teacher":false,"pdf":"Units/Unsorted/Homework/Unit 1 Topic Homework.docx.pdf","text":"Topic 0.1 – Making Accurate Measurements​ ​ ​ Name: ___________________________________ 1.​ What value should be reported in the following measurements? ​ ​ ​ 2.​ Draw the meniscus for the following readings. Topic 0.2 – Significant Figures and Scientific Notation​ Name: _________________________ 1.​ How many significant figures are in the following numbers? a.​ 1.050 ​ ​ _______ b.​ 1050​ ​ _______ c.​ 0.01050​​ _______ d.​ 130200​​ _______ e.​ 1.5x102​​ _______ f.​ 500​ ​ _______ g.​ 100.​ ​ _______ h.​ 0.0100​ ​ _______ 2.​ Round 742,396 to four, three, and two significant figures: a.​ Four S.F.​ ___________________ b.​ Three S.F.​ ___________________ c.​ Two S.F. ​ ___________________ 3.​ Round 0.07284 to four, three, and two significant figures: a.​ Four S.F.​ ___________________ b.​ Three S.F.​ ___________________ c.​ Two S.F. ​ ___________________ 4.​ Round 231.45 to four, three, and two significant figures (USE SCIENTIFIC NOTATION) a.​ Four S.F.​ __________x10___ b.​ Three S.F.​ __________x10___ c.​ Two S.F. ​ __________x10___ 5.​ Round 1,350,400 to four, three, and two significant figures (USE SCIENTIFIC NOTATION) a.​ Four S.F.​ __________x10___ b.​ Three S.F.​ __________x10___ c.​ Two S.F. ​ __________x10___ Topic 0.3 – Calculations with Significant Figures For the following problems, write the answer you get from the calculator and then write the answer rounded to the correct number of significant figures. Don’t forget your units! Calculator Answer a)​ 3.45 cm + 3.4 cm = b)​ 3.43 cm – 0.056 cm = c)​ 8.4 m + 10 m = d)​ 8.4 m + 10.0 m = e)​ 45 g + 8.345 g = f)​ 5.43 cm x 3.4 cm = g)​ 2.5 in x 3.75 in = h)​ 8.001 m / 2.3 s = i)​ 6.00 g / 0.05 mL = j)​ 5.01 g / 1,002,00 molecules = Answer w/ Sig Figs Topic 0.4 – Dimensional Analysis #1 1.00 foot = 12.0 inches 1.00 inch = 2.54 centimeters 60 minutes = 1 hour 3.00 feet = 1.00 yard 1.00 kilometer = 0.62 miles 24 hour = 1 day 5280 feet = 1.00 mile 60 seconds = 1 minute 365 days = 1 year 1.00 pound = 16.0 ounces 1.00 gallon = 3.79 liters ALL work should be shown on the problems below, even if you can do it in your head. You do not get credit on a test for doing the work in your head. Round ALL answers to the correct number of significant figures. 1.​ How many inches are in 36.35 centimeters? 2.​ A football field is 100.0 yards from goal line to goal line. Calculate the length of the football field in miles. 3.​ The moon is roughly 250,000 miles away. Calculate the distance in feet. 4.​ How many centimeters are in 2.15 miles? 5.​ A car is traveling at a speed of 35.0 miles/hour. Calculate the speed of the car in units of feet per minute. 6.​ The cost of gold is $2340 per ounce. How many pounds of gold can someone buy with $1500? Topic 0.5 – Density 1.​ What does density measure? 2.​ A student is comparing 2 blocks of pure aluminum. Block A is much larger than Block B. Do you expect block A’s density to be lower, higher, or the same as Block B? Explain your answer. 3.​ Mercury metal is poured into a graduated cylinder and the volume is measured to be 22.5 mL. The mass of that sample of mercury is 305.4 g. From this information, calculate the density of the mercury sample. 4.​ A rectangular block of copper metal weighs 1896 g. The dimensions of the block are 8.4 cm by 5.5 cm by 4.6 cm. From this data, calculate the density of the copper metal. Consider the unit needed for volume. 5.​ Find the mass of 250.0 mL of benzene. The density of benzene is 0.8765 g/mL. 6.​ 28.5 g of iron is added to a graduated cylinder containing 45.50 mL of water. The water level rises to the 49.10 mL mark. From this information, calculate the density of the iron. 7.​ What is the volume of a liquid, in mL, that contains 25.0 grams of the substance with a density 1.20 g/mL?","id":31},{"kind":"file","unit":"Unsorted","type":"Homework","title":"Unit 4 - Reactions Topic HW","file":"Unit 4 - Reactions Topic HW.pdf","path":"Units/Unsorted/Homework/Unit 4 - Reactions Topic HW.pdf","ext":"pdf","size":268108,"teacher":false,"pdf":"Units/Unsorted/Homework/Unit 4 - Reactions Topic HW.pdf","text":"Topic 4.1 - Balancing Chemical Equations Balancing 1.​ Why does a chemical equation need to be balanced? 2.​ What does a balanced chemical equation represent? (Think about recipes in cooking) 3.​ Balance the following equations! a.​ ___H3PO4 + ___KOH → ___K3PO4 + ___H2O g.​ b.​ c.​ d.​ e.​ f.​ ___K + ___B2O3 → ___K2O + ___B ___H3PO4 + ___Mg(OH)2 → ___Mg3(PO4)2 + ___H2O h.​ ___N2 + ___O2 → ___N2O5 i.​ ___Al + ___S8 → ___Al2S3 j.​ ___Rb + ___RbNO → ___Rb2O + ___N2 k.​ ___C2H6 + ___O2 → ___CO2 + ___H2O l.​ ___NH3 + ___O2 → ___N2 + ___H2O ___HCl + ___NaOH → ___NaCl + ___H2O ___Na + ___NaNO3 → ___Na2O + ___N2 ___C + ___S8 → ___CS2 ___Na + ___O2 → Na2O m.​ ___FeS2 + ___O2 → ___Fe2O3 + ___SO2 4.1 Part 2 - Writing Chemical Reactions Write the balanced chemical equation for the following reactions. 1.​ Sodium metal reacts with chlorine gas to produce sodium chloride. 2.​ Aluminum metal reacts with aqueous copper (II) nitrate to produce aqueous aluminum nitrate and copper metal. 3.​ Aqueous Nitric acid reacts with aqueous magnesium hydroxide to produce aqueous magnesium nitrate and liquid water. 4.​ Propane gas (C3H8) reacts with oxygen gas to produce gaseous carbon dioxide and gaseous water. 5.​ Solid sodium carbonate decomposes into solid sodium oxide and carbon dioxide gas. 6.​ Solid ammonium chloride decomposes into gaseous nitrogen trihydride and gaseous hydrochloric acid. 7.​ Aqueous lead(II) nitrate and aqueous potassium iodide react to produce solid lead(II) iodide and aqueous potassium nitrate. Turn the following chemical equations into word equations 8.​ Na2O (s) + H2O (l) → 2NaOH (aq) 9.​ CS2 (l) + 3O2 (g) → CO2 (g) + 2SO2 (g) 10.​ K (s) + CuNO3 (aq) → KNO3 (aq) + Cu (s) 11.​ 2Li (s) + 2H2O (l) → 2LiOH (aq) + H2 (g) Topic 4.2 - Reaction Types Give the reaction type for the following: 1.​ C5H12, + 8O2 → 5CO2 + 6H2O​​ ​ ____________________________________ 2.​ 2K3PO4 + 3BaCl2 → Ba3(PO4)2 + 6KCl​​ ____________________________________ 3.​ 2Al(OH)3 + 3H2SO4 → Al2(SO4)3 + 3H2O​ ____________________________________ 4.​ 2AgNO3 + Na2CO3 → Ag2CO3 + 2NaNO3​ ____________________________________ 5.​ 2La2O3 → 4Al + 3O2​ ​ ​ ​ ____________________________________ 6.​ 2Al + 6HCl → 3H2 + 2AlCl3​ ​ ​ ____________________________________ 7.​ 4C4H9O + 27O2 → 18H2O + 20CO2​ ​ ____________________________________ 8.​ 3HBr + Al(OH)3 → 3H2O + AlBr3​ ​ ________________ ____________________ 9.​ 2NH3 + H2SO4 → (NH4)2SO4​ ​ ​ ____________________________________ 10.​2HgO → 2Hg + O2​ ​ ​ ​ ____________________________________ 11.​Na2O + H2O → 2NaOH​ ​ ​ ____________________________________ ​ ____________________________________ 12.​Cu + 2AgNO3 → 2Ag + Cu(NO3)2​ Topic 4.3 - Predicting Products (Synthesis, Decomposition, Combustion) 1.​ N2 + H2 → _____________________ 2.​ Fe + S8 →____________________ 3.​ K + Br2 →_____________________ 4.​ NaCl →_______________________ 5.​ MgCl2→______________________ 6.​ CH4 + O2→____________________ 7.​ H2O→ _______________________ 8.​ Al2O3→_______________________ 9.​ C2H6+ O2→____________________ 10.​ C12H26+ O2→__________________ 11.​ CH3OH+ O2→_________________ Topic 4.4 - Predicting Products Single Replacement 1.​ Li(s) + BaCl2(s)→ _________________________________________ 2.​ Li(s) + CaS(s)→__________________________________________ 3.​ BaCl2(s) + K(s)→_________________________________________ 4.​ NaF(s) + Ba(s)→ ________________________________________ 5.​ MgCl2(s) + Na(s)→________________________________________ 6.​ NaCl(s) + F2(g)→_________________________________________ 7.​ NaF(s) + Cl2(g)→_________________________________________ 8.​ Cu(s)+ FeSO4(s)→ ___________________________________ 9.​ H2O(aq) + Na(s)-->___________________________________ 10.​H2O(aq) + Ag(s)-->____________________________________ Topic 4.5 - Predicting Products Double Replacement 11.​BaCl2(aq)+ H3PO4(aq)→ ___________________________________ 12.​K2SO4(aq) + MgF2(aq)-->___________________________________ 13.​AlCl3(aq) + BaSO4(aq)-->____________________________________ 14.​Li2S(aq) + AgNO3(aq) →____________________________________ 15.​BaCl2(aq) + Na2CO3(aq) →___________________________________ 16.​Al2(SO4)3(aq)+ Na3PO4(aq) →________________________________ 17.​Na2SO4(aq)+ NH4I(aq) →___________________________________ 18.​ Li3PO4(aq)+ BaCl2(aq) →___________________________________ 19.​AlBr3(aq)+ H3PO4(aq) →____________________________________ 20.​Zn(NO3)2(aq)+ Ba(OH)2(aq) → _______________________________ Topic 4.6 - Net Ionic Equations of Single Replacement and Double Replacement Reactions 1.​ What does a net ionic equation represent? 2.​ The species that DO NOT react are called what? 3.​ A student dissolves sodium carbonate and magnesium nitrate into water. The diagram provided shows before and after the reaction. a.​ Write the balanced chemical equation for the entire reaction. b.​ What ions are reacting and what ions are spectators? i.​ Reacting: ________________________ ii.​ Spectators: _______________________ c.​ Justify your answer to part B using the diagram provided. d.​ Write the net ionic equation for the reaction. 4. Write the net-ionic equation for the reactions below! a.​ SrBr2 (aq) + K2SO4 (aq) SrSO4 (s) + 2KBr (aq) b.​ 3Ca(OH)2 (aq) + 2FeCl3 (aq) 3CaCl2 (aq) + 2Fe(OH)3 (s) c.​ 2 AgOH(s) + H2CO3(aq) ---> Ag2CO3(s) + 2 H2O(l) d.​ Fe(s) + NiCl3(aq) ---> FeCl3(aq) + Ni(s) e.​ The reaction between sodium sulfide and iron(II) nitrate Topic 4.7 - More Naming! (So much fun) 1.​ Li2S​ ​ ​ ​ ​ ​ _____________________________________ 2.​ beryllium phosphide​ ​ ​ ​ ​ _____________________________________ 3.​ Be(OH)2​ ​ ​ ​ ​ ​ _____________________________________ 4.​ P2Br4​ ​ ​ ​ ​ ​ ​ _____________________________________ 5.​ SF6​ ​ ​ ​ ​ ​ _____________________________________ 6.​ magnesium acetate​ ​ ​ ​ ​ _____________________________________ 7.​ diboron tetrahydride​ ​ ​ ​ ​ _____________________________________ 8.​ dinitrogen trioxide​ ​ ​ ​ ​ _____________________________________ 9.​ hydrocyanic acid ​ ​ ​ ​ ​ _____________________________________ 10.​lithium iodide​ ​ ​ ​ ​ ​ _____________________________________ 11.​KMnO4​​ ​ ​ ​ ​ ​ _____________________________________ 12.​HClO3​ ​ ​ ​ ​ ​ ​ ______________________________________ ​ ​","id":32},{"kind":"file","unit":"Unsorted","type":"Homework","title":"Unit 5 - Stoichiometry Topic HW","file":"Unit  5 - Stoichiometry Topic HW.pdf","path":"Units/Unsorted/Homework/Unit  5 - Stoichiometry Topic HW.pdf","ext":"pdf","size":147443,"teacher":false,"pdf":"Units/Unsorted/Homework/Unit  5 - Stoichiometry Topic HW.pdf","text":"Topic 6.1 - Mole Ratio 1.​ What is needed to determine mole ratios? 2.​ Mole ratio is: 3.​ What number gives the number of moles of a substance involved in the reaction? Find the mole ratios to the following: 1.​ Given this equation: N2 + 3 H2 ---> 2 NH3, write the following mole ratios: a) N2 / H2 _________________________________ b) N2 / NH3 _________________________________ c) H2 / NH3 _________________________________ 2.​ Given the following equation: 8 H2 + S8 ---> 8 H2S, write the following mole ratios: a) H2 / H2S ________________________________ b) H2 / S8 ________________________________ c) H2S / S8 ________________________________ 3.​ Water can be produced from a reaction between hydrogen gas and oxygen gas. a)​ Write the balanced chemical equation: b)​ What are the mole ratios for: hydrogen to oxygen ___________________ hydrogen to water ___________________ oxygen to water ___________________ c)​ How many moles of water can be produced from 10 moles of hydrogen. 4. Use this equation: N2 + 3 H2 ---> 2 NH3, for the following problems a)​ If 10 moles of NH3 were produced, how many moles of N2 would be required? b)​ If 3.00 moles of H2 were used, how many moles of NH3 would be made? c)​ If 0.600 moles of NH3 were produced, how many moles of H2 are required? 5. The reaction between hydrazine (N2H2) and hydrogen peroxide (H2O2) is used to fuel rockets. The products are nitrogen gas and water. a)​ Write a balanced chemical equation: _______________________________________ b)​ If 37 moles of hydrazine are used, how many moles of nitrogen gas are produced? c)​ If 23 moles of water are produced, how many moles of hydrogen peroxide were used? Topic 6.2 - Mass to Mass Stoichiometry 1.​ Use the equation Fe + S8 → FeS to answer the following: a)​ Balance the equation: ______________________________________________ b)​ How many moles of FeS are produced when 2.4 g of S8 react? c)​ How many grams of FeS are produced when 5.9 grams of Fe is used. d)​ If 11.9 grams of sulfur is used, how many grams of iron is also used? 2. Use the equation K3PO4 + Al(NO2)3 → KNO2 + AlPO4 to answer the following: a)​ Balance the equation _______________________________________________ b) What is the mass of potassium nitrite that is produced when 4.6 moles of potassium phosphate is used? c) If 5.8 grams of aluminum phosphate are formed, how many grams of aluminum nitrite is used? d) How many grams of potassium nitrite is formed when 6.2 grams of potassium phosphate is used? 3. Use the equation Fe2O3 + C → Fe + CO2 to answer the following: a) Balance the equation ______________________________________________________ b)​ How many grams of iron are produced if 39.64 grams of carbon are used? c)​ If 63.12 grams of iron (III) oxide are used, how many grams of carbon dioxide are produced? d)​ If 38.2 grams of carbon are used, how many grams of iron are produced? 4. Use the equation CO + H2 → CH3OH to answer the following: a) Balance the equation: ______________________________________________________ b) If 5.7 grams of carbon monoxide are used, how many grams of hydrogen gas are also used? c) If .89 grams of hydrogen gas were used, how much CH3OH was produced? d) If 3.61 grams of carbon monoxide were used, how many grams of CH3OH were produced? Topic 6.3 - More Stoichiometry Conversions (Liters/Atoms) 1.​ Knowing that hydrogen gas and oxygen combine to form water, how many liters of Hydrogen gas are needed to produce 3 moles of water? 1b. According to the same equation, How many grams of water will be produced by 30.2L of hydrogen? 1c. According to the same equation, How many grams of water will be produced by 30.2L of oxygen? 1d. When 120.3 grams of water are produced, how many liters of hydrogen must’ve been used? 2. Use the equation CO + H2 → CH3OH to answer the following: a) Balance the equation: ______________________________________________________ b) If 15.0 liters of carbon monoxide are used, how many liters of hydrogen gas are also used? c) If 12 liters of hydrogen gas were used, how many grams of CH3OH would be produced? d) If 3.00 liters of carbon monoxide were used, how many grams of CH3OH were produced? 3. Use the equation NaN3(s)→ Na(l) + N2(g) to answer the following: a) Balance the equation ______________________________________________________ e)​ How many liters of Nitrogen are produced if 15.62 grams of sodium nitride are used? f)​ If 200.0 L of Nitrogen are produced, how many grams of sodium nitride were used? g)​ If 31.4 grams of sodium are produced, how many liters of nitrogen are also produced? 4. Chlorine gas will react with solid sodium to produce sodium chloride. Balance this reaction to answer the following: a) Balance the equation ______________________________________________________ h)​ How many grams of sodium chloride are produced if 15.0 liters of chloride gas are used? i)​ If 150.0 L of Chlorine are consumed, how many grams of sodium chloride will be produced? j)​ If 38.0 grams of solid sodium are used, how many liters of chlorine are produced? Topic 5.4 - Limiting and Excess Reactants 1) 1.5 moles of CH4 react with 2.5 moles of Cl2 according to the equation below. ​ ___CH4 + ___Cl2 → ___CH2Cl2 + ___HCl a.​ Using a BCA table, calculate the number of moles of product produced and the number of moles of excess reactant remaining. 2) 15.0 grams of N2 gas reacts with 4.50 grams of H2 gas according to the equation below. ​ ___N2 + ___H2 → ___NH3 a.​ Using a BCA table, calculate the mass of the product produced and the mass of the excess reactant remaining. 3) 17.5 liters of NH3 gas reacts with 12.5 liters of O2 gas at STP according to the equation below. ​ ___NH3 (g) + ___O2 (g) → ___NO(g) + ___H2O (g) a.​ Using a BCA table, calculate the mass of each product produced. Also calculate the liters of the excess reactant remaining. 4) 7.50 grams of solid sodium metal reacts with 18.5 liters of Cl2 gas at STP according to the equation below ​ ​ ___Na (s) + ___Cl2 (g) → NaCl (s) a.​ Using a BCA table, calculate the mass of NaCl produced and the mass of the excess reactant remaining. 5.5 - Percent Yield 1.​ A student performs the following reaction. ​ ​ ___CH4 + ___O2 → ___CO2 + ___H2O a.​ The student reacts 10.0 grams of oxygen gas with excess CH4. Calculate the theoretical yield of carbon dioxide in the reaction. b.​ The student performs the lab and 6.50 grams of CO2 is produced. Calculate the percent yield of the reaction. 2. A student performs the following reaction. ​ ​ ​ ___CaCl2 (aq) + ___AgNO3 (aq) → ___Ca(NO3)2 (aq) + ___AgCl (s) a.​ A student reacts 15.0 grams of calcium chloride and 10 grams of silver nitrate. Calculate the theoretical yield of silver chloride. b.​ The reaction is performed and 4.50 grams of silver chloride are made in the lab. Calculate the percent yield of the reaction. 3. A student performs the following reaction ​ ​ ___AlCl3 + ___NaOH → ___Al(OH)3 + ___NaCl a.​ 15.0 grams of aluminum chloride are reacted with 20.0 grams of sodium hydroxide. Calculate the theoretical yield of aluminum hydroxide in the reaction. b.​ If 11.3 grams of aluminum hydroxide are formed in the lab, what is the percent yield of this reaction?","id":33},{"kind":"file","unit":"Unsorted","type":"Homework","title":"Unit 8 - Electrons Honors Topic Homework","file":"Unit 8 - Electrons Honors Topic Homework.pdf","path":"Units/Unsorted/Homework/Unit 8 - Electrons Honors Topic Homework.pdf","ext":"pdf","size":215440,"teacher":false,"pdf":"Units/Unsorted/Homework/Unit 8 - Electrons Honors Topic Homework.pdf","text":"2.1 – Bohr Models and Lewis Dot Structures 1) How did the Bohr model improve upon Rutherford’s nuclear model? 2) Draw the Bohr model for each element listed below. a) Sodium​ ​ ​ ​ b) Carbon​ ​ ​ ​ c) Argon d) Aluminum​ ​ ​ ​ e) Oxygen​ ​ ​ ​ f) Potassium 3) How do you determine the number of valence electrons for an element? 4)Draw the Lewis dot structures for the following elements a)​ Iodine​ ​ b) Magnesium​​ c) Fluorine​ d) Sodium​ e) Francium 5) Identify the element ​ a) This element has 3 valence electrons and is in period 2. _____ ​ b) This element has 7 valence electrons, and its most abundant isotope contains 10 neutrons. ____ c) This element has 8 valence electrons and is in period 3. ____ d) What elements are represented below by the Bohr models? ​ ​ ​ _____​ ​ ​ ​ ​ _____​ ​ ​ ​ Topic 2.2 - Quantum Mechanical Model and Electron Configuration 1.​ Write the electron configuration for Be, Mg, Ca. What is the similarity in the electron configuration of the outermost electrons in these elements? Be: Mg: Ca: Similarity: ​ 2.​ Write the electron configuration for the following: (Circle the valence electrons) N: ​ Cl: ​ Mn: ​ Cd: 3.​ Write shorthand electron configuration for the following: Sr: As: S: Al: ​ ​ ​ 4.​ Identify the following elements from the electron configuration. (Circle the valence electrons) 1s22s22p63s1: 1s22s22p63s23p64s23d104p65s24d105p3 5.​ Are the following electron configurations correct? If not, correct. 1s22s22p63s13p64s24d104p65s1 ​ 1s22s22p63s3 ​ [Ar]5s24d105p5 2.3 - Electron Configuration and Orbital Diagrams Continued Topic 2.4 - Periodic Trends: Ionization Energy and Atomic Radius 1)​ ​ The following Bohr models indicate atoms of Lithium and Sodium. a)​ On both models, circle the electron(s) that would be removed if the atoms were ionized. b)​ What charge would both atoms form when they become ions? ______ c)​ Determine which atom would require more energy to remove those electrons. Use principles of atomic structure and coulomb’s law in your explanation. 2) The ionization energy trend is that it takes more energy to remove an electron as you go from the left to the right (across a period.) Explain why the ionization energy increases using principles of atomic structure and coulomb’s law. 3) The ionization energy trend is that it takes more energy to remove an electron as you go up a group on the periodic table. Explain why the ionization energy increases using principles of atomic structure and coulomb’s law. 4) The atomic radius trend is that atoms get smaller as you go from the left to the right (across a period.) Explain why the atomic radius decreases using principles of atomic structure and coulomb’s law. 5) The atomic radius trend is that atoms get smaller as you go up a group on the periodic table.Explain why the atomic radius decreases using principles of atomic structure and coulomb’s law. 6) Rank the elements below in order of increasing ionization energy. ​ List 1: B​ N​ O​ Li​ Be​ F ​ List 2: N​ As​ Bi​ P​ Sb​ Mc 7) What is a larger atom? a)​ K or Ca​ b) P or N​ c) Al or Ar​ d) F or Br Topic 2.5 - Periodic Trends: Electronegativity and Successive Ionization Energy Word bank: decreases, increases, successive, ionization, electronegativity 1.​ As you move across a period from left to right, the electronegativity of elements generally ______. 2.​ The ___________is a measure of an atom's ability to attract electrons. 3.​ Successive ___________energies increase with the removal of each electron. 4.​ As you move down a group, the electronegativity of elements generally _____________. 5.​ _________________ionization energy refers to the amount of energy required to remove electrons one by one from an atom. 6. Rank the following elements by increasing atomic radius; carbon, aluminum, potassium and oxygen. 7. Rank the following elements by increasing electronegativity; sulfur, oxygen, neon and aluminum. 8. Why does fluorine have a higher ionization energy than iodine? 9. Why do elements in the same family generally have similar properties? 10. Indicate whether the following properties increase or decrease from left to right across the periodic table. a.​ Atomic radius b.​ First ionization energy c.​ electronegativity","id":34},{"kind":"file","unit":"Unsorted","type":"Homework","title":"Unit 8 Gases Homework","file":"Unit 8 Gases Homework.pdf","path":"Units/Unsorted/Homework/Unit 8 Gases Homework.pdf","ext":"pdf","size":252038,"teacher":false,"pdf":"Units/Unsorted/Homework/Unit 8 Gases Homework.pdf","text":"Unit 8 Gases Worksheet #1 – Kinetic Molecular Theory and Gas Relationships Name: _____________________________________ 1. One of the postulates of KMT states that collisions are perfectly elastic. In your own words, describe what this means about the collision. 2. Gases are easily compressible whereas solids and liquids are not. Explain why. 3. How does a gas create pressure on the surroundings? 4. In the space provided below, determine if each of the variables have an inverse or direct relationship a. b. c. d. 5. _______________ _______________ _______________ _______________ A sample of gas is held in a sealed container provided by the diagram below. c. 6. Pressure vs Volume: Pressure vs Temperature: Temperature vs Volume: # Moles vs Pressure: a. What do the arrows indicate in the diagram provided? b. Why are some arrows longer than others? Four boxes are provided below. Each box is a set of conditions that have been
