also used? Work: Answer (units & sig figs): __________________________________ b. If 0.89 g of H₂ are used, how many grams of CH₃OH form? Work: Answer (units & sig figs): __________________________________ Honors Chemistry • Unit 6: Stoichiometry • page 14 Name: ______________________________ Date: ____________ Period: ______ c. If 15.0 L of CO are used at STP, how many liters of H₂ are also used? Why is no molar mass needed? Work: Answer (units & sig figs): __________________________________ B. Limiting reactant and percent yield 3. 10.0 g of Al react with 20.0 g of Cl₂: 2Al + 3Cl₂ → 2AlCl₃. Which is limiting, and how many grams of AlCl₃ can form? How much of the excess reactant is left? (mol) 2Al 3Cl₂ 2AlCl₃ Before Change After Work and answers: 4. 6.54 g of Zn react with 0.150 mol of HCl: Zn + 2HCl → ZnCl₂ + H₂. Find the liters of H₂ at STP that can form and the grams of the excess reactant left. (mol) Zn 2HCl ZnCl₂ H₂ Before Change After Work and answers: 5. A student burns 4.86 g of Mg in air: 2Mg + O₂ → 2MgO. The white powder has a mass of 7.60 g. a. Calculate the theoretical yield of MgO. Work: Answer (units & sig figs): __________________________________ b. Calculate the percent yield and suggest a reason it differs from 100 %. Work: Answer (units & sig figs): __________________________________ Honors Chemistry • Unit 6: Stoichiometry • page 15 Name: ______________________________ Date: ____________ Period: ______ C. Lab data 6. A student mixes 2.12 g of Na₂CO₃ (in water) with excess CaCl₂ solution: Na₂CO₃ (aq) + CaCl₂ (aq) → CaCO₃ (s) + 2NaCl (aq). The precipitate is filtered, dried and weighed. Data: filter paper 0.86 g; filter paper + dry solid 2.76 g. (a) Actual yield (b) theoretical yield (c) percent yield D. Think 7. A recipe makes 24 cookies from 2 cups of flour. You have 5 cups of flour but only 3 eggs, and the recipe needs 1 egg per 8 cookies. How many cookies can you make, and what is the limiting ingredient? Relate this to a chemical reaction. 8. Why must you convert to moles before deciding which reactant is limiting? 9. N₂ + 3H₂ → 2NH₃. If 4 mol N₂ and 9 mol H₂ are mixed, the limiting reactant is… A) N₂ B) H₂ C) NH₃ D) neither 10. Which quantity cannot be negative or over 100 % in a lab report? A) percent yield B) actual yield minus theoretical C) mole ratio D) Change in a BCA table Unit 6 review 11. Write the complete plan (in words) for solving “grams of A → grams of B”. Then say what changes for “liters of gas A → grams of B”. 12. Describe how you find the limiting reactant and how you use it to find the product and the leftover. Honors Chemistry • Unit 6: Stoichiometry • page 16","id":17},{"kind":"file","unit":"Unit 6 - Stoichiometry","type":"Notes","title":"Unit 6 - Stoichiometry - TEACHER EDITION","file":"Unit 6 - Stoichiometry - TEACHER EDITION.docx","path":"Units/Unit 6 - Stoichiometry/Notes/Unit 6 - Stoichiometry - TEACHER EDITION.docx","ext":"docx","size":111833,"teacher":true,"pdf":"_pdf/57a94650d644.pdf","text":"TEACHER EDITION • ANSWER KEY & NOTES HONORS CHEMISTRY • UNIT 6 Stoichiometry Use a balanced equation like a recipe: predict how much you need, how much you make, what runs out first, and how well the lab went. TEACHER EDITION Everything in a light-gray box or cell is an answer or model response. Teacher notes (misconceptions, demo ideas, discussion prompts, sources) appear in the heavy-bordered boxes labeled TEACHER NOTE. The pages follow the student packet, so they line up closely. What we will learn 6.1 Mole ratios 6.2 Mass-to-mass stoichiometry 6.3 Liters and particles (gas volume at STP) 6.4 Limiting and excess reactants (BCA tables) 6.5 Theoretical, actual and percent yield By the end of this unit I can… • Write mole ratios from a balanced equation and use them to convert between moles of two substances. • Solve mass-to-mass problems using a mole map and show every unit. • Convert between liters of gas at STP, moles, grams and particles. • Identify the limiting reactant and calculate product made and excess left over using a BCA table. • Calculate theoretical yield and percent yield, and explain why actual yield is smaller. Honors Chemistry • Unit 6: Stoichiometry • page 1 TEACHER EDITION • ANSWER KEY & NOTES TEACHER OVERVIEW Numbering: the homework folder labels these Topics 6.1–6.3, 5.4 and 5.5 (the last two are mis-numbered in the PDF). This packet is Unit 6 in the notes sequence with topics 6.1–6.5. Every answer is computed by code from the balanced equation, using 2-decimal atomic masses (H 1.01, C 12.01, N 14.01, O 16.00, Na 22.99, Al 26.98, P 30.97, S 32.06, Cl 35.45, K 39.10, Fe 55.85, Ag 107.87, Ca 40.08) and 22.4 L/mol at STP. Unrounded values carry through; only the final answer is rounded to the sig figs of the given data. If your class uses different masses the last digit may differ. Homework quirks: 6.1 #5 writes hydrazine as N₂H₂ (real hydrazine is N₂H₄; the packet keeps the homework formula so the key matches). 6.3 #3 calls NaN₃ “sodium nitride” (it is sodium azide). The 6.3 sub-parts are lettered b, e–j in the PDF; the packet renumbers them. 6.3 #1 needs STP assumed. 6.5 #2 gives “10 grams” of AgNO₃, treated as 2 s.f. 6.5 #3 as written (11.3 g actual) gives a percent yield over 100 % (theoretical is 8.78 g), so the packet uses 7.30 g. Misconceptions: using the coefficients as grams; skipping the mole step; picking the limiting reactant as the one with the smaller mass; dividing by the coefficient in the wrong direction; reporting excess in grams when the question asks for moles or liters; calling percent yield > 100 % acceptable. Pacing idea: 6.1–6.2 on day 1 (mole map until students can draw it from memory), 6.3 on day 2 (STP lab video), 6.4 on days 3–4 (s’mores first, then BCA), 6.5 plus practice on day 5. 6.1 Mole Ratios The coefficients of a balanced equation are a recipe BIG IDEA A balanced equation tells you how many particles react, and since a mole is a counting number, the coefficients also give moles. The mole ratio is a conversion factor built from two coefficients. It is the only bridge between one substance and another. Key vocabulary — write each definition in your own words Term Definition (your words) Example / sketch Stoichiometry The calculation of amounts of reactants and products in a chemical reaction using a balanced equation. How much NH₃ forms from 6 mol H₂? Mole ratio A ratio between the moles of any two substances in a balanced equation, taken from their coefficients. N₂ : H₂ = 1 : 3 Analogy: the recipe 2 crackers : 1 chocolate : 1 marshmallow plays the role of the coefficients. 1. Use the s’more recipe. How many s’mores can you make from 6 chocolates if you have plenty of everything else? How many crackers does that use? Write the two ratios you used. 6 s’mores (1 chocolate : 1 s’more) using 12 crackers (2 crackers : 1 chocolate). The ratios are 1 s’more / 1 chocolate and 2 crackers / 1 chocolate. Honors Chemistry • Unit 6: Stoichiometry • page 2 TEACHER EDITION • ANSWER KEY & NOTES 2. What do you need before you can write a mole ratio? Why must the equation be balanced first? A balanced chemical equation. The coefficients only equal the true particle ratio when the equation is balanced; an unbalanced equation would give the wrong ratio. Write the mole ratios Equation Ratios (write each as a fraction) N₂ + 3H₂ → 2NH₃ N₂/H₂ = ______ N₂/NH₃ = ______ H₂/NH₃ = ______ 8H₂ + S₈ → 8H₂S H₂/H₂S = ______ H₂/S₈ = ______ H₂S/S₈ = ______ ANSWERS N₂/H₂ = 1/3; N₂/NH₃ = 1/2; H₂/NH₃ = 3/2. H₂/H₂S = 8/8 = 1/1; H₂/S₈ = 8/1; H₂S/S₈ = 8/1. 3. Hydrogen gas reacts with oxygen gas to make water. (a) Write the balanced equation. (b) Write the ratios H₂/O₂, H₂/H₂O and O₂/H₂O. (c) How many moles of water form from 10 moles of hydrogen? a. Balanced equation 2H₂ (g) + O₂ (g) → 2H₂O (l) Answer (units & sig figs): 2H₂ + O₂ → 2H₂O b. Mole ratios H₂/O₂ = 2/1; H₂/H₂O = 2/2 = 1/1; O₂/H₂O = 1/2 Answer (units & sig figs): c. Moles of water 10 mol H₂ × (2 mol H₂O / 2 mol H₂) = 1 × 101 mol H₂O Answer (units & sig figs): 1 × 101 mol H₂O WORKED EXAMPLE — MOLE RATIO How many moles of NH₃ form from 4.0 mol N₂? N₂ + 3H₂ → 2NH₃ 4.0 mol N₂ × (2 mol NH₃ / 1 mol N₂) = 8.0 mol NH₃ Answer: 8.0 mol NH₃ 4. Use N₂ + 3H₂ → 2NH₃. a. If 10 moles of NH₃ are produced, how many moles of N₂ were needed? 10 mol NH₃ × (1 mol N₂ / 2 mol NH₃) = 5 mol N₂ Answer (units & sig figs): 5 mol N₂ b. If 3.00 moles of H₂ are used, how many moles of NH₃ are made? 3.00 mol H₂ × (2 mol NH₃ / 3 mol H₂) = 2.00 mol NH₃ Answer (units & sig figs): 2.00 mol NH₃ c. If 0.600 moles of NH₃ are produced, how many moles of H₂ are required? 0.600 mol NH₃ × (3 mol H₂ / 2 mol NH₃) = 0.900 mol H₂ Answer (units & sig figs): 0.900 mol H₂ Honors Chemistry • Unit 6: Stoichiometry • page 3 TEACHER EDITION • ANSWER KEY & NOTES 5. The reaction between hydrazine (N₂H₂) and hydrogen peroxide (H₂O₂) fuels rockets. The products are nitrogen gas and water. (a) Write the balanced equation. (b) How many moles of N₂ form from 37 moles of hydrazine? (c) If 23 moles of water form, how many moles of H₂O₂ were used? a. Balanced equation N₂H₂ (l) + H₂O₂ (l) → N₂ (g) + 2H₂O (g) Answer (units & sig figs): b. Moles of N₂ 37 mol N₂H₂ × (1 mol N₂ / 1 mol N₂H₂) = 37 mol N₂ Answer (units & sig figs): 37 mol N₂ c. Moles of H₂O₂ 23 mol H₂O × (1 mol H₂O₂ / 2 mol H₂O) = 12 mol H₂O₂ Answer (units & sig figs): 12 mol H₂O₂ TEACHER NOTE The homework writes hydrazine as N₂H₂; real hydrazine is N₂H₄ (N₂H₄ + 2H₂O₂ → N₂ + 4H₂O, so 23 mol H₂O would need 11.5 mol H₂O₂). The key above uses the homework formula. 6.2 Mass-to-Mass Stoichiometry Grams → moles → moles → grams BIG IDEA You cannot compare grams of different substances directly, because a gram of one is not the same number of particles as a gram of another. Convert to moles, use the mole ratio, then convert back to grams. The mole map (use the top and bottom boxes in 6.3). Molar masses come from the periodic table. 1. In your own words, why is the mole ratio step the only step that uses the balanced equation? What do the other two steps use? The mole ratio compares particles of two different substances, and only the coefficients tell us that. Converting grams to moles and back uses only each substance’s own molar mass. SETUP RULES 1. Balance the equation. 2. Write the given quantity with its unit and substance. 3. Chain factors so that each unit cancels. 4. Round the final answer to the sig figs of the given data. Honors Chemistry • Unit 6: Stoichiometry • page 4 TEACHER EDITION • ANSWER KEY & NOTES WORKED EXAMPLE — GRAMS TO GRAMS How many grams of FeS form from 5.9 g of Fe? (8Fe + S₈ → 8FeS) 5.9 g Fe × (1 mol Fe / 55.85 g) × (8 mol FeS / 8 mol Fe) × (87.91 g FeS / 1 mol) = 9.3 g FeS Answer: 9.3 g FeS 2. Use the equation Fe + S₈ → FeS. (a) Balance it. a. Balance the equation 8Fe + S₈ → 8FeS Answer (units & sig figs): 8Fe + S₈ → 8FeS b. How many moles of FeS are produced when 2.4 g of S₈ react? 2.4 g S₈ × (1 mol S₈ / 256.48 g) × (8 mol FeS / 1 mol S₈) = 0.075 mol FeS Answer (units & sig figs): 0.075 mol FeS c. How many grams of iron are used if 11.9 g of sulfur (S₈) are used? 11.9 g S₈ × (1 mol S₈ / 256.48 g) × (8 mol Fe / 1 mol S₈) × (55.85 g Fe / 1 mol) = 20.7 g Fe Answer (units & sig figs): 20.7 g Fe 3. Use the equation Fe₂O₃ + C → Fe + CO₂ (the reaction in a blast furnace). a. Balance the equation 2Fe₂O₃ + 3C → 4Fe + 3CO₂ Answer (units & sig figs): 2Fe₂O₃ + 3C → 4Fe + 3CO₂ b. How many grams of iron form if 39.64 g of carbon are used? 39.64 g C × (1 mol C / 12.01 g) × (4 mol Fe / 3 mol C) × (55.85 g Fe / 1 mol) = 245.8 g Fe Answer (units & sig figs): 245.8 g Fe c. If 63.12 g of iron(III) oxide are used, how many grams of carbon dioxide form? 63.12 g Fe₂O₃ × (1 mol Fe₂O₃ / 159.70 g) × (3 mol CO₂ / 2 mol Fe₂O₃) × (44.01 g CO₂ / 1 mol) = 26.09 g CO₂ Answer (units & sig figs): 26.09 g CO₂ 4. A student solved “grams of Fe₂O₃ → grams of CO₂” by multiplying by 159.7 g/mol and then by 44.01 g/mol, skipping the mole ratio. Describe what is wrong and what the student’s answer would represent. The student never converted grams of Fe₂O₃ to moles and never used the mole ratio (2 Fe₂O₃ : 3 CO₂), so the units do not cancel. Grams of one substance cannot be converted directly into grams of another; the coefficients only connect moles. 5. To convert grams of A to grams of B you need… A) molar masses only B) molar masses and the mole ratio L/mol 6.3 C) the mole ratio only Liters and Particles Gas volume at STP and counting atoms Honors Chemistry • Unit 6: Stoichiometry • page 5 D) 22.4 TEACHER EDITION • ANSWER KEY & NOTES BIG IDEA At STP (0 °C and 1 atm), 1 mole of any gas occupies 22.4 L. This lets us convert between liters of a gas and moles, and so to any other substance. One mole is also 6.02 × 10²³ particles. Key vocabulary — write each definition in your own words Term Definition (your words) Example / sketch STP Standard temperature and pressure: 0 °C and 1 atm; 1 mol of any gas occupies 22.4 L. 5.60 L of O₂ = 0.250 mol Molar volume The volume of one mole of gas (22.4 L/mol at STP); it is the same for every ideal gas. 22.4 L/mol THINK OF IT LIKE… A DOZEN IS JUST A NUMBER A dozen is 12 things, whether they are eggs or elephants. A mole is 6.02 × 10²³ things, and at STP that many gas molecules take up 22.4 L whether they are H₂ or Cl₂. Gases are mostly empty space, so the size of the molecule hardly matters. 1. Explain why 1 mole of H₂ and 1 mole of Cl₂ occupy the same volume at STP even though a Cl₂ molecule is much heavier. At STP the gas molecules are far apart (mostly empty space), so the volume depends on the number of particles, not on their size or mass. Equal numbers of particles occupy equal volumes. 2. Hydrogen gas and oxygen gas combine to form water. Assume STP. a. How many liters of H₂ are needed to make 3 moles of water? 3 mol H₂O × (2 mol H₂ / 2 mol H₂O) × (22.4 L H₂ / 1 mol) = 7 × 101 L H₂ Answer (units & sig figs): 7 × 101 L H₂ b. How many grams of water form from 30.2 L of hydrogen? 30.2 L H₂ × (1 mol H₂ / 22.4 L) × (2 mol H₂O / 2 mol H₂) × (18.02 g H₂O / 1 mol) = 24.3 g H₂O Answer (units & sig figs): 24.3 g H₂O c. How many grams of water form from 30.2 L of oxygen? 30.2 L O₂ × (1 mol O₂ / 22.4 L) × (2 mol H₂O / 1 mol O₂) × (18.02 g H₂O / 1 mol) = 48.6 g H₂O Answer (units & sig figs): 48.6 g H₂O d. When 120.3 g of water form, how many liters of hydrogen were used? 120.3 g H₂O × (1 mol H₂O / 18.02 g) × (2 mol H₂ / 2 mol H₂O) × (22.4 L H₂ / 1 mol) = 149.5 L H₂ Answer (units & sig figs): 149.5 L H₂ Honors Chemistry • Unit 6: Stoichiometry • page 6 TEACHER EDITION • ANSWER KEY & NOTES LAB CORNER • Sodium azide in a car air bag A crash sensor sets off the reaction NaN₃(s) → Na(l) + N₂(g). The nitrogen gas inflates the bag in about 0.03 seconds. [ IMAGE GOES HERE ] Photo or diagram of an air bag inflator (add your own) 3. Balance the equation, then solve (STP). a. Balance the equation 2NaN₃ (s) → 2Na (l) + 3N₂ (g) Answer (units & sig figs): 2NaN₃ (s) → 2Na (l) + 3N₂ (g) b. How many liters of N₂ form from 15.62 g of NaN₃? 15.62 g NaN₃ × (1 mol NaN₃ / 65.02 g) × (3 mol N₂ / 2 mol NaN₃) × (22.4 L N₂ / 1 mol) = 8.072 L N₂ Answer (units & sig figs): 8.072 L N₂ c. How many grams of NaN₃ are needed to produce 200.0 L of N₂? 200.0 L N₂ × (1 mol N₂ / 22.4 L) × (2 mol NaN₃ / 3 mol N₂) × (65.02 g NaN₃ / 1 mol) = 387.0 g NaN₃ Answer (units & sig figs): 387.0 g NaN₃ d. If 31.4 g of sodium are produced, how many liters of N₂ are produced? 31.4 g Na × (1 mol Na / 22.99 g) × (3 mol N₂ / 2 mol Na) × (22.4 L N₂ / 1 mol) = 45.9 L N₂ Answer (units & sig figs): 45.9 L N₂ TEACHER NOTE The homework says “sodium nitride”; NaN₃ is sodium azide. 4. How many molecules of water form from 5.0 g of hydrogen gas? (2H₂ + O₂ → 2H₂O; 1 mol = 6.02 × 10²³ molecules) 5.0 g H₂ × (1 mol H₂ / 2.02 g) × (2 mol H₂O / 2 mol H₂) × (6.02 × 1023 molecules / 1 mol) = 1.5 × 1024 molecules H₂O Answer (units & sig figs): 1.5 × 1024 molecules H₂O Honors Chemistry • Unit 6: Stoichiometry • page 7 TEACHER EDITION • ANSWER KEY & NOTES LAB CORNER • Hydrogen gas collected over water A 0.150 g strip of magnesium reacts completely with excess hydrochloric acid. The hydrogen is collected in an inverted graduated cylinder. 5. (a) Write the balanced equation. (b) Calculate the theoretical volume of H₂ at STP in mL. (c) The measured volume was 128 mL. Name one reason it differs. a. Equation Mg (s) + 2HCl (aq) → MgCl₂ (aq) + H₂ (g) Answer (units & sig figs): Mg (s) + 2HCl (aq) → MgCl₂ (aq) + H₂ (g) b. Theoretical volume 0.150 g Mg × (1 mol Mg / 24.31 g) × (1 mol H₂ / 1 mol Mg) × (22.4 L H₂ / 1 mol) = 0.138 L = 138 mL Answer (units & sig figs): 138 mL H₂ c. Reason Some gas stays dissolved or in the tubing; the room is not at STP (T and P differ); water vapor is mixed in with the H₂; the Mg may not be pure. Answer (units & sig figs): 6.4 Limiting and Excess Reactants Which ingredient runs out first? BIG IDEA Reactants are almost never mixed in perfect recipe amounts. The limiting reactant is the one that runs out first and so decides how much product forms. The excess reactant is what is left over when the reaction stops. Honors Chemistry • Unit 6: Stoichiometry • page 8 TEACHER EDITION • ANSWER KEY & NOTES Key vocabulary — write each definition in your own words Term Definition (your words) Example / sketch Limiting reactant The reactant that is completely used up first; it determines the maximum amount of product. Chocolate in the s’more example Excess reactant The reactant present in more than the amount needed; some is left over after the reaction. Crackers and marshmallows Recipe: 2 crackers + 1 chocolate + 1 marshmallow → 1 s’more. 1. Using the s’more recipe and the items shown: (a) How many s’mores can you make? (b) What is the limiting “reactant”? (c) What is left over, and how many of each? (a) Crackers allow 10 ÷ 2 = 5; chocolate allows 3; marshmallows allow 8. The smallest is 3, so 3 s’mores. (b) Chocolate is limiting. (c) Crackers used 6, so 4 left; marshmallows used 3, so 5 left. Chocolate: 0 left. BCA TABLE STEPS (MOLES!) 1. Balance the equation. Convert every given amount to moles. 2. Divide each by its coefficient; the smallest value is the limiting reactant. 3. Before row = starting moles. Change row = the limiting reactant goes to 0; use the mole ratio for the rest (reactants −, products +). 4. After row = Before + Change. Convert the After amounts to the unit the question asks for. Particle picture: N₂ + 3H₂ → 2NH₃ Answer: 6 H₂ react with 2 N₂ to make 4 NH₃; hydrogen is limiting and 1 N₂ is left over. 2. Which reactant is limiting? Draw the particles after the reaction in the AFTER box, then say how many N₂ molecules are left. H₂ is limiting (6 H₂ need only 2 N₂; 3 N₂ are available). After: 4 NH₃ and 1 N₂ left over. Honors Chemistry • Unit 6: Stoichiometry • page 9 TEACHER EDITION • ANSWER KEY & NOTES WORKED EXAMPLE — BCA TABLE 1.5 mol CH₄ react with 2.5 mol Cl₂: CH₄ + 2Cl₂ → CH₂Cl₂ + 2HCl. Find the moles of each product and the moles of excess reactant left. (mol) CH₄ 2Cl₂ CH₂Cl₂ 2HCl Before 1.50 2.50 0 0 Change -1.25 -2.50 +1.25 +2.50 After 0.250 0 1.25 2.50 Limiting reactant: Cl₂ (it gives the smallest amount of reaction, 1.3 “equation units”). CH₂Cl₂ produced: 1.3 mol = 1.3 mol HCl produced: 2.5 mol = 2.5 mol CH₄ left over: 0.25 mol = 0.25 mol 3. 15.0 g of N₂ gas reacts with 4.50 g of H₂ gas: N₂ + 3H₂ → 2NH₃. Use a BCA table to find the mass of NH₃ made and the mass of the excess reactant left. (mol) N₂ 3H₂ 2NH₃ Before 0.535 2.23 0 Change -0.535 -1.61 +1.07 After 0 0.622 1.07 Limiting reactant: N₂ (it gives the smallest amount of reaction, 0.535 “equation units”). NH₃ produced: 1.07 mol = 18.2 g N₂ left over: 0 mol = 0 g H₂ left over: 0.622 mol = 1.26 g 4. 17.5 L of NH₃ gas react with 12.5 L of O₂ gas at STP: 4NH₃ (g) + 5O₂ (g) → 4NO (g) + 6H₂O (g). Use a BCA table to find the mass of each product and the liters of excess reactant left. (mol) 4NH₃ 5O₂ 4NO 6H₂O Before 0.781 0.558 0 0 Change -0.446 -0.558 +0.446 +0.670 After 0.335 0 0.446 0.670 Limiting reactant: O₂ (it gives the smallest amount of reaction, 0.112 “equation units”). NO produced: 0.446 mol = 13.4 g H₂O produced: 0.670 mol = 12.1 g NH₃ left over: 0.335 mol = 7.50 L Honors Chemistry • Unit 6: Stoichiometry • page 10 TEACHER EDITION • ANSWER KEY & NOTES 5. 7.50 g of solid sodium react with 18.5 L of Cl₂ gas at STP: 2Na (s) + Cl₂ (g) → 2NaCl (s). Find the mass of NaCl made and the mass of the excess reactant left. (mol) 2Na Cl₂ 2NaCl Before 0.326 0.826 0 Change -0.326 -0.163 +0.326 After 0 0.663 0.326 Limiting reactant: Na (it gives the smallest amount of reaction, 0.163 “equation units”). NaCl produced: 0.326 mol = 19.1 g Cl₂ left over: 0.663 mol = 47.0 g 6. A classmate says, “The limiting reactant is the one with the smaller mass.” Use any example above to show why this is not reliable. Limiting depends on moles divided by coefficient, not mass. In the N₂/H₂ problem H₂ has the smaller mass (4.50 g vs 15.0 g) and is limiting, but in the sodium/chlorine problem the Cl₂ has far more mass (47 g vs 7.5 g) and is the excess. Different substances have different molar masses and different coefficients. 7. In a BCA table, the limiting reactant’s “After” value is always… A) equal to its Before value B) zero C) equal to the product 6.5 D) negative Theoretical, Actual and Percent Yield How well did the lab go? BIG IDEA The theoretical yield is the most product the equation predicts (from the limiting reactant). The actual yield is what you really collect in the lab. Percent yield = actual ÷ theoretical × 100, and it can never honestly be more than 100 %. Key vocabulary — write each definition in your own words Term Definition (your words) Example / sketch Theoretical yield The maximum amount of product calculated from the balanced equation and the limiting reactant. 8.78 g Al(OH)₃ Actual yield The amount of product actually obtained and measured in an experiment. 7.30 g Al(OH)₃ Percent yield The actual yield divided by the theoretical yield, times 100. 7.30 / 8.78 × 100 = 83.1 % THINK OF IT LIKE… FREE THROWS A player who shoots 10 free throws could, in theory, make all 10 (theoretical yield). Making 8 is the actual yield, so the percent yield is 80 %. Nobody can make 12 out of 10, so a percent yield over 100 % means something is wrong. Honors Chemistry • Unit 6: Stoichiometry • page 11 TEACHER EDITION • ANSWER KEY & NOTES LAB CORNER • Collecting a precipitate A student mixes two solutions, filters the solid, dries it and finds its mass. 1. Give three reasons the actual yield of a precipitate is usually less than the theoretical yield. Then give one reason a student might get a percent yield greater than 100 %. Less: some precipitate stays on the glassware or filter paper; some dissolves a little (not perfectly insoluble); incomplete reaction; side reactions; spills; impure reactants. More than 100 %: the solid was not completely dry (water mass counted) or was contaminated with another substance. 2. Methane burns: CH₄ + 2O₂ → CO","id":18},{"kind":"file","unit":"Unit 7 - Gases","type":"Notes","title":"Unit 7 - Gases - STUDENT NOTES","file":"Unit 7 - Gases - STUDENT NOTES.docx","path":"Units/Unit 7 - Gases/Notes/Unit 7 - Gases - STUDENT NOTES.docx","ext":"docx","size":128644,"teacher":false,"pdf":"_pdf/54c3802d7bf5.pdf","text":"Name: ______________________________ Date: ____________ Period: ______ HONORS CHEMISTRY • UNIT 7 Gases Explain gas behavior with moving particles, then predict how pressure, volume, temperature and moles change together. HOW TO USE THIS PACKET Write in pencil. For every calculation show the givens with units, the equation, your substitution and the answer with units. Always change temperature to kelvin before you use a gas law. LAB CORNER boxes are things you would see at a lab bench. Extra practice is at the back. What we will learn Topic 7.1 Kinetic molecular theory & gas behavior 7.2 Gas relationships & unit conversions 7.3 The combined gas law 7.4 The ideal gas law 7.5 Gas stoichiometry By the end of this unit I can… • Use kinetic molecular theory to explain gas pressure, compressibility and elastic collisions. • Sketch particle diagrams for a change in temperature, volume or number of particles. • Decide whether two gas variables have a direct or an inverse relationship and explain why. • Convert between pressure units (atm, torr, mmHg, kPa, psi) and between °C and kelvin. • Solve combined gas law problems for any unknown, using kelvin temperatures. • Use PV = nRT to find pressure, volume, moles, temperature or molar mass. • Combine the ideal gas law with mole ratios to solve gas stoichiometry problems. Honors Chemistry • Unit 7: Gases • page 1 Name: ______________________________ Date: ____________ Period: ______ 7.1 Kinetic Molecular Theory & Gas Behavior Moving particles • elastic collisions • pressure • particle diagrams BIG IDEA A gas is a huge number of tiny particles flying around in mostly empty space. Everything we measure about a gas (pressure, volume, temperature) comes from how those particles move and hit things. KINETIC MOLECULAR THEORY (KMT) — THE POSTULATES 1. Gas particles are tiny compared with the empty space between them. 2. Particles move constantly, in random, straight-line paths. 3. Particles do not attract or repel each other. 4. Collisions with each other and with the walls are perfectly elastic: no kinetic energy is lost. 5. The average kinetic energy of the particles is proportional to the Kelvin temperature. Key vocabulary — write each definition in your own words Term Definition (your words) Elastic collision What happens to the total kinetic energy when two particles collide? Gas pressure What causes it, and what does it act on? Kelvin temperature What is it proportional to? Why must we use it in gas laws? Example / sketch 1. One of the postulates of KMT states that collisions are perfectly elastic. In your own words, describe what this means about the collision. 2. Gases are easily compressible whereas solids and liquids are not. Explain why. 3. How does a gas create pressure on the surroundings? Honors Chemistry • Unit 7: Gases • page 2 Name: ______________________________ Date: ____________ Period: ______ 4. A sample of gas is held in a sealed container, shown below. a. What do the arrows indicate in the diagram? b. Why are some arrows longer than others? c. Four boxes are provided below. Each box is a set of conditions changed from the original diagram. In each box, draw how the particles will look (use arrows to show speed). Same volume Higher temperature Same # of particles Same volume Same temperature ½ the # of particles Decrease volume Same temperature Same # of particles Increase volume Same temperature Same # of particles 5. According to KMT, which statement is true for an ideal gas? A) particles attract strongly are touching 7.2 B) collisions are perfectly elastic C) particles stop at 25 °C D) particles Gas Relationships & Unit Conversions Pressure • volume • temperature • moles • direct vs inverse • kelvin BIG IDEA Four variables describe a gas: pressure (P), volume (V), temperature (T) and moles (n). Change one and the others respond. If two variables go up together the relationship is direct; if one goes up as the other goes down it is inverse. Direct or inverse? Variables What stays the same? Direct or inverse? Explain with particles a. Pressure vs Volume b. Pressure vs Temperature c. Temperature vs Volume Honors Chemistry • Unit 7: Gases • page 3 Name: ______________________________ Date: ____________ Period: ______ Variables What stays the same? Direct or inverse? Explain with particles d. # Moles vs Pressure CONVERSION FACTORS 1 atm = 760 torr = 760 mmHg = 101.3 kPa = 14.7 psi K = °C + 273 Set up each conversion as a fraction so the unit you start with cancels. Gas-law temperatures must be in kelvin, never °C. Perform the conversion (show the fraction setup) Convert Work and answer (with units) a. 35.0 °C to kelvin b. 1.25 atm to kPa c. 38.0 psi to atm d. 745 mmHg to atm e. 202.6 kPa to psi f. −25 °C to kelvin LAB CORNER • Sealed syringe A syringe is sealed with 40 mL of air at 100 kPa. The plunger is pushed in slowly until the scale reads 20 mL. No air escapes and the temperature does not change. 1. (a) Predict the new pressure. (b) Use particles to explain why the pressure changed. Answer: 1. As the temperature of a gas in a rigid, sealed container increases, the pressure… A) decreases B) increases C) stays the same D) cannot be predicted 2. 2.00 atm is equal to how many mmHg? A) 380 7.3 B) 760 C) 1520 D) 2000 The Combined Gas Law P₁V₁/T₁ = P₂V₂/T₂ • always use kelvin Honors Chemistry • Unit 7: Gases • page 4 Name: ______________________________ Date: ____________ Period: ______ BIG IDEA For a fixed amount of gas, PV/T stays constant. So when conditions change from state 1 to state 2: P₁V₁ / T₁ = P₂V₂ / T₂. Boyle’s, Charles’s and Gay-Lussac’s laws are this equation with the variable that does not change crossed out. STEPS 1. List the givens in a table: P₁, V₁, T₁ and P₂, V₂, T₂ (one is the unknown). 2. Change every temperature to kelvin (°C + 273). 3. Write the equation, solve for the unknown, then substitute with units. 4. Check: does the answer make sense? (Higher T or lower P should make V larger.) WORKED EXAMPLE A sealed balloon holds 2.0 L at 1.0 atm and 27 °C. It is carried up a mountain where the pressure is 0.80 atm and the temperature is −3 °C. What is the new volume? Work it out here: Solve each problem. Show givens, equation, substitution and answer with units. Combined gas law problems 1. If I initially have a gas at a pressure of 11 atm, a volume of 23 liters and a temperature of 200 K, and then I raise the pressure to 13 atm and increase the temperature to 300 K, what is the new volume of the gas? 2. A gas takes up a volume of 18 liters, has a pressure of 2.3 atm and a temperature of 299 K. If I raise the temperature to 355 K and lower the pressure to 1.5 atm, what is the new volume of the gas? 3. A gas that has a volume of 31 liters, a temperature of 45 °C and an unknown pressure has its volume increased to 36 liters and its temperature decreased to 35 °C. If I measure the pressure after the change to be 2.0 atm, what was the original pressure of the gas? Honors Chemistry • Unit 7: Gases • page 5 Name: ______________________________ Date: ____________ Period: ______ Combined gas law problems 4. A gas has a temperature of 13 °C and a volume of 4.1 liters. Calculate the new temperature if the volume of the gas is reduced to 2.5 liters, assuming the pressure stays constant. 5. If I have 18 liters of gas at a temperature of 67 °C and a pressure of 78.89 atm, what will be the pressure of the gas if I raise the temperature to 94 °C and decrease the volume to 12 liters? 1. A gas at constant temperature is compressed from 4.0 L to 2.0 L. The pressure… A) is halved B) doubles C) stays the same D) quadruples 2. Which temperature scale must be used in every gas law calculation? A) °C 7.4 B) kelvin C) °F D) any, as long as it is consistent The Ideal Gas Law PV = nRT • choose R to match your units • molar mass BIG IDEA The combined gas law compares two states of a gas. The ideal gas law describes one state and adds the amount of gas: PV = nRT, where R is a constant. With it you can find any one of P, V, n or T. Value of R Use when P is in… V in… / T in… 0.0821 L·atm / (mol·K) atm L/K 62.4 L·mmHg / (mol·K) mmHg L/K 8.31 L·kPa / (mol·K) kPa L/K STEPS 1. Convert T to kelvin, V to liters, and P to the unit that matches your R. 2. Solve PV = nRT for the unknown (n = PV/RT, V = nRT/P …). 3. For grams: n = mass ÷ molar mass, so mass = n × M. For molar mass: M = mass ÷ n. 4. Answer with units and the right number of sig figs. WORKED EXAMPLE A 5.00 L tank holds nitrogen gas at 2.50 atm and 25 °C. (a) How many moles of N₂ are in the tank? (b) How many grams? Work it out here: Honors Chemistry • Unit 7: Gases • page 6 Name: ______________________________ Date: ____________ Period: ______ Solve each problem Ideal gas law problems 1. A typical human lung has a capacity of 3.90 liters. Assuming the lung has a pressure of 1.00 atm and a temperature of 40.0 °C, calculate the number of moles of gas present in a fully inflated lung. 2. A sample of nitrogen gas contains 0.921 moles at a pressure of 1.38 atm and a temperature of 316 K. What volume does this gas sample occupy? 3. A sample of chlorine gas occupies a volume of 35.5 L at a pressure of 790 mmHg and a temperature of 100.0 °C. Calculate the number of grams of chlorine present in that sample. 4. A student obtains an unknown liquid, Substance A, that readily evaporates into a gas. The goal is to find the molar mass of the gas. The diagram shows the setup. (The particles only show that A has turned into a gas; do not count them in any calculation.) Parts a–e a. The liquid evaporates into the container. If all of it is now gas, how many grams of gas are present? Write your answer under the box that contains the gas. b. What are the units of molar mass? c. The container has a volume of 5.00 liters and a temperature of 25.0 °C. The pressure produced by the gas is 1.25 atm. Calculate the number of moles of gas present. d. Using the given information and your answer to part c, determine the molar mass of Substance A. Honors Chemistry • Unit 7: Gases • page 7 Name: ______________________________ Date: ____________ Period: ______ Parts a–e e. The student repeats the experiment with 10.0 grams of Substance A. Do you expect the calculated molar mass to be higher, lower or the same as in part d? Explain. 1. Which value of R is used when pressure is in atm and volume is in liters? A) 62.4 7.5 B) 0.0821 C) 8.31 D) 22.4 Gas Stoichiometry Grams → moles → (mole ratio) → moles → liters BIG IDEA Moles are the bridge. The balanced equation gives the mole ratio, and PV = nRT converts moles of gas into a volume (or a volume, pressure and temperature into moles). ROAD MAP grams of A → (÷ molar mass) → moles of A → (mole ratio from equation) → moles of B → (V = nRT / P) → liters of B Going the other way: V, P, T of a gas → n = PV / RT → mole ratio → moles → grams (× molar mass). WORKED EXAMPLE Zn + 2HCl → ZnCl₂ + H₂. 3.27 g of zinc reacts completely. What volume of H₂ forms at 1.00 atm and 25 °C? Work it out here: 1. Gasoline is mostly octane (C₈H₁₈), which burns in oxygen to give carbon dioxide and water. Octane combustion a. Write the balanced chemical equation for the combustion of octane. b. A gallon of gasoline has a mass of roughly 4000.0 grams. How many liters of CO₂ will be produced at 21.0 °C and 1.00 atm if 1 gallon of gasoline is combusted? Honors Chemistry • Unit 7: Gases • page 8 Name: ______________________________ Date: ____________ Period: ______ Octane combustion c. Assuming the same temperature and pressure as part b, how many liters of oxygen gas are consumed? d. The enthalpy of combustion (ΔH) of octane is −5,460 kJ/mol rxn. Calculate the energy released in the combustion of 1 gallon of octane. 2. A student performs the experiment below to collect the gas produced by the decomposition of sodium azide. Reaction: ___ NaN₃(s) → ___ Na(s) + ___ N₂(g) Sodium azide a. Label on the diagram where the reaction occurs and where the gas is collected (in the boxes). b. Sodium azide is a solid at room temperature. Using your knowledge of types of compounds, explain why. c. 10.0 g of solid NaN₃ is decomposed and the gas collected. The pressure is 0.98 atm and the temperature is 32.0 °C. Calculate the volume, in mL, of N₂ produced. Honors Chemistry • Unit 7: Gases • page 9 Name: ______________________________ Date: ____________ Period: ______ Sodium azide d. An airbag needs about 75.0 L of N₂ at 1.0 atm and 350 K. How many grams of NaN₃ must be decomposed? 1. The mole ratio used in a gas stoichiometry problem comes from… A) the molar masses B) the coefficients of the balanced equation subscripts in the formulas Honors Chemistry • Unit 7: Gases • page 10 C) the ideal gas constant D) the Name: ______________________________ Date: ____________ Period: ______ PRACTICE Extra Practice — Unit 7 Show your work. Kelvin always. A. Which relationship? (name the law or equation you would use) Situation Law / equation a. A sealed syringe is pushed in; the temperature does not change. b. A balloon is placed in a freezer; the pressure stays the same. c. A sealed aerosol can is heated. d. Gas is pumped into a rigid tank; find the moles added. B. Calculate Problems a. A 6.50 L sample of gas at 1.20 atm and 25 °C is compressed to 2.00 L while heated to 60 °C. What is the new pressure? b. How many grams of CO₂ are in a 2.50 L tank at 3.00 atm and 27 °C? c. CaCO₃ → CaO + CO₂. What volume of CO₂ forms at 1.00 atm and 25 °C when 5.00 g of CaCO₃ decomposes? C. Gas data A student traps air in a syringe at constant temperature and records the pressure as the volume changes. Complete the table, then plot V (y-axis) against P (x-axis). Honors Chemistry • Unit 7: Gases • page 11 Name: ______________________________ Date: ____________ Period: ______ P (atm) V (L) 1.0 12.0 2.0 6.0 4.0 3.0 5.0 2.4 P×V 1. What is the relationship between P and V? D. Think 1. Explain with particles why a sealed can of spray paint says “do not store near heat.” 2. Which gas sample has more particles: 2.0 L at 1.0 atm and 300 K, or 2.0 L at 1.0 atm and 600 K? Explain. 3. At constant pressure, a gas at 300 K is heated to 600 K. Its volume… A) doubles B) is halved C) stays the same D) increases by 300 L 4. A gas has a volume of 22.4 L at 1.00 atm and 273 K. How many moles are present (R = 0.0821)? A) 0.5 mol B) 1.00 mol C) 2.00 mol D) 22.4 mol Honors Chemistry • Unit 7: Gases • page 12","id":19},{"kind":"file","unit":"Unit 7 - Gases","type":"Notes","title":"Unit 7 - Gases - TEACHER EDITION","file":"Unit 7 - Gases - TEACHER EDITION.docx","path":"Units/Unit 7 - Gases/Notes/Unit 7 - Gases - TEACHER EDITION.docx","ext":"docx","size":194437,"teacher":true,"pdf":"_pdf/a7afadbe06a4.pdf","text":"Name: ______________________________ Date: ____________ Period: ______ HONORS CHEMISTRY • UNIT 7 Gases Explain gas behavior with moving particles, then predict how pressure, volume, temperature and moles change together. TEACHER EDITION Everything in a light-gray box, cell or line is an answer or model response. Teacher notes (misconceptions, interpretation choices, corrections) appear in the heavy-bordered boxes labeled TEACHER NOTE. The pages follow the student packet, so they line up closely. TEACHER OVERVIEW Numbering: the homework folder calls this “Unit 8 – Gases” (Worksheets #1–#4). This packet is Unit 7 in the notes sequence; topics 7.1–7.5 follow the worksheets in order (7.1–7.2 = WS #1, 7.3 = WS #2, 7.4 = WS #3, 7.5 = WS #4). Answers are computed. Every numerical answer in the key was calculated by code using R = 0.0821 L·atm/(mol·K), K = °C + 273 and molar masses to 0.01 g/mol, then rounded to the sig figs of the data and proofread. Homework quirks handled in the packet: the degree sign was lost in the PDF text of WS #2 (“450C”, “13 0C”, “67 0C”); these are read as 45 °C, 13 °C, 67 °C and so on. The WS #3 #4 particle picture must not be used for any calculation. WS #4 #1(d) gives ΔH per “mol rxn” – see the note in 7.5. Three extra conversions were added to 7.2 (d–f), each topic has a worked example and 1–2 multiple-choice items, and an Extra Practice page of new problems was written. Dalton’s law, density and STP are not in the homework and are not included. Common misconceptions: using °C in a gas law; mixing pressure units with R; reading “inverse” as “negative”; believing pressure comes from the weight of the gas or from particles hitting each other; thinking collisions slow the particles down; forgetting the mole ratio in gas stoichiometry. What we will learn Topic 7.1 Kinetic molecular theory & gas behavior 7.2 Gas relationships & unit conversions 7.3 The combined gas law 7.4 The ideal gas law 7.5 Gas stoichiometry By the end of this unit I can… • Use kinetic molecular theory to explain gas pressure, compressibility and elastic collisions. • Sketch particle diagrams for a change in temperature, volume or number of particles. • Decide whether two gas variables have a direct or an inverse relationship and explain why. • Convert between pressure units (atm, torr, mmHg, kPa, psi) and between °C and kelvin. • Solve combined gas law problems for any unknown, using kelvin temperatures. • Use PV = nRT to find pressure, volume, moles, temperature or molar mass. • Combine the ideal gas law with mole ratios to solve gas stoichiometry problems. Honors Chemistry • Unit 7: Gases • TEACHER EDITION • page 1 Name: ______________________________ Date: ____________ Period: ______ 7.1 Kinetic Molecular Theory & Gas Behavior Moving particles • elastic collisions • pressure • particle diagrams BIG IDEA A gas is a huge number of tiny particles flying around in mostly empty space. Everything we measure about a gas (pressure, volume, temperature) comes from how those particles move and hit things. KINETIC MOLECULAR THEORY (KMT) — THE POSTULATES 1. Gas particles are tiny compared with the empty space between them. 2. Particles move constantly, in random, straight-line paths. 3. Particles do not attract or repel each other. 4. Collisions with each other and with the walls are perfectly elastic: no kinetic energy is lost. 5. The average kinetic energy of the particles is proportional to the Kelvin temperature. Key vocabulary — write each definition in your own words Term Definition (your words) Example / sketch Elastic collision What happens to the total kinetic energy when two particles collide? Two particles bounce apart; their speeds change but the total energy does not. Total kinetic energy is the same before and after: no energy is lost as heat or sound, so the particles keep moving. Gas pressure What causes it, and what does it act on? Kelvin temperature What is it proportional to? Why must we use it in gas laws? Many hits per second on a wall. Force of particle collisions with the walls of the container, divided by wall area. K = °C + 273 Proportional to the average kinetic energy; 0 K is zero motion, so ratios and proportions work. 1. One of the postulates of KMT states that collisions are perfectly elastic. In your own words, describe what this means about the collision. Particles bounce off each other and the walls without losing any kinetic energy; the energy is only passed between particles, so the gas never “run down.” 2. Gases are easily compressible whereas solids and liquids are not. Explain why. Gas particles are very far apart (mostly empty space), so they can be pushed closer together. In solids and liquids the particles are already touching. 3. How does a gas create pressure on the surroundings? Gas particles move constantly and collide with the walls of the container. Each collision exerts a tiny force; billions of collisions per second over the wall area give pressure. Honors Chemistry • Unit 7: Gases • TEACHER EDITION • page 2 Name: ______________________________ Date: ____________ Period: ______ 4. A sample of gas is held in a sealed container, shown below. a. What do the arrows indicate in the diagram? Direction and speed of each particle’s motion. b. Why are some arrows longer than others? Longer arrow = faster particle (more kinetic energy). Particles in a gas move at a range of speeds; temperature measures the average. c. Four boxes are provided below. Each box is a set of conditions changed from the original diagram. In each box, draw how the particles will look (use arrows to show speed). Same volume Higher temperature Same # of particles Same volume Same temperature ½ the # of particles Decrease volume Same temperature Same # of particles Increase volume Same temperature Same # of particles TEACHER NOTE Sketches will vary. Look for: (1) same number of particles in the same box with longer arrows; (2) half as many particles, same arrow length, same box; (3) the same particles in a smaller box (closer together, more collisions per second); (4) the same particles in a larger box. Arrow length is speed, not force. Pressure is from collisions with the walls, not from the weight of the gas and not from particles hitting each other. 5. According to KMT, which statement is true for an ideal gas? A) particles attract strongly are touching B) collisions are perfectly elastic C) particles stop at 25 °C D) particles Answer: B — KMT postulate 4. 7.2 Gas Relationships & Unit Conversions Pressure • volume • temperature • moles • direct vs inverse • kelvin BIG IDEA Four variables describe a gas: pressure (P), volume (V), temperature (T) and moles (n). Change one and the others respond. If two variables go up together the relationship is direct; if one goes up as the other goes down it is inverse. Direct or inverse? Variables What stays the same? Direct or inverse? Explain with particles a. Pressure vs Volume T and n Inverse Smaller volume: particles hit the walls more often → higher pressure. Honors Chemistry • Unit 7: Gases • TEACHER EDITION • page 3 Name: ______________________________ Date: ____________ Period: ______ Variables What stays the same? Direct or inverse? Explain with particles b. Pressure vs Temperature V and n Direct Hotter: particles move faster, hit harder and more often → higher pressure. c. Temperature vs Volume P and n Direct Hotter gas must spread out (larger V) to keep the same pressure. d. # Moles vs Pressure V and T Direct More particles → more wall collisions → higher pressure. CONVERSION FACTORS 1 atm = 760 torr = 760 mmHg = 101.3 kPa = 14.7 psi K = °C + 273 Set up each conversion as a fraction so the unit you start with cancels. Gas-law temperatures must be in kelvin, never °C. Perform the conversion (show the fraction setup) Convert Work and answer (with units) a. 35.0 °C to kelvin 35.0 + 273 = 308 K b. 1.25 atm to kPa 1.25 atm × (101.3 kPa / 1 atm) = 127 kPa c. 38.0 psi to atm 38.0 psi × (1 atm / 14.7 psi) = 2.59 atm d. 745 mmHg to atm 745 mmHg × (1 atm / 760 mmHg) = 0.980 atm e. 202.6 kPa to psi 202.6 kPa × (14.7 psi / 101.3 kPa) = 29.4 psi f. −25 °C to kelvin −25 + 273 = 248 K LAB CORNER • Sealed syringe A syringe is sealed with 40 mL of air at 100 kPa. The plunger is pushed in slowly until the scale reads 20 mL. No air escapes and the temperature does not change. 1. (a) Predict the new pressure. (b) Use particles to explain why the pressure changed. Answer: (a) About 200 kPa: half the volume, double the pressure (inverse; P₁V₁ = P₂V₂). (b) Same number of particles in half the space, so they hit the walls twice as often. Honors Chemistry • Unit 7: Gases • TEACHER EDITION • page 4 Name: ______________________________ Date: ____________ Period: ______ TEACHER NOTE K = °C + 273 is used as on the homework (college courses use 273.15; answers differ in the 4th sig fig). “Direct” means both increase together (for P–T the graph is a straight line through the origin when T is in kelvin); “inverse” means the product stays constant. Do not let students call an inverse relationship “negative.” 1. As the temperature of a gas in a rigid, sealed container increases, the pressure… A) decreases B) increases C) stays the same D) cannot be predicted Answer: B 2. 2.00 atm is equal to how many mmHg? A) 380 B) 760 C) 1520 D) 2000 Answer: C — 2.00 × 760 = 1520 7.3 The Combined Gas Law P₁V₁/T₁ = P₂V₂/T₂ • always use kelvin BIG IDEA For a fixed amount of gas, PV/T stays constant. So when conditions change from state 1 to state 2: P₁V₁ / T₁ = P₂V₂ / T₂. Boyle’s, Charles’s and Gay-Lussac’s laws are this equation with the variable that does not change crossed out. STEPS 1. List the givens in a table: P₁, V₁, T₁ and P₂, V₂, T₂ (one is the unknown). 2. Change every temperature to kelvin (°C + 273). 3. Write the equation, solve for the unknown, then substitute with units. 4. Check: does the answer make sense? (Higher T or lower P should make V larger.) WORKED EXAMPLE A sealed balloon holds 2.0 L at 1.0 atm and 27 °C. It is carried up a mountain where the pressure is 0.80 atm and the temperature is −3 °C. What is the new volume? Work it out here: T₁ = 27 + 273 = 300 K; T₂ = −3 + 273 = 270 K V₂ = P₁V₁T₂ / (T₁P₂) = (1.0 atm)(2.0 L)(270 K) / [(300 K)(0.80 atm)] = 2.3 L Check: pressure drops (V up) and temperature drops (V down); net is a slightly larger balloon. Solve each problem. Show givens, equation, substitution and answer with units. Combined gas law problems 1. If I initially have a gas at a pressure of 11 atm, a volume of 23 liters and a temperature of 200 K, and then I raise the pressure to 13 atm and increase the temperature to 300 K, what is the new volume of the gas? V₂ = P₁V₁T₂ / (T₁P₂) = (11)(23)(300) / [(200)(13)] = 29 L Honors Chemistry • Unit 7: Gases • TEACHER EDITION • page 5 Name: ______________________________ Date: ____________ Period: ______ Combined gas law problems 2. A gas takes up a volume of 18 liters, has a pressure of 2.3 atm and a temperature of 299 K. If I raise the temperature to 355 K and lower the pressure to 1.5 atm, what is the new volume of the gas? V₂ = (2.3)(18)(355) / [(299)(1.5)] = 33 L 3. A gas that has a volume of 31 liters, a temperature of 45 °C and an unknown pressure has its volume increased to 36 liters and its temperature decreased to 35 °C. If I measure the pressure after the change to be 2.0 atm, what was the original pressure of the gas? T₁ = 318 K, T₂ = 308 K. P₁ = P₂V₂T₁ / (V₁T₂) = (2.0)(36)(318) / [(31)(308)] = 2.4 atm 4. A gas has a temperature of 13 °C and a volume of 4.1 liters. Calculate the new temperature if the volume of the gas is reduced to 2.5 liters, assuming the pressure stays constant. T₁ = 286 K. T₂ = T₁V₂ / V₁ = (286)(2.5) / 4.1 = 174 K (= −99 °C) 5. If I have 18 liters of gas at a temperature of 67 °C and a pressure of 78.89 atm, what will be the pressure of the gas if I raise the temperature to 94 °C and decrease the volume to 12 liters? T₁ = 340 K, T₂ = 367 K. P₂ = P₁V₁T₂ / (V₂T₁) = (78.89)(18)(367) / [(12)(340)] = 127.7 atm ≈ 1.3 × 10² atm TEACHER NOTE — CORRECTIONS In the PDF text of WS #2 the degree signs were lost (“450C,” “13 0C,” “67 0C”); the packet reads them as 45 °C, 13 °C, 67 °C and prints °C explicitly. #4 holds pressure constant, so it is Charles’s law; accept 174 K or −99 °C if the unit is given. #5 is limited to 2 sig figs by 18 L and 12 L, so 1.3 × 10² atm (128 atm) are both fine. Typical error: leaving a temperature in °C. 1. A gas at constant temperature is compressed from 4.0 L to 2.0 L. The pressure… A) is halved B) doubles C) stays the same D) quadruples Answer: B — P₁V₁ = P₂V₂ 2. Which temperature scale must be used in every gas law calculation? A) °C B) kelvin C) °F D) any, as long as it is consistent Answer: B 7.4 The Ideal Gas Law PV = nRT • choose R to match your units • molar mass BIG IDEA The combined gas law compares two states of a gas. The ideal gas law describes one state and adds the amount of gas: PV = nRT, where R is a constant. With it you can find any one of P, V, n or T. Honors Chemistry • Unit 7: Gases • TEACHER EDITION • page 6 Name: ______________________________ Date: ____________ Period: ______ Value of R Use when P is in… V in… / T in… 0.0821 L·atm / (mol·K) atm L/K 62.4 L·mmHg / (mol·K) mmHg L/K 8.31 L·kPa / (mol·K) kPa L/K STEPS 1. Convert T to kelvin, V to liters, and P to the unit that matches your R. 2. Solve PV = nRT for the unknown (n = PV/RT, V = nRT/P …). 3. For grams: n = mass ÷ molar mass, so mass = n × M. For molar mass: M = mass ÷ n. 4. Answer with units and the right number of sig figs. WORKED EXAMPLE A 5.00 L tank holds nitrogen gas at 2.50 atm and 25 °C. (a) How many moles of N₂ are in the tank? (b) How many grams? Work it out here: (a) n = PV / RT = (2.50 atm)(5.00 L) / [(0.0821)(298 K)] = 0.511 mol (b) mass = n × M = (0.511 mol)(28.02 g/mol) = 14.3 g Solve each problem Ideal gas law problems 1. A typical human lung has a capacity of 3.90 liters. Assuming the lung has a pressure of 1.00 atm and a temperature of 40.0 °C, calculate the number of moles of gas present in a fully inflated lung. n = PV / RT = (1.00)(3.90) / [(0.0821)(313)] = 0.152 mol 2. A sample of nitrogen gas contains 0.921 moles at a pressure of 1.38 atm and a temperature of 316 K. What volume does this gas sample occupy? V = nRT / P = (0.921)(0.0821)(316) / 1.38 = 17.3 L 3. A sample of chlorine gas occupies a volume of 35.5 L at a pressure of 790 mmHg and a temperature of 100.0 °C. Calculate the number of grams of chlorine present in that sample. P = 790 / 760 = 1.04 atm; T = 373 K. n = PV / RT = (1.04)(35.5) / [(0.0821)(373)] = 1.21 mol mass = (1.21 mol)(70.90 g/mol) = 85.4 g Cl₂ Honors Chemistry • Unit 7: Gases • TEACHER EDITION • page 7 Name: ______________________________ Date: ____________ Period: ______ 4. A student obtains an unknown liquid, Substance A, that readily evaporates into a gas. The goal is to find the molar mass of the gas. The diagram shows the setup. (The particles only show that A has turned into a gas; do not count them in any calculation.) Parts a–e a. The liquid evaporates into the container. If all of it is now gas, how many grams of gas are present? Write your answer under the box that contains the gas. 5 grams (conservation of mass; the mass does not change when a liquid evaporates). b. What are the units of molar mass? grams per mole (g/mol) c. The container has a volume of 5.00 liters and a temperature of 25.0 °C. The pressure produced by the gas is 1.25 atm. Calculate the number of moles of gas present. n = PV / RT = (1.25)(5.00) / [(0.0821)(298)] = 0.255 mol d. Using the given information and your answer to part c, determine the molar mass of Substance A. M = mass / n = 5.00 g / 0.255 mol = 19.6 g/mol e. The student repeats the experiment with 10.0 grams of Substance A. Do you expect the calculated molar mass to be higher, lower or the same as in part d? Explain. The same. Twice the mass gives twice the moles (and twice the pressure at the same V and T), so mass ÷ moles is unchanged: molar mass is a property of the substance. TEACHER NOTE Choose R to match units: mmHg problems may use 62.4 instead of converting. T = 25.0 °C is 298 K here. In 4(e) students often say “higher” because the mass is larger; ask them what happens to n. 1. Which value of R is used when pressure is in atm and volume is in liters? A) 62.4 B) 0.0821 C) 8.31 D) 22.4 Answer: B 7.5 Gas Stoichiometry Grams → moles → (mole ratio) → moles → liters BIG IDEA Moles are the bridge. The balanced equation gives the mole ratio, and PV = nRT converts moles of gas into a volume (or a volume, pressure and temperature into moles). ROAD MAP grams of A → (÷ molar mass) → moles of A → (mole ratio from equation) → moles of B → (V = nRT / P) → liters of B Going the other way: V, P, T of a gas → n = PV / RT → mole ratio → moles → grams (× molar mass). Honors Chemistry • Unit 7: Gases • TEACHER EDITION • page 8 Name: ______________________________ Date: ____________ Period: ______ WORKED EXAMPLE Zn + 2HCl → ZnCl₂ + H₂. 3.27 g of zinc reacts completely. What volume of H₂ forms at 1.00 atm and 25 °C? Work it out here: 3.27 g Zn × (1 mol / 65.38 g) = 0.0500 mol Zn; 1:1 ratio → 0.0500 mol H₂ V = nRT / P = (0.0500)(0.0821)(298) / 1.00 = 1.22 L H₂ 1. Gasoline is mostly octane (C₈H₁₈), which burns in oxygen to give carbon dioxide and water. Octane combustion a. Write the balanced chemical equation for the combustion of octane. 2C₈H₁₈ + 25O₂ → 16CO₂ + 18H₂O (or C₈H₁₈ + 12.5O₂ → 8CO₂ + 9H₂O) b. A gallon of gasoline has a mass of roughly 4000.0 grams. How many liters of CO₂ will be produced at 21.0 °C and 1.00 atm if 1 gallon of gasoline is combusted? 4000.0 g ÷ 114.23 g/mol = 35.017 mol C₈H₁₈ → × 8 = 280.14 mol CO₂ V = nRT / P = (280.14)(0.0821)(294) / 1.00 = 6762 L CO₂ (≈ 6.76 × 10³ L) c. Assuming the same temperature and pressure as part b, how many liters of oxygen gas are consumed? mol O₂ = 35.017 × 12.5 = 437.71 mol; V = (437.71)(0.0821)(294) / 1.00 = 10600 L O₂ (≈ 1.06 × 10⁴ L) d. The enthalpy of combustion (ΔH) of octane is −5,460 kJ/mol rxn. Calculate the energy released in the combustion of 1 gallon of octane. For the equation in (a) as written (2 octane = 1 mol rxn): 35.017 mol octane ÷ 2 = 17.509 mol rxn; 17.509 × 5,460 kJ = 9.56 × 10⁴ kJ released 2. A student performs the experiment below to collect the gas produced by the decomposition of sodium azide. Reaction: ___ NaN₃(s) → ___ Na(s) + ___ N₂(g) 2, 2, 3 Honors Chemistry • Unit 7: Gases • TEACHER EDITION • page 9 Name: ______________________________ Date: ____________ Period: ______ Sodium azide a. Label on the diagram where the reaction occurs and where the gas is collected (in the boxes). See the labeled diagram above. b. Sodium azide is a solid at room temperature. Using your knowledge of types of compounds, explain why. NaN₃ is ionic (a metal and a non-metal); strong electrostatic attractions between Na⁺ and N₃⁻ ions in a crystal lattice need a lot of energy to overcome, so it is a solid. c. 10.0 g of solid NaN₃ is decomposed and the gas collected. The pressure is 0.98 atm and the temperature is 32.0 °C. Calculate the volume, in mL, of N₂ produced. 10.0 g ÷ 65.01 g/mol = 0.154 mol NaN₃ → × 3/2 = 0.231 mol N₂ V = nRT / P = (0.231)(0.0821)(305) / 0.98 = 5.90 L = 5.9 × 10³ mL d. An airbag needs about 75.0 L of N₂ at 1.0 atm and 350 K. How many grams of NaN₃ must be decomposed? n(N₂) = PV / RT = (1.0)(75.0) / [(0.0821)(350)] = 2.61 mol; × 2/3 = 1.74 mol NaN₃ mass = (1.74 mol)(65.01 g/mol) = 113 g NaN₃ (≈ 1.1 × 10² g) TEACHER NOTE 1(d): “kJ/mol rxn” means per mole of the reaction as written. With 2C₈H₁₈ + 25O₂ → … one mole of reaction burns 2 mol octane, so 35.0 mol octane = 17.5 mol rxn → 9.56 × 10⁴ kJ. If a student balances with 1 octane (12.5 O₂) the number of moles of reaction doubles and the answer is 1.91 × 10⁵ kJ; discuss why the stated unit depends on how the equation is written. The water-vapor pressure of the collected gas is ignored in 2(c). Real airbags add KNO₃ so t","id":20},{"kind":"file","unit":"Unit 8 - Intermolecular Forces","type":"Notes","title":"Unit 8 - Intermolecular Forces - STUDENT NOTES","file":"Unit 8 - Intermolecular Forces - STUDENT NOTES.docx","path":"Units/Unit 8 - Intermolecular Forces/Notes/Unit 8 - Intermolecular Forces - STUDENT NOTES.docx","ext":"docx","size":171275,"teacher":false,"pdf":"_pdf/9488122f7165.pdf","text":"Name: ______________________________ Date: ____________ Period: ______ HONORS CHEMISTRY • UNIT 8 Intermolecular Forces Why water is a liquid but methane is a gas, why some liquids evaporate in seconds and others cling to a surface — it all comes down to the attractions BETWEEN molecules. HOW TO USE THIS PACKET Draw every structure yourself and write explanations in your own words. LAB CORNER boxes are things you would see or do at a lab bench. The flowchart in 8.2 is the one page to keep for the rest of the year. What we will learn 8.1 London dispersion forces 8.2 Identifying the intermolecular force (dipole–dipole, hydrogen bonding) 8.3 IMFs and the properties of liquids 8.4 Putting it all together: boiling point, volatility, ΔHvap ★ Extra practice & unit review By the end of this unit I can… • Distinguish between intramolecular and intermolecular forces and show each on a drawing. • Explain how London dispersion forces form, why every molecule has them and why they get stronger as molecules get bigger. • Decide whether a molecule is polar, and list every IMF it can form (LDF, dipole–dipole, hydrogen bonding). • Draw two molecules and show the attraction between them. • Relate IMF strength to boiling point, evaporation rate (volatility), drop shape and enthalpy of vaporization. • Rank substances by boiling point and justify the ranking with IMFs. • Use ΔHvap, molar mass and gas-volume relationships in calculations. Honors Chemistry • Unit 8: Intermolecular Forces • page 1 Name: ______________________________ Date: ____________ Period: ______ 8.1 London Dispersion Forces Intramolecular vs intermolecular • temporary dipoles • size and boiling point BIG IDEA There are forces inside molecules (the covalent bonds that hold atoms together) and forces between molecules (intermolecular forces, IMFs). Changes of state, like boiling, break the forces between molecules; they do not break the bonds inside them. Key vocabulary — write each definition in your own words Term Definition (your words) Intramolecular force Where is it? Give an example. Intermolecular force (IMF) Where is it? Is it stronger or weaker than a covalent bond? Temporary (instantaneous) dipole How does it form? Induced dipole What induces it? London dispersion force (LDF) Which molecules have it? Polarizability Why do bigger molecules have it more? Example / sketch Intramolecular vs intermolecular Two HF molecules: the solid line is the bond inside a molecule; the dashed line is the attraction between molecules. Honors Chemistry • Unit 8: Intermolecular Forces • page 2 Name: ______________________________ Date: ____________ Period: ______ 1. An intramolecular force is considered a ____________________. How is it represented in a Lewis diagram? 2. Complete the Lewis structure for HF, then draw an arrow to the intramolecular force. HF: 3. Where does an intermolecular force occur? 4. Why can two molecules be attracted to each other? What causes an IMF? [ IMAGE GOES HERE ] Optional: the 'which diagram shows an IMF?' choices from the homework THINK OF IT LIKE… HOLDING HANDS VS. HOLDING A HAND-TIED ROPE Imagine each molecule is a group of friends tied together with strong rope (the covalent bonds). The friends in different groups can only hold hands loosely (IMFs). Pulling the groups apart (boiling) only lets go of the hands; the rope stays tied. How London dispersion forces form Temporary dipole → induced dipole → attraction. CUES / KEY WORDS DESCRIBE HOW TWO NON-POLAR MOLECULES COME TO ATTRACT EACH OTHER Step 1 Step 2 Step 3 Honors Chemistry • Unit 8: Intermolecular Forces • page 3 Name: ______________________________ Date: ____________ Period: ______ 5. Why are LDFs the weakest of the intermolecular forces? Your answer should discuss the dipole that is formed. 6. Explain why ALL molecules form LDF. 7. Which molecules form only LDF as their main intermolecular force? Size matters: LDF and boiling point Three alkanes (skeletal structures: each corner is a carbon with enough hydrogens to make four bonds). Formula Number of electrons State at room temp. Boiling point C₃H₈ gas −42 °C C₅H₁₂ liquid 36 °C C₈H₁₈ liquid 125 °C 8. What trend do you notice between the size of the molecule and the boiling point? 9. Each molecule forms only LDF. Explain what causes the trend. Honors Chemistry • Unit 8: Intermolecular Forces • page 4 Name: ______________________________ Date: ____________ Period: ______ 10. Predict: which has the higher boiling point, F₂ or Br₂? Which is a gas at room temperature? Explain. 11. An intramolecular force is… A) the attraction between two molecules B) a chemical bond within a molecule C) only found in ionic compounds D) the same as an LDF 12. Which has the strongest London dispersion forces? A) CH₄ B) C₂H₆ C) C₄H₁₀ D) C₈H₁₈ 13. Boiling a liquid such as water breaks… A) the covalent bonds within molecules B) the intermolecular forces between molecules C) both equally D) neither 14. Which of these only forms LDF? A) H₂O B) CH₃Cl C) N₂ 8.2 D) HF Identifying the Intermolecular Force Polarity → IMFs • dipole–dipole • hydrogen bonding BIG IDEA To find a molecule’s IMFs: draw the Lewis structure, decide the shape, and decide whether it is polar. Every molecule has LDF; polar molecules add dipole–dipole; molecules with H bonded to N, O or F add hydrogen bonding. Honors Chemistry • Unit 8: Intermolecular Forces • page 5 Name: ______________________________ Date: ____________ Period: ______ Key vocabulary — write each definition in your own words Term Definition (your words) Permanent dipole Which molecules have one? Dipole–dipole force Between which m ain IMF in both molecules? Why is the boiling point of CCl₄ much larger than CH₄? 5. The ΔHvap for CCl₄ is 39.4 kJ/mol. Calculate the energy (kJ) needed to vaporize 10.0 g of CCl₄ (molar mass 153.82 g/mol). Work: Answer (units & sig figs): __________________________________ 6. Would you expect ΔHvap for CH₄ to be higher or lower than CCl₄? Explain. Honors Chemistry • Unit 8: Intermolecular Forces • page 12 Name: ______________________________ Date: ____________ Period: ______ Connecting to stoichiometry: propane Propane, C₃H₈, is a colorless, odorless gas at room temperature (non-polar, only LDF; boiling point −42 °C). 7. How many liters of propane are present in 7.50 g of propane at STP? (1 mol of gas = 22.4 L at STP) Work: Answer (units & sig figs): __________________________________ 8. Write the full balanced equation for the combustion of propane gas in oxygen. 9. The enthalpy of the reaction is ΔH = −2200.0 kJ per mole of reaction. How many kJ of energy are released when the 7.50 g of propane are burned? Work: Answer (units & sig figs): __________________________________ 10. Which has the highest boiling point? A) CH₄ B) C₅H₁₂ C) H₂O D) C₂H₆ 11. Which has the largest ΔHvap? A) CH₃OH B) C₂H₆ C) CH₄ D) Ne Honors Chemistry • Unit 8: Intermolecular Forces • page 13 Name: ______________________________ Date: ____________ Period: ______ PRACTICE Extra Practice — Unit 8 Show your reasoning. A. Identify the IMFs Molecule Polar? All IMFs present Hydrogen bonds with itself? NH₃ CH₃OH CO₂ CH₃Cl Cl₂ HBr C₆H₁₄ CH₃COOH B. Rank by boiling point (lowest → highest) and justify Set Ranking and one-sentence reason He, Ne, Ar, Kr CH₄, NH₃, H₂O HCl, HF, Cl₂ CH₃CH₂CH₃, CH₃OCH₃, CH₃CH₂OH C. Explain 1. Water (18 g/mol) boils at 100 °C but H₂S (34 g/mol) boils at −60 °C. Explain, using IMFs. 2. Explain why ice floats on liquid water. (Hint: hydrogen bonds.) 3. Gasoline (mostly C₈H₁₈) is more volatile than motor oil (long hydrocarbons, C₂₀ and larger). Explain using IMFs. Honors Chemistry • Unit 8: Intermolecular Forces • page 14 Name: ______________________________ Date: ____________ Period: ______ 4. A student says: “When water boils, the H–O bonds break to form hydrogen and oxygen gas.” Correct the statement. D. Quick checks 5. Which molecule has hydrogen bonding as its main IMF? A) CH₃F B) CH₃OCH₃ C) CH₃NH₂ D) HCl 6. Which has the highest vapor pressure at 25 °C? A) water B) ethanol C) hexane D) glycerol 7. What is the dipole type in a pure sample of Br₂? A) permanent only B) temporary C) none; atoms are neutral D) hydrogen bond 8. As the number of electrons in a nonpolar molecule increases, its boiling point… A) decreases B) increases C) stays the same D) doesn’t depend Unit 8 review 9. Describe the three types of IMF in order from weakest to strongest and give an example of each. 10. Explain the steps you take to predict the IMFs in a molecule you have never seen. Honors Chemistry • Unit 8: Intermolecular Forces • page 15","id":21},{"kind":"file","unit":"Unit 8 - Intermolecular Forces","type":"Notes","title":"Unit 8 - Intermolecular Forces - TEACHER EDITION","file":"Unit 8 - Intermolecular Forces - TEACHER EDITION.docx","path":"Units/Unit 8 - Intermolecular Forces/Notes/Unit 8 - Intermolecular Forces - TEACHER EDITION.docx","ext":"docx","size":197430,"teacher":true,"pdf":"_pdf/995e37b7a99a.pdf","text":"TEACHER EDITION • ANSWER KEY & NOTES HONORS CHEMISTRY • UNIT 8 Intermolecular Forces Why water is a liquid but methane is a gas, why some liquids evaporate in seconds and others cling to a surface — it all comes down to the attractions BETWEEN molecules. TEACHER EDITION Everything in a light-gray box or cell is an answer or model response. Teacher notes (misconceptions, demo ideas, discussion prompts, sources) appear in the heavy-bordered boxes labeled TEACHER NOTE. The pages follow the student packet, so they line up closely. What we will learn 8.1 London dispersion forces 8.2 Identifying the intermolecular force (dipole–dipole, hydrogen bonding) 8.3 IMFs and the properties of liquids 8.4 Putting it all together: boiling point, volatility, ΔHvap ★ Extra practice & unit review By the end of this unit I can… • Distinguish between intramolecular and intermolecular forces and show each on a drawing. • Explain how London dispersion forces form, why every molecule has them and why they get stronger as molecules get bigger. • Decide whether a molecule is polar, and list every IMF it can form (LDF, dipole–dipole, hydrogen bonding). • Draw two molecules and show the attraction between them. • Relate IMF strength to boiling point, evaporation rate (volatility), drop shape and enthalpy of vaporization. • Rank substances by boiling point and justify the ranking with IMFs. • Use ΔHvap, molar mass and gas-volume relationships in calculations. Honors Chemistry • Unit 8: Intermolecular Forces • page 1 TEACHER EDITION • ANSWER KEY & NOTES Unit at a glance (teacher) Topic Suggested pacing Depth the homework expects 8.1 LDF 1–2 days Intra vs intermolecular; LDF origin (temporary dipole), why weakest, all molecules have them; boiling point trend of C₃H₈, C₅H₁₂, C₈H₁₈. 8.2 Identifying IMFs 2 days Lewis structure → polarity → IMF for H₂O, CH₃Cl, CH₄, CCl₄, CO, CS₂, H₂S, HF, O₂, diethyl ether, HCN; temporary vs permanent dipole; draw two CH₃Cl. 8.3 Properties 1–2 days Drop shapes (surface tension) for water, pentane, acetone; evaporation; draw H-bonding between 2 water molecules and ethanol/water. 8.4 Putting it together 1–2 days Rank HF, O₂, CO₂; most volatile (C₂H₆, H₂O, CH₃OH); CCl₄ vs CH₄; ΔHvap calculation (10.0 g CCl₄); propane at STP and combustion energy. TEACHER OVERVIEW Big picture. This unit is where Unit 3’s shape and polarity pay off. The whole unit reduces to one habit: Lewis structure → shape → polar? → list ALL IMFs → compare strength (and size) → predict property. Misconceptions to watch for: • Confusing bonds with IMFs: boiling water breaks IMFs, NOT the O–H covalent bonds. • “Hydrogen bonding is a bond.” It is an attraction between molecules (about 5–10% of a covalent bond’s strength). • “Any molecule with H and O or N can hydrogen-bond.” The H must be directly bonded to N, O or F (CH₃Cl, H₂S and HCN do NOT hydrogen-bond; the H in CH₃CH₂–O–CH₂CH₃ is bonded to C). • Saying non-polar molecules have no IMF at all (they have LDF). • Always giving LDF as the “main” IMF of a polar molecule. LDF is present in every molecule; ‘main’ means the strongest type present. • Forgetting size: a large non-polar molecule can have a higher boiling point than a small polar one (e.g., CCl₄, 76 °C, vs HCl, −85 °C). • Describing LDF as “the electrons move to one side.” It is a temporary, instantaneous dipole created by random electron motion that induces a dipole in a neighbor. IMAGES Image spots: the two HF structure choices in 8.1, the three drop drawings in 8.3 and the ethanol–water choices come from the homework; use the IMAGE GOES HERE frames if you want the originals. 8.1 London Dispersion Forces Intramolecular vs intermolecular • temporary dipoles • size and boiling point BIG IDEA There are forces inside molecules (the covalent bonds that hold atoms together) and forces between molecules (intermolecular forces, IMFs). Changes of state, like boiling, break the forces between molecules; they do not break the bonds inside them. Honors Chemistry • Unit 8: Intermolecular Forces • page 2 TEACHER EDITION • ANSWER KEY & NOTES Key vocabulary — write each definition in your own words Term Definition (your words) Example / sketch Intramolecular force An attraction inside a molecule that holds its atoms The H–F bond in HF together: a chemical (covalent) bond. Intermolecular force An attraction BETWEEN separate molecules. IMFs are much weaker than covalent bonds. (IMF) The attraction between two HF molecules Temporary (instantaneous) dipole A short-lived separation of charge that happens when the electrons in a molecule are momentarily unevenly distributed. A nonpolar Cl₂ for a split second Induced dipole A dipole created in a molecule because a neighboring dipole pushes or pulls its electrons to one side. The neighbor of a temporary dipole London dispersion force (LDF) The attraction between a temporary dipole and an induced dipole. Every molecule (and atom) has LDF. The only IMF in CH₄ and Ne Polarizability How easily the electron cloud of a molecule can be distorted. Larger electron clouds (more electrons) are more polarizable, so they have stronger LDF. I₂ is more polarizable than F₂ Intramolecular vs intermolecular Two HF molecules: the solid line is the bond inside a molecule; the dashed line is the attraction between molecules. 1. An intramolecular force is considered a ____________________. How is it represented in a Lewis diagram? A chemical bond (covalent). It is drawn as a line (a shared pair of electrons) between two atoms. 2. Complete the Lewis structure for HF, then draw an arrow to the intramolecular force. H–F with three lone pairs on F (H has none); the arrow points to the line between H and F. 3. Where does an intermolecular force occur? Between two (or more) separate molecules: in the space between them, not within them. Honors Chemistry • Unit 8: Intermolecular Forces • page 3 TEACHER EDITION • ANSWER KEY & NOTES 4. Why can two molecules be attracted to each other? What causes an IMF? Molecules contain positive nuclei and negative electrons. Whenever the charges are unevenly distributed, even briefly, the positive part of one molecule is attracted to the negative part of its neighbor. IMFs are electrostatic (Coulomb) attractions between partial charges. [ IMAGE GOES HERE ] Optional: the 'which diagram shows an IMF?' choices from the homework THINK OF IT LIKE… HOLDING HANDS VS. HOLDING A HAND-TIED ROPE Imagine each molecule is a group of friends tied together with strong rope (the covalent bonds). The friends in different groups can only hold hands loosely (IMFs). Pulling the groups apart (boiling) only lets go of the hands; the rope stays tied. How London dispersion forces form Temporary dipole → induced dipole → attraction. CUES / KEY WORDS Step 1 Step 2 Step 3 DESCRIBE HOW TWO NON-POLAR MOLECULES COME TO ATTRACT EACH OTHER 1. Electrons are always moving, so at any instant the electron cloud of one molecule can be slightly more on one side → a temporary dipole (δ+ on one side, δ− on the other). 2. The δ− end repels the electrons of a neighboring molecule, so that molecule’s cloud shifts → an induced dipole. 3. The δ+ end of one molecule attracts the δ− end of the other: a weak, short-lived attraction. Because electrons keep moving, the dipoles keep forming and changing all the time. 5. Why are LDFs the weakest of the intermolecular forces? Your answer should discuss the dipole that is formed. The dipoles are temporary and very small: they last for a tiny fraction of a second and the partial charges are small, so the attraction is weak compared with the permanent dipoles in polar molecules. 6. Explain why ALL molecules form LDF. All molecules and atoms contain moving electrons, so any molecule can form a temporary dipole and induce one in its neighbor. 7. Which molecules form only LDF as their main intermolecular force? Non-polar molecules: e.g., noble gases (He, Ne), diatomic elements (O₂, N₂, Cl₂), symmetrical molecules (CO₂, CH₄, CCl₄) and hydrocarbons (alkanes). Honors Chemistry • Unit 8: Intermolecular Forces • page 4 TEACHER EDITION • ANSWER KEY & NOTES Size matters: LDF and boiling point Three alkanes (skeletal structures: each corner is a carbon with enough hydrogens to make four bonds). Formula Number of electrons State at room temp. Boiling point C₃H₈ 26 gas −42 °C C₅H₁₂ 42 liquid 36 °C C₈H₁₈ 66 liquid 125 °C 8. What trend do you notice between the size of the molecule and the boiling point? The larger the molecule (more carbons, more electrons), the higher the boiling point. 9. Each molecule forms only LDF. Explain what causes the trend. Bigger molecules have more electrons and a larger, more polarizable electron cloud, so temporary dipoles are larger and more easily induced; they also have more surface area in contact with their neighbors. Stronger LDF means more energy (a higher temperature) is needed to separate the molecules into a gas. 10. Predict: which has the higher boiling point, F₂ or Br₂? Which is a gas at room temperature? Explain. Br₂ has the higher boiling point (59 °C vs −188 °C). Both are non-polar, but Br₂ has many more electrons (70 vs 18), so stronger LDF. F₂ is the gas; Br₂ is a liquid at room temperature. Honors Chemistry • Unit 8: Intermolecular Forces • page 5 TEACHER EDITION • ANSWER KEY & NOTES TEACHER NOTE Branching decreases LDF: pentane boils at 36 °C but 2,2-dimethylpropane (neopentane) at 9.5 °C, because a compact molecule has less surface area for contact. Optional enrichment for fast finishers. Real boiling points: CH₄ −162, C₂H₆ −89, C₃H₈ −42, C₄H₁₀ −1, C₅H₁₂ 36, C₆H₁₄ 69, C₇H₁₆ 98, C₈H₁₈ 125 °C; noble gases He −269, Ne −246, Ar −186, Kr −153, Xe −108 °C. 11. An intramolecular force is… A) the attraction between two molecules B) a chemical bond within a molecule C) only found in ionic compounds D) the same as an LDF 12. Which has the strongest London dispersion forces? A) CH₄ B) C₂H₆ C) C₄H₁₀ D) C₈H₁₈ 13. Boiling a liquid such as water breaks… A) the covalent bonds within molecules B) the intermolecular forces between molecules C) both equally D) neither 14. Which of these only forms LDF? A) H₂O B) CH₃Cl C) N₂ 8.2 D) HF Identifying the Intermolecular Force Polarity → IMFs • dipole–dipole • hydrogen bonding BIG IDEA To find a molecule’s IMFs: draw the Lewis structure, decide the shape, and decide whether it is polar. Every molecule has LDF; polar molecules add dipole–dipole; molecules with H bonded to N, O or F add hydrogen bonding. Honors Chemistry • Unit 8: Intermolecular Forces • page 6 TEACHER EDITION • ANSWER KEY & NOTES Key vocabulary — write each definition in your own words Term Definition (your words) Example / sketch Permanent dipole A dipole that is always there because the molecule is polar (uneven sharing of electrons that does not cancel). H₂O, CH₃Cl, HF Dipole–dipole force The attraction between the δ+ end of one polar molecule Between two CH₃Cl molecules and the δ− end of a neighboring polar molecule. Hydrogen bonding A strong dipole–dipole attraction between a hydrogen Between H₂O molecules that is directly bonded to N, O or F in one molecule and a lone pair on N, O or F of a neighboring molecule. Non-polar molecule A molecule with no permanent dipole (bond dipoles cancel or the bonds are non-polar). Only LDF; it can have temporary dipoles. CO₂, CH₄ Main IMF The strongest type of IMF the molecule forms: hydrogen bonding > dipole–dipole > LDF. Water: hydrogen bonding Dipole–dipole Polar molecules orient so opposite partial charges are close. 1. Why is dipole–dipole stronger than LDF for molecules of similar size? A permanent dipole is always present and is larger than a temporary dipole, so the δ+/δ− attraction is stronger and constant. Honors Chemistry • Unit 8: Intermolecular Forces • page 7 TEACHER EDITION • ANSWER KEY & NOTES Hydrogen bonding Hydrogen bonding between two water molecules. HYDROGEN BONDING CHECKLIST 1. The molecule has a hydrogen directly bonded to N, O or F (look for N–H, O–H, F–H). 2. A neighboring molecule has a lone pair on N, O or F that the hydrogen can point to. 3. If an H is bonded to C (C–H), or the molecule has N, O or F but no N–H/O–H/F–H, there is no hydrogen bonding. THINK OF IT LIKE… A MAGNET-STRONG HANDSHAKE Hydrogen is tiny and, when bonded to N, O or F, its single electron is dragged away, leaving an almost bare proton. That bare end can get very close to a lone pair on a neighbor, so the attraction is much stronger than an ordinary dipole–dipole attraction. The IMF flowchart Remember: LDF is present in EVERY case. Honors Chemistry • Unit 8: Intermolecular Forces • page 8 TEACHER EDITION • ANSWER KEY & NOTES Three molecules, t
