.filters{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;cursor:pointer;font:inherit;font-size:14px;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}

.meta{display:flex;flex-wrap:wrap;gap:5px;font-size:12px}

.snip{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}

.desc{font-size:14px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.btn{font:inherit;font-size:14px;text-decoration:none;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:6px 12px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}

var HUB = {"title":"Honors Chemistry Resource Hub","updated":"2026-11-08","units":[{"id":"Unit 0 - Measurement and Math Skills","num":0,"name":"Measurement and Math Skills","label":"Unit 0","sub":"Measurement and Math Skills"},{"id":"Unit 1 - Atomic Structure","num":1,"name":"Atomic Structure","label":"Unit 1","sub":"Atomic Structure"},{"id":"Unit 2 - Electrons and Periodic Trends","num":2,"name":"Electrons and Periodic Trends","label":"Unit 2","sub":"Electrons and Periodic Trends"},{"id":"Unit 3 - Chemical Bonding","num":3,"name":"Chemical Bonding","label":"Unit 3","sub":"Chemical Bonding"},{"id":"Unit 4 - Chemical Reactions","num":4,"name":"Chemical Reactions","label":"Unit 4","sub":"Chemical Reactions"},{"id":"Unit 5 - Moles and Molar Quantities","num":5,"name":"Moles and Molar Quantities","label":"Unit 5","sub":"Moles and Molar Quantities"},{"id":"Unit 6 - Stoichiometry","num":6,"name":"Stoichiometry","label":"Unit 6","sub":"Stoichiometry"},{"id":"Unit 7 - Gases","num":7,"name":"Gases","label":"Unit 7","sub":"Gases"},{"id":"Unit 8 - Intermolecular Forces","num":8,"name":"Intermolecular Forces","label":"Unit 8","sub":"Intermolecular Forces"},{"id":"Course-wide","num":null,"name":"Course-wide","label":"Course-wide","sub":""},{"id":"Unsorted","num":null,"name":"Unsorted","label":"Unsorted","sub":""}],"typeOrder":["Notes","Worksheets","Homework","Tests and Quizzes","Labs","Virtual Labs","Review","Slides","Reference","Other"],"items":[{"kind":"file","unit":"Unit 0 - Measurement and Math Skills","type":"Notes","title":"Unit 0 - Measurement and Math Skills - STUDENT NOTES","file":"Unit 0 - Measurement and Math Skills - STUDENT NOTES.docx","path":"Units/Unit 0 - Measurement and Math Skills/Notes/Unit 0 - Measurement and Math Skills - STUDENT NOTES.docx","ext":"docx","size":198681,"teacher":false,"pdf":"_pdf/eec16c02aec0.pdf","text":"Name: ______________________________ Date: ____________ Period: ______ HONORS CHEMISTRY • UNIT 0 Measurement & Math Skills Every number in chemistry comes from a measurement. Learn to take them, write them, and work with them honestly. HOW TO USE THIS PACKET This is your notebook for the unit. Write definitions in your own words, copy the steps of each worked example, and use the blank space for sketches and questions. Boxes marked LAB CORNER are things you would do or see at a lab bench. Extra practice is at the back. What we will learn 0.1 Making accurate measurements 0.2 Significant figures & scientific notation 0.3 Calculations with significant figures 0.4 Dimensional analysis (unit conversions) 0.5 Density ★ Extra practice, error analysis & unit review By the end of this unit I can… • Choose the right piece of lab equipment and read a scale to the correct decimal place. • Tell accuracy from precision and use percent error. • Count significant figures and round correctly; write numbers in scientific notation. • Add, subtract, multiply and divide measurements and report the right number of sig figs. • Convert between units with multi-step dimensional analysis (including squared and cubed units). • Calculate density, mass or volume and identify a substance from its density. • Design a simple lab procedure and explain where measurement error comes from. Honors Chemistry • Unit 0: Measurement & Math Skills • page 1 Name: ______________________________ Date: ____________ Period: ______ TOPIC 0.1 Making Accurate Measurements Choosing tools • reading scales • accuracy vs precision BIG IDEA A measurement has two kinds of digits: the digits the tool lets you be certain about, and one estimated digit that you guess by eye. You always report all of them — and no more. Key vocabulary — write each definition in your own words Term Definition (your words) Measurement A number + a ____ ; what two kinds of digits does it contain? Estimated digit Where does it come from? Which digit in a reading is it? Accuracy Compared to what? Precision Compared to what? Meniscus Draw it. Where do you read it? Example / sketch THINK OF IT LIKE… A CAR SPEEDOMETER The speedometer has marks every 10 mph. If the needle sits a bit past 60, you would say \"about 64.\" The 6 you were sure about; the 4 is your best estimate between the marks. A lab measurement works exactly the same way. Accuracy vs. precision: a basketball player who hits the same spot on the backboard every time (but never the hoop) is precise, not accurate. Honors Chemistry • Unit 0: Measurement & Math Skills • page 2 Name: ______________________________ Date: ____________ Period: ______ How to read ANY scale (cylinder, buret, ruler, thermometer) CUES / KEY WORDS WRITE THE FOUR STEPS IN YOUR OWN WORDS Step 1 Step 2 Step 3 Step 4 LAB CORNER • Choosing the right tool Chemists choose glassware based on how precisely they need to know a volume. Study the pieces below. Common lab glassware and measuring tools (not to scale). The job Best tool Why? Deliver an exact, adjustable volume of acid drop by drop (titration) Make exactly 250.00 mL of a solution with a known concentration Measure 37.4 mL of water for a reaction Heat and stir roughly 100 mL of a solution Swirl a reaction mixture without splashing Honors Chemistry • Unit 0: Measurement & Math Skills • page 3 Name: ______________________________ Date: ____________ Period: ______ LAB CORNER • Reading scales Each drawing below is a zoomed-in piece of a real instrument. Read the bottom of the meniscus. Remember: certain digits + one estimated digit. Scale readings A, B and C. Smallest mark is worth Reading (with unit) Which digit is estimated? # of sig figs A B C (buret) 1. A classmate reads cylinder A as \"35 mL\" and another reads it as \"34.60 mL.\" Explain what is wrong with each reading. 2. Why does a buret reading to 22.74 mL have more significant figures than the cylinder reading of 34.6 mL? What does that tell you about the tool? Honors Chemistry • Unit 0: Measurement & Math Skills • page 4 Name: ______________________________ Date: ____________ Period: ______ LAB CORNER • The meniscus and eye level Water sticks to glass, so the liquid climbs the walls and forms a curve. Always read at eye level, at the bottom of the curve. 3. Why does water form a meniscus that curves up at the walls? 4. Draw a picture of what the meniscus would look like if you looked at the cylinder from slightly above the surface. Explain how this could make your reading wrong. Honors Chemistry • Unit 0: Measurement & Math Skills • page 5 Name: ______________________________ Date: ____________ Period: ______ LAB CORNER • Length with two different rulers The same metal strip is measured with two rulers. Ruler 1 has marks every 1 cm; Ruler 2 has marks every 0.1 cm. Smallest mark Reading Estimated digit Ruler 1 Ruler 2 5. Both readings are \"correct.\" Why do they have different numbers of significant figures? [ IMAGE GOES HERE ] Optional: photo or AP exam figure of a buret / graduated cylinder reading (homework Topic 0.1 figures) Honors Chemistry • Unit 0: Measurement & Math Skills • page 6 Name: ______________________________ Date: ____________ Period: ______ LAB CORNER • Accuracy and precision Four students throw darts at a target. The bullseye is the true value. Target Accurate? Precise? A B C D 6. Three students each measure a 10.00 g standard mass three times. a. Student 1: 10.01 g, 10.02 g, 10.00 g. Student 2: 9.52 g, 9.51 g, 9.53 g. Student 3: 9.2 g, 10.6 g, 10.0 g. b. Describe the accuracy and precision of each student. PERCENT ERROR % error = |measured − accepted| ÷ accepted × 100 Use it to describe accuracy as a single number. Example: A student finds the density of iron to be 8.22 g/mL; the accepted value is 7.87 g/mL. % error = |8.22 − 7.87| ÷ 7.87 × 100 = 4.45 % WATCH OUT! Precision does not guarantee accuracy. A balance that is not zeroed gives beautifully precise wrong answers. 7. Quick check — which is a better description of a systematic error: a balance that always reads 0.30 g too high, or a student who sometimes reads the cylinder from above? Why? Honors Chemistry • Unit 0: Measurement & Math Skills • page 7 Name: ______________________________ Date: ____________ Period: ______ TOPIC 0.2 Significant Figures & Scientific Notation Which digits count • rounding • writing very large and small numbers BIG IDEA Significant figures (sig figs) tell the reader how well you know a number. Sig figs = all certain digits + the one estimated digit. THINK OF IT LIKE… A PHOTO’S RESOLUTION \"I live somewhere in Tennessee\" and \"I live at 123 Main Street, Spring Hill\" can both be true — but one has far more detail. A number with more sig figs is a sharper picture. If someone says \"about 1500 people were at the game,\" the trailing zeros are placeholders (a rounded estimate). If an attendance scanner reports \"1500.\" it counted every one. The decimal point is the signal. Build the rules — write each rule in your own words Type of digit The rule (your words) Example Non-zero digits 4.37 and 437 Captive zeros 5004 and 1.002 Leading zeros 0.0052 Trailing zeros WITH a decimal point 25.00 and 100. Honors Chemistry • Unit 0: Measurement & Math Skills • page 8 Sig figs Name: ______________________________ Date: ____________ Period: ______ Type of digit The rule (your words) Example Sig figs Trailing zeros WITHOUT a decimal point 1500 and 90 Exact numbers 24 students; 12 in = 1 ft WATCH OUT! Scientific notation removes the confusion. 1500 has 2 sig figs, but 1.500 × 103 has 4. Every digit in the coefficient (the part before ×10) is significant. Practice A — count the significant figures Number # sig figs Number 4.056 0.00340 1200 1200. 6.0200 0.0809 3.0 × 105 450.0 90 0.10 5,000,100 1.00 × 10-3 # sig figs 1. Explain the difference between the numbers 100, 100. and 1.00 × 10 2. Rounding to a given number of sig figs ROUNDING RULE Look at the digit just after the last one you are keeping. If it is 5 or more, round the last kept digit up; if it is 4 or less, leave it alone. Keep the number the same size: fill the lost places with zeros (or use scientific notation so the zeros are not misleading). Honors Chemistry • Unit 0: Measurement & Math Skills • page 9 Name: ______________________________ Date: ____________ Period: ______ Number 4 s.f. 3 s.f. 2 s.f. 58,364 0.004528 19.95 Scientific notation CUES / KEY WORDS NOTES — FILL IN DURING THE MINI-LESSON Format Moving the decimal Why use it? THINK OF IT LIKE… ZOOMING A MAP Scientific notation is a zoom dial. A big positive exponent zooms way out (the whole galaxy); a big negative exponent zooms way in (a single atom). The coefficient is the \"what you see,\" and the exponent is the zoom level. Write in scientific notation Keep this many s.f. 93,000,000 2 0.000000450 3 12,500 3 0.0820 3 602,200,000,000,000,000,000,000 4 Answer Honors Chemistry • Unit 0: Measurement & Math Skills • page 10 Name: ______________________________ Date: ____________ Period: ______ Write in standard form Answer 3.4 × 103 6.02 × 10-3 1.50 × 102 8.0 × 10-5 2. Both 3.4 × 103 and 3400 can describe the same value. Why might a scientist prefer 3.4 × 10 3? How would you write 3400 so that it has 4 sig figs? Honors Chemistry • Unit 0: Measurement & Math Skills • page 11 Name: ______________________________ Date: ____________ Period: ______ TOPIC 0.3 Calculations with Significant Figures Add/subtract vs multiply/divide • don’t round until the end BIG IDEA A calculator answer is not a measurement. Your final answer can never be more certain than your least certain measurement. Two rules — two different questions Operation Look at… Your answer gets… Why? Add / Subtract Multiply / Divide THINK OF IT LIKE… TWO DIFFERENT “WEAKEST LINKS” Adding is like stacking planks: if one plank was measured to the nearest meter and another to the nearest millimeter, the stack is only trustworthy to the nearest meter — the place value of the sloppiest measurement decides. Multiplying is like a relay race: the team result can't be more reliable than its least reliable runner, so the number of sig figs of the weakest measurement decides. WATCH OUT! • Don't round in the middle of a problem. Carry an extra digit and round once at the end. • Exact numbers (24 hours in a day; 12 in = 1 ft) never limit the answer. • In a mixed problem, do the steps in order and apply the right rule at each step. WORKED EXAMPLE — ADD / SUBTRACT 12.11 cm + 18.0 cm + 1.013 cm = ? Work it out here: Answer: __________________________________ WORKED EXAMPLE — MULTIPLY / DIVIDE 6.38 cm × 2.0 cm = ? Honors Chemistry • Unit 0: Measurement & Math Skills • page 12 Name: ______________________________ Date: ____________ Period: ______ Work it out here: Answer: __________________________________ WORKED EXAMPLE — MIXED OPERATIONS (4.58 g + 1.2 g) ÷ 3.45 mL = ? Work it out here: Answer: __________________________________ Practice: write the calculator answer, then the answer with correct sig figs Problem Calculator answer Answer with sig figs 5.72 cm + 3.1 cm 12.40 g − 0.337 g 150 m + 25.4 m 150. m + 25.4 m 2.50 cm × 4.1 cm 15.0 g ÷ 4.2 mL 0.0821 × 298 (6.02 × 1023) × 0.0500 (25.0 − 4.8) × 3.2 8.314 × 273.15 ÷ 101.3 Honors Chemistry • Unit 0: Measurement & Math Skills • page 13 Name: ______________________________ Date: ____________ Period: ______ 1. Error analysis. A student calculates the area of a lab bench that is 2.0 m long and 0.85 m wide and writes 1.700 m². Find the mistake and write the correct answer. 2. Reasoning. Why can't you use the \"fewest sig figs\" rule when adding 8.4 m + 10.0 m? What rule do you use and what is the answer? Honors Chemistry • Unit 0: Measurement & Math Skills • page 14 Name: ______________________________ Date: ____________ Period: ______ TOPIC 0.4 Dimensional Analysis Multiplying by 1 in disguise • SI prefixes • multi-step conversions BIG IDEA A conversion factor is a fraction that equals 1, because the top and the bottom are the same amount written in different units. Multiplying by 1 changes the units but not the amount. THINK OF IT LIKE… EXCHANGING MONEY $1 = 100 ¢ is a true statement, so (100 ¢ / $1) is just \"1.\" Converting $5 into cents is multiplying by 1: $5 × (100 ¢ / $1) = 500 ¢. The dollar sign cancels and cents remain. Dimensional analysis is simply that, with any units you want. Key vocabulary — write each definition in your own words Term Definition (your words) Equality Two ways of writing the same amount. Conversion factor How do you make one from an equality? Cancel units What does “cancel” mean? Example / sketch Make two conversion factors from every equality Equality Conversion factor 1 Conversion factor 2 1 in = 2.54 cm 1 mi = 5280 ft 1 kg = 1000 g 1 L = 1000 mL 60 s = 1 min Honors Chemistry • Unit 0: Measurement & Math Skills • page 15 Name: ______________________________ Date: ____________ Period: ______ SI prefixes — fill in the missing information Prefix Symbol Meaning (power of ten) Example kiloc millimicronanomega- The steps CUES / KEY WORDS WRITE YOUR OWN STEP-BY-STEP RECIPE 1 2 3 4 5 SIG FIGS AND CONVERSIONS Defined equalities such as 12 in = 1 ft or 60 s = 1 min are exact and never limit your answer. A measured equality (1 gal = 3.79 L) or the number you start with does. Always count sig figs on the given measurement. WORKED EXAMPLE — A ONE-STEP CONVERSION A lab bench is 48.2 cm wide. How many inches is that? (1 in = 2.54 cm) Work it out here: Answer: __________________________________ Honors Chemistry • Unit 0: Measurement & Math Skills • page 16 Name: ______________________________ Date: ____________ Period: ______ WORKED EXAMPLE — A RATE CONVERSION (TWO UNITS CHANGE) A car travels at 65 mi/h. What is its speed in m/s? (1 mi = 5280 ft; 1 ft = 12 in; 1 in = 2.54 cm; 100 cm = 1 m; 1 h = 3600 s) Work it out here: Answer: __________________________________ WORKED EXAMPLE — SQUARED AND CUBED UNITS (HONORS EXTENSION) How many cm³ are in 1.0 m³? Hint: 100 cm = 1 m, and you must cube the whole factor. Work it out here: Answer: __________________________________ WATCH OUT! When a unit is squared or cubed, raise the entire conversion factor to that power. 1 m² is 10,000 cm², not 100 cm². LAB CORNER • Chemistry at the bench Every lab calculation you do this year is a dimensional analysis problem in disguise. Try these lab-style conversions. 1. A buret delivers 23.45 mL of acid. Convert this volume to liters. Work: Answer (units & sig figs): __________________________________ 2. Convert the same 23.45 mL to microliters (µL). Work: Answer (units & sig figs): __________________________________ Honors Chemistry • Unit 0: Measurement & Math Skills • page 17 Name: ______________________________ Date: ____________ Period: ______ 3. A procedure calls for 0.250 L of water, but you only have a 50.0 mL graduated cylinder. How many full cylinders must you pour? Work: Answer (units & sig figs): __________________________________ Practice — show ALL work, even if you can do it in your head 4. A basketball court is 94.0 ft long. How many meters is that? (1 ft = 12 in; 1 in = 2.54 cm; 100 cm = 1 m) Work: Answer (units & sig figs): __________________________________ 5. A marathon is 26.2 mi. How many kilometers is that? (1.00 mi = 1.61 km) Work: Answer (units & sig figs): __________________________________ 6. A cheetah sprints at 88.0 ft/s. What is that speed in mi/h? (5280 ft = 1 mi; 60 s = 1 min; 60 min = 1 h) Work: Answer (units & sig figs): __________________________________ 7. A patient is prescribed 15 mg of medicine per kg of body mass. The patient weighs 142 lb. How many mg should be given? (1 kg = 2.20 lb) Work: Answer (units & sig figs): __________________________________ Honors Chemistry • Unit 0: Measurement & Math Skills • page 18 Name: ______________________________ Date: ____________ Period: ______ 8. Gasoline costs $3.45 per gallon. What is the price per liter? (1 gal = 3.79 L) Work: Answer (units & sig figs): __________________________________ 9. A sample has a volume of 5.0 cm³. Express this volume in m³. (100 cm = 1 m) Work: Answer (units & sig figs): __________________________________ 10. The diameter of a hydrogen atom is about 0.106 nm. Express this in cm. (1 nm = 10 -9 m; 100 cm = 1 m) Work: Answer (units & sig figs): __________________________________ Honors Chemistry • Unit 0: Measurement & Math Skills • page 19 Name: ______________________________ Date: ____________ Period: ______ TOPIC 0.5 Density Mass ÷ volume • an identity fingerprint for matter BIG IDEA Density tells you how much mass is packed into a given volume. Because it doesn't depend on how much you have, it is a fingerprint that helps identify a substance. THINK OF IT LIKE… A CROWDED VS. EMPTY THEATER A theater has a fixed volume (the room). Fill it with 500 people and it is dense; with 50 people it is not. Same room, different amount of “stuff” inside. Another way: a bag of feathers and a bag of bricks take up the same space, but the bricks pack far more mass into it. Key vocabulary — write each definition in your own words Term Definition (your words) Density Write the equation and the units. Intensive property Does it change if you cut the sample in half? Extensive property Does it change if you cut the sample in half? Displacement How does it measure volume? Example / sketch The density triangle — fill in all three forms To find… Use Typical units Density Mass Volume Honors Chemistry • Unit 0: Measurement & Math Skills • page 20 Name: ______________________________ Date: ____________ Period: ______ REMEMBER 1 mL = 1 cm³ exactly. Liquids are usually measured in mL, solids in cm³ — the number is the same. Three ways to find volume Type of sample How to get the volume Tool(s) Regular solid (box, cylinder) Liquid Irregular solid LAB CORNER • Density tower A student carefully pours four liquids into a tall cylinder. They separate into layers. 1. Why do the liquids stack in this order? Use the word density in your explanation. 2. A plastic bead with a density of 1.03 g/mL is dropped into the tower. Between which two layers will it come to rest? Explain. Honors Chemistry • Unit 0: Measurement & Math Skills • page 21 Name: ______________________________ Date: ____________ Period: ______ LAB CORNER • Finding the density of a metal by displacement A student masses an unknown metal sample, then lowers it into a graduated cylinder of water. DATA Mass of metal sample = 32.3 g. Water level before = 20.0 mL. Water level after = 24.1 mL. 3. Use the data above to analyze the metal sample. a. Volume of the metal: Work: Answer (units & sig figs): __________________________________ b. Density: Work: Answer (units & sig figs): __________________________________ 4. Identify the metal. Honors Chemistry • Unit 0: Measurement & Math Skills • page 22 Name: ______________________________ Date: ____________ Period: ______ Substance Density (g/cm³ or g/mL) Substance Density (g/cm³ or g/mL) Magnesium 1.74 Zinc 7.14 Aluminum 2.70 Iron 7.87 Titanium 4.51 Copper 8.96 Water (4 °C) 1.00 Lead 11.34 Ethanol 0.789 Gold 19.3 Ice (0 °C) 0.917 Mercury 13.53 WATCH OUT! The density of a block of aluminum does not depend on how big it is. A big block has a larger mass AND a larger volume — the ratio stays 2.70 g/cm³. WORKED EXAMPLE — REGULAR SOLID A rectangular block measures 3.00 cm × 2.50 cm × 4.20 cm and has a mass of 85.1 g. What is its density, and what metal could it be? Work it out here: Answer: __________________________________ WORKED EXAMPLE — LIQUID WITH A GRADUATED CYLINDER An empty graduated cylinder has a mass of 45.30 g. With 20.0 mL of an unknown liquid it has a mass of 61.10 g. What is the density? Work it out here: Answer: __________________________________ Honors Chemistry • Unit 0: Measurement & Math Skills • page 23 Name: ______________________________ Date: ____________ Period: ______ Practice 5. Two blocks of pure copper are weighed: block A is 400 g and block B is 25 g. A student predicts block A has a higher density ","id":0},{"kind":"file","unit":"Unit 0 - Measurement and Math Skills","type":"Notes","title":"Unit 0 - Measurement and Math Skills - TEACHER EDITION","file":"Unit 0 - Measurement and Math Skills - TEACHER EDITION.docx","path":"Units/Unit 0 - Measurement and Math Skills/Notes/Unit 0 - Measurement and Math Skills - TEACHER EDITION.docx","ext":"docx","size":210134,"teacher":true,"pdf":"_pdf/82cbbb134d8b.pdf","text":"TEACHER EDITION • ANSWER KEY & NOTES HONORS CHEMISTRY • UNIT 0 Measurement & Math Skills Every number in chemistry comes from a measurement. Learn to take them, write them, and work with them honestly. TEACHER EDITION Everything in a light-gray box or cell is an answer or model response. Teacher notes (misconceptions, demo ideas, discussion prompts, sources) appear in the heavy-bordered boxes labeled TEACHER NOTE. The pages follow the student packet, so they line up closely. What we will learn 0.1 Making accurate measurements 0.2 Significant figures & scientific notation 0.3 Calculations with significant figures 0.4 Dimensional analysis (unit conversions) 0.5 Density ★ Extra practice, error analysis & unit review By the end of this unit I can… • Choose the right piece of lab equipment and read a scale to the correct decimal place. • Tell accuracy from precision and use percent error. • Count significant figures and round correctly; write numbers in scientific notation. • Add, subtract, multiply and divide measurements and report the right number of sig figs. • Convert between units with multi-step dimensional analysis (including squared and cubed units). • Calculate density, mass or volume and identify a substance from its density. • Design a simple lab procedure and explain where measurement error comes from. Honors Chemistry • Unit 0: Measurement & Math Skills • page 1 TEACHER EDITION • ANSWER KEY & NOTES Unit at a glance (teacher) Topic Suggested pacing Depth the homework expects 0.1 Measurements 1 day Read cylinders/burets to the estimated digit; draw meniscus. 0.2 Sig figs & sci. notation 1 day Count sig figs (incl. 100., 0.0100, 500); round to 4/3/2 s.f.; sci. notation. 0.3 Calcs with sig figs 1 day Write calculator answer, then the rounded answer; add/sub vs mult/div. 0.4 Dimensional analysis 1–2 days Multi-step conversions (cm→in, yd→mi, mi/h→ft/min, $/oz→lb) with all work shown. 0.5 Density 1–2 days Conceptual (intensive property), regular solid, displacement, mass and volume from density. TEACHER OVERVIEW Big picture. This unit is the toolbox. Students who leave it able to (1) pick a tool, (2) read it to one estimated digit, and (3) carry that honesty through calculations will make fewer mistakes in stoichiometry, gas laws and thermochemistry. Misconceptions to watch for: • \"More digits = more accurate.\" A calculator display is not a measurement. • Treating trailing zeros as always (or never) significant. The decimal point decides. • Rounding at every step (round only at the end; carry one extra digit). • Believing that bigger objects have bigger density. • Flipping conversion factors without checking that the units cancel. IMAGES Image spots: where a spot is marked \"IMAGE GOES HERE\", the homework packet or an AP exam figure (reading a buret/cylinder) works well. The scale drawings in this packet were made specifically so students can practise estimating the last digit. TOPIC 0.1 Making Accurate Measurements Choosing tools • reading scales • accuracy vs precision BIG IDEA A measurement has two kinds of digits: the digits the tool lets you be certain about, and one estimated digit that you guess by eye. You always report all of them — and no more. Honors Chemistry • Unit 0: Measurement & Math Skills • page 2 TEACHER EDITION • ANSWER KEY & NOTES Key vocabulary — write each definition in your own words Term Definition (your words) Example / sketch Measurement A quantity made with a tool that has a number AND a unit. It includes every certain digit plus one estimated digit. 34.6 mL Estimated digit The last digit of a measurement. You guess it by eye between the smallest marks on the scale, so it is the uncertain digit. In 34.6 mL the 6 is estimated. Accuracy How close a measurement is to the true (accepted) value. A thermometer reads 100.1 °C in boiling water at sea level (true value 100 °C). Precision How close repeated measurements are to each other (how reproducible they are), whether or not they are correct. Three masses: 9.52 g, 9.51 g, 9.53 g. Meniscus The curved surface of a liquid in a narrow tube. For water-based liquids you read the bottom of the curve with your eye level with it. Sketch: U-shaped curve, edges climb the glass. THINK OF IT LIKE… A CAR SPEEDOMETER The speedometer has marks every 10 mph. If the needle sits a bit past 60, you would say \"about 64.\" The 6 you were sure about; the 4 is your best estimate between the marks. A lab measurement works exactly the same way. Accuracy vs. precision: a basketball player who hits the same spot on the backboard every time (but never the hoop) is precise, not accurate. How to read ANY scale (cylinder, buret, ruler, thermometer) CUES / KEY WORDS WRITE THE FOUR STEPS IN YOUR OWN WORDS Step 1 1. Find the smallest mark on the scale and what it is worth (1 mL? 0.1 mL?). Step 2 Step 3 Step 4 2. Read the last mark the liquid/pointer has passed — these are your certain digits. 3. Estimate how far you are between marks by mentally cutting the gap into ten pieces — that is the one estimated digit. 4. Write certain digits + estimated digit with units. (If the liquid is exactly on a mark, the estimated digit is 0.) TEACHER NOTE Rule of thumb for students: you estimate one decimal place past the smallest marking. Some teachers allow ± one unit in the estimated digit when grading readings (e.g., 34.5–34.7 for reading A). Make that tolerance explicit up front. Honors Chemistry • Unit 0: Measurement & Math Skills • page 3 TEACHER EDITION • ANSWER KEY & NOTES LAB CORNER • Choosing the right tool Chemists choose glassware based on how precisely they need to know a volume. Study the pieces below. Common lab glassware and measuring tools (not to scale). The job Best tool Why? Deliver an exact, adjustable volume of acid drop by drop (titration) Buret Marked to 0.1 mL; stopcock lets you control the flow; read to ±0.01 mL. Make exactly 250.00 mL of a solution with a known concentration Volumetric flask It holds one very exact volume when filled to the line. Measure 37.4 mL of water for a reaction Graduated cylinder Marked to 1 mL (read to 0.1 mL); far better than a beaker. Heat and stir roughly 100 mL of a solution Beaker Marks are only rough (±10%); good for holding, heating and mixing, not measuring. Swirl a reaction mixture without splashing Erlenmeyer flask Narrow neck and sloping sides keep liquid in while you swirl. Honors Chemistry • Unit 0: Measurement & Math Skills • page 4 TEACHER EDITION • ANSWER KEY & NOTES LAB CORNER • Reading scales Each drawing below is a zoomed-in piece of a real instrument. Read the bottom of the meniscus. Remember: certain digits + one estimated digit. Scale readings A, B and C. Smallest mark is worth Reading (with unit) Which digit is estimated? # of sig figs A 1 mL 34.6 mL the 6 (tenths place) 3 B 0.1 mL 6.43 mL the 3 (hundredths place) 3 C (buret) 0.1 mL 22.74 mL the 4 (hundredths place) 4 TEACHER NOTE Accept A: 34.5–34.7; B: 6.42–6.44; C: 22.73–22.75. Buret scales run downward — the reading increases as liquid is delivered. Cylinder scales increase upward. This is a classic trap. 1. A classmate reads cylinder A as \"35 mL\" and another reads it as \"34.60 mL.\" Explain what is wrong with each reading. \"35 mL\" throws away the estimated digit — the tool can show the tenths place, so we should report 34.6 mL. \"34.60 mL\" claims a hundredths-place estimate, but the smallest marks are 1 mL, so the best we can honestly estimate is the tenths place. 2. Why does a buret reading to 22.74 mL have more significant figures than the cylinder reading of 34.6 mL? What does that tell you about the tool? The buret has finer markings (0.1 mL vs. 1 mL), so its estimated digit is in the hundredths place instead of the tenths. A tool with smaller marks gives more precise measurements. Honors Chemistry • Unit 0: Measurement & Math Skills • page 5 TEACHER EDITION • ANSWER KEY & NOTES LAB CORNER • The meniscus and eye level Water sticks to glass, so the liquid climbs the walls and forms a curve. Always read at eye level, at the bottom of the curve. 3. Why does water form a meniscus that curves up at the walls? Water molecules are attracted to the glass (adhesion) more strongly than they are to each other (cohesion), so the edges are pulled up the walls. 4. Draw a picture of what the meniscus would look like if you looked at the cylinder from slightly above the surface. Explain how this could make your reading wrong. Looking from above (or below) the surface makes the meniscus line up with the wrong mark on the glass — a parallax error — so the reading is slightly high or low. Keep your eye level with the bottom of the curve. EXTENSION Mercury forms a convex (dome) meniscus because cohesion beats adhesion — a nice contrast for fast finishers. Quick demo: students read the same cylinder from three eye heights and compare. Honors Chemistry • Unit 0: Measurement & Math Skills • page 6 TEACHER EDITION • ANSWER KEY & NOTES LAB CORNER • Length with two different rulers The same metal strip is measured with two rulers. Ruler 1 has marks every 1 cm; Ruler 2 has marks every 0.1 cm. Smallest mark Reading Estimated digit Ruler 1 1 cm 6.4 cm the 4 (tenths) Ruler 2 0.1 cm 6.43 cm the 3 (hundredths) 5. Both readings are \"correct.\" Why do they have different numbers of significant figures? Ruler 2 has smaller marks, so it can show one more place of certainty. The number of sig figs always reflects the quality of the measuring tool. [ IMAGE GOES HERE ] Optional: photo or AP exam figure of a buret / graduated cylinder reading (homework Topic 0.1 figures) Honors Chemistry • Unit 0: Measurement & Math Skills • page 7 TEACHER EDITION • ANSWER KEY & NOTES LAB CORNER • Accuracy and precision Four students throw darts at a target. The bullseye is the true value. Target Accurate? Precise? A Yes Yes B No Yes C Yes (on average) No D No No 6. Three students each measure a 10.00 g standard mass three times. a. Student 1: 10.01 g, 10.02 g, 10.00 g. Student 2: 9.52 g, 9.51 g, 9.53 g. Student 3: 9.2 g, 10.6 g, 10.0 g. b. Describe the accuracy and precision of each student. Student 1: accurate and precise. Student 2: precise but NOT accurate (a systematic error — maybe the balance was not zeroed). Student 3: accurate on average (the mean is 9.9 g) but not precise (large spread). PERCENT ERROR % error = |measured − accepted| ÷ accepted × 100 Use it to describe accuracy as a single number. Example: A student finds the density of iron to be 8.22 g/mL; the accepted value is 7.87 g/mL. % error = |8.22 − 7.87| ÷ 7.87 × 100 = 4.45 % WATCH OUT! Precision does not guarantee accuracy. A balance that is not zeroed gives beautifully precise wrong answers. 7. Quick check — which is a better description of a systematic error: a balance that always reads 0.30 g too high, or a student who sometimes reads the cylinder from above? Why? The balance that is always 0.30 g high. A systematic error pushes every result the same direction (hurting accuracy), while inconsistent reading technique is a random error (hurting precision). IDEA Demo (5 min): have 4 groups each measure the mass of the same 5 g piece on different balances; plot the class results on the board and label accuracy and precision. Honors Chemistry • Unit 0: Measurement & Math Skills • page 8 TEACHER EDITION • ANSWER KEY & NOTES TOPIC 0.2 Significant Figures & Scientific Notation Which digits count • rounding • writing very large and small numbers BIG IDEA Significant figures (sig figs) tell the reader how well you know a number. Sig figs = all certain digits + the one estimated digit. THINK OF IT LIKE… A PHOTO’S RESOLUTION \"I live somewhere in Tennessee\" and \"I live at 123 Main Street, Spring Hill\" can both be true — but one has far more detail. A number with more sig figs is a sharper picture. If someone says \"about 1500 people were at the game,\" the trailing zeros are placeholders (a rounded estimate). If an attendance scanner reports \"1500.\" it counted every one. The decimal point is the signal. Build the rules — write each rule in your own words Type of digit The rule (your words) Example Sig figs Non-zero digits Every non-zero digit is significant. 4.37 and 437 3 and 3 Captive zeros Zeros between non-zero digits are significant. 5004 and 1.002 4 and 4 Leading zeros Zeros before the first non-zero digit are NEVER significant — they only show where the decimal is. 0.0052 2 Trailing zeros WITH a decimal point Zeros at the end of a number that has a decimal point ARE significant. 25.00 and 100. 4 and 3 Honors Chemistry • Unit 0: Measurement & Math Skills • page 9 TEACHER EDITION • ANSWER KEY & NOTES Type of digit The rule (your words) Trailing zeros WITHOUT Zeros at the end of a number with no decimal point are NOT significant (they are placeholders). a decimal point Exact numbers Counted numbers and definitions have unlimited sig figs and never limit your answer. Example Sig figs 1500 and 90 2 and 1 24 students; 12 in = 1 ft infinite WATCH OUT! Scientific notation removes the confusion. 1500 has 2 sig figs, but 1.500 × 103 has 4. Every digit in the coefficient (the part before ×10) is significant. Practice A — count the significant figures Number # sig figs Number # sig figs 4.056 4 0.00340 3 1200 2 1200. 4 6.0200 5 0.0809 3 3.0 × 105 2 450.0 4 90 1 0.10 2 5,000,100 5 1.00 × 10-3 3 1. Explain the difference between the numbers 100, 100. and 1.00 × 10 2. 100 has 1 sig fig (no decimal → trailing zeros are placeholders). 100. has 3 sig figs (the decimal point makes the zeros count). 1.00 × 102 also has 3 sig figs (every digit in the coefficient counts). The last two show the measurement was made to the ones place. Rounding to a given number of sig figs ROUNDING RULE Look at the digit just after the last one you are keeping. If it is 5 or more, round the last kept digit up; if it is 4 or less, leave it alone. Keep the number the same size: fill the lost places with zeros (or use scientific notation so the zeros are not misleading). Honors Chemistry • Unit 0: Measurement & Math Skills • page 10 TEACHER EDITION • ANSWER KEY & NOTES Number 4 s.f. 3 s.f. 2 s.f. 58,364 5.836 × 104 5.84 × 104 5.8 × 104 0.004528 0.004528 0.00453 0.0045 19.95 19.95 20.0 20 TEACHER NOTE 19.95 → 3 s.f. = 20.0 (the 5 rounds up; the zero is kept to show 3 sig figs). Remind students that 58,364 → 4 s.f. should be written 5.836 × 104 (not 58,360 — which would be ambiguous in a strict reading). Scientific notation CUES / KEY WORDS NOTES — FILL IN DURING THE MINI-LESSON Format Format: a × 10n, where 1 ≤ a < 10 and n is an integer. Moving the decimal Why use it? Moving the decimal: move it left → the exponent gets bigger (positive for large numbers). Move it right → the exponent gets smaller (negative for tiny numbers). Count the places you moved = the exponent. Why: it shows the sig figs clearly and keeps huge/tiny values manageable (6.02 × 10 23, 1.6 × 10-19). Calculator: use the EE (or ×10x) key. Typing \"× 10 ^ 5\" works too but is easy to get wrong with parentheses. THINK OF IT LIKE… ZOOMING A MAP Scientific notation is a zoom dial. A big positive exponent zooms way out (the whole galaxy); a big negative exponent zooms way in (a single atom). The coefficient is the \"what you see,\" and the exponent is the zoom level. Write in scientific notation Keep this many s.f. Answer 93,000,000 2 9.3 × 107 0.000000450 3 4.50 × 10-7 12,500 3 1.25 × 104 0.0820 3 8.20 × 10-2 602,200,000,000,000,000,000,000 4 6.022 × 1023 Honors Chemistry • Unit 0: Measurement & Math Skills • page 11 TEACHER EDITION • ANSWER KEY & NOTES Write in standard form Answer 3.4 × 103 3400 6.02 × 10-3 0.00602 1.50 × 102 150 8.0 × 10-5 0.000080 2. Both 3.4 × 103 and 3400 can describe the same value. Why might a scientist prefer 3.4 × 10 3? How would you write 3400 so that it has 4 sig figs? 3.4 × 103 clearly has 2 sig figs, while 3400 is ambiguous. To show 4 sig figs, write 3.400 × 10 3 (or 3400.). TEACHER NOTE Quick formative check (exit ticket): \"How many sig figs are in 0.00500?\" (3). Students who say 1 or 6 need the Atlantic– Pacific diagram again. Honors Chemistry • Unit 0: Measurement & Math Skills • page 12 TEACHER EDITION • ANSWER KEY & NOTES TOPIC 0.3 Calculations with Significant Figures Add/subtract vs multiply/divide • don’t round until the end BIG IDEA A calculator answer is not a measurement. Your final answer can never be more certain than your least certain measurement. Two rules — two different questions Operation Look at… Your answer gets… Why? Add / Subtract the number of DECIMAL PLACES the fewest decimal places You can only be as exact as the least exact place value. Multiply / Divide the number of SIG FIGS the fewest sig figs The weakest measurement limits the quality of the result. THINK OF IT LIKE… TWO DIFFERENT “WEAKEST LINKS” Adding is like stacking planks: if one plank was measured to the nearest meter and another to the nearest millimeter, the stack is only trustworthy to the nearest meter — the place value of the sloppiest measurement decides. Multiplying is like a relay race: the team result can't be more reliable than its least reliable runner, so the number of sig figs of the weakest measurement decides. WATCH OUT! • Don't round in the middle of a problem. Carry an extra digit and round once at the end. • Exact numbers (24 hours in a day; 12 in = 1 ft) never limit the answer. • In a mixed problem, do the steps in order and apply the right rule at each step. WORKED EXAMPLE — ADD / SUBTRACT 12.11 cm + 18.0 cm + 1.013 cm = ? 12.11 + 18.0 + 1.013 = 31.123 (calculator) Decimal places: 12.11 → 2, 18.0 → 1, 1.013 → 3. Fewest = 1 decimal place. Round 31.123 to 1 decimal: 31.1 cm Answer: 31.1 cm WORKED EXAMPLE — MULTIPLY / DIVIDE 6.38 cm × 2.0 cm = ? 6.38 × 2.0 = 12.76 (calculator) 6.38 → 3 s.f., 2.0 → 2 s.f. Fewest = 2 s.f. Round 12.76 to 2 s.f.: 13 cm² Honors Chemistry • Unit 0: Measurement & Math Skills • page 13 TEACHER EDITION • ANSWER KEY & NOTES Answer: 13 cm² WORKED EXAMPLE — MIXED OPERATIONS (4.58 g + 1.2 g) ÷ 3.45 mL = ? Parentheses first (add): 4.58 + 1.2 = 5.78 → 1 decimal place → 5.8 (keep 5.78 in the calculator; 5.8 has 2 s.f.) Divide: 5.78 ÷ 3.45 = 1.6754 (calculator) Fewest s.f. in the division = 2 (from 5.8) and 3 (from 3.45) → 2 s.f. 1.6754 → 1.7 g/mL Answer: 1.7 g/mL Practice: write the calculator answer, then the answer with correct sig figs Problem Calculator answer Answer with sig figs 5.72 cm + 3.1 cm 8.82 8.8 cm 12.40 g − 0.337 g 12.063 12.06 g 150 m + 25.4 m 175.4 1.8 × 102 m 150. m + 25.4 m 175.4 175 m 2.50 cm × 4.1 cm 10.25 10 cm² 15.0 g ÷ 4.2 mL 3.571428 3.6 g/mL 0.0821 × 298 24.4658 24.5 (6.02 × 1023) × 0.0500 3.01 × 1022 3.01 × 1022 (25.0 − 4.8) × 3.2 64.64 65 8.314 × 273.15 ÷ 101.3 22.4186 22.42 TEACHER NOTE Check item 3 vs 4: 150 m has its last sig digit in the tens place, so 150 + 25.4 → 180 m (1.8 × 10 2); 150. m is good to the ones place so the answer is 175 m. This pair is the best way to show students that the decimal point matters. 1. Error analysis. A student calculates the area of a lab bench that is 2.0 m long and 0.85 m wide and writes 1.700 m². Find the mistake and write the correct answer. 2.0 has 2 sig figs and 0.85 has 2 sig figs, so the product must have 2 sig figs: 2.0 × 0.85 = 1.7 m². The student kept all the calculator digits. Honors Chemistry • Unit 0: Measurement & Math Skills • page 14 TEACHER EDITION • ANSWER KEY & NOTES 2. Reasoning. Why can't you use the \"fewest sig figs\" rule when adding 8.4 m + 10.0 m? What rule do you use and what is the answer? Addition depends on decimal places (place value), not total sig figs. 8.4 has 1 decimal place and 10.0 has 1 decimal place, so the answer has 1 decimal place: 8.4 + 10.0 = 18.4 m. Honors Chemistry • Unit 0: Measurement & Math Skills • page 15 TEACHER EDITION • ANSWER KEY & NOTES TOPIC 0.4 Dimensional Analysis Multiplying by 1 in disguise • SI prefixes • multi-step conversions BIG IDEA A conversion factor is a fraction that equals 1, because the top and the bottom are the same amount written in different u","id":1},{"kind":"file","unit":"Unit 1 - Atomic Structure","type":"Notes","title":"Unit 1 - Atomic Structure - STUDENT NOTES","file":"Unit 1 - Atomic Structure - STUDENT NOTES.docx","path":"Units/Unit 1 - Atomic Structure/Notes/Unit 1 - Atomic Structure - STUDENT NOTES.docx","ext":"docx","size":287849,"teacher":false,"pdf":"_pdf/c9899e2b6c57.pdf","text":"Name: ______________________________ Date: ____________ Period: ______ HONORS CHEMISTRY • UNIT 1 Atomic Structure Everything in the universe is built from a few kinds of tiny particles. Learn what they are, how we found them, and how to count them. HOW TO USE THIS PACKET This is your notebook for the unit. Write definitions in your own words, copy the steps of each worked example, and use the blank space for sketches and questions. Boxes marked LAB CORNER are things you would do or see at a lab bench. Extra practice is at the back. What we will learn 1.1 Atomic structure & properties 1.2 Atomic history: how we know what atoms look like 1.3 Isotopes & average atomic mass 1.4 The mole, Avogadro’s number & molar mass ★ Extra practice & unit review By the end of this unit I can… • Name the three subatomic particles and state the charge, relative mass and location of each. • Use atomic number, mass number and charge to find protons, neutrons and electrons in atoms, isotopes and ions. • Describe the key experiment and conclusion of Dalton, Thomson and Rutherford, and how the model of the atom changed. • Explain why atomic masses are not whole numbers and calculate average atomic mass from isotope data. • Use the mole as a bridge between particles and grams (Avogadro’s number and molar mass). • Interpret lab data (mass-spectrometer graphs, balance readings, crucible data) to support a claim about atoms. Honors Chemistry • Unit 1: Atomic Structure • page 1 Name: ______________________________ Date: ____________ Period: ______ TOPIC 1.1 Atomic Structure & Properties Protons • neutrons • electrons • ions BIG IDEA Every atom is made of just three particles. The number of protons decides which element it is; the neutrons add mass; the electrons decide the charge and how the atom bonds. Key vocabulary — write each definition in your own words Term Definition (your words) Atom What is it? What are its parts? Proton Charge? Where? What does it control? Neutron Charge? Where? What does it control? Electron Charge? Where? Size? Nucleus What is inside it? How big is it? Atomic number (Z) What does it count? Mass number (A) What two particles does it count? Ion What changes? What stays the same? Example / sketch Honors Chemistry • Unit 1: Atomic Structure • page 2 Name: ______________________________ Date: ____________ Period: ______ THINK OF IT LIKE… A STADIUM If the nucleus were a marble sitting on the 50-yard line, the outer edge of the atom (the electron cloud) would be more than five football fields away. Almost all of an atom is empty space; almost all of its mass is in the marble. THINK OF IT LIKE… A NAME TAG The atomic number is the element’s name tag. Change a few neutrons or electrons and you still have the same element (a different isotope, or an ion). Change the number of protons and you have a completely different element. REAL WORLD Alchemists spent centuries trying to turn lead (82 protons) into gold (79 protons). Chemical reactions only move electrons, so they can never change the number of protons. Only nuclear reactions can (you will meet those in the Nuclear unit). Fill in the particle table Particle Symbol Charge Relative mass (amu) Location in the atom Proton Neutron Electron What controls what? CUES / KEY WORDS COMPLETE EACH LINE AND EXPLAIN WHY ion (hint: look at the periodic table). 3. Explain why the mass of a Na⁺ ion is practically identical to the mass of a neutral Na atom, even though they are different particles. Honors Chemistry • Unit 1: Atomic Structure • page 6 Name: ______________________________ Date: ____________ Period: ______ 4. A student says: \"If I add a proton to a neutral oxygen atom I get an O⁻ ion.\" Correct the statement. LAB CORNER • Reading an element tile Chemists read the periodic table like a label on a food package. Use the tile below for aluminum. A typical periodic table tile. Question Your answer Which number is the atomic number? How many protons does an Al atom have? Which number is the atomic mass? Why isn’t it a whole number? How many electrons are in an Al³⁺ ion? Most aluminum atoms have 14 neutrons. What is the mass number of that isotope? Check for understanding 5. Which particle(s) contribute significantly to the mass of an atom? A) electrons only B) protons and neutrons C) protons and electrons D) neutrons and electrons Honors Chemistry • Unit 1: Atomic Structure • page 7 Name: ______________________________ Date: ____________ Period: ______ 6. Two atoms have the same number of protons but different numbers of neutrons. They are… A) different elements B) isotopes of the same element C) ions of the same element D) impossible Honors Chemistry • Unit 1: Atomic Structure • page 8 Name: ______________________________ Date: ____________ Period: ______ TOPIC 1.2 Atomic History Dalton • Thomson • Rutherford • and the evidence behind each model BIG IDEA A model of the atom is only as good as the evidence behind it. Every time scientists did a new experiment and got a surprising result, the model had to change. How our picture of the atom developed. THINK OF IT LIKE… A MYSTERY BOX Imagine a sealed shoe box with something hidden inside. You can’t open it, but you can roll marbles through it and see where they come out. If every marble goes straight through, the box is empty. If some bounce back, something solid is in there. Rutherford did exactly this with atoms, using alpha particles for marbles. Dalton’s atomic theory (about 1803) CUES / KEY WORDS WRITE EACH OF DALTON’S IDEAS IN YOUR OWN WORDS Atoms Elements Compounds Reactions Honors Chemistry • Unit 1: Atomic Structure • page 9 Name: ______________________________ Date: ____________ Period: ______ Dalton’s idea Does modern theory agree? Explain. Atoms are indivisible (the smallest form of matter). All atoms of an element are identical. Atoms are never created or destroyed in a chemical reaction. LAB CORNER • The burning magnesium ribbon A student burns magnesium ribbon in a crucible with a lid, then re-weighs the white powder. She repeats the experiment three times. 1. The solid’s mass increased. Use Dalton’s theory to explain where the extra mass came from, and calculate it for the first trial. a. How many grams of oxygen combined with the 12.15 g of magnesium? b. Explain the answer using one of Dalton’s ideas. Honors Chemistry • Unit 1: Atomic Structure • page 10 Name: ______________________________ Date: ____________ Period: ______ Trial Mg used (g) MgO formed (g) 1 12.15 20.15 2 6.08 10.08 3 9.12 15.12 O gained (g) Mass Mg ÷ mass O 2. What pattern do you notice in the last column? What does it suggest about how magnesium and oxygen combine? 3. Suppose white smoke escaped from the crucible when the lid was lifted and the student’s final mass was only 18.9 g. Does this break the law of conservation of mass? Explain. Thomson: the electron (1897) Cathode ray tube. Rays travel from the cathode (−) to the anode (+). Honors Chemistry • Unit 1: Atomic Structure • page 11 Name: ______________________________ Date: ____________ Period: ______ Observation What Thomson concluded A glowing ray travels from the negative electrode (cathode) to the positive end. When a positively charged plate is placed near the ray, the ray bends toward it. The ray’s behaviour did not change when a different metal was used for the cathode. The particles were about 1/1800 as massive as a hydrogen atom. 4. What evidence did Thomson use to decide the particle had a charge, and what was the sign of the charge? 5. Thomson’s atom was electrically neutral but contained negative electrons. Describe his model, name it, and sketch it in the box. Sketch your own plum-pudding model here: Honors Chemistry • Unit 1: Atomic Structure • page 12 Name: ______________________________ Date: ____________ Period: ______ LAB CORNER • Charged tape A teacher sticks two strips of tape to a desk, peels them off, and holds them near each other. Strips of the same type repel each other. Strips of different types attract. Pair What happens Top strip + top strip repel Bottom strip + bottom strip repel Top strip + bottom strip attract What does it show? KEY RULE Like charges repel. Opposite charges attract. You will use this rule to explain Rutherford’s experiment, bonding, ionization energy and nearly everything else in chemistry. Rutherford: the nucleus (1911) Rutherford’s team aimed a beam of alpha (α) particles (positively charged helium nuclei) from a radioactive source at an extremely thin sheet of gold foil, and used a screen to detect where the particles ended up. 6. The plum-pudding model predicted every alpha particle would pass straight through. Why? (Think about the charge of the particles and how it is spread out in Thomson’s atom.) Honors Chemistry • Unit 1: Atomic Structure • page 13 Name: ______________________________ Date: ____________ Period: ______ 7. Describe the results of the experiment. Be specific about what happened to the alpha particles. Observation Conclusion about the atom Most α particles passed straight through. A few α particles were deflected. 1 in 8000 bounced almost straight back. THINK OF IT LIKE… SHOOTING AT A HAYSTACK You fire 8000 bullets at a haystack. Almost all of them pass through, but about one bounces straight back. You would conclude that something small, hard and heavy is hidden in the hay. Rutherford later said it was as surprising as firing a huge artillery shell at tissue paper and having it come back at you. 8. A lab fires 2.4 × 105 alpha particles at a gold foil. About how many would you expect to bounce back? Work: Answer: __________________________________ Honors Chemistry • Unit 1: Atomic Structure • page 14 Name: ______________________________ Date: ____________ Period: ______ Thomson (left) and Rutherford (right) 9. Describe Rutherford’s new model of the atom and draw it. What did it fail to explain? [ IMAGE GOES HERE ] Optional: the Rutherford experiment diagram from your Topic 1.2 homework or an AP exam figure After Rutherford Scientist Year Contribution Bohr 1913 Chadwick 1932 Schrödinger and others 1920s Honors Chemistry • Unit 1: Atomic Structure • page 15 Name: ______________________________ Date: ____________ Period: ______ Check for understanding — match the evidence to the scientist Evidence Scientist Model it supports Cathode ray bends toward a positive plate Some α particles bounce straight back from gold foil Mass is the same before and after burning (closed system) Atoms of one element with different masses Honors Chemistry • Unit 1: Atomic Structure • page 16 Name: ______________________________ Date: ____________ Period: ______ TOPIC 1.3 Isotopes & Average Atomic Mass Same protons, different neutrons • weighted averages • mass spectra BIG IDEA Atoms of the same element can have different numbers of neutrons (isotopes). The atomic mass on the periodic table is a weighted average of all the isotopes, which is why it is almost never a whole number. Key vocabulary — write each definition in your own words Term Definition (your words) Isotope What is the same? What is different? Atomic mass unit (amu) What is it used to measure? Percent abundance Of what, in what? Average atomic mass How is it different from mass number? Mass spectrometer What does it measure? Example / sketch ISOTOPE NAMES Isotopes are named with the element and the mass number: carbon-14 or C-14, also written 146C. Hydrogen is the only element whose isotopes have their own names: protium (H-1, 0 n), deuterium (H-2, 1 n) and tritium (H-3, 2 n). Isotope Protons Neutrons Electrons (neutral) Mg-24 Mg-25 Mg-26 Honors Chemistry • Unit 1: Atomic Structure • page 17 Mass number Name: ______________________________ Date: ____________ Period: ______ 1. Which of the following pairs are isotopes of the same element? 126C and 146C; 146C and 147N; 3517Cl and 3717Cl Why isn’t the atomic mass a whole number? THINK OF IT LIKE… YOUR GRADE IN A CLASS Tests are worth 70% of your grade and homework is worth 30%. You average 90 on tests and 60 on homework. Your grade is not (90 + 60) ÷ 2 = 75, because the tests count more: 0.70 × 90 + 0.30 × 60 = 81. An element’s atomic mass is the same kind of average: each isotope “counts” in proportion to how common it is. WORKED EXAMPLE — WEIGHTED AVERAGE Boron has two isotopes: B-10 (10.013 amu → use 10 amu) is 19.9% abundant and B-11 (use 11 amu) is 80.1% abundant. Calculate the average atomic mass. Work it out here: Answer: __________________________________ THE RECIPE Average atomic mass = (mass₁ × abundance₁) + (mass₂ × abundance₂) + … (write abundances as decimals; they add to 1.00) WATCH OUT! Never just add the masses and divide by the number of isotopes. A simple average treats a rare isotope as if it were as common as a common one. Honors Chemistry • Unit 1: Atomic Structure • page 18 Name: ______________________________ Date: ____________ Period: ______ LAB CORNER • Penny isotopes Pennies minted before 1982 are almost pure copper; pennies minted after are mostly zinc with a thin copper coating. They look alike but have different masses, so they behave like two isotopes of “the penny.” A student weighs a bag of 50 pennies by sorting them and counting. She finds 31 pre-1982 pennies and 19 post-1982 pennies. Type Number Abundance (decimal) Mass of one (g) Pre-1982 31 3.11 Post-1982 19 2.50 Abundance × mass (g) 2. Calculate the average mass of a penny in this bag. Work: Average mass: __________________________________ 3. Is any single penny in the bag actually 2.88 g? What does this tell you about the atomic mass of an element like chlorine? 4. Is the average closer to the mass of the pre-1982 penny or the post-1982 penny? Why? Honors Chemistry • Unit 1: Atomic Structure • page 19 Name: ______________________________ Date: ____________ Period: ______ LAB CORNER • Reading a mass spectrum A mass spectrometer ionizes atoms, speeds them up and bends their path with a magnet. Lighter ions bend more than heavier ones, so the instrument sorts the atoms by mass and counts how many of each arrive. Mass spectrum of a sample of chlorine. Question Your answer How many isotopes of chlorine are in the sample? What are their masses and abundances? Without calculating, predict whether the average will be closer to 35 or 37. Why? 5. Calculate the average atomic mass of chlorine from the graph (use the mass numbers as the masses). Work: Average atomic mass: __________________________________ 6. In a sample of 1000 chlorine atoms, about how many are Cl-35 and how many are Cl-37? [ IMAGE GOES HERE ] Optional: the mass-spectrometer or carbon-isotope data table from your Topic 1.3 homework Honors Chemistry • Unit 1: Atomic Structure • page 20 Name: ______________________________ Date: ____________ Period: ______ Practice 7. Lithium has two isotopes: Li-6 (7.59%) and Li-7 (92.41%). Calculate the average atomic mass of lithium. Work: Answer (units & sig figs): __________________________________ 8. Magnesium has three isotopes: Mg-24 (78.99%), Mg-25 (10.00%) and Mg-26 (11.01%). Calculate its average atomic mass. Work: Answer (units & sig figs): __________________________________ 9. An unknown element has two isotopes: one of mass 107 amu (51.84%) and one of mass 109 amu (48.16%). Calculate the average atomic mass and identify the element using your periodic table. Work: Answer (units & sig figs): __________________________________ 10. Boron’s average atomic mass is 10.8 amu. Its two isotopes have masses of 10 and 11 amu. Without doing a full calculation, which isotope is more abundant and why? Then use algebra to find the percent abundance of the heavier isotope. Work: Abundance of heavier isotope: __________________________________ 11. Carbon’s atomic mass is 12.01 amu, very close to 12. What does this tell you about the abundance of C-12 compared with C-13 and C-14? Honors Chemistry • Unit 1: Atomic Structure • page 21 Name: ______________________________ Date: ____________ Period: ______ REAL WORLD Carbon-14 is radioactive. Living things take it in all the time; when they die the C-14 slowly decays, so measuring how much is left tells scientists how old a bone or a piece of wood is (radiocarbon dating). Iodine-131 is used in medicine to treat thyroid disease. Check for understanding 12. Chlorine’s atomic mass is 35.45 amu. Which statement is true? A) Every chlorine atom has a mass of 35.45 amu. B) Chlorine is a mixture of isotopes, mostly with masses near 35 and 37 amu. C) Chlorine atoms contain 35.45 neutrons. D) The decimal comes from the mass of the electrons. 13. Two isotopes of the same element always have the same… A) mass number B) number of neutrons C) number of protons D) atomic mass Honors Chemistry • Unit 1: Atomic Structure • page 22 Name: ______________________________ Date: ____________ Period: ______ TOPIC 1.4 The Mole, Avogadro’s Number & Molar Mass Counting atoms by weighing them BIG IDEA Atoms are far too small to count one by one, so chemists count them in huge groups called moles. 1 mole = 6.022 × 10²³ particles, and the mass of 1 mole of an element in grams equals its atomic mass. Key vocabulary — write each definition in your own words Term Definition (your words) Mole (mol) Compare it to a dozen. Avogadro’s number Write it in scientific notation. Molar mass (g/mol) How do you find it for an element? Conversion factor What makes it equal to 1? Example / sketch THINK OF IT LIKE… A DOZEN, A REAM, A GROSS We already count by groups: a dozen eggs is 12, a ream of paper is 500 sheets. A dozen eggs and a dozen bowling balls contain the same *number* of objects but have very different *masses*. A mole is just a bigger group; a mole of carbon and a mole of lead both contain 6.022 × 10²³ atoms but have very different masses (12.01 g and 207.2 g). Honors Chemistry • Unit 1: Atomic Structure • page 23 Name: ______________________________ Date: ____________ Period: ______ REAL WORLD How big is a mole? If you could count one atom every second, it would take about 1.9 × 10¹⁶ years, ","id":2},{"kind":"file","unit":"Unit 1 - Atomic Structure","type":"Notes","title":"Unit 1 - Atomic Structure - TEACHER EDITION","file":"Unit 1 - Atomic Structure - TEACHER EDITION.docx","path":"Units/Unit 1 - Atomic Structure/Notes/Unit 1 - Atomic Structure - TEACHER EDITION.docx","ext":"docx","size":298417,"teacher":true,"pdf":"_pdf/ce4ac35f38aa.pdf","text":"TEACHER EDITION • ANSWER KEY & NOTES HONORS CHEMISTRY • UNIT 1 Atomic Structure Everything in the universe is built from a few kinds of tiny particles. Learn what they are, how we found them, and how to count them. TEACHER EDITION Everything in a light-gray box or cell is an answer or model response. Teacher notes (misconceptions, demo ideas, discussion prompts, sources) appear in the heavy-bordered boxes labeled TEACHER NOTE. The pages follow the student packet, so they line up closely. What we will learn 1.1 Atomic structure & properties 1.2 Atomic history: how we know what atoms look like 1.3 Isotopes & average atomic mass 1.4 The mole, Avogadro’s number & molar mass ★ Extra practice & unit review By the end of this unit I can… • Name the three subatomic particles and state the charge, relative mass and location of each. • Use atomic number, mass number and charge to find protons, neutrons and electrons in atoms, isotopes and ions. • Describe the key experiment and conclusion of Dalton, Thomson and Rutherford, and how the model of the atom changed. • Explain why atomic masses are not whole numbers and calculate average atomic mass from isotope data. • Use the mole as a bridge between particles and grams (Avogadro’s number and molar mass). • Interpret lab data (mass-spectrometer graphs, balance readings, crucible data) to support a claim about atoms. Honors Chemistry • Unit 1: Atomic Structure • page 1 TEACHER EDITION • ANSWER KEY & NOTES Unit at a glance (teacher) Topic Suggested pacing Depth the homework expects 1.1 Atomic structure 1–2 days Particles, location, what each controls; label an atom; fill isotope tables; ions (protons vs. electrons). 1.2 Atomic history 1–2 days Conservation of mass with Dalton; refute “indivisible”; Thomson’s evidence & model; Rutherford’s prediction, result and conclusion. 1.3 Isotopes & atomic mass 1–2 days Define isotope; why masses are decimals; weighted-average calculations; identify the element; count atoms of each isotope in 1 mol. 1.4 Moles & molar mass 1–2 days Mole as a counting unit; molar mass from the periodic table; atoms ⇄ moles with dimensional analysis. TEACHER OVERVIEW Big picture. Students tend to memorize particle facts but not the *reasoning* behind them. The homework asks for evidence (“what did Thomson observe that told him the particle was negative?”), so the packet keeps asking “what was observed → what was concluded.” Misconceptions to watch for: • Mass number = atomic mass (they are close, not the same). • Ions form by changing protons (they only change electrons). • “The atomic mass is a decimal because of electrons.” (It is a weighted average of isotope masses.) • A mole of anything has the same mass. (Same *number* of particles, different mass.) • Rutherford “discovered the proton” — he discovered the nucleus. • Calculating average atomic mass by averaging the isotope masses without weighting them. IMAGES Image spots: figures from the homework packet (the labeled atom, the mass-spectrometer graph, the Rutherford diagram) fit in the framed IMAGE GOES HERE boxes. All other diagrams in this packet were drawn to be printed in black and white. TOPIC 1.1 Atomic Structure & Properties Protons • neutrons • electrons • ions BIG IDEA Every atom is made of just three particles. The number of protons decides which element it is; the neutrons add mass; the electrons decide the charge and how the atom bonds. Honors Chemistry • Unit 1: Atomic Structure • page 2 TEACHER EDITION • ANSWER KEY & NOTES Key vocabulary — write each definition in your own words Term Definition (your words) Example / sketch Atom The smallest unit of an element that still has the A gold atom: 79 protons. properties of that element. Made of a nucleus (protons + neutrons) surrounded by electrons. Proton A positively charged particle (+1) found in the nucleus. The number of protons is the identity of the element. Carbon always has 6 protons. Neutron A particle with no charge found in the nucleus. Adds mass and helps hold the nucleus together. C-12 has 6 neutrons; C-14 has 8. Electron A negatively charged particle (−1) with almost no mass found in the electron cloud outside the nucleus. Controls the charge of an atom and how it bonds. A neutral sodium atom has 11 e⁻. Nucleus The tiny, dense, positively charged center of the atom. Holds the protons and neutrons and almost all of the atom’s mass. About 1/100,000 of the atom’s diameter. Atomic number (Z) The number of protons in the nucleus. It identifies the element. Z = 17 is always chlorine. Mass number (A) The total number of protons + neutrons in one atom of an isotope. (A whole number.) Fe-56: A = 56, so n = 56 − 26 = 30. Ion An atom (or group of atoms) that has gained or lost electrons so it has a net charge. The number of protons does not change. Na⁺ lost one e⁻. THINK OF IT LIKE… A STADIUM If the nucleus were a marble sitting on the 50-yard line, the outer edge of the atom (the electron cloud) would be more than five football fields away. Almost all of an atom is empty space; almost all of its mass is in the marble. THINK OF IT LIKE… A NAME TAG The atomic number is the element’s name tag. Change a few neutrons or electrons and you still have the same element (a different isotope, or an ion). Change the number of protons and you have a completely different element. Honors Chemistry • Unit 1: Atomic Structure • page 3 TEACHER EDITION • ANSWER KEY & NOTES REAL WORLD Alchemists spent centuries trying to turn lead (82 protons) into gold (79 protons). Chemical reactions only move electrons, so they can never change the number of protons. Only nuclear reactions can (you will meet those in the Nuclear unit). Fill in the particle table Particle Symbol Charge Relative mass (amu) Location in the atom Proton p⁺ +1 1 in the nucleus Neutron n⁰ 0 1 in the nucleus Electron e⁻ −1 ≈ 0 (1/1836) outside the nucleus, in the electron cloud What controls what? CUES / KEY WORDS COMPLETE EACH LINE AND EXPLAIN WHY Identity Identity is controlled by the number of protons (atomic number). Change it and the element changes. Mass Charge Mass is controlled by protons + neutrons (the nucleus). Electrons are about 1/1836 of a proton, so they add almost nothing. Charge is controlled by the difference between protons and electrons. Equal numbers = neutral atom. 1. Label the parts of the atom below (A–E). Diagram of a helium-like atom (not to scale). A: nucleus B: proton C: neutron D: electron E: electron cloud (region where electrons are found) Honors Chemistry • Unit 1: Atomic Structure • page 4 TEACHER EDITION • ANSWER KEY & NOTES [ IMAGE GOES HERE ] Optional: the labeled-atom diagram from your Topic 1.1 homework Nuclear symbols and hyphen notation Two ways to name the same isotope. WORKED EXAMPLE — COUNT THE PARTICLES How many protons, neutrons and electrons are in a neutral atom of iron-56 (5626Fe)? Protons = atomic number = 26. Neutrons = mass number − atomic number = 56 − 26 = 30. Neutral atom → electrons = protons = 26. Answer: 26 p⁺, 30 n⁰, 26 e⁻ THREE RULES TO MEMORIZE • protons = atomic number (Z) (always, even in ions) • neutrons = mass number (A) − atomic number (Z) • electrons = protons − charge (Na⁺: 11 − (+1) = 10 e⁻; O²⁻: 8 − (−2) = 10 e⁻) WATCH OUT! Mass number is a whole number you count. Atomic mass (on the periodic table) is a decimal average. They are not the same thing. You’ll see why in Topic 1.3. Honors Chemistry • Unit 1: Atomic Structure • page 5 TEACHER EDITION • ANSWER KEY & NOTES Practice: fill in every blank Isotope name Nuclear symbol Atomic # Mass # Protons Electrons Neutrons carbon-14 14 C 6 14 6 6 8 copper-64 64 Cu 29 64 29 29 35 uranium-238 238 92 U 92 238 92 92 146 argon-40 40 Ar 18 40 18 18 22 silver-108 108 47 Ag 47 108 47 47 61 oxygen-18 18 8 O 8 18 8 8 10 fluorine-19 19 F 9 19 9 9 10 6 29 18 9 TEACHER NOTE Row 4 is given as e⁻ = 18 and n = 22 (neutral atom). Rows 5–6 show the table can be entered from any two numbers: encourage students to find the *first* thing they can calculate, then fill outward. Ions: when the number of electrons changes CUES / KEY WORDS HOW DOES AN ATOM BECOME AN ION? WHAT ARE THE TWO TYPES? Ion An atom becomes an ion by gaining or losing electrons (never protons). Cation Anion Cation = positive ion, formed when an atom loses electrons (more protons than electrons). Metals usually form cations. Anion = negative ion, formed when an atom gains electrons (more electrons than protons). Nonmetals usually form anions. THINK OF IT LIKE… A BANK ACCOUNT Protons are the account’s fixed deposits; electrons are the cash you can add or take away. Losing electrons (cash) leaves the atom more positive; gaining electrons leaves it more negative. A tip to remember: cations are +itive (the t looks like a plus sign); anions have a negative charge. Honors Chemistry • Unit 1: Atomic Structure • page 6 TEACHER EDITION • ANSWER KEY & NOTES Ion Cation or anion? Protons Electrons Gained or lost how many e⁻? Al3+ cation 13 10 lost 3 O2- anion 8 10 gained 2 K+ cation 19 18 lost 1 N3- anion 7 10 gained 3 Ca2+ cation 20 18 lost 2 Br- anion 35 36 gained 1 2. An ion has 26 protons and 23 electrons. What is its charge, and is it a cation or an anion? Name the ion (hint: look at the periodic table). Charge = 26 − 23 = +3, so it is a cation: Fe³⁺ (iron(III) ion). 3. Explain why the mass of a Na⁺ ion is practically identical to the mass of a neutral Na atom, even though they are different particles. The ion differs only by one electron, and an electron has about 1/1836 the mass of a proton. The mass is in the nucleus, which did not change. 4. A student says: \"If I add a proton to a neutral oxygen atom I get an O⁻ ion.\" Correct the statement. Adding a proton changes the element (oxygen → fluorine). Ions form only by gaining or losing electrons. Adding an electron to neutral oxygen gives O⁻. LAB CORNER • Reading an element tile Chemists read the periodic table like a label on a food package. Use the tile below for aluminum. A typical periodic table tile. Honors Chemistry • Unit 1: Atomic Structure • page 7 TEACHER EDITION • ANSWER KEY & NOTES Question Your answer Which number is the atomic number? How many protons does an Al atom have? The whole number on top (13). 13 protons. Which number is the atomic mass? Why isn’t it a whole number? 26.98. It is a weighted average of the masses of all of aluminum’s naturally occurring isotopes. How many electrons are in an Al³⁺ ion? 13 − 3 = 10 electrons. Most aluminum atoms have 14 neutrons. What is the mass number of that isotope? 13 + 14 = 27 → Al-27. TEACHER NOTE This sets up Topic 1.3 (why 26.98?). Al is nearly 100% Al-27, which is why the decimal is close to 27. Check for understanding 5. Which particle(s) contribute significantly to the mass of an atom? A) electrons only B) protons and neutrons C) protons and electrons D) neutrons and electrons 6. Two atoms have the same number of protons but different numbers of neutrons. They are… A) different elements B) isotopes of the same element C) ions of the same element D) impossible Honors Chemistry • Unit 1: Atomic Structure • page 8 TEACHER EDITION • ANSWER KEY & NOTES TOPIC 1.2 Atomic History Dalton • Thomson • Rutherford • and the evidence behind each model BIG IDEA A model of the atom is only as good as the evidence behind it. Every time scientists did a new experiment and got a surprising result, the model had to change. How our picture of the atom developed. THINK OF IT LIKE… A MYSTERY BOX Imagine a sealed shoe box with something hidden inside. You can’t open it, but you can roll marbles through it and see where they come out. If every marble goes straight through, the box is empty. If some bounce back, something solid is in there. Rutherford did exactly this with atoms, using alpha particles for marbles. Dalton’s atomic theory (about 1803) CUES / KEY WORDS WRITE EACH OF DALTON’S IDEAS IN YOUR OWN WORDS Atoms 1. All matter is made of tiny particles called atoms. Elements Compounds Reactions 2. All atoms of a given element are identical to each other in mass and properties, and different from atoms of other elements. 3. Compounds form when atoms of different elements combine in simple wholenumber ratios. 4. In a chemical reaction atoms are rearranged: never created, destroyed or changed into other kinds of atoms (law of conservation of mass). Honors Chemistry • Unit 1: Atomic Structure • page 9 TEACHER EDITION • ANSWER KEY & NOTES Dalton’s idea Does modern theory agree? Explain. Atoms are indivisible (the smallest form of matter). No. Atoms are made of protons, neutrons and electrons (and those are made of smaller particles). Nuclear reactions can even split atoms. All atoms of an element are identical. Not exactly. Isotopes of an element have different numbers of neutrons, so different masses. Atoms are never created or destroyed in a chemical reaction. Yes, for chemical reactions. (Nuclear reactions are different.) LAB CORNER • The burning magnesium ribbon A student burns magnesium ribbon in a crucible with a lid, then re-weighs the white powder. She repeats the experiment three times. 1. The solid’s mass increased. Use Dalton’s theory to explain where the extra mass came from, and calculate it for the first trial. a. How many grams of oxygen combined with the 12.15 g of magnesium? 20.15 g − 12.15 g = 8.00 g of oxygen. b. Explain the answer using one of Dalton’s ideas. Atoms are not created or destroyed in a chemical reaction, only rearranged. The magnesium atoms combined with oxygen atoms from the air, so the product has the mass of both. Mass of reactants = mass of products (conservation of mass). Honors Chemistry • Unit 1: Atomic Structure • page 10 TEACHER EDITION • ANSWER KEY & NOTES Trial Mg used (g) MgO formed (g) O gained (g) Mass Mg ÷ mass O 1 12.15 20.15 8.00 1.52 2 6.08 10.08 4.00 1.52 3 9.12 15.12 6.00 1.52 2. What pattern do you notice in the last column? What does it suggest about how magnesium and oxygen combine? The ratio is constant (about 1.52 g Mg for every 1 g O). Magnesium and oxygen always combine in the same fixed mass ratio, which fits Dalton’s idea that compounds form from atoms in definite whole-number ratios (law of definite proportions). 3. Suppose white smoke escaped from the crucible when the lid was lifted and the student’s final mass was only 18.9 g. Does this break the law of conservation of mass? Explain. No. The missing mass is MgO that left the crucible as smoke. Mass is still conserved, but the system was not closed, so the student didn't measure all of the product. TEACHER NOTE Mg is 24.31 g/mol and O is 16.00 g/mol, so the exact mass ratio in MgO is 24.31 : 16.00 = 1.52 : 1. The data are built from that ratio. A real crucible experiment also produces some Mg₃N₂ (Mg reacts with N₂ in air), which is a good “why isn’t our data perfect?” discussion. Thomson: the electron (1897) Cathode ray tube. Rays travel from the cathode (−) to the anode (+). Honors Chemistry • Unit 1: Atomic Structure • page 11 TEACHER EDITION • ANSWER KEY & NOTES Observation What Thomson concluded A glowing ray travels from the negative electrode (cathode) to the positive end. The ray is made of particles that come out of the metal. When a positively charged plate is placed near the ray, the ray bends toward it. Opposite charges attract, so the particles must be negatively charged. The ray’s behaviour did not change when a different metal was used for the cathode. These particles are in the atoms of all matter. The particles were about 1/1800 as massive as a hydrogen atom. They are smaller than an atom: atoms are divisible! Thomson named them electrons. 4. What evidence did Thomson use to decide the particle had a charge, and what was the sign of the charge? The cathode ray was bent (deflected) by electric and magnetic fields. It bent toward the positive plate and away from the negative plate, so the charge is negative. 5. Thomson’s atom was electrically neutral but contained negative electrons. Describe his model, name it, and sketch it in the box. The plum-pudding model: a sphere of diffuse positive charge (the pudding) with negative electrons (the plums) scattered throughout it. Overall neutral. Sketch: a large circle shaded as positive 'pudding' with small dots marked − scattered inside. LAB CORNER • Charged tape A teacher sticks two strips of tape to a desk, peels them off, and holds them near each other. Strips of the same type repel each other. Strips of different types attract. Pair What happens What does it show? Top strip + top strip repel Same type of charge repels. Bottom strip + bottom strip repel Same type of charge repels. Top strip + bottom strip attract The two strips have opposite charges. There are two kinds of charge. KEY RULE Like charges repel. Opposite charges attract. You will use this rule to explain Rutherford’s experiment, bonding, ionization energy and nearly everything else in chemistry. Rutherford: the nucleus (1911)
