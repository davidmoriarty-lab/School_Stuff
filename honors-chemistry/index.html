nd":"file","unit":"Unit 5 - Moles and Molar Quantities","type":"Tests and Quizzes","title":"Unit 5 - Moles and Molar Quantities - SAMPLE TEST","file":"Unit 5 - Moles and Molar Quantities - SAMPLE TEST.docx","path":"Units/Unit 5 - Moles and Molar Quantities/Tests and Quizzes/Unit 5 - Moles and Molar Quantities - SAMPLE TEST.docx","ext":"docx","size":40463,"teacher":false,"pdf":"_pdf/cdb8affa66ab.pdf","text":"Moles and Molar Quantities Unit: Sample Test Name: ______________________________ Pd: ______ Bring your own periodic table and calculator. Show your setup with units for every calculation. Part I is worth 1 point per question (20 points). Part II is on the following pages (46 points). Part I: Multiple Choice 1. Which statement about one mole is correct? A. One mole of any element has a mass of 1.00 g. B. One mole is 6.022 × 10²³ particles. C. One mole of any substance occupies 22.4 L. D. One mole of any compound contains 6.022 × 10²³ atoms. 2. How many zinc atoms are in 0.250 mol of Zn? A. 4.15 × 10⁻²⁵ atoms B. 1.51 × 10²⁴ atoms C. 6.022 × 10²³ atoms D. 1.51 × 10²³ atoms 3. 4. 5. 6. 7. What is the molar mass of Ca(NO₃)₂? A. 164.10 g/mol B. 102.09 g/mol C. 116.10 g/mol D. 148.10 g/mol How many moles are in 3.011 × 10²³ molecules of CO₂? A. 2.000 mol B. 6.84 × 10²¹ mol C. 0.5000 mol D. 1.81 × 10⁴⁷ mol What is the mass of 2.50 mol of NaCl? A. 0.0428 g B. 146 g C. 60.9 g D. 1.51 × 10²⁴ g How many moles are in 88.0 g of CO₂? A. 2.00 mol B. 3870 mol C. 0.500 mol D. 3.93 mol Which sample contains the greatest number of atoms? A. 1.0 mol of He B. 1.0 mol of H₂ C. 1.0 mol of N₂ D. 1.0 mol of CH₄ Honors Chemistry • Unit 5 Sample Test • page 1 8. A student wants to convert a mass of a compound in grams into a number of molecules. What is the first step? A. Multiply by 6.022 × 10²³. B. Divide by the molar mass. C. Divide by 22.4 L/mol. D. Multiply by the molar mass. 9. What volume does 0.500 mol of N₂ gas occupy at STP? A. 44.8 L B. 314 L C. 11.2 L D. 0.0223 L 10. A gas sample occupies 33.6 L at STP. How many moles of gas is this? A. 0.667 mol B. 753 mol C. 56.0 mol D. 1.50 mol 11. Which 10.0 g gas sample has the greatest volume at STP? A. H₂ B. He C. N₂ D. CO₂ 12. What is the percent by mass of oxygen in H₂O? A. 11.21% B. 50.00% C. 88.79% D. 94.06% 13. What is the percent by mass of nitrogen in NH₄NO₃? A. 35.00% B. 17.5% C. 59.96% D. 5.05% 14. What is the empirical formula of C₆H₁₂O₆? A. C₆H₁₂O₆ B. CH₂O C. C₂H₄O₂ D. CHO 15. A compound is 75.0% C and 25.0% H by mass. What is its empirical formula? A. CH₃ B. C₃H₁₂ C. CH₄ D. C₂H₆ 16. A compound has the empirical formula CH₂O and a molar mass of 60.06 g/mol. What is its molecular formula? A. CH₂O B. C₃H₆O₃ C. C₄H₈O₄ D. C₂H₄O₂ 17. What is the correct name for CuSO₄ · 5H₂O? A. copper(II) sulfate pentahydrate B. copper(I) sulfate pentahydrate C. copper(II) sulfate pentoxide D. copper(II) sulfate hydrate five 18. A 5.00 g sample of a hydrate is heated until its mass is constant at 3.20 g. What is the percent water in the hydrate? A. 64.0% B. 36.0% C. 56.3% D. 1.80% 19. A student heats CuSO₄ · xH₂O and finds 0.0100 mol CuSO₄ and 0.0498 mol H₂O. What is x? A. 4 B. 6 C. 5 D. 0.0498 20. 1.00 mol of He and 1.00 mol of Ne contain the same number of atoms but have different masses. Why? A. A mole of Ne contains more atoms than a mole of He. B. The mole is defined by mass, not by number. C. Ne atoms are always larger than He molecules. D. Each Ne atom has a greater mass than each He atom. Part II: Free Response 1) Calculate each quantity. Show your setup with units and give the answer with the correct sig figs. (12 pts) a. Find the molar mass of (NH₄)₂CO₃. (2 pts) b. How many grams are in 0.750 mol of Mg(OH)₂? (2 pts) c. How many molecules are in 25.0 g of glucose, C₆H₁₂O₆? (3 pts) d. How many oxygen atoms are in 0.400 mol of Al₂(SO₄)₃? (3 pts) e. What is the mass of 3.011 × 10²³ molecules of NH₃? (2 pts) Honors Chemistry • Unit 5 Sample Test • page 2 2) Gases at STP. Use 22.4 L/mol where it applies. (10 pts) a. What volume does 14.2 g of Cl₂ gas occupy at STP? (3 pts) b. What is the mass of 5.60 L of NH₃ gas at STP? (3 pts) c. How many molecules are in 11.2 L of N₂ gas at STP? (2 pts) d. A student uses 22.4 L/mol for a gas at 25 °C and 1 atm. Explain why the answer will be wrong. (2 pts) 3) Percent composition and formulas. (12 pts) a. Find the percent by mass of each element in Al₂(SO₄)₃. (4 pts) b. A compound is 40.00% C, 6.71% H and 53.29% O by mass and has a molar mass of 180 g/mol. Find its empirical formula and its molecular formula. Show your work. (8 pts) Honors Chemistry • Unit 5 Sample Test • page 3 4) Hydrates. A student heats a sample of blue copper(II) sulfate hydrate, CuSO₄ · xH₂O, in a crucible until the mass stops changing. (12 pts) Data: mass of empty crucible = 18.42 g; crucible + hydrate (before heating) = 20.92 g; crucible + solid (after heating) = 20.02 g a. Find the mass of the hydrate, the mass of water lost and the mass of anhydrous CuSO₄. (2 pts) b. Calculate the moles of water lost and the moles of CuSO₄ left. (3 pts) c. Find x. Then write the formula and the name of the hydrate. (3 pts) d. Find the percent water by mass in this hydrate. (2 pts) e. The student stopped heating early, so some water stayed in the crucible. Will the calculated x be too high or too low? Explain. (2 pts) Honors Chemistry • Unit 5 Sample Test • page 4","id":13},{"kind":"file","unit":"Unit 5 - Moles and Molar Quantities","type":"Tests and Quizzes","title":"Unit 5 - Moles and Molar Quantities - SAMPLE TEST KEY","file":"Unit 5 - Moles and Molar Quantities - SAMPLE TEST KEY.docx","path":"Units/Unit 5 - Moles and Molar Quantities/Tests and Quizzes/Unit 5 - Moles and Molar Quantities - SAMPLE TEST KEY.docx","ext":"docx","size":41213,"teacher":true,"pdf":"_pdf/02ad63030b67.pdf","text":"Moles and Molar Quantities Unit: Sample Test, TEACHER KEY Every value is computed in code (atomic masses to 0.01 g/mol, NA = 6.022 × 10²³, 22.4 L/mol at STP) and rounded to the sig figs of the data. Accept answers within one rounding digit if the work is correct. Points are listed in each part. Part I: Multiple Choice (1 point each) # Ans Correct choice Why 1 B One mole is 6.022 × 10²³ particles. 2 3 4 5 6 7 D A C B A D 1.51 × 10²³ atoms 164.10 g/mol 0.5000 mol 146 g 2.00 mol 1.0 mol of CH₄ 8 B Divide by the molar mass. 9 10 11 C D A 11.2 L 1.50 mol H₂ 12 13 C A 88.79% 35.00% 14 15 16 17 18 19 20 B C D A B C D CH₂O CH₄ C₂H₄O₂ copper(II) sulfate pentahydrate 36.0% 5 Each Ne atom has a greater mass than each He atom. The mole counts particles (atoms, molecules or formula units). A compound's molecules each hold several atoms, and 22.4 L is only for a gas at STP. 0.250 mol × 6.022 × 10²³ atoms/mol 40.08 + 2(14.01) + 6(16.00): the 2 outside the parentheses multiplies everything inside. 3.011 × 10²³ ÷ 6.022 × 10²³ = 0.5000 mol 2.50 mol × 58.44 g/mol = 146 g 88.0 g ÷ 44.01 g/mol = 2.00 mol Every sample is 1.0 mol of particles, but a CH₄ molecule holds 5 atoms (H₂ and N₂ hold 2, He holds 1). Grams and particles never convert directly: grams → moles (÷ molar mass) → particles (× 6.022 × 10²³). 0.500 mol × 22.4 L/mol = 11.2 L 33.6 L ÷ 22.4 L/mol = 1.50 mol Volume follows moles, and the lightest gas has the most moles in 10.0 g: H₂ 4.95 mol, He 2.50, N₂ 0.357, CO₂ 0.227. 16.00 g ÷ 18.02 g × 100 = 88.79% Two N atoms: 28.02 g ÷ 80.06 g × 100 = 35.00%. The formula has two nitrogens (one in NH₄⁺, one in NO₃⁻). Divide every subscript by 6 (the largest whole number that divides them all). 75.0 g C = 6.245 mol; 25.0 g H = 24.75 mol; ratio C : H = 1 : 3.96, which is 1 : 4. Empirical mass = 30.03 g/mol; 60.06 ÷ 30.03 = 2, so multiply every subscript by 2. Copper(II) because sulfate is 2−; the prefix penta- gives the 5 water molecules. Water lost = 5.00 − 3.20 = 1.80 g; 1.80 ÷ 5.00 × 100 = 36.0%. 0.0498 mol H₂O ÷ 0.0100 mol CuSO₄ = 4.98, which rounds to 5. A mole is a count (6.022 × 10²³). Ne is 20.18 g/mol and He is 4.00 g/mol because each Ne atom is heavier. Answer pattern: 1B 2D 3A 4C 5B 6A 7D 8B 9C 10D 11A 12C 13A 14B 15C 16D 17A 18B 19C 20D Part II: Free Response (46 points) 1) Calculate each quantity. Show your setup with units and give the answer with the correct sig figs. (12 pts) a. Find the molar mass of (NH₄)₂CO₃. (2 pts) N: 2 × 14.01 = 28.02; H: 8 × 1.01 = 8.08; C: 12.01; O: 3 × 16.00 = 48.00 Molar mass = 96.11 g/mol b. How many grams are in 0.750 mol of Mg(OH)₂? (2 pts) Mg(OH)₂ = 24.31 + 2(16.00) + 2(1.01) = 58.33 g/mol 0.750 mol × 58.33 g/mol = 43.7 g c. How many molecules are in 25.0 g of glucose, C₆H₁₂O₆? (3 pts) C₆H₁₂O₆ = 180.18 g/mol 25.0 g × (1 mol / 180.18 g) × (6.022 × 10²³ molecules / 1 mol) = 8.36 × 10²² molecules d. How many oxygen atoms are in 0.400 mol of Al₂(SO₄)₃? (3 pts) Each formula unit has 12 O atoms (4 × 3). 0.400 mol Al₂(SO₄)₃ × (12 mol O / 1 mol) × (6.022 × 10²³ atoms / 1 mol) = 2.89 × 10²⁴ O atoms e. What is the mass of 3.011 × 10²³ molecules of NH₃? (2 pts) 3.011 × 10²³ ÷ 6.022 × 10²³ = 0.5000 mol; NH₃ = 17.04 g/mol 0.5000 mol × 17.04 g/mol = 8.520 g 2) Gases at STP. Use 22.4 L/mol where it applies. (10 pts) a. What volume does 14.2 g of Cl₂ gas occupy at STP? (3 pts) Cl₂ = 70.90 g/mol 14.2 g × (1 mol / 70.90 g) × (22.4 L / 1 mol) = 4.49 L b. What is the mass of 5.60 L of NH₃ gas at STP? (3 pts) 5.60 L × (1 mol / 22.4 L) × (17.04 g / 1 mol) = 4.26 g Honors Chemistry • Unit 5 Sample Test • TEACHER KEY • page 1 c. How many molecules are in 11.2 L of N₂ gas at STP? (2 pts) 11.2 L × (1 mol / 22.4 L) × (6.022 × 10²³ molecules / 1 mol) = 3.01 × 10²³ molecules d. A student uses 22.4 L/mol for a gas at 25 °C and 1 atm. Explain why the answer will be wrong. (2 pts) 22.4 L/mol is the molar volume only at STP (0 °C and 1 atm). At 25 °C the gas is warmer, so 1 mol takes up more than 22.4 L. 3) Percent composition and formulas. (12 pts) a. Find the percent by mass of each element in Al₂(SO₄)₃. (4 pts) Molar mass = 2(26.98) + 3(32.06) + 12(16.00) = 342.14 g/mol Al: 53.96 ÷ 342.14 × 100 = 15.77%; S: 96.18 ÷ 342.14 × 100 = 28.11%; O: 192.00 ÷ 342.14 × 100 = 56.12% (check: the percents add to 100%) b. A compound is 40.00% C, 6.71% H and 53.29% O by mass and has a molar mass of 180 g/mol. Find its empirical formula and its molecular formula. Show your work. (8 pts) Assume 100 g: 40.00 g C, 6.71 g H, 53.29 g O (2 pts) Moles: C 40.00 ÷ 12.01 = 3.331; H 6.71 ÷ 1.01 = 6.644; O 53.29 ÷ 16.00 = 3.331 (2 pts) Divide by the smallest (3.331): C 1.000, H 1.99, O 1.000 → empirical formula CH₂O (2 pts) Empirical mass = 12.01 + 2(1.01) + 16.00 = 30.03 g/mol; 180 ÷ 30.03 = 5.99, so n = 6 → molecular formula C₆H₁₂O₆ (2 pts) 4) Hydrates. A student heats a sample of blue copper(II) sulfate hydrate, CuSO₄ · xH₂O, in a crucible until the mass stops changing. (12 pts) Data: mass of empty crucible = 18.42 g; crucible + hydrate (before heating) = 20.92 g; crucible + solid (after heating) = 20.02 g a. Find the mass of the hydrate, the mass of water lost and the mass of anhydrous CuSO₄. (2 pts) Hydrate: 20.92 − 18.42 = 2.50 g; water lost: 20.92 − 20.02 = 0.90 g; anhydrous CuSO₄: 20.02 − 18.42 = 1.60 g b. Calculate the moles of water lost and the moles of CuSO₄ left. (3 pts) H₂O: 0.90 g ÷ 18.02 g/mol = 0.0499 mol CuSO₄ (159.61 g/mol): 1.60 g ÷ 159.61 g/mol = 0.0100 mol c. Find x. Then write the formula and the name of the hydrate. (3 pts) x = 0.0499 ÷ 0.0100 = 4.98, which rounds to 5 CuSO₄ · 5H₂O, named copper(II) sulfate pentahydrate d. Find the percent water by mass in this hydrate. (2 pts) 0.90 g ÷ 2.50 g × 100 = 36.0% e. The student stopped heating early, so some water stayed in the crucible. Will the calculated x be too high or too low? Explain. (2 pts) Too low. The mass of water lost is too small, so moles of water and the ratio to CuSO₄ come out smaller than the true value. Honors Chemistry • Unit 5 Sample Test • TEACHER KEY • page 2","id":14},{"kind":"file","unit":"Unit 5 - Moles and Molar Quantities","type":"Labs","title":"Unit 5 Lab - Empirical Formula of Magnesium Oxide - STUDENT","file":"Unit 5 Lab - Empirical Formula of Magnesium Oxide - STUDENT.docx","path":"Units/Unit 5 - Moles and Molar Quantities/Labs/Unit 5 Lab - Empirical Formula of Magnesium Oxide - STUDENT.docx","ext":"docx","size":41761,"teacher":false,"pdf":"_pdf/0255a5e4635d.pdf","text":"Pre-Lab: Empirical Formula of Magnesium Oxide Name: ______________________________ Date: ____________ Period: ______ Complete before lab day. In lab you burn a piece of magnesium ribbon and use the masses to find the mole ratio of Mg to O. Show your work and use units. Part A: Background 1. What is an empirical formula? Why can't we find it by just looking at the compound? 2. Mg forms Mg²⁺ and O forms O²⁻. Predict the formula of magnesium oxide and the mole ratio of Mg to O. 3. Balance: ____ Mg + ____ O₂ → ____ MgO 4. Magnesium is so reactive that it also reacts with the nitrogen in air, making magnesium nitride. Write the formula of magnesium nitride (Mg²⁺ and N³⁻) and balance: ____ Mg + ____ N₂ → ____ Mg₃N₂ 5. After the first heating you add water. Balance the reaction of the nitride with water, and the reaction when Mg(OH)₂ is heated. Then explain how the water step helps the experiment. ____ Mg₃N₂ + ____ H₂O → ____ Mg(OH)₂ + ____ NH₃ ____ Mg(OH)₂ → ____ MgO + ____ H₂O 6. Why is the lid left slightly ajar during heating, instead of fully off or fully on? 7. You cannot weigh the oxygen that reacts. Explain how you will find the mass of oxygen from three masses. Part B: Practice calculation and precision 8. In a trial, 0.1500 g of Mg burns to give 0.2487 g of product. Find the mass of oxygen, the moles of each element, and the empirical formula. Show every step. 9. The balance reads 25.4310 g. How many decimal places is that? When you subtract two such masses, how many decimal places belong in the answer? Why is the last digit allowed to drift on a warm crucible? 10. List three safety precautions for this lab and the hazard each prevents. 11. Predict. How would you prove that all the water is gone and the mass is final? (Hint: the idea of constant mass.) Honors Chemistry • Unit 5 Lab: Empirical Formula of Magnesium Oxide • page 1 Lab: Empirical Formula of Magnesium Oxide (47 minutes) Name: ______________________________ Date: ____________ Period: ______ Partner: ______________________ Purpose: Find the empirical formula of magnesium oxide by burning a weighed piece of Mg, finding the mass of oxygen that combined by difference, and comparing the mole ratio with the formula you predicted in the pre-lab. SAFETY • • • Goggles on all period. Hair tied back. Do not look directly at burning magnesium. Tongs only for the crucible and lid. Set hot items on the ceramic pad, never on the bench. Add water slowly to the cooled ash, never to a glowing crucible. Waft the ammonia smell, do not sniff. Materials: numbered crucible and lid (mass on label), pre-massed Mg ribbon (mass on bag), ring stand with ring and clay triangle, Bunsen burner, tongs, ceramic pad, dropper bottle of distilled water, 0.0001 g balance (shared). Procedure (minutes are a guide) 1. (0–4) Goggles on. Set the clay triangle on the ring so the crucible sits in it. Record the crucible + lid mass and the Mg mass from the labels. Do not weigh them again. 2. (4–6) Coil the Mg ribbon in the crucible. Set the lid on slightly ajar (a small gap, not off). Set the crucible in the triangle. 3. (6–16) Light the burner. Heat gently for 2 minutes, then strongly. When the Mg ignites, keep the lid ajar. Do not stare at the flame. Heat until the ribbon is fully burned and no longer glowing (about 8 minutes). Record what you see. 4. (16–19) Turn the burner off. Use tongs to set the crucible on the ceramic pad. Cool 3 minutes. Start the calculation setup. 5. (19–21) The crucible must no longer glow. Remove the lid with tongs and add about 10 drops of distilled water slowly onto the ash. Waft any odour toward you. Record the odour and colour. 6. (21–28) Replace the lid slightly ajar and heat gently for 2 minutes to drive off the water, then strongly for 4 to 5 minutes. Turn off the burner. 7. (28–31) Cool 3 minutes on the pad. Sign up for a balance. 8. (31–36) Mass the crucible, lid and product together on the balance (4 decimal places). The last digit may drift: record the first reading that holds for 3 seconds. Carry the crucible with tongs. 9. (36–47) Finish the calculations, add your results to the class table, then clean up: let equipment cool, return crucible and tongs, wipe your area, wash hands. The product goes in the trash. Data Mass (g) Mass of crucible + lid (from label) Mass of Mg ribbon (from bag) Mass of crucible + lid + product (after heating) Mass of product, MgO (final − crucible + lid) Mass of oxygen (product − Mg) Observations (before heating, during burning, after adding water, final product): Honors Chemistry • Unit 5 Lab: Empirical Formula of Magnesium Oxide • page 2 Calculations (show setup and units; your last digit is limited by the balance) Work Answer Moles of Mg (÷ 24.31 g/mol) Moles of O (÷ 16.00 g/mol) Mole ratio O : Mg (divide both by the smaller) Empirical formula (whole numbers) Percent error in the O : Mg ratio (accepted 1.00) Class data (record every group) Group Mg (g) MgO (g) O (g) O : Mg ratio Class average Analysis questions 1. State your experimental O : Mg mole ratio and empirical formula. Does it agree with your pre-lab prediction? Use the class average in your answer. 2. Give two observations from the lab that support the formation of an oxide (or a nitride that was converted to an oxide). 3. The ribbon gained mass. Where did the extra mass come from? Which law does this show? 4. Name one source of error that could make your ratio too high and one that could make it too low. Explain each. 5. How does the water step improve your result? What would the ratio look like without it? Honors Chemistry • Unit 5 Lab: Empirical Formula of Magnesium Oxide • page 3 Extension questions (honors) E1. Theoretical yield. Using your Mg mass, calculate the mass of MgO you should have made and your percent yield. E2. Percent composition. Find the percent Mg by mass in your product and compare it with the percent Mg in MgO. E3. Gas volume. How many liters of O₂ gas at STP reacted with your Mg? (Hint: moles O₂ = moles O ÷ 2.) E4. Suppose all of the Mg had formed Mg₃N₂ and you did the calculation as if the extra mass were oxygen. What O : Mg mole ratio would you get? What does that tell you about the effect of leaving the nitride in the product? E5. Question the evidence. Hot magnesium can also react with carbon dioxide: 2 Mg + CO₂ → 2 MgO + C. A student's product is grey-black. What does the colour suggest and how would the carbon change the O : Mg ratio? E6. A student burns 0.2698 g of aluminum and gets 0.5098 g of aluminum oxide. Find the empirical formula (Al = 26.98 g/mol). Hint: the ratio may not be 1 : 1. Honors Chemistry • Unit 5 Lab: Empirical Formula of Magnesium Oxide • page 4","id":15},{"kind":"file","unit":"Unit 5 - Moles and Molar Quantities","type":"Labs","title":"Unit 5 Lab - Empirical Formula of Magnesium Oxide - TEACHER EDITION","file":"Unit 5 Lab - Empirical Formula of Magnesium Oxide - TEACHER EDITION.docx","path":"Units/Unit 5 - Moles and Molar Quantities/Labs/Unit 5 Lab - Empirical Formula of Magnesium Oxide - TEACHER EDITION.docx","ext":"docx","size":45962,"teacher":true,"pdf":"_pdf/b471ad93dc04.pdf","text":"TEACHER EDITION: Empirical Formula of Magnesium Oxide Name: ______________________________ Date: ____________ Period: ______ Partner: ______________________ Prep sheet, 47-minute pacing, answer keys with computed sample data, troubleshooting and rubric. Student pages follow. Before the lab (about 30 minutes of prep) • Crucibles: fire each crucible and lid for about 5 minutes, cool, and mass the pair to 0.0001 g. Number each pair and write its mass on a card or tray label (tape burns off). • Magnesium: sand the ribbon bright, cut about 0.15 to 0.25 g per group, and mass it to 0.0001 g. Put each piece in a numbered bag that matches a crucible number, and write the mass on the bag. Students record both masses and do not weigh them. • Each group needs: goggles, ring stand with ring and clay triangle, Bunsen burner, tongs, ceramic pad, dropper bottle of distilled water, a numbered crucible, lid and bag. Hair tied back, no loose sleeves. • Balances: one 0.0001 g balance for every 2 to 3 groups. Stagger the final masses (students sign up at minute 28). Wipe the pan and shut the doors. • Why one period works: pre-massed crucibles and ribbon remove two weighings and the 5-minute crucible firing, and the cooling is cut to about 3 minutes. A warm crucible makes the last digit drift, so accept a mass within ±0.0020 g and tell students to record the first reading that holds for 3 seconds. The constant-mass check is a pre-lab question; if a group finishes early they can reheat 3 minutes and mass again. • Water step safety: after the 3-minute cool the crucible should be dull, not glowing. Students add the drops slowly with the dropper at arm's length, goggles on. If a crucible still glows, wait another minute. Ammonia smell means the nitride was there. 47-minute pacing Minutes 0–4 4–6 6–16 16–19 19–21 21–28 28–31 31–36 36–43 43–47 Students Goggles on, set up stand and triangle, collect crucible and Mg, record both masses. Quick pre-lab check. Coil the Mg inside the crucible, set the lid slightly ajar on the triangle. Light the burner. Heat gently 2 minutes, then strongly until the ribbon has burned and stopped glowing (about 8 minutes). Cool 3 minutes on the ceramic pad. Start the calculation setup. Add about 10 drops of water slowly, waft, record the smell and colour. Heat gently 2 minutes to drive off water, then strongly 4 to 5 minutes, lid ajar. Cool 3 minutes. Sign up for a balance. Teacher Hand out numbered sets. Check pre-lab questions 1–3 orally. Check lids and hair. Remind: do not look at the flame. Watch for lids sealed or fully off. Walk the room. Confirm crucibles are not glowing. Mass the crucible, lid and product (4 decimals). Record. Tongs only. Calculations in the data sheet. Add the class table row. Cleanup: cool equipment, return crucibles and tongs, wash hands. Product may go in the trash. Staggered at balances. Collect results on the board. Honors Chemistry • Unit 5 Lab: Empirical Formula of Magnesium Oxide • TEACHER EDITION • page 1 Pre-Lab: Empirical Formula of Magnesium Oxide Part A: Background 1. What is an empirical formula? Why can't we find it by just looking at the compound? The simplest whole-number ratio of atoms (or moles of atoms) in a compound. We cannot see the atoms, so we measure masses and convert them to moles. 2. Mg forms Mg²⁺ and O forms O²⁻. Predict the formula of magnesium oxide and the mole ratio of Mg to O. MgO; 1 mol Mg : 1 mol O (the charges cancel one to one). 3. Balance: ____ Mg + ____ O₂ → ____ MgO 2 Mg + 1 O₂ → 2 MgO 4. Magnesium is so reactive that it also reacts with the nitrogen in air, making magnesium nitride. Write the formula of magnesium nitride (Mg²⁺ and N³⁻) and balance: ____ Mg + ____ N₂ → ____ Mg₃N₂ Mg₃N₂ (3 × 2+ = 2 × 3−). 3 Mg + 1 N₂ → 1 Mg₃N₂ 5. After the first heating you add water. Balance the reaction of the nitride with water, and the reaction when Mg(OH)₂ is heated. Then explain how the water step helps the experiment. ____ Mg₃N₂ + ____ H₂O → ____ Mg(OH)₂ + ____ NH₃ ____ Mg(OH)₂ → ____ MgO + ____ H₂O 1 Mg₃N₂ + 6 H₂O → 3 Mg(OH)₂ + 2 NH₃; 1 Mg(OH)₂ → 1 MgO + 1 H₂O. The water turns the nitride into hydroxide (ammonia escapes) and heating turns the hydroxide back into MgO and steam, so everything ends up as MgO and the mass is correct. 6. Why is the lid left slightly ajar during heating, instead of fully off or fully on? Air (O₂) must get in so the Mg burns, but the lid keeps the white MgO smoke from escaping, which would lose product mass. A fully closed lid starves the Mg of O₂; fully off loses product. 7. You cannot weigh the oxygen that reacts. Explain how you will find the mass of oxygen from three masses. Mass of O = mass of MgO product − mass of Mg (conservation of mass: the extra mass is the oxygen that combined). Part B: Practice calculation and precision 8. In a trial, 0.1500 g of Mg burns to give 0.2487 g of product. Find the mass of oxygen, the moles of each element, and the empirical formula. Show every step. Mass O = 0.2487 − 0.1500 = 0.0987 g Moles Mg = 0.1500 g ÷ 24.31 g/mol = 0.006170 mol; moles O = 0.0987 g ÷ 16.00 g/mol = 0.006169 mol Ratio O : Mg = 0.006169 ÷ 0.006170 = 1.000 ≈ 1 : 1 → MgO 9. The balance reads 25.4310 g. How many decimal places is that? When you subtract two such masses, how many decimal places belong in the answer? Why is the last digit allowed to drift on a warm crucible? 4 decimal places; the difference also has 4 decimal places (0.0001 g). A warm crucible heats the air around it, which rises and pushes on the pan, so the last digit changes. Record the first steady reading. 10. List three safety precautions for this lab and the hazard each prevents. Any three: goggles and not looking at the burning Mg (very bright light harms eyes); tongs and the ceramic pad for hot crucibles (burns); no water on a glowing crucible (it can crack and spatter); hair tied back and loose items away (fire); waft ammonia, do not sniff (irritant); wash hands. 11. Predict. How would you prove that all the water is gone and the mass is final? (Hint: the idea of constant mass.) Reheat and mass again; if the two masses agree within the balance's limit, no more water or gas is leaving. Repeat until masses stop changing. Honors Chemistry • Unit 5 Lab: Empirical Formula of Magnesium Oxide • TEACHER EDITION • page 2 Lab: Empirical Formula of Magnesium Oxide (47 minutes) Purpose: Find the empirical formula of magnesium oxide by burning a weighed piece of Mg, finding the mass of oxygen that combined by difference, and comparing the mole ratio with the formula you predicted in the pre-lab. SAFETY • • • Goggles on all period. Hair tied back. Do not look directly at burning magnesium. Tongs only for the crucible and lid. Set hot items on the ceramic pad, never on the bench. Add water slowly to the cooled ash, never to a glowing crucible. Waft the ammonia smell, do not sniff. Materials: numbered crucible and lid (mass on label), pre-massed Mg ribbon (mass on bag), ring stand with ring and clay triangle, Bunsen burner, tongs, ceramic pad, dropper bottle of distilled water, 0.0001 g balance (shared). Procedure (minutes are a guide) 1. (0–4) Goggles on. Set the clay triangle on the ring so the crucible sits in it. Record the crucible + lid mass and the Mg mass from the labels. Do not weigh them again. 2. (4–6) Coil the Mg ribbon in the crucible. Set the lid on slightly ajar (a small gap, not off). Set the crucible in the triangle. 3. (6–16) Light the burner. Heat gently for 2 minutes, then strongly. When the Mg ignites, keep the lid ajar. Do not stare at the flame. Heat until the ribbon is fully burned and no longer glowing (about 8 minutes). Record what you see. 4. (16–19) Turn the burner off. Use tongs to set the crucible on the ceramic pad. Cool 3 minutes. Start the calculation setup. 5. (19–21) The crucible must no longer glow. Remove the lid with tongs and add about 10 drops of distilled water slowly onto the ash. Waft any odour toward you. Record the odour and colour. 6. (21–28) Replace the lid slightly ajar and heat gently for 2 minutes to drive off the water, then strongly for 4 to 5 minutes. Turn off the burner. 7. (28–31) Cool 3 minutes on the pad. Sign up for a balance. 8. (31–36) Mass the crucible, lid and product together on the balance (4 decimal places). The last digit may drift: record the first reading that holds for 3 seconds. Carry the crucible with tongs. 9. (36–47) Finish the calculations, add your results to the class table, then clean up: let equipment cool, return crucible and tongs, wipe your area, wash hands. The product goes in the trash. Data Mass (g) Mass of crucible + lid (from label) 25.1234 Mass of Mg ribbon (from bag) 0.2015 Mass of crucible + lid + product (after heating) 25.4552 Mass of product, MgO (final − crucible + lid) 0.3318 Mass of oxygen (product − Mg) 0.1303 Observations (before heating, during burning, after adding water, final product): Ribbon burned with a very bright white light, leaving a white powder, sometimes with grey or pale yellow bits. Water: faint ammonia odour. Final: white powder. Honors Chemistry • Unit 5 Lab: Empirical Formula of Magnesium Oxide • TEACHER EDITION • page 3 Calculations (show setup and units; your last digit is limited by the balance) Work Answer Moles of Mg (÷ 24.31 g/mol) 0.2015 g ÷ 24.31 g/mol 0.008289 mol Moles of O (÷ 16.00 g/mol) 0.1303 g ÷ 16.00 g/mol 0.008144 mol Mole ratio O : Mg (divide both by the smaller) 0.008144 ÷ 0.008289 1 : 0.983 Empirical formula (whole numbers) MgO Percent error in the O : Mg ratio (accepted 1.00) |0.983 − 1.00| ÷ 1.00 × 100 1.7% Class data (record every group) Group 1 Mg (g) 0.1983 MgO (g) 0.3280 O (g) 0.1297 O : Mg ratio 0.994 2 0.2041 0.3385 0.1344 1.00 3 0.2015 0.3318 0.1303 0.983 4 0.1962 0.3202 0.1240 0.960 5 0.2076 0.3441 0.1365 0.999 6 0.2008 0.3366 0.1358 1.03 Class average 0.994 Analysis questions 1. State your experimental O : Mg mole ratio and empirical formula. Does it agree with your pre-lab prediction? Use the class average in your answer. Sample: O : Mg = 0.983, so the empirical formula is MgO, which matches the Mg²⁺/O²⁻ prediction. The class average of 0.994 is also close to 1.00. 2. Give two observations from the lab that support the formation of an oxide (or a nitride that was converted to an oxide). Bright white flame and white powder (oxide); ammonia odour after adding water (nitride was present and converted); the mass increased. 3. The ribbon gained mass. Where did the extra mass come from? Which law does this show? From oxygen in the air combining with the Mg. Law of conservation of mass: the product mass equals Mg mass plus O mass. 4. Name one source of error that could make your ratio too high and one that could make it too low. Explain each. Too high: water or Mg(OH)₂ left in the product (extra mass counted as oxygen). Too low: MgO smoke escaped, or unburned Mg left (less oxygen in the product). A warm crucible reads slightly light, also lowering the ratio. 5. How does the water step improve your result? What would the ratio look like without it? It converts Mg₃N₂ to Mg(OH)₂ and then MgO. Without it, some Mg is in the product as the nitride, which weighs less than MgO for the same Mg, so the oxygen would look too low. Honors Chemistry • Unit 5 Lab: Empirical Formula of Magnesium Oxide • TEACHER EDITION • page 4 Extension questions (honors) E1. Theoretical yield. Using your Mg mass, calculate the mass of MgO you should have made and your percent yield. Theory = 0.2015 g Mg × (40.31 g MgO ÷ 24.31 g Mg) = 0.3341 g; percent yield = 0.3318 ÷ 0.3341 × 100 = 99.31%. E2. Percent composition. Find the percent Mg by mass in your product and compare it with the percent Mg in MgO. Experimental: 0.2015 ÷ 0.3318 × 100 = 60.73% Mg; theoretical: 24.31 ÷ 40.31 × 100 = 60.31% Mg. E3. Gas volume. How many liters of O₂ gas at STP reacted with your Mg? (Hint: moles O₂ = moles O ÷ 2.) 0.008144 mol O ÷ 2 = 0.004072 mol O₂; × 22.4 L/mol = 0.0912 L (about 91 mL). E4. Suppose all of the Mg had formed Mg₃N₂ and you did the calculation as if the extra mass were oxygen. What O : Mg mole ratio would you get? What does that tell you about the effect of leaving the nitride in the product? Mg₃N₂ has 2 N for 3 Mg: 14.01 × 2 ÷ 3 = 9.34 g N per mol Mg; treated as oxygen: 9.34 ÷ 16.00 = 0.58 mol, so the ratio would be about 1 : 0.58, far below 1 : 1. A little nitride lowers the oxygen found; that is why the water step is needed. E5. Question the evidence. Hot magnesium can also react with carbon dioxide: 2 Mg + CO₂ → 2 MgO + C. A student's product is grey-black. What does the colour suggest and how would the carbon change the O : Mg ratio? The dark colour is carbon (or unburned Mg), not pure MgO. Carbon adds mass that is counted as oxygen, so the ratio would come out too high. Appearance is evidence: the formula is only trustworthy if the product is white. E6. A student burns 0.2698 g of aluminum and gets 0.5098 g of aluminum oxide. Find the empirical formula (Al = 26.98 g/mol). Hint: the ratio may not be 1 : 1. Mass O = 0.5098 − 0.2698 = 0.2400 g. Moles Al = 0.01000 mol; moles O = 0.01500 mol. Ratio O : Al = 1.50, which is 1.5 : 1. Multiply both by 2 for whole numbers: 2 Al : 3 O, so Al₂O₃. Troubleshooting • Ribbon will not ignite: the lid is too closed or the crucible is not hot enough. Open the lid slightly and heat more strongly. • White smoke escaping: the lid is too far open. Close the gap and keep heating. • Grey or black bits after the first burn: unburned Mg or carbon. Reheat with the lid ajar before adding water. • Greenish-yellow powder: Mg₃N₂ (the water step converts it). • Crucible cracks or spits at the water step: water was added to a glowing crucible. Wait longer and add drops slowly. • Ratio far from 1: check for smoke loss, wet product (reheat 3 minutes and mass again), or a warm-crucible reading. Use the class table to discuss which errors push the ratio up and down. Rubric (40 points) Category Pre-lab Technique and safety Data and calculations Points 10 5 10 Analysis Extension 8 7 What earns full credit All 11 questions answered with work (about 1 point each), submitted before lab. Goggles, lid ajar, water added only to a cooled crucible, tongs used, clean station. Masses recorded to 4 decimals from the labels and balance, setup shown, units on every number, correct ratio and formula. Five questions with reasoning that references the data (about 1.5 points each). Any six answered correctly; E4 to E6 count double for reasoning. Honors Chemistry • Unit 5 Lab: Empirical Formula of Magnesium Oxide • TEACHER EDITION • page 5","id":16},{"kind":"file","unit":"Unit 6 - Stoichiometry","type":"Notes","title":"Unit 6 - Stoichiometry - STUDENT NOTES","file":"Unit 6 - Stoichiometry - STUDENT NOTES.docx","path":"Units/Unit 6 - Stoichiometry/Notes/Unit 6 - Stoichiometry - STUDENT NOTES.docx","ext":"docx","size":98592,"teacher":false,"pdf":"_pdf/4471b90abaa7.pdf","text":"Name: ______________________________ Date: ____________ Period: ______ HONORS CHEMISTRY • UNIT 6 Stoichiometry Use a balanced equation like a recipe: predict how much you need, how much you make, what runs out first, and how well the lab went. HOW TO USE THIS PACKET Write in pencil. Every calculation needs a setup with units, an answer with the right number of sig figs, and the substance named. LAB CORNER boxes are things you would see at a lab bench. Extra practice and a review are at the back. What we will learn 6.1 Mole ratios 6.2 Mass-to-mass stoichiometry 6.3 Liters and particles (gas volume at STP) 6.4 Limiting and excess reactants (BCA tables) 6.5 Theoretical, actual and percent yield By the end of this unit I can… • Write mole ratios from a balanced equation and use them to convert between moles of two substances. • Solve mass-to-mass problems using a mole map and show every unit. • Convert between liters of gas at STP, moles, grams and particles. • Identify the limiting reactant and calculate product made and excess left over using a BCA table. • Calculate theoretical yield and percent yield, and explain why actual yield is smaller. Honors Chemistry • Unit 6: Stoichiometry • page 1 Name: ______________________________ Date: ____________ Period: ______ 6.1 Mole Ratios The coefficients of a balanced equation are a recipe BIG IDEA A balanced equation tells you how many particles react, and since a mole is a counting number, the coefficients also give moles. The mole ratio is a conversion factor built from two coefficients. It is the only bridge between one substance and another. Key vocabulary — write each definition in your own words Term Definition (y N₂ form from 37 moles of hydrazine? (c) If 23 moles of water form, how many moles of H₂O₂ were used? a. Balanced equation Work: Answer (units & sig figs): __________________________________ b. Moles of N₂ Work: Honors Chemistry • Unit 6: Stoichiometry • page 3 Name: ______________________________ Date: ____________ Period: ______ Answer (units & sig figs): __________________________________ c. Moles of H₂O₂ Work: Answer (units & sig figs): __________________________________ 6.2 Mass-to-Mass Stoichiometry Grams → moles → moles → grams BIG IDEA You cannot compare grams of different substances directly, because a gram of one is not the same number of particles as a gram of another. Convert to moles, use the mole ratio, then convert back to grams. The mole map (use the top and bottom boxes in 6.3). Molar masses come from the periodic table. 1. In your own words, why is the mole ratio step the only step that uses the balanced equation? What do the other two steps use? SETUP RULES 1. Balance the equation. 2. Write the given quantity with its unit and substance. 3. Chain factors so that each unit cancels. 4. Round the final answer to the sig figs of the given data. WORKED EXAMPLE — GRAMS TO GRAMS How many grams of FeS form from 5.9 g of Fe? (8Fe + S₈ → 8FeS) Work it out here: Answer: __________________________________ 2. Use the equation Fe + S₈ → FeS. (a) Balance it. a. Balance the equation Work: Answer (units & sig figs): __________________________________ Honors Chemistry • Unit 6: Stoichiometry • page 4 Name: ______________________________ Date: ____________ Period: ______ b. How many moles of FeS are produced when 2.4 g of S₈ react? Work: Answer (units & sig figs): __________________________________ c. How many grams of iron are used if 11.9 g of sulfur (S₈) are used? Work: Answer (units & sig figs): __________________________________ 3. Use the equation Fe₂O₃ + C → Fe + CO₂ (the reaction in a blast furnace). a. Balance the equation Work: Answer (units & sig figs): __________________________________ b. How many grams of iron form if 39.64 g of carbon are used? Work: Answer (units & sig figs): __________________________________ c. If 63.12 g of iron(III) oxide are used, how many grams of carbon dioxide form? Work: Answer (units & sig figs): __________________________________ 4. A student solved “grams of Fe₂O₃ → grams of CO₂” by multiplying by 159.7 g/mol and then by 44.01 g/mol, skipping the mole ratio. Describe what is wrong and what the student’s answer would represent. 5. To convert grams of A to grams of B you need… A) molar masses only B) molar masses and the mole ratio 6.3 C) the mole ratio only D) 22.4 L/mol Liters and Particles Gas volume at STP and counting atoms BIG IDEA At STP (0 °C and 1 atm), 1 mole of any gas occupies 22.4 L. This lets us convert between liters of a gas and moles, and so to any other substance. One mole is also 6.02 × 10²³ particles. Honors Chemistry • Unit 6: Stoichiometry • page 5 Name: ______________________________ Date: ____________ Period: ______ Key vocabulary — write each definition in your own words Term Definition (your words) STP Two conditions and a number Molar volume Units? Example / sketch THINK OF IT LIKE… A DOZEN IS JUST A NUMBER A dozen is 12 things, whether they are eggs or elephants. A mole is 6.02 × 10²³ things, and at STP that many gas molecules take up 22.4 L whether they are H₂ or Cl₂. Gases are mostly empty space, so the size of the molecule hardly matters. 1. Explain why 1 mole of H₂ and 1 mole of Cl₂ occupy the same volume at STP even though a Cl₂ molecule is much heavier. 2. Hydrogen gas and oxygen gas combine to form water. Assume STP. a. How many liters of H₂ are needed to make 3 moles of water? Work: Answer (units & sig figs): __________________________________ b. How many grams of water form from 30.2 L of hydrogen? Work: Answer (units & sig figs): __________________________________ c. How many grams of water form from 30.2 L of oxygen? Work: Answer (units & sig figs ient runs out first? BIG IDEA Reactants are almost never mixed in perfect recipe amounts. The limiting reactant is the one that runs out first and so decides how much product forms. The excess reactant is what is left over when the reaction stops. Honors Chemistry • Unit 6: Stoichiometry • page 8 Name: ______________________________ Date: ____________ Period: ______ Key vocabulary — write each definition in your own words Term Definition (your words) Limiting reactant What does it limit? Excess reactant What happens to it? Example / sketch Recipe: 2 crackers + 1 chocolate + 1 marshmallow → 1 s’more. 1. Using the s’more recipe and the items shown: (a) How many s’mores can you make? (b) What is the limiting “reactant”? (c) What is left over, and how many of each? Work: BCA TABLE STEPS (MOLES!) 1. Balance the equation. Convert every given amount to moles. 2. Divide each by its coefficient; the smallest value is the limiting reactant. 3. Before row = starting moles. Change row = the limiting reactant goes to 0; use the mole ratio for the rest (reactants −, products +). 4. After row = Before + Change. Convert the After amounts to the unit the question asks for. Particle picture: N₂ + 3H₂ → 2NH₃ 2. Which reactant is limiting? Draw the particles after the reaction in the AFTER box, then say how many N₂ molecules are left. WORKED EXAMPLE — BCA TABLE 1.5 mol CH₄ react with 2.5 mol Cl₂: CH₄ + 2Cl₂ → CH₂Cl₂ + 2HCl. Find the moles of each product and the moles of excess reactant left. Work it out here: Honors Chemistry • Unit 6: Stoichiometry • page 9 Name: ______________________________ Date: ____________ Period: ______ (mol) CH₄ 2Cl₂ CH₂Cl₂ 2HCl Before Change After Divide by coefficients and answer: 3. 15.0 g of N₂ gas reacts with 4.50 g of H₂ gas: N₂ + 3H₂ → 2NH₃. Use a BCA table to find the mass of NH₃ made and the mass of the excess reactant left. (mol) N₂ 3H₂ 2NH₃ Before Change After Work and answers: 4. 17.5 L of NH₃ gas react with 12.5 L of O₂ gas at STP: 4NH₃ (g) + 5O₂ (g) → 4NO (g) + 6H₂O (g). Use a BCA table to find the mass of each product and the liters of excess reactant left. (mol) 4NH₃ 5O₂ 4NO 6H₂O Before Change After Work and answers: 5. 7.50 g of solid sodium react with 18.5 L of Cl₂ gas at STP: 2Na (s) + Cl₂ (g) → 2NaCl (s). Find the mass of NaCl made and the mass of the excess reactant left. (mol) 2Na Cl₂ Before Change After Work and answers: Honors Chemistry • Unit 6: Stoichiometry • page 10 2NaCl Name: ______________________________ Date: ____________ Period: ______ 6. A classmate says, “The limiting reactant is the one with the smaller mass.” Use any example above to show why this is not reliable. 7. In a BCA table, the limiting reactant’s “After” value is always… A) equal to its Before value B) zero C) equal to the product 6.5 D) negative Theoretical, Actual and Percent Yield How well did the lab go? BIG IDEA The theoretical yield is the most product the equation predicts (from the limiting reactant). The actual yield is what you really collect in the lab. Percent yield = actual ÷ theoretical × 100, and it can never honestly be more than 100 %. Key vocabulary — write each definition in your own words Term Definition (your words) Theoretical yield Where does it come from? Actual yield How is it found? Percent yield Formula? Example / sketch THINK OF IT LIKE… FREE THROWS A player who shoots 10 free throws could, in theory, make all 10 (theoretical yield). Making 8 is the actual yield, so the percent yield is 80 %. Nobody can make 12 out of 10, so a percent yield over 100 % means something is wrong. Honors Chemistry • Unit 6: Stoichiometry • page 11 Name: ______________________________ Date: ____________ Period: ______ LAB CORNER • Collecting a precipitate A student mixes two solutions, filters the solid, dries it and finds its mass. 1. Give three reasons the actual yield of a precipitate is usually less than the theoretical yield. Then give one reason a student might get a percent yield greater than 100 %. 2. Methane
