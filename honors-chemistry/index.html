Rutherford’s team aimed a beam of alpha (α) particles (positively charged helium nuclei) from a radioactive source at an extremely thin sheet of gold foil, and used a screen to detect where the particles ended up. Honors Chemistry • Unit 1: Atomic Structure • page 12 TEACHER EDITION • ANSWER KEY & NOTES 6. The plum-pudding model predicted every alpha particle would pass straight through. Why? (Think about the charge of the particles and how it is spread out in Thomson’s atom.) In Thomson’s atom the positive charge is spread out evenly and the electrons are very light, so there is no concentrated charge strong enough to repel a fast, heavy alpha particle. It should plow straight through, like a bullet through a cloud. 7. Describe the results of the experiment. Be specific about what happened to the alpha particles. Most alpha particles passed straight through. A few were deflected at small angles, and a very few (about 1 in 8000) bounced almost straight back. Honors Chemistry • Unit 1: Atomic Structure • page 13 TEACHER EDITION • ANSWER KEY & NOTES Observation Conclusion about the atom Most α particles passed straight through. Most of the atom is empty space. A few α particles were deflected. There is a small positively charged region that repels the positive α particles. 1 in 8000 bounced almost straight back. That charged region is tiny, very dense and has most of the atom’s mass: the nucleus. THINK OF IT LIKE… SHOOTING AT A HAYSTACK You fire 8000 bullets at a haystack. Almost all of them pass through, but about one bounces straight back. You would conclude that something small, hard and heavy is hidden in the hay. Rutherford later said it was as surprising as firing a huge artillery shell at tissue paper and having it come back at you. 8. A lab fires 2.4 × 105 alpha particles at a gold foil. About how many would you expect to bounce back? 2.4 × 105 ÷ 8000 = 30 Answer: ≈ 30 particles Thomson (left) and Rutherford (right) 9. Describe Rutherford’s new model of the atom and draw it. What did it fail to explain? A tiny, dense, positively charged nucleus at the center that holds nearly all the mass, with electrons outside it in mostly empty space. It couldn’t explain why electrons don’t spiral into the nucleus, or what the extra mass in the nucleus was made of (later answered by Bohr's energy levels and Chadwick's neutron). [ IMAGE GOES HERE ] Optional: the Rutherford experiment diagram from your Topic 1.2 homework or an AP exam figure Honors Chemistry • Unit 1: Atomic Structure • page 14 TEACHER EDITION • ANSWER KEY & NOTES After Rutherford Scientist Year Contribution Bohr 1913 Electrons travel in fixed energy levels (orbits) around the nucleus (Unit 2). Chadwick 1932 Discovered the neutron, the neutral particle in the nucleus that explains the missing mass. Schrödinger and others 1920s Quantum-mechanical model: electrons are found in clouds of probability (orbitals), not on fixed paths. Check for understanding — match the evidence to the scientist Evidence Scientist Model it supports Cathode ray bends tow","id":3},{"kind":"file","unit":"Unit 2 - Electrons and Periodic Trends","type":"Notes","title":"Unit 2 - Electrons and Periodic Trends - STUDENT NOTES","file":"Unit 2 - Electrons and Periodic Trends - STUDENT NOTES.docx","path":"Units/Unit 2 - Electrons and Periodic Trends/Notes/Unit 2 - Electrons and Periodic Trends - STUDENT NOTES.docx","ext":"docx","size":272451,"teacher":false,"pdf":"_pdf/a366e0ed6393.pdf","text":"Name: ______________________________ Date: ____________ Period: ______ HONORS CHEMISTRY • UNIT 2 Electrons & Periodic Trends The arrangement of electrons explains the shape of the periodic table, why elements react the way they do, and every trend you will use for the rest of the course. HOW TO USE THIS PACKET This is your notebook for the unit. Write definitions in your own words, copy the steps of each worked example, and use the blank space for sketches and questions. Boxes marked LAB CORNER are things you would do or see at a lab bench. Extra practice is at the back. What we will learn 2.1 Bohr models & Lewis dot structures 2.2 The quantum mechanical model & electron configuration 2.3 Orbital diagrams (Aufbau, Pauli & Hund) 2.4 Periodic trends: ionization energy & atomic radius 2.5 Periodic trends: electronegativity & successive ionization energy ★ Extra practice & unit review By the end of this unit I can… • Explain how Bohr’s model improved on Rutherford’s, and use line spectra and flame tests as evidence for energy levels. • Draw Bohr models and Lewis dot structures and find valence electrons from a periodic table. • Write full and noble-gas shorthand electron configurations for atoms and ions. • Draw orbital diagrams that obey the Aufbau principle, the Pauli exclusion principle and Hund’s rule. • Use Coulomb’s law (nuclear charge, distance and shielding) to explain trends in ionization energy and atomic radius. • Explain the trend in electronegativity and use successive ionization energies to identify an element’s group. • Rank atoms and ions in order of radius, ionization energy and electronegativity and justify each ranking. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 1 Name: ______________________________ Date: ____________ Period: ______ TOPIC 2.1 Bohr Models & Lewis Dot Structures Energy levels • line spectra • valence electrons BIG IDEA Bohr proposed that electrons can only exist in certain energy levels (shells) around the nucleus, like steps on a staircase. Electrons jump between levels by absorbing or emitting exactly the right amount of energy. Key vocabulary — write each definition in your own words Term Definition (your words) Energy level (shell) How many e⁻ can the first three levels hold? Valence electron Where are they? Why do they matter? Core electron How is it different from a valence electron? Emission spectrum What makes the lines? Lewis dot structure What do the dots stand for? Example / sketch Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 2 Name: ______________________________ Date: ____________ Period: ______ How did Bohr improve Rutherford’s model? CUES / KEY WORDS COMPARE THE TWO MODELS Rutherford Bohr Evidence THINK OF IT LIKE… A STAIRCASE On a staircase you can stand on step 1 or step 2, but never in between. Electrons are the same: they can only be at certain energy levels. Moving up a step takes a specific amount of energy; moving down releases the same amount, as light. LAB CORNER • Line spectra: the fingerprint of an element When hydrogen gas is heated or energized, it glows. A prism or diffraction grating spreads that light into a spectrum. Visible lines in the hydrogen spectrum An electron falls to a lower level 1. Why does hydrogen emit only a few separate lines and not a continuous rainbow of colors? 2. The line at 410 nm has a shorter wavelength than the line at 656 nm. Which line comes from the larger energy drop? Explain. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 3 Name: ______________________________ Date: ____________ Period: ______ 3. What happens to an electron when an atom absorbs energy? What happens when it falls back? LAB CORNER • Flame tests A student dips a clean wire loop into solutions of metal salts and holds it in a Bunsen burner flame. Each metal ion produces a different flame color. Metal ion in the salt Flame color observed Lithium (Li⁺) crimson red Sodium (Na⁺) bright yellow-orange Potassium (K⁺) pale lilac / violet Calcium (Ca²⁺) orange-red Copper (Cu²⁺) blue-green Barium (Ba²⁺) yellow-green 4. Explain, using electron energy levels, where the colored light in a flame test comes from and why each metal gives a different color. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 4 Name: ______________________________ Date: ____________ Period: ______ 5. A student tests a white powder and sees a bright yellow-orange flame. What metal ion is most likely in the powder? Why isn’t flame color alone enough to be certain when the flame is orange-red? Drawing Bohr models BOHR MODEL RULES • The number in the nucleus = atomic number (protons). • Fill the shells closest to the nucleus first: 2 → 8 → 8 … (up to element 20). • The electrons in the last shell are the valence electrons. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 5 Name: ______________________________ Date: ____________ Period: ______ Draw the Bohr model for each element. Write the number of protons in the nucleus and place dots for electrons on the rings. 6. How do you find the number of valence electrons for an element using the periodic table? Group 1 2 13 14 15 16 17 18 Valence electrons Lewis dot structures THINK OF IT LIKE… SEATS ON A SQUARE TABLE Put one dot on each side of the symbol (top, right, bottom, left) before you pair any up. This is like people sitting at a square table: everyone takes their own side first. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 6 Name: ______________________________ Date: ____________ Period: ______ Draw the Lewis dot structure for each element. Identify the element Clue Element Has 5 valence electrons and is in period 3. Has 7 valence electrons and its most abundant isotope has 18 neutrons. Has 8 valence electrons and is in period 2. Has a Bohr model with 2, 8, 2 electrons in its shells. WATCH OUT! Valence electrons are counted by the outermost shell, not by the total number of electrons. Sodium has 11 electrons but only 1 valence electron. [ IMAGE GOES HERE ] Optional: Bohr model diagrams from your Topic 2.1 homework (identify the elements) 7. An electron in an atom absorbs energy. What happens next? A) It moves to a lower energy level. B) It moves to a higher energy level. C) It leaves the nucleus. D) It becomes a proton. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 7 Name: ______________________________ Date: ____________ Period: ______ TOPIC 2.2 The Quantum Mechanical Model & Electron Configuration Sublevels • orbitals • Aufbau order BIG IDEA Electrons don’t circle the nucleus like planets. They occupy orbitals, 3-D regions where an electron is most likely to be found. Orbitals are grouped into sublevels (s, p, d, f) inside each energy level. An electron configuration lists where every electron is. Key vocabulary — write each definition in your own words Term Definition (your words) Orbital How many electrons fit in one? Sublevel (s, p, d, f) How many orbitals in each? Electron configuration What does 2p⁴ mean? Aufbau principle Which sublevels fill first? Noble gas shorthand Why do we use it? Example / sketch THINK OF IT LIKE… AN APARTMENT BUILDING The energy level is the floor of the building (n = 1, 2, 3 …). Each floor has different types of rooms (s, p, d, f). Each room is an orbital, and every room holds at most 2 people. People take the cheapest, lowest rooms first, and the building gets bigger as you go up (floor 1 has just an s room; floor 3 has s, p and d rooms). Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 8 Name: ______________________________ Date: ____________ Period: ______ Sublevel Shape Number of orbitals s p d f Orbital shapes (not to scale). Relative energies of the sublevels. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 9 Max electrons Name: ______________________________ Date: ____________ Period: ______ The diagonal rule: follow each arrow from top right to bottom left. CUES / KEY WORDS WRITE THE FILLING ORDER FROM MEMORY (USE THE DIAGRAM AS A GUIDE) Aufbau Order The periodic table is a map of the filling order Blocks of the periodic table. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 10 Name: ______________________________ Date: ____________ Period: ______ 1. Use the table above to explain why the periodic table has a block of 2 columns on the left, 6 on the right, and 10 in the middle. Worked examples WORKED EXAMPLE — FULL CONFIGURATION Write the electron configuration for nitrogen (7 electrons). Work it out here: Answer: __________________________________ WORKED EXAMPLE — SHORTHAND Write the noble gas shorthand for arsenic (As, 33 electrons). Work it out here: Answer: __________________________________ WORKED EXAMPLE — IDENTIFY FROM THE CONFIGURATION Which element has the configuration 1s² 2s² 2p⁶ 3s² 3p⁴? Work it out here: Answer: __________________________________ QUICK TRICKS • The period number is the highest energy level (n) in the configuration. • Valence electrons = electrons in the highest energy level (the s and p electrons of the outer shell). • Superscripts always add up to the atomic number (for a neutral atom). Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 11 Name: ______________________________ Date: ____________ Period: ______ Practice: write the full configuration, then circle the valence electrons Element Electron configuration Valence e⁻ Be (Z = 4) Mg (Z = 12) Ca (Z = 20) 2. What do the configurations of Be, Mg and Ca have in common? Why does this make sense? Element Electron configuration N (Z = 7) Cl (Z = 17) Mn (Z = 25) Cd (Z = 48) Practice: noble gas shorthand Element Shorthand configuration Sr (Z = 38) As (Z = 33) S (Z = 16) Al (Z = 13) Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 12 Valence e⁻ Name: ______________________________ Date: ____________ Period: ______ Practice: identify the element Configuration Element 1s² 2s² 2p⁶ 3s¹ [Kr] 5s² 4d¹⁰ 5p³ 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹⁰ 4p⁶ 5s² 4d¹⁰ 5p³ [Ne] 3s² 3p² Find the error Each configuration below is for a neutral atom. Is it correct? If not, explain what is wrong and write the correct one. Configuration Correct? If not, fix it 1s² 2s² 2p⁶ 3s³ 1s² 2s² 2p⁷ 1s² 2s¹ 2p⁵ [Ar] 4s² 3d¹⁰ 4p⁵ [Ar] 5s² 4d¹⁰ 5p⁵ Configurations of ions CUES / KEY WORDS HOW DO YOU WRITE THE CONFIGURATION OF AN ION? Cations Anions Isoelectronic Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 13 Name: ______________________________ Date: ____________ Period: ______ Ion Configuration Same configuration as which noble gas? Na⁺ O²⁻ Mg²⁺ Cl⁻ Ca²⁺ Al³⁺ REAL WORLD Atoms “want” a filled outer shell like a noble gas. That is why sodium readily forms Na⁺ and chlorine forms Cl⁻: they end up with the same stable configuration as neon and argon. This is the whole story of ionic bonding (Unit 9). 3. How many electrons can the 3d sublevel hold? A) 2 B) 6 C) 10 D) 14 4. Which is the correct shorthand configuration for calcium? A) [Ne] 3s² B) [Ar] 4s² C) [Ar] 3d² D) [Kr] 4s² Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 14 Name: ______________________________ Date: ____________ Period: ______ TOPIC 2.3 Orbital Diagrams Aufbau • Pauli exclusion • Hund’s rule BIG IDEA An orbital diagram shows every orbital as a box and every electron as an arrow. It tells you more than a configuration: it shows which electrons are paired and which are unpaired, and that decides how an atom behaves in a magnetic field and in bonding. Key vocabulary — write each definition in your own words Term Definition (your words) Orbital How many electrons can one orbital hold? Pauli exclusion principle What must be different about two electrons in the same box? Hund’s rule What do electrons do in a sublevel with several boxes? Paired / unpaired electron How can you tell from a diagram? Degenerate orbitals Which orbitals are degenerate? Example / sketch THINK OF IT LIKE… SEATS ON A BUS Strangers boarding a bus take an empty double-seat to themselves before sitting next to someone (Hund’s rule). Only when every double-seat has one person does anyone sit beside a stranger. Each seat holds at most two people, and they must be facing opposite directions (Pauli). Passengers fill the front rows first (Aufbau). Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 15 Name: ______________________________ Date: ____________ Period: ______ The three rules — write each one in your own words CUES / KEY WORDS STATE EACH RULE AND SKETCH A SMALL EXAMPLE Aufbau principle Pauli exclusion principle Hund’s rule How to draw an orbital diagram STEPS 1. Write the electron configuration first (so you know how many electrons go in each sublevel). 2. Draw boxes: 1 box for s, 3 for p, 5 for d, 7 for f. 3. Add arrows one at a time, ↑ first in every box of the sublevel (Hund), then add ↓ to pair them. 4. Check: the total number of arrows equals the atomic number, and no box holds more than two arrows. WORKED EXAMPLE — NITROGEN Draw the orbital diagram for nitrogen (Z = 7). Work it out here: Answer: __________________________________ Nitrogen: three unpaired electrons. WORKED EXAMPLE — IRON Draw the orbital diagram for iron (Z = 26) and count its unpaired electrons. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 16 Name: ______________________________ Date: ____________ Period: ______ Work it out here: Answer: __________________________________ Iron: four unpaired electrons in 3d. Practice: complete the orbital diagram Fill in the arrows. Then write the number of unpaired electrons. O (Z = 8): unpaired electrons = ________ Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 17 Name: ______________________________ Date: ____________ Period: ______ P (Z = 15): unpaired electrons = ________ Find the error Each diagram below is meant to show nitrogen’s outer electrons (2s and 2p). Only one is correct. For the other two, name the rule that is broken. 1. Which diagram is correct, and what rule is broken in each of the others? Unpaired electrons across period 3 Element Shorthand configuration Unpaired e⁻ Na Mg Al Si P S Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 18 Attracted to a magnet? Name: ______________________________ Date: ____________ Period: ______ Element Shorthand configuration Unpaired e⁻ Attracted to a magnet? Cl Ar 2. Describe the pattern in the number of unpaired electrons as you move across period 3. Why does it go up and then back down? Orbital diagrams for ions 3. Draw the 2p orbital boxes for O (2p⁴) and for O²⁻. How many unpaired electrons does each have? Why is O²⁻ stable? 4. Write the electron configuration and count the unpaired electrons for Fe²⁺ and Fe³⁺. (Remove the 4s electrons first.) Extension: photoelectron spectroscopy (PES) as evidence for sublevels In PES a sample is hit with high-energy light and the energy needed to remove each electron is measured. Each peak is one sublevel; the height is the number of electrons in it. Peaks farther left need more energy (those electrons are closest to the nucleus). Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 19 Name: ______________________________ Date: ____________ Period: ______ 5. The PES for an unknown element shows three peaks with relative heights 2 : 2 : 1 (left to right). Which element is it? Write its configuration. 6. In the sodium spectrum, why is the 1s peak farthest to the left? 7. How many unpaired electrons does a ground-state atom of sulfur have? A) 0 B) 1 C) 2 D) 4 8. Which rule is broken if two electrons in the same orbital both point up? A) Aufbau B) Hund C) Pauli exclusion D) Dalton 9. Which element has exactly three unpaired electrons? A) Si B) P C) S D) Cl Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 20 Name: ______________________________ Date: ____________ Period: ______ TOPIC 2.4 Periodic Trends I: Ionization Energy & Atomic Radius Coulomb’s law • nuclear charge • distance • shielding BIG IDEA Almost every periodic trend comes from one idea: opposite charges attract. The nucleus (+) pulls on the electrons (−). How hard it pulls depends on how many protons, how far away the electron is, and how many other electrons are in the way. Key vocabulary — write each definition in your own words Term Definition (your words) Atomic radius How is it measured, and in what units? Ionization energy (IE) Does it take energy or release it? Effective nuclear charge (Zeff) Is it larger or smaller than the real nuclear charge? Shielding Which electrons do the shielding? Coulomb’s law What are the three factors? Example / sketch Coulomb’s law: the pull on an electron. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 21 Name: ______________________________ Date: ____________ Period: ______ THINK OF IT LIKE… A MAGNET AND A PAPERCLIP A paperclip held close to a magnet jumps to it. Move it a little farther away and the pull almost disappears (distance). Use a stronger magnet and the pull grows (nuclear charge). Put a thick book between them and the pull is weakened (shielding). An outer electron feels the nucleus exactly like that paperclip. The three factors — your own words CUES / KEY WORDS HOW DOES EACH FACTOR CHANGE THE PULL ON AN OUTER ELECTRON? Nuclear charge Distance Shielding Effective nuclear charge across period 3 Element Protons Core (inner) e⁻ Na 11 10 Mg 12 10 Al 13 10 Si 14 10 P 15 10 S 16 10 Cl 17 10 Ar 18 10 Zeff ≈ protons − core Valence e⁻ 1. What happens to the effective nuclear charge as you go left to right across a period? Does the number of energy levels change? Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 22 Name: ______________________________ Date: ____________ Period: ______ Atomic radius Radii shown are empirical atomic radii (pm); different sources give slightly different numbers but the same trends. 2. State the trend in atomic radius (a) across a period and (b) down a group. Write a full explanation (CER) CER FRAME Claim: what is the trend or the answer? Evidence: quote a fact, a number or a position on the table. Reasoning: use nuclear charge, distance and shielding (Coulomb’s law) to explain WHY. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 23 Name: ______________________________ Date: ____________ Period: ______ 3. Explain why a sodium atom is larger than a chlorine atom, using principles of atomic structure and Coulomb’s law. 4. Explain why a potassium atom is larger than a sodium atom, using Coulomb’s law. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 24 Name: ______________________________ Date: ____________ Period: ______ Bohr models: lithium and sodium Draw Bohr models for Li and Na. Show the correct number of electrons in each shell and circle the valence electron. 5. Using your models, explain which atom holds its valence electron more tightly. First ionization energy First ionization energy of elements 1–20. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 25 Name: ______________________________ Date: ____________ Period: ______ 6. Describe the overall pattern across a period and down a group in the graph. 7. Explain why the ionization energy drops sharply from neon to sodium. 8. Explain why helium has the largest first ionization energy of all the elements. Two small exceptions Look at the graph again: boron is slightly lower than beryllium, and oxygen is slightly lower than nitrogen. Use the configurations to explain one of them. 9. Explain why oxygen’s first IE is lower than nitrogen’s. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 26 Name: ______________________________ Date: ____________ Period: ______ Ranking practice Rank from lowest to highest Answer First ionization energy: Li, Be, B, N, O, F Atomic radius (smallest to largest): N, P, As, Sb, Bi, Mc Atomic radius (smallest to largest): Na, Mg, Al, Si, Cl First ionization energy (lowest to highest): Cs, K, Na, Li 10. For each ranking above, circle the ","id":4},{"kind":"file","unit":"Unit 2 - Electrons and Periodic Trends","type":"Notes","title":"Unit 2 - Electrons and Periodic Trends - TEACHER EDITION","file":"Unit 2 - Electrons and Periodic Trends - TEACHER EDITION.docx","path":"Units/Unit 2 - Electrons and Periodic Trends/Notes/Unit 2 - Electrons and Periodic Trends - TEACHER EDITION.docx","ext":"docx","size":341281,"teacher":true,"pdf":"_pdf/58160e719720.pdf","text":"TEACHER EDITION • ANSWER KEY & NOTES HONORS CHEMISTRY • UNIT 2 Electrons & Periodic Trends The arrangement of electrons explains the shape of the periodic table, why elements react the way they do, and every trend you will use for the rest of the course. TEACHER EDITION Everything in a light-gray box or cell is an answer or model response. Teacher notes (misconceptions, demo ideas, discussion prompts, sources) appear in the heavy-bordered boxes labeled TEACHER NOTE. The pages follow the student packet, so they line up closely. What we will learn 2.1 Bohr models & Lewis dot structures 2.2 The quantum mechanical model & electron configuration 2.3 Orbital diagrams (Aufbau, Pauli & Hund) 2.4 Periodic trends: ionization energy & atomic radius 2.5 Periodic trends: electronegativity & successive ionization energy ★ Extra practice & unit review By the end of this unit I can… • Explain how Bohr’s model improved on Rutherford’s, and use line spectra and flame tests as evidence for energy levels. • Draw Bohr models and Lewis dot structures and find valence electrons from a periodic table. • Write full and noble-gas shorthand electron configurations for atoms and ions. • Draw orbital diagrams that obey the Aufbau principle, the Pauli exclusion principle and Hund’s rule. • Use Coulomb’s law (nuclear charge, distance and shielding) to explain trends in ionization energy and atomic radius. • Explain the trend in electronegativity and use successive ionization energies to identify an element’s group. • Rank atoms and ions in order of radius, ionization energy and electronegativity and justify each ranking. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 1 TEACHER EDITION • ANSWER KEY & NOTES Unit at a glance (teacher) Topic Suggested pacing Depth the homework expects 2.1 Bohr & Lewis 1–2 days Bohr’s improvement over Rutherford; Bohr models (Na, C, Ar, Al, O, K); valence electrons; Lewis dots; identify elements from clues. 2.2 Configuration 2 days Full and shorthand configurations (Be, Mg, Ca, N, Cl, Mn, Cd, Sr, As, S, Al); identify the element; spot illegal configurations. 2.3 Orbital diagrams 1–2 days Orbital diagrams with Hund’s rule and Pauli; unpaired electrons; ions. 2.4 IE & radius 2 days Written explanations with Coulomb’s law (period and group); Bohr models of Li and Na; ranking lists; larger-atom pairs. 2.5 EN & successive IE 1–2 days Word bank fill-in; ranking radius and EN; F vs I ionization energy; why families behave similarly; left-to-right trends. TEACHER OVERVIEW Big picture. The homework asks students to explain trends “using principles of atomic structure and Coulomb’s law,” so every trend in this packet is built on three words: nuclear charge, distance, shielding. Insist that students name all three that apply. Misconceptions to watch for: • Electrons orbit the nucleus like planets (the quantum model has probability clouds). • Electrons in the same shell shield each other well (they don’t, which is why Zeff rises across a period). • “Atoms get bigger across a period because they have more electrons.” (Shells stay the same; the pull gets stronger.) • Writing 3d before 4s when asked for the ground-state filling order (accept either in final answers if the electron count is right; the homework uses energy order). • Confusing 1s² (superscript = electrons) with 1s₂. • Putting a second electron into an orbital before every orbital of the sublevel has one (Hund’s rule). IMAGES Image spots: figures from the homework (Bohr diagrams of Li and Na, the periodic table pages) fit in the framed IMAGE GOES HERE boxes. Everything else is drawn to print in black and white. TOPIC 2.1 Bohr Models & Lewis Dot Structures Energy levels • line spectra • valence electrons BIG IDEA Bohr proposed that electrons can only exist in certain energy levels (shells) around the nucleus, like steps on a staircase. Electrons jump between levels by absorbing or emitting exactly the right amount of energy. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 2 TEACHER EDITION • ANSWER KEY & NOTES Key vocabulary — write each definition in your own words Term Definition (your words) Example / sketch Energy level (shell) A region around the nucleus where electrons of a certain energy are found. Level 1 holds up to 2 e⁻, level 2 up to 8, level 3 up to 8 (for the first 20 elements). Na: 2, 8, 1 Valence electron An electron in the outermost energy level. These are the electrons that are lost, gained or shared in chemical reactions. Chlorine has 7 valence electrons. Core electron An electron in an inner energy level. Core electrons are held tightly and do not take part in bonding. Na has 10 core e⁻ and 1 valence e⁻. Emission spectrum The set of specific wavelengths of light an element gives off when its excited electrons fall back to lower energy levels. Every element has its own pattern. Hydrogen’s lines at 410, 434, 486 and 656 nm. Lewis dot structure A diagram showing an element’s symbol surrounded by dots, one dot for each valence electron. Magnesium: Mg with 2 dots. How did Bohr improve Rutherford’s model? CUES / KEY WORDS COMPARE THE TWO MODELS Rutherford Rutherford: a tiny dense nucleus with electrons somewhere outside it, but no rule for where; a moving electron should lose energy and spiral into the nucleus. Bohr Evidence Bohr: electrons move only in specific energy levels (shells) at set distances; they don’t lose energy while in a level; they absorb or emit energy only when jumping between levels. Evidence: element line spectra: if energy were not quantized atoms would give off a continuous rainbow, not separate lines. THINK OF IT LIKE… A STAIRCASE On a staircase you can stand on step 1 or step 2, but never in between. Electrons are the same: they can only be at certain energy levels. Moving up a step takes a specific amount of energy; moving down releases the same amount, as light. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 3 TEACHER EDITION • ANSWER KEY & NOTES LAB CORNER • Line spectra: the fingerprint of an element When hydrogen gas is heated or energized, it glows. A prism or diffraction grating spreads that light into a spectrum. Visible lines in the hydrogen spectrum An electron falls to a lower level 1. Why does hydrogen emit only a few separate lines and not a continuous rainbow of colors? Hydrogen’s electron can only be in certain energy levels. When it falls from a higher level to a lower one it releases a photon with exactly the energy difference between those levels, so only certain wavelengths of light are produced. 2. The line at 410 nm has a shorter wavelength than the line at 656 nm. Which line comes from the larger energy drop? Explain. The 410 nm line. Shorter wavelength means higher-energy light, so the electron fell through a larger energy gap. 3. What happens to an electron when an atom absorbs energy? What happens when it falls back? Absorbing energy moves the electron to a higher energy level (excited state). When it falls back to a lower level it gives off the energy as light. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 4 TEACHER EDITION • ANSWER KEY & NOTES LAB CORNER • Flame tests A student dips a clean wire loop into solutions of metal salts and holds it in a Bunsen burner flame. Each metal ion produces a different flame color. Metal ion in the salt Flame color observed Lithium (Li⁺) crimson red Sodium (Na⁺) bright yellow-orange Potassium (K⁺) pale lilac / violet Calcium (Ca²⁺) orange-red Copper (Cu²⁺) blue-green Barium (Ba²⁺) yellow-green 4. Explain, using electron energy levels, where the colored light in a flame test comes from and why each metal gives a different color. The heat excites the metal’s electrons to higher energy levels. When they fall back down they emit photons whose energies equal the gaps between levels. Each element has different energy levels, so each emits different wavelengths, which we see as different colors. 5. A student tests a white powder and sees a bright yellow-orange flame. What metal ion is most likely in the powder? Why isn’t flame color alone enough to be certain when the flame is orange-red? Sodium (Na⁺). Several metals (for example calcium and strontium) give similar red-orange flames that are hard to tell apart by eye, so a spectroscope (which shows each line separately) or other tests are needed. TEACHER NOTE Safety: wear goggles; use a wooden splint soaked in water or a nichrome wire cleaned in HCl. Sodium contamination makes every flame orange, which makes a good “why did my results look wrong?” discussion. Neon signs and fireworks are everyday uses of the same idea. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 5 TEACHER EDITION • ANSWER KEY & NOTES Drawing Bohr models BOHR MODEL RULES • The number in the nucleus = atomic number (protons). • Fill the shells closest to the nucleus first: 2 → 8 → 8 … (up to element 20). • The electrons in the last shell are the valence electrons. Draw the Bohr model for each element. Write the number of protons in the nucleus and place dots for electrons on the rings. Answers: Li 2-1, N 2-5, Mg 2-8-2 Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 6 TEACHER EDITION • ANSWER KEY & NOTES Answers: Cl 2-8-7, Ca 2-8-8-2, B 2-3 6. How do you find the number of valence electrons for an element using the periodic table? For main-group elements, the group number tells you: groups 1 and 2 have 1 and 2 valence electrons; for groups 13–18 subtract 10 from the group number (group 15 → 5, group 17 → 7). Helium is the exception (group 18, but only 2). You can also count the electrons in the outermost shell of the Bohr model. Group 1 2 13 14 15 16 17 18 Valence electrons 1 2 3 4 5 6 7 8 (He: 2) Lewis dot structures THINK OF IT LIKE… SEATS ON A SQUARE TABLE Put one dot on each side of the symbol (top, right, bottom, left) before you pair any up. This is like people sitting at a square table: everyone takes their own side first. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 7 TEACHER EDITION • ANSWER KEY & NOTES Draw the Lewis dot structure for each element. Answers Identify the element Clue Element Has 5 valence electrons and is in period 3. phosphorus (P) Has 7 valence electrons and its most abundant isotope has 18 neutrons. chlorine (Cl-35: 17 p⁺ + 18 n⁰) Has 8 valence electrons and is in period 2. neon (Ne) Has a Bohr model with 2, 8, 2 electrons in its shells. magnesium (Mg) WATCH OUT! Valence electrons are counted by the outermost shell, not by the total number of electrons. Sodium has 11 electrons but only 1 valence electron. [ IMAGE GOES HERE ] Optional: Bohr model diagrams from your Topic 2.1 homework (identify the elements) 7. An electron in an atom absorbs energy. What happens next? A) It moves to a lower energy level. B) It moves to a higher energy level. C) It leaves the nucleus. D) It becomes a proton. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 8 TEACHER EDITION • ANSWER KEY & NOTES TOPIC 2.2 The Quantum Mechanical Model & Electron Configuration Sublevels • orbitals • Aufbau order BIG IDEA Electrons don’t circle the nucleus like planets. They occupy orbitals, 3-D regions where an electron is most likely to be found. Orbitals are grouped into sublevels (s, p, d, f) inside each energy level. An electron configuration lists where every electron is. Key vocabulary — write each definition in your own words Term Definition (your words) Example / sketch Orbital A region of space where there is a high probability of finding an electron. Each orbital holds a maximum of 2 electrons. The 2p sublevel has three orbitals. Sublevel (s, p, d, f) A group of orbitals of the same shape and similar energy inside an energy level. s has 1 orbital (2 e⁻), p has 3 (6 e⁻), d has 5 (10 e⁻), f has 7 (14 e⁻). Energy level 3 has 3s, 3p and 3d. Electron configuration A shorthand that shows which energy levels and sublevels hold electrons. The big number is the energy level, the letter the sublevel, the superscript the number of electrons. O: 1s² 2s² 2p⁴ Aufbau principle Electrons fill the lowest-energy sublevel available before moving to a higher one (1s, 2s, 2p, 3s, 3p, 4s, 3d …). 4s fills before 3d. Noble gas shorthand A short way to write a configuration: put the symbol of Na: [Ne] 3s¹ the previous noble gas in brackets to stand for all the inner electrons, then write the rest. THINK OF IT LIKE… AN APARTMENT BUILDING The energy level is the floor of the building (n = 1, 2, 3 …). Each floor has different types of rooms (s, p, d, f). Each room is an orbital, and every room holds at most 2 people. People take the cheapest, lowest rooms first, and the building gets bigger as you go up (floor 1 has just an s room; floor 3 has s, p and d rooms). Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 9 TEACHER EDITION • ANSWER KEY & NOTES Sublevel Shape Number of orbitals Max electrons s sphere 1 2 p dumbbell 3 6 d clover-leaf (mostly) 5 10 f complex 7 14 Orbital shapes (not to scale). Relative energies of the sublevels. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 10 TEACHER EDITION • ANSWER KEY & NOTES The diagonal rule: follow each arrow from top right to bottom left. CUES / KEY WORDS WRITE THE FILLING ORDER FROM MEMORY (USE THE DIAGRAM AS A GUIDE) Aufbau 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p, 5s, 4d, 5p, 6s, 4f, 5d, 6p, 7s … Order The periodic table is a map of the filling order Blocks of the periodic table. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 11 TEACHER EDITION • ANSWER KEY & NOTES 1. Use the table above to explain why the periodic table has a block of 2 columns on the left, 6 on the right, and 10 in the middle. The widths match the maximum number of electrons each sublevel holds: s = 2, p = 6, d = 10 (and f = 14 in the rows pulled out below). The table’s shape comes from filling order. Worked examples WORKED EXAMPLE — FULL CONFIGURATION Write the electron configuration for nitrogen (7 electrons). 1. Fill 1s: 2 electrons (5 left). 2. Fill 2s: 2 electrons (3 left). 3. Put the last 3 electrons in 2p. 1s² 2s² 2p³ Check: 2 + 2 + 3 = 7 ✓ Answer: 1s2 2s2 2p3 WORKED EXAMPLE — SHORTHAND Write the noble gas shorthand for arsenic (As, 33 electrons). The previous noble gas is argon (18 e⁻), so start with [Ar]. The remaining 15 electrons fill, in order: 4s² (2), 3d¹⁰ (10), 4p³ (3). [Ar] 4s² 3d¹⁰ 4p³ Answer: [Ar] 4s2 3d10 4p3 WORKED EXAMPLE — IDENTIFY FROM THE CONFIGURATION Which element has the configuration 1s² 2s² 2p⁶ 3s² 3p⁴? Add the superscripts: 2 + 2 + 6 + 2 + 4 = 16 electrons. A neutral atom has 16 protons: sulfur (S). Valence electrons: the 3rd energy level has 2 + 4 = 6. Answer: sulfur (S) QUICK TRICKS • The period number is the highest energy level (n) in the configuration. • Valence electrons = electrons in the highest energy level (the s and p electrons of the outer shell). • Superscripts always add up to the atomic number (for a neutral atom). Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 12 TEACHER EDITION • ANSWER KEY & NOTES Practice: write the full configuration, then circle the valence electrons Element Electron configuration Valence e⁻ Be (Z = 4) 1s2 2s2 2 Mg (Z = 12) 1s2 2s2 2p6 3s2 2 Ca (Z = 20) 1s2 2s2 2p6 3s2 3p6 4s2 2 2. What do the configurations of Be, Mg and Ca have in common? Why does this make sense? Their outermost electrons are all ns² (2s², 3s², 4s²). They are in the same group (2) and have the same number of valence electrons, so they behave similarly. Element Electron configuration Valence e⁻ N (Z = 7) 1s2 2s2 2p3 5 Cl (Z = 17) 1s2 2s2 2p6 3s2 3p5 7 Mn (Z = 25) 1s2 2s2 2p6 3s2 3p6 4s2 3d5 2 Cd (Z = 48) 1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s2 4d10 2 TEACHER NOTE Mn is [Ar] 4s² 3d⁵ and Cd is [Kr] 5s² 4d¹⁰ in the energy-ordered form the homework uses. Some courses write the d before the s ([Ar] 3d⁵ 4s²); accept both when the electron counts are right. Valence electrons for transition metals are usually counted as the ns electrons (2 for Mn and Cd) in this course. Practice: noble gas shorthand Element Shorthand configuration Sr (Z = 38) [Kr] 5s2 As (Z = 33) [Ar] 4s2 3d10 4p3 S (Z = 16) [Ne] 3s2 3p4 Al (Z = 13) [Ne] 3s2 3p1 Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 13 TEACHER EDITION • ANSWER KEY & NOTES Practice: identify the element Configuration Element 1s² 2s² 2p⁶ 3s¹ sodium (Na) [Kr] 5s² 4d¹⁰ 5p³ antimony (Sb) 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹⁰ 4p⁶ 5s² 4d¹⁰ 5p³ antimony (Sb) (51 electrons) [Ne] 3s² 3p² silicon (Si) Find the error Each configuration below is for a neutral atom. Is it correct? If not, explain what is wrong and write the correct one. Configuration Correct? If not, fix it 1s² 2s² 2p⁶ 3s³ No. The 3s sublevel holds only 2 electrons. Na is 1s² 2s² 2p⁶ 3s¹. 1s² 2s² 2p⁷ No. The p sublevel holds a maximum of 6 electrons. For 11 electrons: 1s² 2s² 2p⁶ 3s¹. 1s² 2s¹ 2p⁵ No. 2s must fill before 2p (Aufbau). Fluorine is 1s² 2s² 2p⁵. (This one is an excited state.) [Ar] 4s² 3d¹⁰ 4p⁵ Yes — bromine (35 electrons). [Ar] 5s² 4d¹⁰ 5p⁵ No. The core must be [Kr] (36 e⁻) for 5s, 4d, 5p: iodine is [Kr] 5s² 4d¹⁰ 5p⁵. Configurations of ions CUES / KEY WORDS HOW DO YOU WRITE THE CONFIGURATION OF AN ION? Cations Cation (positive): remove electrons from the highest energy level first: Na [Ne]3s¹ → Na⁺ [Ne]. For transition metals remove the 4s electrons before 3d. Anions Isoelectronic Anion (negative): add electrons to the next open spots: O 2p⁴ → O²⁻ 2p⁶. Isoelectronic species have the same electron configuration: Na⁺, Ne and F⁻ are all 1s² 2s² 2p⁶. Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 14 TEACHER EDITION • ANSWER KEY & NOTES Ion Configuration Same configuration as which noble gas? Na⁺ 1s2 2s2 2p6 Ne O²⁻ 1s2 2s2 2p6 Ne Mg²⁺ 1s2 2s2 2p6 Ne Cl⁻ 1s2 2s2 2p6 3s2 3p6 Ar Ca²⁺ 1s2 2s2 2p6 3s2 3p6 Ar Al³⁺ 1s2 2s2 2p6 Ne REAL WORLD Atoms “want” a filled outer shell like a noble gas. That is why sodium readily forms Na⁺ and chlorine forms Cl⁻: they end up with the same stable configuration as neon and argon. This is the whole story of ionic bonding (Unit 9). TEACHER NOTE Extension (exceptions): chromium is [Ar] 4s¹ 3d⁵ and copper is [Ar] 4s¹ 3d¹⁰ because half-filled and completely filled d sublevels are especially stable. The homework doesn’t require this; mention it for AP-bound students. 3. How many electrons can the 3d sublevel hold? A) 2 B) 6 C) 10 D) 14 4. Which is the correct shorthand configuration for calcium? A) [Ne] 3s² B) [Ar] 4s² C) [Ar] 3d² D) [Kr] 4s² Honors Chemistry • Unit 2: Electrons and Periodic Trends • page 15 TEACHER EDITION • ANSWER KEY & NOTES TOPIC 2.3 Orbital Diagrams Aufbau • Pauli exclusion • Hund’s rule BIG IDEA An orbital diagram shows every orbital as a box and every electron as an arrow. It tells you more than a configuration: it shows which electrons are paired and which are unpaired, and that decides how an atom behaves in a magnetic field and in bonding. Key vocabulary — write each definition in your own words Term Definition (your words) Example / sketch Orbital A region of space around the nucleus (drawn as one box) where an electron is likely to be found. Each orbital holds a maximum of 2 electrons. The 2p sublevel has three orbitals. Pauli exclusion principle No two electrons in an atom can have the same set of ↑↓ is allowed; ↑↑ in one box is quantum numbers. In one orbital the two electrons must not. have opposite spins (one arrow up, one arrow down). Hund’s rule Electrons occupy the orbitals of a sublevel one at a time, all with the same spin, before any orbital gets a second electron. N: 2p has ↑ ↑ ↑, not ↑↓ ↑ _ Paired / unpaired electron A paired electron shares a box with an electron of opposite spin; an unpaired electron is alone in its box. Carbon has 2 unpaired electrons. Degenerate orbitals Orbitals that have exactly the same energy, such as the three 2p orbitals. 2px, 2py, 2pz THINK OF IT LIKE… SEATS ON A BUS Strangers boarding a bus take an empty double-seat to themselves before sittin","id":5},{"kind":"file","unit":"Unit 3 - Chemical Bonding","type":"Notes","title":"Unit 3 - Chemical Bonding - STUDENT NOTES","file":"Unit 3 - Chemical Bonding - STUDENT NOTES.docx","path":"Units/Unit 3 - Chemical Bonding/Notes/Unit 3 - Chemical Bonding - STUDENT NOTES.docx","ext":"docx","size":261861,"teacher":false,"pdf":"_pdf/e0c45ba2c3ee.pdf","text":"Name: ______________________________ Date: ____________ Period: ______ HONORS CHEMISTRY • UNIT 3 Chemical Bonding Why atoms stick together, how they share or trade electrons, and how the shape and polarity of a molecule decide how a substance behaves. HOW TO USE THIS PACKET Write definitions in your own words, draw every structure yourself and use the empty space for questions. LAB CORNER boxes are things you would see or do at a lab bench. The shape chart in 3.4 is the one page to keep for the rest of the year. What we will learn 3.1 Types of chemical bonds: ionic and covalent 3.2 Properties of ionic and covalent compounds 3.3 Lewis diagrams for ionic and covalent compounds 3.4 Lewis structures & VSEPR theory (shapes and angles) 3.5 Bond polarity & molecular polarity ★ Extra practice & unit review By the end of this unit I can… • Explain what a full octet is and how atoms reach one by losing, gaining or sharing electrons. • Predict whether a compound is ionic or covalent and describe the bond using metals/non-metals and electronegativity. • Connect bonding type to properties: melting point, state at room temperature and electrical conductivity. • Use Lewis dot diagrams to model ionic compounds and to draw Lewis structures for covalent molecules and polyatomic ions. • Compare single, double and triple bonds in terms of bond length and strength. • Use VSEPR theory to predict molecular shapes and bond angles. • Use electronegativity, bond dipoles and shape to decide whether a molecule is polar or non-polar. Honors Chemistry • Unit 3: Chemical Bonding • page 1 Name: ______________________________ Date: ____________ Period: ______ TOPIC 3.1 Types of Chemical Bonds Octet rule • ionic bonds • covalent bonds BIG IDEA Atoms bond to reach a full outer shell of 8 electrons (an octet; 2 for hydrogen and helium), the arrangement of the noble gases. They get there in one of two ways: transfer electrons (ionic bond) or share electrons (covalent bond). Key vocabulary — write each definition in your own words Term Definition (your words) Octet How many electrons? Which elements are the exception? Ionic bond Between what kinds of elements? What do the electrons do? Covalent bond Between what kinds of elements? What do the electrons do? Cation / anion Which one is formed by losing electrons? Molecule Is NaCl a molecule? Why or why not? Bond order (single / double / triple) How many electrons are shared? Example / sketch THINK OF IT LIKE… TRADING CARDS VS. SHARING A TOY An ionic bond is like a trade where one kid hands over a card for good and the two are now stuck together by the deal (opposite charges). A covalent bond is two kids sharing one toy: neither owns it outright, and the toy keeps them together. Honors Chemistry • Unit 3: Chemical Bonding • page 2 Name: ______________________________ Date: ____________ Period: ______ What does it mean to have a full octet? 1. In your own words, what is a full octet and why do atoms “want” one? Ionic bonds 2. Which type of element typically forms a cation, and does it give or take electrons? Which type forms an anion, and does it give or take electrons? CUES / KEY WORDS HOW A SODIUM ATOM AND A CHLORINE ATOM FORM AN IONIC BOND Metal Non-metal Why does the ion form? Honors Chemistry • Unit 3: Chemical Bonding • page 3 Name: ______________________________ Date: ____________ Period: ______ Predicting ion charges Use the periodic table. For each element: count the valence electrons, decide whether the atom loses or takes electrons, and give the ion’s charge. Element # of valence e⁻ Lose or take e⁻? Cation or anion? Ion charge Sodium Fluorine Aluminum Boron Nitrogen Sulfur QUICK RULE • Group 1 → 1+, Group 2 → 2+, Group 13 → 3+. • Group 15 → 3−, Group 16 → 2−, Group 17 → 1−. • Transition metals often form more than one charge (Fe²⁺ or Fe³⁺); you will see these in Unit 4. Covalent bonds 3. How is a covalent bond different from an ionic bond? Talk about the elements that form it and what happens to the electrons. 4. Some compounds contain single, double and triple bonds. What is the difference between them? Honors Chemistry • Unit 3: Chemical Bonding • page 4 Name: ______________________________ Date: ____________ Period: ______ Single, double and triple bonds. Ionic or covalent? SHORTCUT metal + non-metal → ionic non-metal + non-metal → covalent (If you are unsure, compare electronegativity: a difference larger than about 1.7 means ionic. See 3.5.) Compound 1st element: metal or non-metal? 2nd element: metal or non-metal? NO₂ MgBr₂ CaO PI₃ SO₂ CaI₂ More practice Ionic or covalent? KCl CCl₄ Li₃N H₂O Al₂O₃ CH₄ Honors Chemistry • Unit 3: Chemical Bonding • page 5 Ionic or covalent? Name: ______________________________ Date: ____________ Period: ______ More practice Ionic or covalent? NH₄Cl 5. An ionic bond forms when… A) two non-metals share electrons B) a metal transfers electrons to a non-metal C) two metals share electrons D) two noble gases attract 6. How many electrons are shared in a double bond? A) 2 B) 4 C) 6 D) 8 7. Which element is most likely to form a 2− ion? A) Na B) Cl C) O D) Mg 8. Which compound is covalent? A) MgO B) SO₂ C) KBr D) CaCl₂ Honors Chemistry • Unit 3: Chemical Bonding • page 6 Name: ______________________________ Date: ____________ Period: ______ TOPIC 3.2 Properties of Ionic and Covalent Compounds Melting point • state • conductivity • brittleness BIG IDEA The kind of bond decides how a substance behaves: ionic compounds are hard, brittle, high-melting solids that conduct only when their ions can move; covalent (molecular) compounds usually melt at low temperatures and do not conduct. Key vocabulary — write each definition in your own words Term Definition (your words) Crystal lattice What holds it together? Formula unit How is it different from a molecule? Melting point What are you overcoming when a solid melts? Electrical conductor What must be present? Electrolyte Is a sucrose solution an electrolyte? Example / sketch Honors Chemistry • Unit 3: Chemical Bonding • page 7 Name: ______________________________ Date: ____________ Period: ______ Melting points tell you about the bond The table lists data for six substances. Classify each as ionic or covalent, then answer the questions that follow. Substance Ionic or covalent? Melting point State at room temp. CaCl₂ 772 °C solid H₂O 0 °C liquid MgO 2852 °C solid NH₃ −77 °C gas SrO 2531 °C solid 146 °C solid H₂S C₆H₁₂O₆ 1. Some compounds have a large difference in melting point. Use the type of bond to explain why the ionic compounds melt at much higher temperatures. Honors Chemistry • Unit 3: Chemical Bonding • page 8 Name: ______________________________ Date: ____________ Period: ______ 2. Based on this trend, do you expect H₂S to have a high or low melting point? Explain using the bond found in H₂S. Why ionic crystals are brittle A hammer blow slides one layer of ions. 3. Explain why a salt crystal shatters when you hit it, while a metal bends. LAB CORNER • Conductivity testing A student uses a conductivity tester (two electrodes, a battery and a light bulb) to test substances. If current can flow through the sample, the bulb lights. A: solid NaCl B: molten NaCl Honors Chemistry • Unit 3: Chemical Bonding • page 9 Name: ______________________________ Date: ____________ Period: ______ C: NaCl dissolved in water D: sucrose dissolved in water [ IMAGE GOES HERE ] Optional: conductivity beakers from the homework 4. For a substance to conduct electricity, what must be present? 5. Which beakers should the student expect to light the bulb? Explain. 6. For the beakers you did not choose, explain why they do not conduct. Honors Chemistry • Unit 3: Chemical Bonding • page 10 Name: _______________________ nit 3: Chemical Bonding • page 12 Name: ______________________________ Date: ____________ Period: ______ Work it out here: Answer: __________________________________ Potassium oxide: two K⁺ for each O²⁻. Your turn Draw Lewis dot diagrams (with arrows and brackets) for each compound and write its formula. 1. Calcium oxide: calcium + oxygen Diagram and formula: Honors Chemistry • Unit 3: Chemical Bonding • page 13 Name: ______________________________ Date: ____________ Period: ______ 2. Lithium nitride: lithium + nitrogen. (The label on a bottle has worn off, but the student knows it contains lithium and nitrogen.) Diagram and formula: 3. Magnesium chloride: magnesium + chlorine. Diagram and formula: 4. Both K₂O and CaO contain oxygen. Explain why one formula has a subscript 2 and the other doesn’t. Covalent compounds: Lewis structures step by step STEPS 1. Count total valence electrons (add one electron for each negative charge; subtract one for each positive charge). 2. Skeleton: put the least electronegative atom in the middle (never H, never F). Connect the atoms with single bonds (2 e⁻ each). 3. Outer atoms first: add lone pairs to the outside atoms until each has 8 (H gets 2). 4. Leftover electrons go on the central atom. 5. If the central atom has fewer than 8, move a lone pair from an outer atom to make a double (or triple) bond. 6. Check: every atom has an octet (H has 2), and the electron count matches step 1. Honors Chemistry • Unit 3: Chemical Bonding • page 14 Name: ______________________________ Date: ____________ Period: ______ WORKED EXAMPLE — WATER Draw the Lewis structure of H₂O. Work it out here: Answer: __________________________________ WORKED EXAMPLE — CARBON DIOXIDE Draw the Lewis structure of CO₂. Work it out here: Answer: __________________________________ WORKED EXAMPLE — NITRATE ION Draw the Lewis structure of NO₃⁻. Work it out here: Answer: __________________________________ Honors Chemistry • Unit 3: Chemical Bonding • page 15 Name: ______ ectron domain What counts as one domain? Electron geometry Do lone pairs count? Molecular shape Do lone pairs count? Bond angle How is it measured? VSEPR theory Why do molecules have shapes? Example / sketch THINK OF IT LIKE… TIED-TOGETHER BALLOONS Tie 2 balloons together and they point in opposite directions (180°). Tie 3 and they make a flat triangle (120°). Four balloons form a tetrahedron (109.5°). Balloons are electron domains: they push each other apart as far as the knot allows. A fatter balloon (a lone pair, which takes more room than a bond) squeezes the others slightly closer. Honors Chemistry • Unit 3: Chemical Bonding • page 20 Name: ______________________________ Date: ____________ Period: ______ In your own words: what is the big idea of VSEPR? HOW TO NAME A SHAPE 1. Draw the Lewis structure. 2. Count the electron domains on the central atom (each bond, whether single, double or triple, counts once; each lone pair counts once). 3. Count how many of the domains are lone pairs (E). 4. Use the chart below: the number of domains gives the electron geometry; the lone pairs remove positions to give the molecular shape. Honors Chemistry • Unit 3: Chemical Bonding • page 21 Name: ______________________________ Date: ____________ Period: ______ The VSEPR chart (fill in the name and angle of every shape) A = central atom, X = bonded atoms, E = lone pairs. Write the shape name and the ideal angle in each box. Honors Chemistry • Unit 3: Chemical Bonding • page 22 Name: ______________________________ Date: ____________ Period: ______ Total domains Electron geometry Lone pairs (E) 2 0 3 0/1 4 0/1/2 5 0/1/2/3 6 0/1/2 Molecular shape Worked examples WORKED EXAMPLE — SHAPE OF NH₃ Give the Lewis structure, domains, shape and angle for NH₃. Work it out here: Answer: __________________________________ WORKED EXAMPLE — SHAPE OF CO₂ Give the shape and angle of CO₂. Work it out here: Answer: __________________________________ Honors Chemistry • Unit 3: Chemical Bonding • page 23 Name: ______________________________ Date: ____________ Period: ______ Practice: Lewis structure, shape and angle Draw each Lewis structure, then name the shape and the bond angle(s). Compound Lewis structure Shape NO₃⁻ OF₂ PF₅ CO₂ PH₃ SCl₆ Honors Chemistry • Unit 3: Chemical Bonding • page 24 Angle(s) Name: ______________________________ Date: ____________ Period: ______ Identify the shape and angle of each structure shown Domains on central atom Electron geometry Molecular shape (a) SO₂ (b) CH₄ (c) NH₄⁺ (d) BF₃ (e) XeF₂ (f) ClF₃ Honors Chemistry • Unit 3: Chemical Bonding • page 25 Angle Name: ______________________________ Date: ____________ Period: ______ Shape around each atom of a larger molecule Acetic acid (vinegar) has several “central” atoms. Name the shape and bond angle around each atom marked (a), (b) and (c). [ IMAGE GOES HERE ] Optional: the large molecule from the homework Atom Domains Shape Angle (a) the CH₃ carbon (b) the C=O carbon (c) the O–H oxygen 1. Why is the angle in H₂O (104.5°) smaller than the ideal tetrahedral angle of 109.5°? 2. Both CO₂ and SO₂ have three atoms, but one is linear and the other is bent. Explain the difference. Honors Chemistry • Unit 3: Chemical Bonding • page 26 Name: ______________________________ Date: ____________ Period: ______ 3. What is the shape of a molecule with 4 electron domains, 2 of which are lone pairs? A) linear B) bent C) trigonal pyramidal D) tetrahedral 4. PF₅ has what molecular shape? A) octahedral B) trigonal planar C) trigonal bipyramidal D) square planar 5. What is the approximate bond angle in CH₄? A) 90° B) 104.5° C) 109.5° D) 120° 6. Which species is trigonal planar? A) NH₃ B) BF₃ C) PCl₃ D) H₂O Honors Chemistry • Unit 3: Chemical Bonding • page 27 Name: ______________________________ Date: ____________ Period: ______ TOPIC 3.5 Bond Polarity & Molecular Polarity Electronegativity • dipoles • shape decides polarity BIG IDEA Electrons in a covalent bond are not always shared equally. The atom with the larger electronegativity pulls harder and becomes slightly negative. Whether the whole molecule is polar then depends on its shape: do the pulls add up or cancel? Key vocabulary — write each definition in your own words Term Definition (your words) Electronegativity Which element has the highest value? Polar covalent bond What is unequal about it? Non-polar covalent bond When does it happen? Dipole / partial charge (δ+, δ−) What does the arrow show? Polar molecule Two things that determine it? Example / sketch THINK OF IT LIKE… TUG-OF-WAR Two teams pull on a rope (the shared electrons). If the teams are equally strong the flag stays in the middle (nonpolar). If one team is stronger, the flag shifts toward them (polar). In a molecule with several teams pulling in different directions, it can still end in a draw: if three equal teams pull at 120° from each other, the flag doesn’t move (BF₃). Honors Chemistry • Unit 3: Chemical Bonding • page 28 Name: ______________________________ Date: ____________ Period: ______ Step 1: the bond RULE OF THUMB (ΔEN = DIFFERENCE IN ELECTRONEGATIVITY) ΔEN < 0.4 → non-polar covalent 0.4 ≤ ΔEN ≤ 1.7 → polar covalent ΔEN > 1.7 → ionic (electron is effectively transferred) Carbon–hydrogen bonds (ΔEN = 0.35) are treated as non-polar: do not draw an arrow for C–H. Order of the top four: F > O > Cl > N (then Br, I, S, C, H). Bond EN values H–H 2.20, 2.20 C–H 2.55, 2.20 C–Cl 2.55, 3.16 N–H 3.04, 2.20 O–H 3.44, 2.20 C–O 2.55, 3.44 Cl–F 3.16, 3.98 Mg–O 1.31, 3.44 Na–Cl 0.93, 3.16 ΔEN Bond type More electronegative atom 1. Draw a dipole arrow and label δ+ and δ− on each of these bonds: H–Cl, H–O, H–N, C–F, and explain why the C–H bond gets no arrow. Honors Chemistry • Unit 3: Chemical Bonding • page 29 Name: ______________________________ Date: ____________ Period: ______ Step 2: the molecule IS THE MOLECULE POLAR? 1. Draw the Lewis structure and decide on the shape (3.4). 2. Draw a dipole arrow on every polar bond. 3. Ask: do the arrows cancel? Are the polar bonds arranged symmetrically (equal arrows pointing in opposite directions)? 4. If they cancel → non-polar. If there is a net pull to one side (or any lone pair on the central atom or different atoms attached) → polar: label partial charges o","id":6},{"kind":"file","unit":"Unit 3 - Chemical Bonding","type":"Notes","title":"Unit 3 - Chemical Bonding - TEACHER EDITION","file":"Unit 3 - Chemical Bonding - TEACHER EDITION.docx","path":"Units/Unit 3 - Chemical Bonding/Notes/Unit 3 - Chemical Bonding - TEACHER EDITION.docx","ext":"docx","size":408118,"teacher":true,"pdf":"_pdf/d37ea9060827.pdf","text":"TEACHER EDITION • ANSWER KEY & NOTES HONORS CHEMISTRY • UNIT 3 Chemical Bonding Why atoms stick together, how they share or trade electrons, and how the shape and polarity of a molecule decide how a substance behaves. TEACHER EDITION Everything in a light-gray box or cell is an answer or model response. Teacher notes (misconceptions, demo ideas, discussion prompts, sources) appear in the heavy-bordered boxes labeled TEACHER NOTE. The pages follow the student packet, so they line up closely. What we will learn 3.1 Types of chemical bonds: ionic and covalent 3.2 Properties of ionic and covalent compounds 3.3 Lewis diagrams for ionic and covalent compounds 3.4 Lewis structures & VSEPR theory (shapes and angles) 3.5 Bond polarity & molecular polarity ★ Extra practice & unit review By the end of this unit I can… • Explain what a full octet is and how atoms reach one by losing, gaining or sharing electrons. • Predict whether a compound is ionic or covalent and describe the bond using metals/non-metals and electronegativity. • Connect bonding type to properties: melting point, state at room temperature and electrical conductivity. • Use Lewis dot diagrams to model ionic compounds and to draw Lewis structures for covalent molecules and polyatomic ions. • Compare single, double and triple bonds in terms of bond length and strength. • Use VSEPR theory to predict molecular shapes and bond angles. • Use electronegativity, bond dipoles and shape to decide whether a molecule is polar or non-polar. Honors Chemistry • Unit 3: Chemical Bonding • page 1 TEACHER EDITION • ANSWER KEY & NOTES Unit at a glance (teacher) Topic Suggested pacing Depth the homework expects 3.1 Types of bonds 1 day Octet; metal/non-metal and cation/anion table (Na, F, Al, B, N, S); ionic vs covalent classification (NO₂, MgBr₂, CaO, PI₃, SO₂, CaI₂); single/double/triple. 3.2 Properties 1–2 days Melting points of ionic vs covalent; explain with the bond; conductivity of solids, melts and solutions; predict H₂S. 3.3 Lewis diagrams 2 days Lewis dot models of K₂O, CaO and Li₃N; formulas from electron transfer; C–C, C=C, C≡C bond length and attraction. 3.4 VSEPR 2–3 days Explain VSEPR in own words; Lewis structure + shape + angle for NO₃⁻, OF₂, PF₅, CO₂, PH₃, SCl₆; shape around each atom of a large molecule. 3.5 Polarity 2 days Arrows toward the more electronegative atom, C–H not polar, EN order F > O > Cl > N; polar or non-polar and partial charges. TEACHER OVERVIEW Big picture. Bonding connects Unit 2 (electron configurations, electronegativity) to everything that follows: intermolecular forces, reactions, solutions. Students should be able to go from a formula → bond type → Lewis structure → shape → polarity → properties in one chain. Misconceptions to watch for: • “Ionic bonds are just attractions between two atoms.” (They are attractions among many ions in a lattice; there is no ionic molecule.) • “Covalent bonds are weaker than ionic.” (Compare *intramolecular* covalent bonds with *intermolecular* forces: covalent compounds melt at low temperatures because of weak forces BETWEEN molecules, not because the covalent bond itself is weak.) • Calling the formula of an ionic compound a “molecule” (use formula unit). • “Polar bonds always make polar molecules.” (CO₂ and CCl₄ cancel.) • Counting lone pairs as bonds when naming the shape (shape names only the atoms; the electron-pair geometry counts everything). • Putting the ion charge on the wrong side of the bracket, or forgetting the brackets around a polyatomic ion. IMAGES All structures in this packet are drawn to print in black and white. Spots marked IMAGE GOES HERE are for the homework figures (the conductivity beakers in 3.2 and the large molecule in 3.4). TOPIC 3.1 Types of Chemical Bonds Octet rule • ionic bonds • covalent bonds BIG IDEA Atoms bond to reach a full outer shell of 8 electrons (an octet; 2 for hydrogen and helium), the arrangement of the noble gases. They get there in one of two ways: transfer electrons (ionic bond) or share electrons (covalent bond). Honors Chemistry • Unit 3: Chemical Bonding • page 2 TEACHER EDITION • ANSWER KEY & NOTES Key vocabulary — write each definition in your own words Term Definition (your words) Example / sketch Octet A full outer energy level of 8 valence electrons (s²p⁶). Atoms bond to obtain one. Hydrogen and helium are full with 2. Neon: 2s² 2p⁶ Ionic bond The electrostatic attraction between a positive cation and a negative anion, formed when a metal transfers electrons to a non-metal. Na⁺ and Cl⁻ in NaCl Covalent bond A bond formed when two non-metal atoms share one or more pairs of electrons. H–H in H₂ Cation / anion A cation is a positive ion (an atom that lost electrons); an anion is a negative ion (an atom that gained electrons). Mg²⁺, Cl⁻ Molecule A neutral group of two or more non-metal atoms held together by covalent bonds. Ionic compounds are NOT molecules; they are lattices described by a formula unit. H₂O, CO₂ Bond order (single / double / triple) The number of shared pairs between two atoms: single = O=O is a double bond 1 pair (2 e⁻), double = 2 pairs (4 e⁻), triple = 3 pairs (6 e⁻). THINK OF IT LIKE… TRADING CARDS VS. SHARING A TOY An ionic bond is like a trade where one kid hands over a card for good and the two are now stuck together by the deal (opposite charges). A covalent bond is two kids sharing one toy: neither owns it outright, and the toy keeps them together. What does it mean to have a full octet? 1. In your own words, what is a full octet and why do atoms “want” one? An atom has a full octet when its outer energy level holds 8 valence electrons, the same stable arrangement as a noble gas (s²p⁶). A full outer shell is a lower-energy, more stable arrangement, so atoms lose, gain or share electrons to reach it. Ionic bonds 2. Which type of element typically forms a cation, and does it give or take electrons? Which type forms an anion, and does it give or take electrons? Metals form cations by giving away (losing) their few valence electrons. Non-metals form anions by taking (gaining) electrons to complete the octet. Honors Chemistry • Unit 3: Chemical Bonding • page 3 TEACHER EDITION • ANSWER KEY & NOTES CUES / KEY WORDS HOW A SODIUM ATOM AND A CHLORINE ATOM FORM AN IONIC BOND Na ([Ne] 3s¹) has 1 valence electron; losing it leaves [Ne], a full octet, so Na → Na⁺. Cl ([Ne] 3s² 3p⁵) has 7 valence electrons; gaining 1 makes [Ar], so Cl → Cl⁻. The electron moves from Na to Cl and the two opposite ions attract each other: an ionic bond. Metal Non-metal Why does the ion form? Predicting ion charges Use the periodic table. For each element: count the valence electrons, decide whether the atom loses or takes electrons, and give the ion’s charge. Element # of valence e⁻ Lose or take e⁻? Cation or anion? Ion charge Sodium 1 lose 1 cation 1+ Fluorine 7 take 1 anion 1− Aluminum 3 lose 3 cation 3+ Boron 3 lose 3 cation 3+ Nitrogen 5 take 3 anion 3− Sulfur 6 take 2 anion 2− TEACHER NOTE Boron is a metalloid and forms covalent compounds almost exclusively; the homework asks for the “textbook” ion (B³⁺). Mention that B³⁺ is rare in real life. Rule of thumb for students: groups 1, 2, 13 → 1+, 2+, 3+; groups 15, 16, 17 → 3−, 2−, 1−. QUICK RULE • Group 1 → 1+, Group 2 → 2+, Group 13 → 3+. • Group 15 → 3−, Group 16 → 2−, Group 17 → 1−. • Transition metals often form more than one charge (Fe²⁺ or Fe³⁺); you will see these in Unit 4. Covalent bonds 3. How is a covalent bond different from an ionic bond? Talk about the elements that form it and what happens to the electrons. A covalent bond forms between two non-metal atoms that SHARE electrons so that each atom counts the shared pair toward its own octet. An ionic bond forms between a metal and a non-metal; electrons are TRANSFERRED completely, creating ions that attract. Honors Chemistry • Unit 3: Chemical Bonding • page 4 TEACHER EDITION • ANSWER KEY & NOTES 4. Some compounds contain single, double and triple bonds. What is the difference between them? They differ in the number of shared electron pairs: a single bond shares 1 pair (2 e⁻), a double bond shares 2 pairs (4 e⁻), a triple bond shares 3 pairs (6 e⁻). More shared pairs means a shorter, stronger bond. Single, double and triple bonds. Ionic or covalent? SHORTCUT metal + non-metal → ionic non-metal + non-metal → covalent (If you are unsure, compare electronegativity: a difference larger than about 1.7 means ionic. See 3.5.) Compound 1st element: metal or non-metal? 2nd element: metal or non-metal? Ionic or covalent? NO₂ non-metal non-metal covalent MgBr₂ metal non-metal ionic CaO metal non-metal ionic PI₃ non-metal non-metal covalent SO₂ non-metal non-metal covalent CaI₂ metal non-metal ionic More practice Ionic or covalent? KCl ionic CCl₄ covalent Li₃N ionic H₂O covalent Al₂O₃ ionic Honors Chemistry • Unit 3: Chemical Bonding • page 5 TEACHER EDITION • ANSWER KEY & NOTES More practice Ionic or covalent? CH₄ covalent NH₄Cl ionic (contains the polyatomic ion NH₄⁺; covalent bonds inside the ion, ionic bond between the ions) 5. An ionic bond forms when… A) two non-metals share electrons B) a metal transfers electrons to a non-metal C) two metals share electrons D) two noble gases attract 6. How many electrons are shared in a double bond? A) 2 B) 4 C) 6 D) 8 7. Which element is most likely to form a 2− ion? A) Na B) Cl C) O D) Mg 8. Which compound is covalent? A) MgO B) SO₂ C) KBr D) CaCl₂ Honors Chemistry • Unit 3: Chemical Bonding • page 6 TEACHER EDITION • ANSWER KEY & NOTES TOPIC 3.2 Properties of Ionic and Covalent Compounds Melting point • state • conductivity • brittleness BIG IDEA The kind of bond decides how a substance behaves: ionic compounds are hard, brittle, high-melting solids that conduct only when their ions can move; covalent (molecular) compounds usually melt at low temperatures and do not conduct. Key vocabulary — write each definition in your own words Term Definition (your words) Example / sketch Crystal lattice A repeating three-dimensional pattern of alternating cations and anions held together by strong attractions in every direction. NaCl crystal Formula unit The simplest whole-number ratio of ions in an ionic compound; it is NOT a separate particle. NaCl, MgBr₂ Melting point The temperature at which a solid becomes a liquid; you must overcome the forces holding the particles in place. Ice: 0 °C Electrical conductor A substance that carries electric current. It needs charged particles (ions or electrons) that are free to move. Molten NaCl, copper wire Electrolyte A substance that forms ions when dissolved in water so the solution conducts electricity. NaCl(aq) yes; C₆H₁₂O₆(aq) no Honors Chemistry • Unit 3: Chemical Bonding • page 7 TEACHER EDITION • ANSWER KEY & NOTES Melting points tell you about the bond The table lists data for six substances. Classify each as ionic or covalent, then answer the questions that follow. Substance Ionic or covalent? Melting point State at room temp. CaCl₂ ionic 772 °C solid H₂O covalent 0 °C liquid MgO ionic 2852 °C solid NH₃ covalent −77 °C gas SrO ionic 2531 °C solid H₂S covalent low (about −86 °C) gas C₆H₁₂O₆ covalent 146 °C solid 1. Some compounds have a large difference in melting point. Use the type of bond to explain why the ionic compounds melt at much higher temperatures. Ionic compounds are made of a lattice of cations and anions held by very strong electrostatic attractions in all directions; a lot of energy (heat) is needed to pull the ions apart. Covalent compounds are separate molecules: melting only requires overcoming the weak attractions BETWEEN molecules (intermolecular forces), not the covalent bonds inside them, so they melt at much lower temperatures. Honors Chemistry • Unit 3: Chemical Bonding • page 8 TEACHER EDITION • ANSWER KEY & NOTES 2. Based on this trend, do you expect H₂S to have a high or low melting point? Explain using the bond found in H₂S. Low (actual: −86 °C). H₂S is covalent (two non-metals); it exists as separate molecules held together by weak intermolecular forces, so little energy is needed to separate them. TEACHER NOTE — MELTING POINTS Be explicit about the word choice: students often write “covalent bonds are weak.” Correct it to “the forces between covalent molecules are weak.” Glucose (146 °C) is a good example of a covalent solid that melts higher than H₂O because it is a bigger molecule with more hydrogen bonding (preview of Unit 8/IMF). Diamond and quartz (network covalent) are the exceptions; mention them but don’t test them. Why ionic crystals are brittle A hammer blow slides one layer of ions. 3. Explain why a salt crystal shatters when you hit it, while a metal bends. Hitting the crystal shifts one layer of ions by one position, so ions of the same charge line up and repel; the crystal splits. In a metal the electrons are shared among all atoms so layers can slide without repulsion. LAB CORNER • Conductivity testing A student uses a conductivity tester (two electrodes, a battery and a light bulb) to test substances. If current can flow through the sample, the bulb lights. A: solid NaCl B: molten NaCl Honors Chemistry • Unit 3: Chemical Bonding • page 9 TEACHER EDITION • ANSWER KEY & NOTES C: NaCl dissolved in water D: sucrose dissolved in water [ IMAGE GOES HERE ] Optional: conductivity beakers from the homework 4. For a substance to conduct electricity, what must be present? Charged particles (ions or free electrons) that are free to move. 5. Which beakers should the student expect to light the bulb? Explain. B and C. In molten NaCl and in NaCl solution the Na⁺ and Cl⁻ ions are free to move and carry the current between the electrodes. 6. For the beakers you did not choose, explain why they do not conduct. A: the ions are locked in fixed positions in the lattice, so they can’t move. D: sucrose is a covalent compound that dissolves as neutral molecules, so there are no ions in the solution to carry a charge. 7. Predict: would distilled water light the bulb? Would tap water? Explain. Distilled water: almost no ions, so no (or a very dim bulb). Tap water has a few dissolved ions (Ca²⁺, Mg²⁺, Cl⁻, …) so it conducts weakly. This is why you should not use electrical devices in water. TEACHER NOTE — LAB IDEAS Lab version: use 9 V battery + LED/bulb conductivity tester; test solid NaCl, tap water, distilled water, NaCl(aq), sucrose(aq), dilute HC₂H₃O₂(aq), KNO₃(aq) and ethanol. Have students predict first. Molten NaCl is a demonstration only (801 °C) — use a video. Safety: goggles; rinse electrodes between tests with distilled water. Honors Chemistry • Unit 3: Chemical Bonding • page 10 TEACHER EDITION • ANSWER KEY & NOTES Property Ionic compounds Covalent (molecular) compounds Particles cations and anions in a lattice neutral molecules Melting / boiling point high low State at room temp. solid solid, liquid or gas Conducts as a solid? no no Conducts when molten or dissolved? yes (ions move) no (no ions) Hardness hard but brittle often soft 8. Which substance would conduct electricity when melted but not as a solid? A) C₆H₁₂O₆ B) MgO C) H₂O D) NH₃ 9. Why does CaCl₂ have a much higher melting point than H₂O? A) covalent bonds are stronger B) ionic attractions among many ions are strong C) water has no bonds D) CaCl₂ is a gas 10. Which of these solutions does NOT conduct electricity? A) KBr(aq) B) NaOH(aq) C) C₁₂H₂₂O₁₁(aq) D) HCl(aq) Honors Chemistry • Unit 3: Chemical Bonding • page 11 TEACHER EDITION • ANSWER KEY & NOTES TOPIC 3.3 Lewis Diagrams for Ionic and Covalent Compounds Electron transfer • shared pairs • bond length BIG IDEA A Lewis diagram is a bookkeeping tool for valence electrons. For ionic compounds it shows electrons moving from metal to non-metal; for covalent compounds it shows shared pairs (bonds) and lone pairs. Key vocabulary — write each definition in your own words Term Definition (your words) Example / sketch Lewis dot diagram (atom) The element symbol surrounded by one dot per valence electron. O has 6 dots; Na has 1. Bonding pair A pair of electrons shared between two atoms; drawn as a line between the atoms. H–H Lone pair A pair of valence electrons on one atom that is not shared in a bond; drawn as two dots. Water’s oxygen has two lone pairs. Formula unit (ionic) The lowest whole-number ratio of cations to anions that makes the total charge zero. K₂O: 2 K⁺ for 1 O²⁻ Bond length The distance between the nuclei of two bonded atoms; more shared pairs pull the nuclei closer. C≡C is shorter than C–C. Ionic compounds: show the electron transfer STEPS 1. Draw each atom with its valence electrons as dots. 2. Draw an arrow from each metal to the non-metal for every electron transferred. 3. Draw the ions in brackets: the cation shows NO dots (its outer shell is gone); the anion shows 8 dots. 4. Write the charge outside the bracket, and use as many metal atoms as it takes so that the electrons given = electrons taken. WORKED EXAMPLE — POTASSIUM OXIDE Use Lewis dot diagrams to show why potassium oxide is K₂O. Honors Chemistry • Unit 3: Chemical Bonding • page 12 TEACHER EDITION • ANSWER KEY & NOTES K has 1 valence electron; O needs 2 more to reach 8. One K can supply only 1 electron, so two K atoms give one electron each to one O atom. Result: 2 K⁺ and 1 O²⁻ → charges 2(+1) + (−2) = 0 → K₂O. Answer: K₂O Potassium oxide: two K⁺ for each O²⁻. Your turn Draw Lewis dot diagrams (with arrows and brackets) for each compound and write its formula. 1. Calcium oxide: calcium + oxygen Ca has 2 valence electrons; O needs 2. One Ca gives 2 e⁻ to one O → Ca²⁺ and O²⁻ → CaO (1:1 ratio). Honors Chemistry • Unit 3: Chemical Bonding • page 13 TEACHER EDITION • ANSWER KEY & NOTES Answer: CaO. 2. Lithium nitride: lithium + nitrogen. (The label on a bottle has worn off, but the student knows it contains lithium and nitrogen.) Li has 1 valence electron; N needs 3. Three Li atoms each give 1 e⁻ to one N atom → 3 Li⁺ and N³⁻ → Li₃N. Answer: Li₃N. Honors Chemistry • Unit 3: Chemical Bonding • page 14 TEACHER EDITION • ANSWER KEY & NOTES 3. Magnesium chloride: magnesium + chlorine. Mg has 2 valence electrons; each Cl needs only 1. One Mg gives one e⁻ to each of two Cl atoms → Mg²⁺ + 2 Cl⁻ → MgCl₂. Answer: MgCl₂. 4. Both K₂O and CaO contain oxygen. Explain why one formula has a subscript 2 and the other doesn’t. Potassium loses 1 electron (K⁺) and oxygen needs 2, so two potassium atoms are needed for each O. Calcium loses 2 electrons (Ca²⁺), exactly what one oxygen needs, so the ratio is 1:1. TEACHER NOTE Crisscross shortcut (preview of Unit 4 naming): K⁺ and O²⁻ → K₂O¹; Ca²⁺ and O²⁻ → Ca₂O₂ → reduce to CaO. Make sure students can justify the formula with electrons first. Covalent compounds: Lewis structures step by step STEPS 1. Count total valence electrons (add one electron for each negative charge; subtract one for each positive charge). 2. Skeleton: put the least electronegative atom in the middle (never H, never F). Connect the atoms with single bonds (2 e⁻ each). 3. Outer atoms first: add lone pairs to the outside atoms until each has 8 (H gets 2). 4. Leftover electrons go on the central atom. 5. If the central atom has fewer than 8, move a lone pair from an outer atom to make a double (or triple) bond. 6. Check: every atom has an octet (H has 2), and the electron count matches step 1. Honors Chemistry • Unit 3: Chemical Bonding • pag
