he most s character, holding the lone pair closest to the nucleus."}, {"k": "quiz", "id": "Q16", "title": "Quiz Q16 · Orbitals", "tag": "Orbitals", "sub": "Direct", "text": "Q16 Orbitals Direct Which of these anions is the strongest base? The charge is on carbon in all three, with no resonance or induction. The orbital differs: the alkyl anion has the charge in an sp³ orbital (highest energy, least stable, strongest base). The alkynide is in an sp orbital (most stable, weakest base). All three are equally basic because the charge is on carbon in each", "img": "", "q": "Which of these anions is the strongest base?", "opts": [{"type": "img", "value": "organic-chemistry/acids-bases/img/q16_A.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q16_B.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q16_C.png"}, {"type": "text", "value": "All three are equally basic because the charge is on carbon in each"}], "a": "C", "why": "The charge is on carbon in all three, with no resonance or induction. The orbital differs: the alkyl anion has the charge in an sp³ orbital (highest energy, least stable, strongest base). The alkynide is in an sp orbital (most stable, weakest base)."}, {"k": "quiz", "id": "Q17", "title": "Quiz Q17 · Orbitals", "tag": "Orbitals", "sub": "Direct", "text": "Q17 Orbitals Direct A terminal alkyne C–H is more acidic than an alkene C–H. Which statement best explains why? This is factor 4 (orbitals). An sp orbital is 50% s character, which is closer to the nucleus than the 33% s character of an sp² orbital, so the lone pair in an sp orbital is lower in energy. The sp carbon has more p character, so it is more electronegative The electron pair in the sp orbital is held closer to the nucleus, so the alkynide ion is more stable The alkynide ion has resonance structures that spread out the charge The triple bond withdraws electron density from the C–H bond by induction", "img": "", "q": "A terminal alkyne C–H is more acidic than an alkene C–H. Which statement best explains why?", "opts": [{"type": "text", "value": "The sp carbon has more p character, so it is more electronegative"}, {"type": "text", "value": "The electron pair in the sp orbital is held closer to the nucleus, so the alkynide ion is more stable"}, {"type": "text", "value": "The alkynide ion has resonance structures that spread out the charge"}, {"type": "text", "value": "The triple bond withdraws electron density from the C–H bond by induction"}], "a": "B", "why": "This is factor 4 (orbitals). An sp orbital is 50% s character, which is closer to the nucleus than the 33% s character of an sp² orbital, so the lone pair in an sp orbital is lower in energy."}, {"k": "quiz", "id": "Q18", "title": "Quiz Q18 · Competing factors", "tag": "Competing factors", "sub": "Challenge", "text": "Q18 Competing factors Challenge Which of the labeled hydrogens is more acidic? Propene's CH₃ gives a resonance-stabilized allyl anion, but the charge is on carbon. Ethoxide has the charge on O. The atom (factor 1) takes priority over resonance (factor 2). H₂ in II (propene), because the allyl anion is resonance stabilized H₂ in II (propene), because the carbon is sp² hybridized They are about equal H₁ in I (ethanol), because the atom (O vs. C) outranks resonance", "img": "organic-chemistry/acids-bases/img/q18.png", "q": "Which of the labeled hydrogens is more acidic?", "opts": [{"type": "text", "value": "H₂ in II (propene), because the allyl anion is resonance stabilized"}, {"type": "text", "value": "H₂ in II (propene), because the carbon is sp² hybridized"}, {"type": "text", "value": "They are about equal"}, {"type": "text", "value": "H₁ in I (ethanol), because the atom (O vs. C) outranks resonance"}], "a": "D", "why": "Propene's CH₃ gives a resonance-stabilized allyl anion, but the charge is on carbon. Ethoxide has the charge on O. The atom (factor 1) takes priority over resonance (factor 2)."}, {"k": "quiz", "id": "Q19", "title": "Quiz Q19 · Competing factors", "tag": "Competing factors", "sub": "Challenge", "text": "Q19 Competing factors Challenge Which labeled hydrogen is the most acidic? Both put the charge on O, so factor 1 ties. The carboxylate is resonance stabilized (factor 2); the alkoxide only has the inductive effect of CF₃ (factor 3). Resonance beats induction. H₁, because resonance outranks induction H₂, because the CF₃ group stabilizes the alkoxide by induction H₂, because alcohols are more acidic than carboxylic acids They are equally acidic", "img": "organic-chemistry/acids-bases/img/q19.png", "q": "Which labeled hydrogen is the most acidic?", "opts": [{"type": "text", "value": "H₁, because resonance outranks induction"}, {"type": "text", "value": "H₂, because the CF₃ group stabilizes the alkoxide by induction"}, {"type": "text", "value": "H₂, because alcohols are more acidic than carboxylic acids"}, {"type": "text", "value": "They are equally acidic"}], "a": "A", "why": "Both put the charge on O, so factor 1 ties. The carboxylate is resonance stabilized (factor 2); the alkoxide only has the inductive effect of CF₃ (factor 3). Resonance beats induction."}, {"k": "quiz", "id": "Q20", "title": "Quiz Q20 · Competing factors", "tag": "Competing factors", "sub": "Challenge", "text": "Q20 Competing factors Challenge Which labeled hydrogen is more acidic? H₁ gives a carbanion on an sp carbon; H₂ gives an alkoxide. Atom comes before orbital: O⁻ is more stable than C⁻ even in an sp orbital. H₁, because an sp carbanion is the most stable H₁, because the alkynide ion is resonance stabilized H₂, because the atom (O vs. C) outranks the orbital They are about equal", "img": "organic-chemistry/acids-bases/img/q20.png", "q": "Which labeled hydrogen is more acidic?", "opts": [{"type": "text", "value": "H₁, because an sp carbanion is the most stable"}, {"type": "text", "value": "H₁, because the alkynide ion is resonance stabilized"}, {"type": "text", "value": "H₂, because the atom (O vs. C) outranks the orbital"}, {"type": "text", "value": "They are about equal"}], "a": "C", "why": "H₁ gives a carbanion on an sp carbon; H₂ gives an alkoxide. Atom comes before orbital: O⁻ is more stable than C⁻ even in an sp orbital."}, {"k": "quiz", "id": "Q21", "title": "Quiz Q21 · Competing factors", "tag": "Competing factors", "sub": "Challenge", "text": "Q21 Competing factors Challenge Rank these from LEAST acidic to MOST acidic. All three have the charge on O. III is resonance stabilized (factor 2), the strongest effect here. II has the inductive effect of three F atoms (factor 3), and I has neither. III < II < I II < I < III I < III < II I < II < III", "img": "organic-chemistry/acids-bases/img/q21.png", "q": "Rank these from LEAST acidic to MOST acidic.", "opts": [{"type": "text", "value": "III < II < I"}, {"type": "text", "value": "II < I < III"}, {"type": "text", "value": "I < III < II"}, {"type": "text", "value": "I < II < III"}], "a": "D", "why": "All three have the charge on O. III is resonance stabilized (factor 2), the strongest effect here. II has the inductive effect of three F atoms (factor 3), and I has neither."}, {"k": "quiz", "id": "Q22", "title": "Quiz Q22 · Competing factors", "tag": "Competing factors", "sub": "Two-factor", "text": "Q22 Competing factors Two-factor Aspirin is shown. Which labeled hydrogen is the most acidic? H₁ puts the charge on O (factor 1) and the carboxylate is resonance stabilized. H₂ and H₃ put the charge on carbon, which loses on factor 1. H₂ (the aromatic C–H) H₁ (the carboxylic acid O–H) H₃ (the CH₃ on the acetyl group) All three are about equally acidic", "img": "organic-chemistry/acids-bases/img/q22.png", "q": "Aspirin is shown. Which labeled hydrogen is the most acidic?", "opts": [{"type": "text", "value": "H₂ (the aromatic C–H)"}, {"type": "text", "value": "H₁ (the carboxylic acid O–H)"}, {"type": "text", "value": "H₃ (the CH₃ on the acetyl group)"}, {"type": "text", "value": "All three are about equally acidic"}], "a": "B", "why": "H₁ puts the charge on O (factor 1) and the carboxylate is resonance stabilized. H₂ and H₃ put the charge on carbon, which loses on factor 1."}, {"k": "quiz", "id": "Q23", "title": "Quiz Q23 · Equilibrium", "tag": "Equilibrium", "sub": "Two-factor", "text": "Q23 Equilibrium Two-factor Which side of the equilibrium is favored? The equilibrium favors the more stable ion. Both anions have O⁻, so compare resonance: acetate is delocalized over two O atoms, ethoxide is not. Acetate is the weaker base, so the products are favored. The products, because acetate is resonance stabilized and is the more stable anion The reactants, because ethoxide is more stable Neither side, because both anions have the charge on O The products, because ethanol is a stronger acid than acetic acid", "img": "organic-chemistry/acids-bases/img/q23.png", "q": "Which side of the equilibrium is favored?", "opts": [{"type": "text", "value": "The products, because acetate is resonance stabilized and is the more stable anion"}, {"type": "text", "value": "The reactants, because ethoxide is more stable"}, {"type": "text", "value": "Neither side, because both anions have the charge on O"}, {"type": "text", "value": "The products, because ethanol is a stronger acid than acetic acid"}], "a": "A", "why": "The equilibrium favors the more stable ion. Both anions have O⁻, so compare resonance: acetate is delocalized over two O atoms, ethoxide is not. Acetate is the weaker base, so the products are favored."}, {"k": "quiz", "id": "Q24", "title": "Quiz Q24 · Equilibrium", "tag": "Equilibrium", "sub": "Two-factor", "text": "Q24 Equilibrium Two-factor Which side of the equilibrium is favored? Compare HO⁻ with RS⁻. O and S are in the same column, so size decides. The larger RS⁻ is more stable (weaker base), so the equilibrium favors the products. The reactants, because O is more electronegative than S Neither side, because O and S are both in group 16 The reactants, because hydroxide is the smaller anion The products, because the larger S atom stabilizes the charge better", "img": "organic-chemistry/acids-bases/img/q24.png", "q": "Which side of the equilibrium is favored?", "opts": [{"type": "text", "value": "The reactants, because O is more electronegative than S"}, {"type": "text", "value": "Neither side, because O and S are both in group 16"}, {"type": "text", "value": "The reactants, because hydroxide is the smaller anion"}, {"type": "text", "value": "The products, because the larger S atom stabilizes the charge better"}], "a": "D", "why": "Compare HO⁻ with RS⁻. O and S are in the same column, so size decides. The larger RS⁻ is more stable (weaker base), so the equilibrium favors the products."}, {"k": "quiz", "id": "Q25", "title": "Quiz Q25 · Equilibrium", "tag": "Equilibrium", "sub": "Challenge", "text": "Q25 Equilibrium Challenge Which side of the equilibrium is favored? Compare RO⁻ with the alkynide. Atom (factor 1) before orbital (factor 4): O is more electronegative than C, so ethoxide is more stable. The reactants are favored. The products, because the sp carbanion is the most stable carbanion The reactants, because ethoxide (O⁻) is more stable than the sp carbanion (C⁻) The products, because the alkynide ion has resonance structures Neither side, because both anions have lone pairs", "img": "organic-chemistry/acids-bases/img/q25.png", "q": "Which side of the equilibrium is favored?", "opts": [{"type": "text", "value": "The products, because the sp carbanion is the most stable carbanion"}, {"type": "text", "value": "The reactants, because ethoxide (O⁻) is more stable than the sp carbanion (C⁻)"}, {"type": "text", "value": "The products, because the alkynide ion has resonance structures"}, {"type": "text", "value": "Neither side, because both anions have lone pairs"}], "a": "B", "why": "Compare RO⁻ with the alkynide. Atom (factor 1) before orbital (factor 4): O is more electronegative than C, so ethoxide is more stable. The reactants are favored."}, {"k": "quiz", "id": "Q26", "title": "Quiz Q26 · Equilibrium", "tag": "Equilibrium", "sub": "Two-factor", "text": "Q26 Equilibrium Two-factor Which side of the equilibrium is favored? Both anions have O⁻, so compare resonance. Phenoxide is delocalized into the ring; ethoxide is not. The more stable anion (phenoxide) is on the reactant side, so the reactants are favored. The products, because ethanol is the more acidic reactant The products, because ethoxide is more stable The reactants, because phenoxide is resonance stabilized Neither side, because both anions have the charge on O", "img": "organic-chemistry/acids-bases/img/q26.png", "q": "Which side of the equilibrium is favored?", "opts": [{"type": "text", "value": "The products, because ethanol is the more acidic reactant"}, {"type": "text", "value": "The products, because ethoxide is more stable"}, {"type": "text", "value": "The reactants, because phenoxide is resonance stabilized"}, {"type": "text", "value": "Neither side, because both anions have the charge on O"}], "a": "C", "why": "Both anions have O⁻, so compare resonance. Phenoxide is delocalized into the ring; ethoxide is not. The more stable anion (phenoxide) is on the reactant side, so the reactants are favored."}, {"k": "quiz", "id": "Q27", "title": "Quiz Q27 · Equilibrium", "tag": "Equilibrium", "sub": "Challenge", "text": "Q27 Equilibrium Challenge Which side of the equilibrium is favored? Both anions are carboxylates, so atom and resonance tie. The three F atoms stabilize CF₃CO₂⁻ by induction (factor 3), so CF₃CO₂⁻ is more stable and the reactant side is favored. The products, because acetate is resonance stabilized The products, because CH₃ donates electron density to the carboxylate Neither side, because both anions are resonance stabilized The reactants, because CF₃CO₂⁻ is stabilized by induction", "img": "organic-chemistry/acids-bases/img/q27.png", "q": "Which side of the equilibrium is favored?", "opts": [{"type": "text", "value": "The products, because acetate is resonance stabilized"}, {"type": "text", "value": "The products, because CH₃ donates electron density to the carboxylate"}, {"type": "text", "value": "Neither side, because both anions are resonance stabilized"}, {"type": "text", "value": "The reactants, because CF₃CO₂⁻ is stabilized by induction"}], "a": "D", "why": "Both anions are carboxylates, so atom and resonance tie. The three F atoms stabilize CF₃CO₂⁻ by induction (factor 3), so CF₃CO₂⁻ is more stable and the reactant side is favored."}, {"k": "quiz", "id": "Q28", "title": "Quiz Q28 · Equilibrium", "tag": "Equilibrium", "sub": "Two-factor", "text": "Q28 Equilibrium Two-factor Hydroxide deprotonates phenol. Which set of curved arrows correctly shows the proton transfer? A proton transfer always uses at least two arrows. Arrow 1 starts on a lone pair of the base (HO⁻) and ends on the H. Arrow 2 starts on the O–H bond and ends on the O of the acid, which becomes the conjugate base.", "img": "", "q": "Hydroxide deprotonates phenol. Which set of curved arrows correctly shows the proton transfer?", "opts": [{"type": "img", "value": "organic-chemistry/acids-bases/img/q28_A.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q28_B.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q28_C.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q28_D.png"}], "a": "C", "why": "A proton transfer always uses at least two arrows. Arrow 1 starts on a lone pair of the base (HO⁻) and ends on the H. Arrow 2 starts on the O–H bond and ends on the O of the acid, which becomes the conjugate base."}, {"k": "quiz", "id": "Q29", "title": "Quiz Q29 · Equilibrium", "tag": "Equilibrium", "sub": "Two-factor", "text": "Q29 Equilibrium Two-factor Which side of the equilibrium is favored? Both ions have the charge on carbon, with no resonance and no inductive effects, so only the orbital differs (factor 4). An sp orbital (50% s character) holds the lone pair closer to the nucleus than an sp² orbital (33% s), so the alkynide is more stable. The more stable ion is on the reactant side, so the reactants are favored. The reactants, because the alkynide (charge in an sp orbital) is more stable than the vinyl anion (charge in an sp² orbital) The products, because the vinyl anion is resonance stabilized The products, because an sp² orbital is closer to the nucleus than an sp orbital Neither side, because both anions have the charge on carbon", "img": "organic-chemistry/acids-bases/img/q29.png", "q": "Which side of the equilibrium is favored?", "opts": [{"type": "text", "value": "The reactants, because the alkynide (charge in an sp orbital) is more stable than the vinyl anion (charge in an sp² orbital)"}, {"type": "text", "value": "The products, because the vinyl anion is resonance stabilized"}, {"type": "text", "value": "The products, because an sp² orbital is closer to the nucleus than an sp orbital"}, {"type": "text", "value": "Neither side, because both anions have the charge on carbon"}], "a": "A", "why": "Both ions have the charge on carbon, with no resonance and no inductive effects, so only the orbital differs (factor 4). An sp orbital (50% s character) holds the lone pair closer to the nucleus than an sp² orbital (33% s), so the alkynide is more stable. The more stable ion is on the reactant side, so the reactants are favored."}, {"k": "quiz", "id": "Q30", "title": "Quiz Q30 · Equilibrium", "tag": "Equilibrium", "sub": "Challenge", "text": "Q30 Equilibrium Challenge Which anion is a strong enough base to deprotonate ethanol so that the equilibrium favors the products? Ethanol deprotonates to give ethoxide, so the base must be a less stable (stronger) base than ethoxide. Acetate (resonance), phenoxide (resonance), and CH₃S⁻ (larger atom) are all more stable than ethoxide. The alkynide ion has the charge on C and is less stable.", "img": "", "q": "Which anion is a strong enough base to deprotonate ethanol so that the equilibrium favors the products?", "opts": [{"type": "img", "value": "organic-chemistry/acids-bases/img/q30_A.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q30_B.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q30_C.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q30_D.png"}], "a": "B", "why": "Ethanol deprotonates to give ethoxide, so the base must be a less stable (stronger) base than ethoxide. Acetate (resonance), phenoxide (resonance), and CH₃S⁻ (larger atom) are all more stable than ethoxide. The alkynide ion has the charge on C and is less stable."}, {"k": "quiz", "id": "Q31", "title": "Quiz Q31 · Nomenclature", "tag": "Nomenclature", "sub": "Direct", "text": "Q31 Nomenclature Direct Which is the correct IUPAC name for this alkane? The longest chain has 5 carbons (pentane) with one methyl branch. Number from the end that gives the branch the lower number: 2-methylpentane, not 4-methylpentane. 2-methylpentane 4-methylpentane 3-methylpentane 2-ethylbutane", "img": "organic-chemistry/acids-bases/img/q31.png", "q": "Which is the correct IUPAC name for this alkane?", "opts": [{"type": "text", "value": "2-methylpentane"}, {"type": "text", "value": "4-methylpentane"}, {"type": "text", "value": "3-methylpentane"}, {"type": "text", "value": "2-ethylbutane"}], "a": "A", "why": "The longest chain has 5 carbons (pentane) with one methyl branch. Number from the end that gives the branch the lower number: 2-methylpentane, not 4-methylpentane."}, {"k": "quiz", "id": "Q32", "title": "Quiz Q32 · Nomenclature", "tag": "Nomenclature", "sub": "Direct", "text": "Q32 Nomenclature Direct Which is the correct IUPAC name for this alkane? The longest chain has 6 carbons (hexane). The methyl is on carbon 3 when numbered from the left and carbon 4 from the right, so use the lower number: 3-methylhexane. 4-methylhexane 2-ethylpentane 3-methylpentane 3-methylhexane", "img": "organic-chemistry/acids-bases/img/q32.png", "q": "Which is the correct IUPAC name for this alkane?", "opts": [{"type": "text", "value": "4-methylhexane"}, {"type": "text", "value": "2-ethylpentane"}, {"type": "text", "value": "3-methylpentane"}, {"type": "text", "value": "3-methylhexane"}], "a": "D", "why": "The longest chain has 6 carbons (hexane). The methyl is on carbon 3 when numbered from the left and carbon 4 from the right, so use the lower number: 3-methylhexane."}, {"k": "quiz", "id": "Q33", "title": "Quiz Q33 · Nomenclature", "tag": "Nomenclature", "sub": "Direct", "text": "Q33 Nomenclature Direct Which is the correct IUPAC name for this alkane? The longest chain has 4 carbons (butane) with two methyl groups on the same carbon. Number from the end that gives them the lower number (2,2), and repeat the locant for each methyl. 3,3-dimethylbutane 2,2-dimethylbutane 2-ethyl-2-methylpropane 2,2-dimethylpropane", "img": "organic-chemistry/acids-bases/img/q33.png", "q": "Which is the correct IUPAC name for this alkane?", "opts": [{"type": "text", "value": "3,3-dimethylbutane"}, {"type": "text", "value": "2,2-dimethylbutane"}, {"type": "text", "value": "2-ethyl-2-methylpropane"}, {"type": "text", "value": "2,2-dimethylpropane"}], "a": "B", "why": "The longest chain has 4 carbons (butane) with two methyl groups on the same carbon. Number from the end that gives them the lower number (2,2), and repeat the locant for each methyl."}, {"k": "quiz", "id": "Q34", "title": "Quiz Q34 · Nomenclature", "tag": "Nomenclature", "sub": "Direct", "text": "Q34 Nomenclature Direct Which is the correct IUPAC name for this alkane? The longest chain has 5 carbons (pentane) with two methyl branches. Numbering from the left gives locants 2,3; from the right it gives 3,4. Use 2,3 and combine the identical groups as dimethyl. 3,4-dimethylpentane 2-methyl-3-methylpentane 2,3-dimethylpentane 2,3-dimethylhexane", "img": "organic-chemistry/acids-bases/img/q34.png", "q": "Which is the correct IUPAC name for this alkane?", "opts": [{"type": "text", "value": "3,4-dimethylpentane"}, {"type": "text", "value": "2-methyl-3-methylpentane"}, {"type": "text", "value": "2,3-dimethylpentane"}, {"type": "text", "value": "2,3-dimethylhexane"}], "a": "C", "why": "The longest chain has 5 carbons (pentane) with two methyl branches. Numbering from the left gives locants 2,3; from the right it gives 3,4. Use 2,3 and combine the identical groups as dimethyl."}, {"k": "quiz", "id": "Q35", "title": "Quiz Q35 · Nomenclature", "tag": "Nomenclature", "sub": "Direct", "text": "Q35 Nomenclature Direct Which is the correct IUPAC name for this alkane? The longest chain has 5 carbons: the central carbon can be reached by chains through any two of the three ethyl groups. The third ethyl is the branch on carbon 3: 3-ethylpentane. (Choosing a 6-carbon chain is not possible for this structure.) 3-methylhexane 3-propylbutane heptane 3-ethylpentane", "img": "organic-chemistry/acids-bases/img/q35.png", "q": "Which is the correct IUPAC name for this alkane?", "opts": [{"type": "text", "value": "3-methylhexane"}, {"type": "text", "value": "3-propylbutane"}, {"type": "text", "value": "heptane"}, {"type": "text", "value": "3-ethylpentane"}], "a": "D", "why": "The longest chain has 5 carbons: the central carbon can be reached by chains through any two of the three ethyl groups. The third ethyl is the branch on carbon 3: 3-ethylpentane. (Choosing a 6-carbon chain is not possible for this structure.)"}, {"k": "quiz", "id": "Q36", "title": "Quiz Q36 · Nomenclature", "tag": "Nomenclature", "sub": "Direct", "text": "Q36 Nomenclature Direct Which is the correct IUPAC name for this alkane? The longest chain has 6 carbons (hexane). Numbering from the left gives locants 2,4; from the right it gives 3,5, so use 2,4. List the substituents in alphabetical order: ethyl comes before methyl, so 4-ethyl-2-methylhexane. 4-ethyl-2-methylhexane 3-ethyl-5-methylhexane 2-methyl-4-ethylhexane 2-ethyl-4-methylhexane", "img": "organic-chemistry/acids-bases/img/q36.png", "q": "Which is the correct IUPAC name for this alkane?", "opts": [{"type": "text", "value": "4-ethyl-2-methylhexane"}, {"type": "text", "value": "3-ethyl-5-methylhexane"}, {"type": "text", "value": "2-methyl-4-ethylhexane"}, {"type": "text", "value": "2-ethyl-4-methylhexane"}], "a": "A", "why": "The longest chain has 6 carbons (hexane). Numbering from the left gives locants 2,4; from the right it gives 3,5, so use 2,4. List the substituents in alphabetical order: ethyl comes before methyl, so 4-ethyl-2-methylhexane."}, {"k": "quiz", "id": "Q37", "title": "Quiz Q37 · Nomenclature", "tag": "Nomenclature", "sub": "Direct", "text": "Q37 Nomenclature Direct Which is the correct IUPAC name for this alkane? The longest chain has 5 carbons (pentane) with three methyl groups. Numbering from the end that gives the lowest locants gives 2,2,4 (from the other end the set would be 2,4,4). Three identical groups use the prefix tri. 2,4,4-trimethylpentane 2,2,3-trimethylpentane 2,2,4-trimethylpentane 2,2,4-trimethylhexane", "img": "organic-chemistry/acids-bases/img/q37.png", "q": "Which is the correct IUPAC name for this alkane?", "opts": [{"type": "text", "value": "2,4,4-trimethylpentane"}, {"type": "text", "value": "2,2,3-trimethylpentane"}, {"type": "text", "value": "2,2,4-trimethylpentane"}, {"type": "text", "value": "2,2,4-trimethylhexane"}], "a": "C", "why": "The longest chain has 5 carbons (pentane) with three methyl groups. Numbering from the end that gives the lowest locants gives 2,2,4 (from the other end the set would be 2,4,4). Three identical groups use the prefix tri."}, {"k": "quiz", "id": "Q38", "title": "Quiz Q38 · Nomenclature", "tag": "Nomenclature", "sub": "Direct", "text": "Q38 Nomenclature Direct Which is the correct IUPAC name for this alkane? The longest chain has 5 carbons (pentane). Numbering from the left gives the substituents locants 2 and 3; from the right they would be 3 and 4. Alphabetical order puts ethyl before methyl: 3-ethyl-2-methylpentane. 2-methyl-3-ethylpentane 3-ethyl-2-methylpentane 3-ethyl-4-methylpentane 2,3-diethylbutane", "img": "organic-chemistry/acids-bases/img/q38.png", "q": "Which is the correct IUPAC name for this alkane?", "opts": [{"type": "text", "value": "2-methyl-3-ethylpentane"}, {"type": "text", "value": "3-ethyl-2-methylpentane"}, {"type": "text", "value": "3-ethyl-4-methylpentane"}, {"type": "text", "value": "2,3-diethylbutane"}], "a": "B", "why": "The longest chain has 5 carbons (pentane). Numbering from the left gives the substituents locants 2 and 3; from the right they would be 3 and 4. Alphabetical order puts ethyl before methyl: 3-ethyl-2-methylpentane."}, {"k": "quiz", "id": "Q39", "title": "Quiz Q39 · Nomenclature", "tag": "Nomenclature", "sub": "Direct", "text": "Q39 Nomenclature Direct Which is the correct IUPAC name for this alkane? The longest chain has 6 carbons (hexane) with a methyl on each side. The molecule is symmetric, so both directions give 2,5. Combine the two identical groups as dimethyl: 2,5-dimethylhexane. 2,5-dimethylhexane 2,4-dimethylhexane 1,1,4-trimethylpentane 2-methyl-5-methylhexane", "img": "organic-chemistry/acids-bases/img/q39.png", "q": "Which is the correct IUPAC name for this alkane?", "opts": [{"type": "text", "value": "2,5-dimethylhexane"}, {"type": "text", "value": "2,4-dimethylhexane"}, {"type": "text", "value": "1,1,4-trimethylpentane"}, {"type": "text", "value": "2-methyl-5-methylhexane"}], "a": "A", "why": "The longest chain has 6 carbons (hexane) with a methyl on each side. The molecule is symmetric, so both directions give 2,5. Combine the two identical groups as dimethyl: 2,5-dimethylhexane."}, {"k": "quiz", "id": "Q40", "title": "Quiz Q40 · Nomenclature", "tag": "Nomenclature", "sub": "Two-factor", "text": "Q40 Nomenclature Two-factor Which structure is 2,3,3-trimethylpentane? Draw a 5-carbon chain and put one methyl on carbon 2 and two methyls on carbon 3. The other three choices are the isomers 2,2,3-trimethylpentane, 2,3,4-trimethylpentane and 2,2,4-trimethylpentane.", "img": "", "q": "Which structure is 2,3,3-trimethylpentane?", "opts": [{"type": "img", "value": "organic-chemistry/acids-bases/img/q40_A.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q40_B.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q40_C.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q40_D.png"}], "a": "D", "why": "Draw a 5-carbon chain and put one methyl on carbon 2 and two methyls on carbon 3. The other three choices are the isomers 2,2,3-trimethylpentane, 2,3,4-trimethylpentane and 2,2,4-trimethylpentane."}, {"k": "sim", "id": "SIM1", "title": "Enthalpy of Dissolution Virtual Lab", "tag": "Simulation", "sub": "Interactive lab simulation", "text": "enthalpy of dissolution virtual lab calorimetry simulation", "img": "", "link": "simulations/enthalpy-dissolution-lab/index.html"}],LAB={"mol": "Molecules", "prob": "Sub/Elim problems", "quiz": "Quiz questions", "sim": "Simulations"},PAGE=48;
const $=id=>document.getElementById(id);let coll='',shown=PAGE,list=[];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IDX=DATA.map(d=>(d.text||'').toLowerCase());
function chips(){const ks=Object.keys(LAB);$('chips').innerHTML='<button class="chip" data-k="" aria-pressed="'+(coll==='')+'">All ('+DATA.length+')</button>'+
ks.map(k=>'<button class="chip" data-k="'+k+'" aria-pressed="'+(coll===k)+'">'+LAB[k]+' ('+DATA.filter(d=>d.k===k).length+')</button>').join('')}
function subs(){const tags=[...new Set(DATA.filter(d=>!coll||d.k===coll).map(d=>d.tag))].sort();const cur=$('sub').value;

function card(d){let h='<div class="card'+(d.k==='quiz'&&d.opts&&d.opts.some(o=>o.type==='img')?' span':'')+'"><div class="top"><span>'+esc(d.id)+'</span><span class="tag">'+esc(d.tag)+'</span></div>'+
'<div class="t">'+esc(d.title)+'</div>'+(d.sub?'<div class="sub">'+esc(d.sub)+'</div>':'')+(d.q?'<div class="q">'+esc(d.q)+'</div>':'')+(d.img?'<img loading="lazy" src="'+esc(d.img)+'" alt="">':'');
if(d.link)h+='<a href="'+esc(d.link)+'">Open →</a>';
if(d.a||d.meta||d.opts){h+='<details><summary>'+(d.a?'Show answer':'Details')+'</summary>';
if(d.opts)h+='<div class="opts">'+d.opts.map((o,i)=>'<div>'+(o.type==='img'?'<img loading="lazy" src="'+esc(o.value)+'" alt="">':'<b>'+'ABCD'[i]+')</b> '+esc(o.value))+'</div>').join('')+'</div>';
if(d.a)h+='<p class="ans">Answer: '+esc(d.a)+'</p>';if(d.aimg)h+='<img loading="lazy" src="'+esc(d.aimg)+'" alt="">';
if(d.why)h+='<p>'+esc(d.why)+'</p>';if(d.meta)h+='<div class="meta">'+Object.entries(d.meta).map(([k,v])=>esc(k)+': '+esc(v)).join('<br>')+'</div>';h+='</details>'}

function run(reset){if(reset)shown=PAGE;const t=$('q').value.toLowerCase().trim().split(/\s+/).filter(Boolean),s=$('sub').value;
