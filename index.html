:root{--bg:#f5f6f8;--card:#fff;--ink:#1b2430;--mute:#667085;--line:#dde1e8;--acc:#1f5fa8;--chip:#e8eef7;--ok:#17653a}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:18px;margin:0 0 8px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=search]{flex:1 1 260px;min-width:0}
button.chip{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
button.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.docs{font-size:13px;color:var(--mute);margin-top:8px}.docs a{color:var(--acc);margin-right:12px;white-space:nowrap}
#info{color:var(--mute);font-size:13px;padding:10px 16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:0 16px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.span{grid-column:span 2}@media(max-width:700px){.card.span{grid-column:auto}}
.top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute)}.tag{background:var(--chip);border-radius:6px;padding:1px 7px}
.t{font-weight:650}.sub{font-size:12.5px;color:var(--mute)}.q{font-size:14px}
.card img{max-width:100%;max-height:190px;object-fit:contain;align-self:center;background:#fff;border-radius:6px}
details{font-size:14px}summary{cursor:pointer;color:var(--acc);font-weight:600}
.ans{color:var(--ok);font-weight:600}.meta{font-size:12px;color:var(--mute);word-break:break-all}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.opts div{font-size:13px}.opts img{max-height:110px}
#more{display:block;margin:6px auto 24px}#more[hidden]{display:none}a{color:var(--acc)}

s a strong nucleophile and a weak base; Solvent: DMSO is aprotic. These favor SN2.", "aimg": "organic-chemistry/substitution-elimination/images/P001_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P002", "title": "Choose the reagents", "tag": "Choose the reagents", "sub": "SN2 · difficulty 1", "text": "P002 Choose the reagents SN2 What reagent(s) and solvent would convert bromoethane into azidoethane? Name the mechanism and justify your choice with the four factors (substrate, nucleophile, leaving group, solvent). NaN₃ in DMF (SN2). Substrate: primary (1°) alkyl halide; Leaving group: good leaving group (Br); Nucleophile/base: azide is a strong nucleophile and a weak base; Solvent: DMF is aprotic. These favor SN2.", "img": "organic-chemistry/substitution-elimination/images/P002_q.png", "q": "What reagent(s) and solvent would convert bromoethane into azidoethane? Name the mechanism and justify your choice with the four factors (substrate, nucleophile, leaving group, solvent).", "a": "NaN₃ in DMF (SN2).", "why": "Substrate: primary (1°) alkyl halide; Leaving group: good leaving group (Br); Nucleophile/base: azide is a strong nucleophile and a weak base; Solvent: DMF is aprotic. These favor SN2.", "aimg": "organic-chemistry/substitution-elimination/images/P002_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P003", "title": "Choose the reagents", "tag": "Choose the reagents", "sub": "SN2 · difficulty 1", "text": "P003 Choose the reagents SN2 What reagent(s) and solvent would convert 1-bromopropane into propane-1-thiol? Name the mechanism and justify your choice with the four factors (substrate, nucleophile, leaving group, solvent). NaSH in DMSO (SN2). Substrate: primary (1°) alkyl halide; Leaving group: good leaving group (Br); Nucleophile/base: hydrosulfide is a strong nucleophile and a weak base; Solvent: DMSO is aprotic. These favor SN2.", "img": "organic-chemistry/substitution-elimination/images/P003_q.png", "q": "What reagent(s) and solvent would convert 1-bromopropane into propane-1-thiol? Name the mechanism and justify your choice with the four factors (substrate, nucleophile, leaving group, solvent).", "a": "NaSH in DMSO (SN2).", "why": "Substrate: primary (1°) alkyl halide; Leaving group: good leaving group (Br); Nucleophile/base: hydrosulfide is a strong nucleophile and a weak base; Solvent: DMSO is aprotic. These favor SN2.", "aimg": "organic-chemistry/substitution-elimination/images/P003_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P004", "title": "Choose the reagents", "tag": "Choose the reagents", "sub": "SN2 · difficulty 1", "text": "P004 Choose the reagents SN2 What reagent(s) and solvent would convert 2-bromopropane into 2-methylpropanenitrile? Name the mechanism and justify your choice with the four factors (substrate, nucleophile, leaving group, solvent). NaCN in DMSO (SN2). Substrate: secondary (2°) alkyl halide; Leaving group: good leaving group (Br); Nucleophile/base: cyanide is a strong nucleophile and a weak base; Solvent: DMSO is aprotic. These favor SN2.", "img": "organic-chemistry/substitution-elimination/images/P004_q.png", "q": "What reagent(s) and solvent would convert 2-bromopropane into 2-methylpropanenitrile? Name the mechanism and justify your choice with the four factors (substrate, nucleophile, leaving group, solvent).", "a": "NaCN in DMSO (SN2).", "why": "Substrate: secondary (2°) alkyl halide; Leaving group: good leaving group (Br); Nucleophile/base: cyanide is a strong nucleophile and a weak base; Solvent: DMSO is aprotic. These favor SN2.", "aimg": "organic-chemistry/substitution-elimination/images/P004_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P005", "title": "Choose the reagents", "tag": "Choose the reagents", "sub": "SN2 · difficulty 1", "text": "P005 Choose the reagents SN2 What reagent(s) and solvent would conver ing group: good leaving group (Br); Nucleophile/base: water is a weak nucleophile and a weak base; Solvent: H2O is protic. These favor SN1. Competing pathway: E1 (minor; favored by heat).", "aimg": "organic-chemistry/substitution-elimination/images/P006_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P007", "title": "Choose the reagents", "tag": "Choose the reagents", "sub": "E2 · difficulty 2", "text": "P007 Choose the reagents E2 What reagent(s) and solvent would convert 2-bromopropane into prop-1-ene? Name the mechanism and justify your choice with the four factors (substrate, nucleophile, leaving group, solvent). NaOEt in EtOH with heat (E2). Substrate: secondary (2°) alkyl halide; Leaving group: good leaving group (Br); Nucleophile/base: ethoxide is a strong nucleophile and a strong base; Solvent: EtOH is protic. These favor E2. Competing pathway: SN1/E1 do not compete under strongly basic conditions.", "img": "organic-chemistry/substitution-elimination/images/P007_q.png", "q": "What reagent(s) and solvent would convert 2-bromopropane into prop-1-ene? Name the mechanism and justify your choice with the four factors (substrate, nucleophile, leaving group, solvent).", "a": "NaOEt in EtOH with heat (E2).", "why": "Substrate: secondary (2°) alkyl halide; Leaving group: good leaving group (Br); Nucleophile/base: ethoxide is a strong nucleophile and a strong base; Solvent: EtOH is protic. These favor E2. Competing pathway: SN1/E1 do not compete under strongly basic conditions.", "aimg": "organic-chemistry/substitution-elimination/images/P007_a.png", "meta": {"Source": "Standard elimination conventions (Zaitsev/Hofmann); not from the provided PDF"}}, {"k": "prob", "id": "P008", "title": "Choose the reagents", "tag": "Choose the reagents", "sub": "E2 · difficulty 2", "text": "P008 Choose the reagents E2 What reagent(s) and solvent would convert 2-bromobutane into (E)-but-2-ene? Name the mechanism and justify your choice with th ic attack, loss of a leaving group, proton transfer and rearrangement. Substrate: primary (1°) alkyl halide; Leaving group: good leaving group (Br); Nucleophile/base: azide is a strong nucleophile and a weak base; Solvent: DMF is aprotic. These favor SN2.", "aimg": "organic-chemistry/substitution-elimination/images/P038_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P039", "title": "Draw the mechanism", "tag": "Draw the mechanism", "sub": "SN2 · difficulty 3", "text": "P039 Draw the mechanism SN2 Describe the complete mechanism (list each step and the curved arrows) for the reaction of 1-bromopropane with NaOMe in MeOH. How many steps are there? (1) One concerted step: the nucleophile attacks the α carbon from the back side while the leaving group departs (inversion). Each ionic mechanism is built from nucleophilic attack, loss of a leaving group, proton transfer and rearrangement. Substrate: primary (1°) alkyl halide; Leaving group: good leaving group (Br); Nucleophile/base: methoxide is a strong nucleophile and a strong base; Solvent: MeOH is protic. These favor SN2. Competing pathway: E2 (minor).", "img": "organic-chemistry/substitution-elimination/images/P039_q.png", "q": "Describe the complete mechanism (list each step and the curved arrows) for the reaction of 1-bromopropane with NaOMe in MeOH. How many steps are there?", "a": "(1) One concerted step: the nucleophile attacks the α carbon from the back side while the leaving group departs (inversion).", "why": "Each ionic mechanism is built from nucleophilic attack, loss of a leaving group, proton transfer and rearrangement. Substrate: primary (1°) alkyl halide; Leaving group: good leaving group (Br); Nucleophile/base: methoxide is a strong nucleophile and a strong base; Solvent: MeOH is protic. These favor SN2. Competing pathway: E2 (minor).", "aimg": "organic-chemistry/substitution-elimination/images/P039_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factor m (list each step and the curved arrows) for the reaction of 1-bromo-2,2-dimethylpropane with EtOH as the solvent. How many steps are there?", "a": "(1) One concerted step: the nucleophile attacks the α carbon from the back side while the leaving group departs (inversion). (2) Proton transfer: a base removes the proton from the positively charged nucleophile atom.", "why": "Each ionic mechanism is built from nucleophilic attack, loss of a leaving group, proton transfer and rearrangement. Substrate: primary (1°) alkyl halide; Leaving group: good leaving group (Br); Nucleophile/base: ethanol is a weak nucleophile and a weak base; Solvent: EtOH is protic. These favor SN2. Competing pathway: none significant (slow solvolysis).", "aimg": "organic-chemistry/substitution-elimination/images/P044_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P045", "title": "Draw the mechanism", "tag": "Draw the mechanism", "sub": "SN1 · difficulty 3", "text": "P045 Draw the mechanism SN1 Describe the complete mechanism (list each step and the curved arrows) for the reaction of 2-bromo-2-methylbutane with MeOH as the solvent. How many steps are there? (1) Loss of the leaving group gives a planar carbocation (rate-determining step). (2) Nucleophilic attack on the carbocation (either face). (3) Proton transfer removes the positive charge from the oxonium ion. Each ionic mechanism is built from nucleophilic attack, loss of a leaving group, proton transfer and rearrangement. Substrate: tertiary (3°) alkyl halide; Leaving group: good leaving group (Br); Nucleophile/base: methanol is a weak nucleophile and a weak base; Solvent: MeOH is protic. These favor SN1. Competing pathway: E1 (minor; favored by heat).", "img": "organic-chemistry/substitution-elimination/images/P045_q.png", "q": "Describe the complete mechanism (list each step and the curved arrows) for the reaction of 2-bromo-2-methylbutane with MeOH as the solvent. How many steps are there?", "a": "(1) Loss of the leaving group gives a planar carbocation (rate-determining step). (2) Nucleophilic attack on the carbocation (either face). (3) Proton transfer removes the positive charge from the oxonium ion.", "why": "Each ionic mechanism is built from nucleophilic attack, loss of a leaving group, proton transfer and rearrangement. Substrate: tertiary (3°) alkyl halide; Leaving group: good leaving group (Br); Nucleophile/base: methanol is a weak nucleophile and a weak base; Solvent: MeOH is protic. These favor SN1. Competing pathway: E1 (minor; favored by heat).", "aimg": "organic-chemistry/substitution-elimination/images/P045_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P046", "title": "What went wrong", "tag": "What went wrong", "sub": "SN2/E2 · difficulty 2", "text": "P046 What went wrong SN2/E2 A student predicts an SN2 reaction to give a nitrile. Reaction: 2-bromo-2-methylpropane + NaCN in DMSO. Explain what is wrong and give the correct outcome. No SN2: a tertiary carbon is too hindered for back-side attack. Cyanide is a weak base but the only feasible path is E2, giving 2-methylpropene (isobutylene). Apply the four factors in order: substrate, nucleophile/base, leaving group, solvent.", "img": "organic-chemistry/substitution-elimination/images/P046_q.png", "q": "A student predicts an SN2 reaction to give a nitrile. Reaction: 2-bromo-2-methylpropane + NaCN in DMSO. Explain what is wrong and give the correct outcome.", "a": "No SN2: a tertiary carbon is too hindered for back-side attack. Cyanide is a weak base but the only feasible path is E2, giving 2-methylpropene (isobutylene).", "why": "Apply the four factors in order: substrate, nucleophile/base, leaving group, solvent.", "aimg": "organic-chemistry/substitution-elimination/images/P046_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P047", "title": "What went wrong", "tag": "What went wrong", "sub": "SN2/E2 · difficulty 2", "text": "P047 What went wrong SN2/E2 A student says a primary halide always reacts quickly by SN2. Reaction: 1-bromo-2,2-dimethylpropane + NaOH in DMSO. Explain what is wrong and give the correct outcome. Neopentyl bromide is primary but the three β methyl groups block back-side attack; SN2 is extremely slow (like a tertiary substrate). The primary carbocation is also too unstable for SN1. Apply the four factors in order: substrate, nucleophile/base, leaving group, solvent.", "img": "organic-chemistry/substitution-elimination/images/P047_q.png", "q": "A student says a primary halide always reacts quickly by SN2. Reaction: 1-bromo-2,2-dimethylpropane + NaOH in DMSO. Explain what is wrong and give the correct outcome.", "a": "Neopentyl bromide is primary but the three β methyl groups block back-side attack; SN2 is extremely slow (like a tertiary substrate). The primary carbocation is also too unstable for SN1.", "why": "Apply the four factors in order: substrate, nucleophile/base, leaving group, solvent.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P048", "title": "What went wrong", "tag": "What went wrong", "sub": "SN2/E2 · difficulty 2", "text": "P048 What went wrong SN2/E2 A student predicts substitution to give vinyl alcohol. Reaction: bromoethene (vinyl bromide) + NaOH in DMSO. Explain what is wrong and give the correct outcome. Vinyl halides do not react by SN2 (sp² carbon, back side blocked) or SN1 (unstable vinyl cation). No substitution occurs. Apply the four factors in order: substrate, nucleophile/base, leaving group, solvent.", "img": "organic-chemistry/substitution-elimination/images/P048_q.png", "q": "A student predicts substitution to give vinyl alcohol. Reaction: bromoethene (vinyl bromide) + NaOH in DMSO. Explain what is wrong and give the correct outcome.", "a": "Vinyl halides do not react by SN2 (sp² carbon, back side blocked) or SN1 (unstable vinyl cation). No substitution occurs.", "why": " ed, and state the stereochemical outcome if there is a stereocenter.", "a": "HBr (SN2).", "why": "Hydroxide is a bad leaving group, so the OH must be activated first: protonated by HX (SN1 for tertiary, SN2 for primary), or converted to a tosylate (TsCl/pyridine) or halide (PBr₃, SOCl₂) for SN2. Tosylate formation does not touch the stereocenter, so one inversion occurs in the substitution step.", "aimg": "organic-chemistry/substitution-elimination/images/P061_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P062", "title": "Functional group conversion", "tag": "Functional group conversion", "sub": "SN2 · difficulty 2", "text": "P062 Functional group conversion SN2 Propose reagents to convert propan-2-ol into 2-chloropropane. Explain why the OH group cannot simply be displaced, and state the stereochemical outcome if there is a stereocenter. SOCl2, pyridine (SN2). Hydroxide is a bad leaving group, so the OH must be activated first: protonated by HX (SN1 for tertiary, SN2 for primary), or converted to a tosylate (TsCl/pyridine) or halide (PBr₃, SOCl₂) for SN2. Tosylate formation does not touch the stereocenter, so one inversion occurs in the substitution step.", "img": "organic-chemistry/substitution-elimination/images/P062_q.png", "q": "Propose reagents to convert propan-2-ol into 2-chloropropane. Explain why the OH group cannot simply be displaced, and state the stereochemical outcome if there is a stereocenter.", "a": "SOCl2, pyridine (SN2).", "why": "Hydroxide is a bad leaving group, so the OH must be activated first: protonated by HX (SN1 for tertiary, SN2 for primary), or converted to a tosylate (TsCl/pyridine) or halide (PBr₃, SOCl₂) for SN2. Tosylate formation does not touch the stereocenter, so one inversion occurs in the substitution step.", "aimg": "organic-chemistry/substitution-elimination/images/P062_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P063", "title": "Functional group conversion", "tag": "Functional group conversion", "sub": "SN2 · difficulty 2", "text": "P063 Functional group conversion SN2 Propose reagents to convert (R)-pentan-2-ol into (S)-2-methylpentanenitrile. Explain why the OH group cannot simply be displaced, and state the stereochemical outcome if there is a stereocenter. TsCl, pyridine; then NaCN, DMSO (SN2). Inversion at the stereocenter. Hydroxide is a bad leaving group, so the OH must be activated first: protonated by HX (SN1 for tertiary, SN2 for primary), or converted to a tosylate (TsCl/pyridine) or halide (PBr₃, SOCl₂) for SN2. Tosylate formation does not touch the stereocenter, so one inversion occurs in the substitution step.", "img": "organic-chemistry/substitution-elimination/images/P063_q.png", "q": "Propose reagents to convert (R)-pentan-2-ol into (S)-2-methylpentanenitrile. Explain why the OH group cannot simply be displaced, and state the stereochemical outcome if there is a stereocenter.", "a": "TsCl, pyridine; then NaCN, DMSO (SN2). Inversion at the stereocenter.", "why": "Hydroxide is a bad leaving group, so the OH must be activated first: protonated by HX (SN1 for tertiary, SN2 for primary), or converted to a tosylate (TsCl/pyridine) or halide (PBr₃, SOCl₂) for SN2. Tosylate formation does not touch the stereocenter, so one inversion occurs in the substitution step.", "aimg": "organic-chemistry/substitution-elimination/images/P063_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P064", "title": "Functional group conversion", "tag": "Functional group conversion", "sub": "SN2 · difficulty 2", "text": "P064 Functional group conversion SN2 Propose reagents to convert butan-1-ol into 1-azidobutane. Explain why the OH group cannot simply be displaced, and state the stereochemical outcome if there is a stereocenter. TsCl, pyridine; then NaN3, DMF (SN2). Hydroxide is a bad leaving group, so the OH must be activated first: protonated by HX (SN1 for tertiary, SN2 for primary), or converted to a tosylate (TsCl/pyridine) or halide (PBr₃, SOCl₂) for SN2. Tosylate formation does not touch the stereocenter, so one inversion occurs in the substitution step.", "img": "organic-chemistry/substitution-elimination/images/P064_q.png", "q": "Propose reagents to convert butan-1-ol into 1-azidobutane. Explain why the OH group cannot simply be displaced, and state the stereochemical outcome if there is a stereocenter.", "a": "TsCl, pyridine; then NaN3, DMF (SN2).", "why": "Hydroxide is a bad leaving group, so the OH must be activated first: protonated by HX (SN1 for tertiary, SN2 for primary), or converted to a tosylate (TsCl/pyridine) or halide (PBr₃, SOCl₂) for SN2. Tosylate formation does not touch the stereocenter, so one inversion occurs in the substitution step.", "aimg": "organic-chemistry/substitution-elimination/images/P064_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P065", "title": "Carbocation rearrangement", "tag": "Carbocation rearrangement", "sub": "SN1 · difficulty 3", "text": "P065 Carbocation rearrangement SN1 Will 2-bromo-3-methylbutane rearrange when heated in EtOH? Show the carbocation that forms, the shift involved, and the major substitution product. Yes: hydride shift converts the initial cation into a more stable tertiary cation; major product 2-ethoxy-2-methylbutane. (1) Loss of the leaving group gives a planar carbocation (rate-determining step). (2) Carbocation rearrangement (hydride shift) gives a more stable carbocation. (3) Nucleophilic attack on the carbocation (either face). (4) Proton transfer removes the positive charge from the oxonium ion. Substrate: secondary (2°) alkyl halide; Leaving group: good leaving group (Br); Nucleophile/base: ethanol is a weak nucleophile and a weak base; Solvent: EtOH is protic. These favor SN1.", "img": "organic-chemistry/substitution-elimination/images/P065_q.png", "q": "Will 2-bromo-3-methylbutane rearrange when heated in EtOH? Show the carbocation that forms, the shift involved, and the major substitution product.", "a": "Yes: hydride shift converts the initial cation into a more stable tertiary cation; major product 2-ethoxy-2-methylbutane.", "why": "(1) Loss of the leaving group gives a planar carbocation (rate-determining step). (2) Carbocation rearrangement (hydride shift) gives a more stable carbocation. (3) Nucleophilic attack on the carbocation (either face). (4) Proton transfer removes the positive charge from the oxonium ion. Substrate: secondary (2°) alkyl halide; Leaving group: good leaving group (Br); Nucleophile/base: ethanol is a weak nucleophile and a weak base; Solvent: EtOH is protic. These favor SN1.", "aimg": "organic-chemistry/substitution-elimination/images/P065_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P066", "title": "Carbocation rearrangement", "tag": "Carbocation rearrangement", "sub": "SN2 · difficulty 3", "text": "P066 Carbocation rearrangement SN2 Will 1-bromo-2,2-dimethylpropane rearrange when heated in EtOH? Show the carbocation that forms, the shift involved, and the major substitution product. Yes: methyl shift converts the initial cation into a more stable tertiary cation; major product 1-ethoxy-2,2-dimethylpropane. (1) One concerted step: the nucleophile attacks the α carbon from the back side while the leaving group departs (inversion). (2) Proton transfer: a base removes the proton from the positively charged nucleophile atom. Substrate: primary (1°) alkyl halide; Leaving group: good leaving group (Br); Nucleophile/base: ethanol is a weak nucleophile and a weak base; Solvent: EtOH is protic. These favor SN2.", "img": "organic-chemistry/substitution-elimination/images/P066_q.png", "q": "Will 1-bromo-2,2-dimethylpropane rearrange when heated in EtOH? Show the carbocation that forms, the shift involved, and the major substitution product.", "a": "Yes: methyl shift converts the initial cation into a more s ic attack on the carbocation (either face). (4) Proton transfer removes the positive charge from the oxonium ion. Substrate: secondary (2°) alkyl halide; Leaving group: good leaving group (Br); Nucleophile/base: methanol is a weak nucleophile and a weak base; Solvent: MeOH is protic. These favor SN1.", "aimg": "organic-chemistry/substitution-elimination/images/P068_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P069", "title": "Carbocation rearrangement", "tag": "Carbocation rearrangement", "sub": "E1 · difficulty 3", "text": "P069 Carbocation rearrangement E1 Predict the major alkene from heating 3-methylbutan-2-ol with H₂SO₄. Explain the rearrangement. 2-methylbut-2-ene via E1 after a hydride shift. (1) Proton transfer: the acid protonates the OH group. (2) Loss of water gives a carbocation (rate-determining step). (3) Carbocation rearrangement (hydride shift) gives a more stable carbocation. (4) A base (water or HSO₄⁻) removes a β hydrogen next to the cation, forming the alkene. Zaitsev elimination from the rearranged tertiary cation.", "img": "organic-chemistry/substitution-elimination/images/P069_q.png", "q": "Predict the major alkene from heating 3-methylbutan-2-ol with H₂SO₄. Explain the rearrangement.", "a": "2-methylbut-2-ene via E1 after a hydride shift.", "why": "(1) Proton transfer: the acid protonates the OH group. (2) Loss of water gives a carbocation (rate-determining step). (3) Carbocation rearrangement (hydride shift) gives a more stable carbocation. (4) A base (water or HSO₄⁻) removes a β hydrogen next to the cation, forming the alkene. Zaitsev elimination from the rearranged tertiary cation.", "aimg": "organic-chemistry/substitution-elimination/images/P069_a.png", "meta": {"Source": "Standard elimination conventions (Zaitsev/Hofmann); not from the provided PDF"}}, {"k": "prob", "id": "P070", "title": "Elimination (E1)", "tag": "Elimination (E1)", "sub": "E1 · difficulty 2", "text": "P070 Elimination (E1) es a carbocation (rate-determining step). (3) A base (water or HSO₄⁻) removes a β hydrogen next to the cation, forming the alkene.", "aimg": "organic-chemistry/substitution-elimination/images/P071_a.png", "meta": {"Source": "Standard elimination conventions (Zaitsev/Hofmann); not from the provided PDF"}}, {"k": "prob", "id": "P072", "title": "Elimination (E1)", "tag": "Elimination (E1)", "sub": "E1 · difficulty 2", "text": "P072 Elimination (E1) E1 What happens when 1-methylcyclohexan-1-ol is heated with concentrated H₂SO₄? Give the major product, name the mechanism and explain why the OH must be protonated first. 1-methylcyclohexene via E1 (Zaitsev). (1) Proton transfer: the acid protonates the OH group. (2) Loss of water gives a carbocation (rate-determining step). (3) A base (water or HSO₄⁻) removes a β hydrogen next to the cation, forming the alkene.", "img": "organic-chemistry/substitution-elimination/images/P072_q.png", "q": "What happens when 1-methylcyclohexan-1-ol is heated with concentrated H₂SO₄? Give the major product, name the mechanism and explain why the OH must be protonated first.", "a": "1-methylcyclohexene via E1 (Zaitsev).", "why": "(1) Proton transfer: the acid protonates the OH group. (2) Loss of water gives a carbocation (rate-determining step). (3) A base (water or HSO₄⁻) removes a β hydrogen next to the cation, forming the alkene.", "aimg": "organic-chemistry/substitution-elimination/images/P072_a.png", "meta": {"Source": "Standard elimination conventions (Zaitsev/Hofmann); not from the provided PDF"}}, {"k": "prob", "id": "P073", "title": "Elimination (E1)", "tag": "Elimination (E1)", "sub": "E1 · difficulty 2", "text": "P073 Elimination (E1) E1 What happens when butan-2-ol is heated with concentrated H₂SO₄? Give the major product, name the mechanism and explain why the OH must be protonated first. (E)-but-2-ene via E1 (Zaitsev). (1) Proton transfer: the acid protonates the OH group. (2) Loss of water gives a carbocation (rate-determining step). (3) A base (water or HSO₄⁻) removes a β hydrogen next to the cation, forming the alkene.", "img": "organic-chemistry/substitution-elimination/images/P073_q.png", "q": "What happens when butan-2-ol is heated with concentrated H₂SO₄? Give the major product, name the mechanism and explain why the OH must be protonated first.", "a": "(E)-but-2-ene via E1 (Zaitsev).", "why": "(1) Proton transfer: the acid protonates the OH group. (2) Loss of water gives a carbocation (rate-determining step). (3) A base (water or HSO₄⁻) removes a β hydrogen next to the cation, forming the alkene.", "aimg": "organic-chemistry/substitution-elimination/images/P073_a.png", "meta": {"Source": "Standard elimination conventions (Zaitsev/Hofmann); not from the provided PDF"}}, {"k": "prob", "id": "P074", "title": "Regiochemistry of elimination", "tag": "Regiochemistry of elimination", "sub": "E2 · difficulty 3", "text": "P074 Regiochemistry of elimination E2 Starting from 2-bromo-2-methylbutane, choose reagents to make (a) the more substituted alkene and (b) the less substituted alkene. Give both products. (a) NaOEt/EtOH (small base, Zaitsev): 2-methylbut-2-ene. (b) KOtBu/tBuOH (bulky base, Hofmann): 2-methylbut-1-ene. A small base removes the β hydrogen that leads to the more stable, more substituted alkene (Zaitsev). A bulky base removes the more accessible, less hindered hydrogen (Hofmann).", "img": "organic-chemistry/substitution-elimination/images/P074_q.png", "q": "Starting from 2-bromo-2-methylbutane, choose reagents to make (a) the more substituted alkene and (b) the less substituted alkene. Give both products.", "a": "(a) NaOEt/EtOH (small base, Zaitsev): 2-methylbut-2-ene. (b) KOtBu/tBuOH (bulky base, Hofmann): 2-methylbut-1-ene.", "why": "A small base removes the β hydrogen that leads to the more stable, more substituted alkene (Zaitsev). A bulky base removes the more accessible, less hindered hydrogen (Hofmann).", "aimg": "organic-chemistry/substitution-elimination/images/P074_a.png", "meta": {"Source": "Standard elimination conventions (Zaitsev/Hofmann); not from the provided PDF"}}, {"k": "prob", "id": "P075", "title": "Regiochemistry of elimination", "tag": "Regiochemistry of elimination", "sub": "E2 · difficulty 3", "text": "P075 Regiochemistry of elimination E2 Starting from 2-bromobutane, choose reagents to make (a) the more substituted alkene and (b) the less substituted alkene. Give both products. (a) NaOEt/EtOH (small base, Zaitsev): (E)-but-2-ene. (b) KOtBu/tBuOH (bulky base, Hofmann): but-1-ene. A small base removes the β hydrogen that leads to the more stable, more substituted alkene (Zaitsev). A bulky base removes the more accessible, less hindered hydrogen (Hofmann).", "img": "organic-chemistry/substitution-elimination/images/P075_q.png", "q": "Starting from 2-bromobutane, choose reagents to make (a) the more substituted alkene and (b) the less substituted alkene. Give both products.", "a": "(a) NaOEt/EtOH (small base, Zaitsev): (E)-but-2-ene. (b) KOtBu/tBuOH (bulky base, Hofmann): but-1-ene.", "why": "A small base removes the β hydrogen that leads to the more stable, more substituted alkene (Zaitsev). A bulky base removes the more accessible, less hindered hydrogen (Hofmann).", "aimg": "organic-chemistry/substitution-elimination/images/P075_a.png", "meta": {"Source": "Standard elimination conventions (Zaitsev/Hofmann); not from the provided PDF"}}, {"k": "prob", "id": "P076", "title": "Regiochemistry of elimination", "tag": "Regiochemistry of elimination", "sub": "E2 · difficulty 3", "text": "P076 Regiochemistry of elimination E2 Starting from 2-bromopentane, choose reagents to make (a) the more substituted alkene and (b) the less substituted alkene. Give both products. (a) NaOEt/EtOH (small base, Zaitsev): (E)-pent-2-ene. (b) KOtBu/tBuOH (bulky base, Hofmann): pent-1-ene. A small base removes the β hydrogen that leads to the more stable, more substituted alkene (Zaitsev). A bulky base removes the more accessible, less hindered hydrogen (Hofmann).", "img": "organic-chemistry/substitution-elimination/images/P076_q.png", "q": "Starting from 2-bromopentane, choose reagents to make (a) the more substituted alkene and (b) the less substituted alkene. Give both products.", "a": "(a) NaOEt/EtOH (small base, Zaitsev): (E)-pent-2-ene. (b) KOtBu/tBuOH (bulky base, Hofmann): pent-1-ene.", "why": "A small base removes the β hydrogen that leads to the more stable, more substituted alkene (Zaitsev). A bulky base removes the more accessible, less hindered hydrogen (Hofmann).", "aimg": "organic-chemistry/substitution-elimination/images/P076_a.png", "meta": {"Source": "Standard elimination conventions (Zaitsev/Hofmann); not from the provided PDF"}}, {"k": "prob", "id": "P077", "title": "Regiochemistry of elimination", "tag": "Regiochemistry of elimination", "sub": "E2 · difficulty 3", "text": "P077 Regiochemistry of elimination E2 Starting from 1-bromo-1-methylcyclohexane, choose reagents to make (a) the more substituted alkene and (b) the less substituted alkene. Give both products. (a) NaOEt/EtOH (small base, Zaitsev): 1-methylcyclohexene. (b) KOtBu/tBuOH (bulky base, Hofmann): methylenecyclohexane. A small base removes the β hydrogen that leads to the more stable, more substituted alkene (Zaitsev). A bulky base removes the more accessible, less hindered hydrogen (Hofmann).", "img": "organic-chemistry/substitution-elimination/images/P077_q.png", "q": "Starting from 1-bromo-1-methylcyclohexane, choose reagents to make (a) the more substituted alkene and (b) the less substituted alkene. Give both products.", "a": "(a) NaOEt/EtOH (small base, Zaitsev): 1-methylcyclohexene. (b) KOtBu/tBuOH (bulky base, Hofmann): methylenecyclohexane.", "why": "A small base removes the β hydrogen that leads to the more stable, more substituted alkene (Zaitsev). A bulky base removes the more accessible, less hindered hydrogen (Hofmann).", "aimg": "organic-chemistry/substitution-elimination/images/P077_a.png", "meta": {"Source": "Standard elimination conventions (Zaitsev/Hofmann); not from the provided PDF"}}, {"k": "prob", "id": "P078", "title": "Regiochemistry of elimination", "tag": "Regiochemistry of elimination", "sub": "E2 · difficulty 3", "text": "P078 Regiochemistry of elimination E2 Starting from 3-bromo-3-methylpentane, choose reagents to make (a) the more substituted alkene and (b) the less substituted alkene. Give both products. (a) NaOEt/EtOH (small base, Zaitsev): 3-methylpent-2-ene. (b) KOtBu/tBuOH (bulky base, Hofmann): 2-ethylbut-1-ene. A small base removes the β hydrogen that leads to the more stable, more substituted alkene (Zaitsev). A bulky base removes the more accessible, less hindered hydrogen (Hofmann).", "img": "organic-chemistry/substitution-elimination/images/P078_q.png", "q": "Starting from 3-bromo-3-methylpentane, choose reagents to make (a) the more substituted alkene and (b) the less substituted alkene. Give both products.", "a": "(a) NaOEt/EtOH (small base, Zaitsev): 3-methylpent-2-ene. (b) KOtBu/tBuOH (bulky base, Hofmann): 2-ethylbut-1-ene.", "why": "A small base removes the β hydrogen that leads to the more stable, more substituted alkene (Zaitsev). A bulky base removes the more accessible, less hindered hydrogen (Hofmann).", "aimg": "organic-chemistry/substitution-elimination/images/P078_a.png", "meta": {"Source": "Standard elimination conventions (Zaitsev/Hofmann); not from the provided PDF"}}, {"k": "prob", "id": "P079", "title": "Synthesis design", "tag": "Synthesis design", "sub": "SN2 · difficulty 3", "text": "P079 Synthesis design SN2 Design a synthesis of 2-methoxy-2-methylpropane from an alkyl halide and an alkoxide. Which combination works, and why does the other combination fail? Use iodomethane with sodium tert-butoxide. The alternative, tert-butyl bromide with sodium methoxide, fails because it gives E2 elimination instead of substitution. The Williamson ether synthesis is an SN2 reaction, so the halide must be methyl or primary. A secondary or tertiary halide with a strongly basic alkoxide gives E2 elimination.", "img": "organic-chemistry/substitution-elimination/images/P079_q.png", "q": "Design a synthesis of 2-methoxy-2-methylpropane from an alkyl halide and an alkoxide. Which combination works, and why does the other combination fail?", "a": "Use iodomethane with sodium tert-butoxide. The alternative, tert-butyl bromide with sodium methoxide, fails because it gives E2 elimination instead of substitution.", "why": "The Williamson ether synthesis is an SN2 reaction, so the halide must be methyl or primary. A secondary or tertiary halide with a strongly basic alkoxide gives E2 elimination.", "aimg": "organic-chemistry/substitution-elimination/images/P079_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P080", "title": "Synthesis design", "tag": "Synthesis design", "sub": "SN2 · difficulty 3", "text": "P080 Synthesis design SN2 Design a synthesis of 2-ethoxypropane from an alkyl halide and an alkoxide. Which combination works, and why does the other combination fail? Use bromoethane with sodium isopropoxide. The alternative, 2-bromopropane with sodium ethoxide, fails because it gives E2 elimination instead of substitution. The Williamson ether synthesis is an SN2 reaction, so the halide must be methyl or primary. A secondary or tertiary halide with a strongly basic alkoxide gives E2 elimination.", "img": "organic-chemistry/substitution-elimination/images/P080_q.png", "q": "Design a synthesis of 2-ethoxypropane from an alkyl halide and an alkoxide. Which combination works, and why does the other combination fail?", "a": "Use bromoethane with sodium isopropoxide. The alternative, 2-bromopropane with sodium ethoxide, fails because it gives E2 elimination instead of substitution.", "why": "The Williamson ether synthesis is an SN2 reaction, so the halide must be methyl or primary. A secondary or tertiary halide with a strongly basic alkoxide gives E2 elimination.", "aimg": "organic-chemistry/substitution-elimination/images/P080_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P081", "title": "Synthesis design", "tag": "Synthesis design", "sub": "SN2 · difficulty 3", "text": "P081 Synthesis design SN2 Design a synthesis of 2-ethoxy-2-methylpropane from an alkyl halide and an alkoxide. Which combination works, and why does the other combination fail? Use iodoethane with sodium tert-butoxide. The alternative, tert-butyl bromide with sodium ethoxide, fails because it gives E2 elimination instead of substitution. The Williamson ether synthesis is an SN2 reaction, so the halide must be methyl or primary. A secondary or tertiary halide with a strongly basic alkoxide gives E2 elimination.", "img": "organic-chemistry/substitution-elimination/images/P081_q.png", "q": "Design a synthesis of 2-ethoxy-2-methylpropane from an alkyl halide and an alkoxide. Which combination works, and why does the other combination fail?", "a": "Use iodoethane with sodium tert-butoxide. The alternative, tert-butyl bromide with sodium ethoxide, fails because it gives E2 elimination instead of substitution.", "why": "The Williamson ether synthesis is an SN2 reaction, so the halide must be methyl or primary. A secondary or tertiary halide with a strongly basic alkoxide gives E2 elimination.", "aimg": "organic-chemistry/substitution-elimination/images/P081_a.png", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P082", "title": "Intramolecular substitution", "tag": "Intramolecular substitution", "sub": "SN2 · difficulty 3", "text": "P082 Intramolecular substitution SN2 Treatment of 4-bromobutan-1-ol with NaOH gives a cyclic ether, tetrahydrofuran (oxolane). Explain the mechanism and why a ring forms. NaOH deprotonates the OH to give an alkoxide, which attacks the carbon bearing bromine intramolecularly (SN2, 5- or 6-membered ring) displacing bromide. Intramolecular SN2 is favored because the nucleophile and electrophile are tethered together; 5- and 6-membered rings form fastest.", "img": "organic-chemistry/substitution-elimination/images/P082_q.png", "q": "Treatment of 4-bromobutan-1-ol with NaOH gives a cyclic ether, tetrahydrofuran (oxolane). Explain the mechanism and why a ring forms.", "a": "NaOH deprotonates the OH to give an alkoxide, which attacks the carbon bearing bromine intramolecularly (SN2, 5- or 6-membered ring) displacing bromide.", "why": "Intramolecular SN2 is favored because the nucleophile and electrophile are tethered together; 5- and 6-membered rings form fastest.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P083", "title": "Intramolecular substitution", "tag": "Intramolecular substitution", "sub": "SN2 · difficulty 3", "text": "P083 Intramolecular substitution SN2 Treatment of 5-bromopentan-1-ol with NaOH gives a cyclic ether, tetrahydropyran (oxane). Explain the mechanism and why a ring forms. NaOH deprotonates the OH to give an alkoxide, which attacks the carbon bearing bromine intramolecularly (SN2, 5- or 6-membered ring) displacing bromide. Intramolecular SN2 is favored because the nucleophile and electrophile are tethered together; 5- and 6-membered rings form fastest.", "img": "organic-chemistry/substitution-elimination/images/P083_q.png", "q": "Treatment of 5-bromopentan-1-ol with NaOH gives a cyclic ether, tetrahydropyran (oxane). Explain the mechanism and why a ring forms.", "a": "NaOH deprotonates the OH to give an alkoxide, which attacks the carbon bearing bromine intramolecularly (SN2, 5- or 6-membered ring) displacing bromide.", "why": "Intramolecular SN2 is favored because the nucleophile and electrophile are tethered together; 5- and 6-membered rings form fastest.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P084", "title": "Nucleophile strength", "tag": "Nucleophile strength", "sub": "SN2 · difficulty 2", "text": "P084 Nucleophile strength SN2 Rank the halide ions F⁻, Cl⁻, Br⁻, I⁻ by nucleophilicity (a) in methanol (a protic solvent) and (b) in DMSO (a polar aprotic solvent). Explain the reversal. (a) in methanol: I⁻ > Br⁻ > Cl⁻ > F⁻; (b) in DMSO: F⁻ > Cl⁻ > Br⁻ > I⁻. In protic solvents the small anions are strongly solvated by hydrogen bonding and are tied up; in polar aprotic solvents anions are not solvated, so basicity (F⁻ most basic) tracks nucleophilicity.", "img": "", "q": "Rank the halide ions F⁻, Cl⁻, Br⁻, I⁻ by nucleophilicity (a) in methanol (a protic solvent) and (b) in DMSO (a polar aprotic solvent). Explain the reversal.", "a": "(a) in methanol: I⁻ > Br⁻ > Cl⁻ > F⁻; (b) in DMSO: F⁻ > Cl⁻ > Br⁻ > I⁻.", "why": "In protic solvents the small anions are strongly solvated by hydrogen bonding and are tied up; in polar aprotic solvents anions are not solvated, so basicity (F⁻ most basic) tracks nucleophilicity.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P085", "title": "Nucleophile strength", "tag": "Nucleophile strength", "sub": "SN2 · difficulty 2", "text": "P085 Nucleophile strength SN2 Classify each as a strong or weak nucleophile and state whether it favors SN2 or SN1: (a) HS⁻ (b) H₂O (c) CH₃CH₂O⁻ (d) CH₃CH₂OH (e) I⁻ (f) CN⁻. Strong (favor SN2): HS⁻, CH₃CH₂O⁻, I⁻, CN⁻. Weak (allow SN1 to compete): H₂O, CH₃CH₂OH. Strong nucleophiles speed up SN2; the rate of SN1 does not depend on the nucleophile, so weak nucleophiles disfavor SN2 and let SN1 compete.", "img": "", "q": "Classify each as a strong or weak nucleophile and state whether it favors SN2 or SN1: (a) HS⁻ (b) H₂O (c) CH₃CH₂O⁻ (d) CH₃CH₂OH (e) I⁻ (f) CN⁻.", "a": "Strong (favor SN2): HS⁻, CH₃CH₂O⁻, I⁻, CN⁻. Weak (allow SN1 to compete): H₂O, CH₃CH₂OH.", "why": "Strong nucleophiles speed up SN2; the rate of SN1 does not depend on the nucleophile, so weak nucleophiles disfavor SN2 and let SN1 compete.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P086", "title": "Substrate reactivity", "tag": "Substrate reactivity", "sub": "SN2 · difficulty 2", "text": "P086 Substrate reactivity SN2 Rank bromomethane, 1-bromopropane, 2-bromopropane and 2-bromo-2-methylpropane from fastest to slowest toward SN2. Then give the order for SN1. SN2: bromomethane > 1-bromopropane > 2-bromopropane >> 2-bromo-2-methylpropane (essentially unreactive). SN1 is the reverse: 2-bromo-2-methylpropane > 2-bromopropane > 1-bromopropane > bromomethane. SN2 is limited by steric hindrance in the transition state; SN1 is limited by carbocation stability.", "img": "organic-chemistry/substitution-elimination/images/P086_q.png", "q": "Rank bromomethane, 1-bromopropane, 2-bromopropane and 2-bromo-2-methylpropane from fastest to slowest toward SN2. Then give the order for SN1.", "a": "SN2: bromomethane > 1-bromopropane > 2-bromopropane >> 2-bromo-2-methylpropane (essentially unreactive). SN1 is the reverse: 2-bromo-2-methylpropane > 2-bromopropane > 1-bromopropane > bromomethane.", "why": "SN2 is limited by steric hindrance in the transition state; SN1 is limited by carbocation stability.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P087", "title": "Substrate reactivity", "tag": "Substrate reactivity", "sub": "SN2 · difficulty 3", "text": "P087 Substrate reactivity SN2 Neopentyl bromide, (CH₃)₃CCH₂Br, is a primary alkyl halide. Predict whether it reacts well by SN2 or by SN1 and explain. It reacts very poorly by SN2 because of the bulky β substituents, and a primary carbocation is too unstable for SN1 (a rearrangement concerted with ionization can occur in ionizing solvents). Steric hindrance at the β position slows SN2 almost as much as α branching.", "img": "organic-chemistry/substitution-elimination/images/P087_q.png", "q": "Neopentyl bromide, (CH₃)₃CCH₂Br, is a primary alkyl halide. Predict whether it reacts well by SN2 or by SN1 and explain.", "a": "It reacts very poorly by SN2 because of the bulky β substituents, and a primary carbocation is too unstable for SN1 (a rearrangement concerted with ionization can occur in ionizing solvents).", "why": "Steric hindrance at the β position slows SN2 almost as much as α branching.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P088", "title": "Leaving groups", "tag": "Leaving groups", "sub": "SN1/SN2 · difficulty 2", "text": "P088 Leaving groups SN1/SN2 Which is the better leaving group in each pair, and why? (a) Cl⁻ or I⁻ (b) HO⁻ or H₂O (c) CH₃O⁻ or TsO⁻. (a) I⁻. (b) H₂O. (c) TsO⁻. Good leaving groups are weak bases, the conjugate bases of strong acids. Iodide is the conjugate base of HI; water is the conjugate base of H₃O⁺; tosylate is the conjugate base of a strong sulfonic acid.", "img": "", "q": "Which is the better leaving group in each pair, and why? (a) Cl⁻ or I⁻ (b) HO⁻ or H₂O (c) CH₃O⁻ or TsO⁻.", "a": "(a) I⁻. (b) H₂O. (c) TsO⁻.", "why": "Good leaving groups are weak bases, the conjugate bases of strong acids. Iodide is the conjugate base of HI; water is the conjugate base of H₃O⁺; tosylate is the conjugate base of a strong sulfonic acid.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P089", "title": "Leaving groups", "tag": "Leaving groups", "sub": "SN2 · difficulty 2", "text": "P089 Leaving groups SN2 Rank 1-chlorobutane, 1-bromobutane and 1-iodobutane by their rate of reaction with NaCN in DMSO, and explain. 1-iodobutane > 1-bromobutane > 1-chlorobutane. The rate of SN2 depends on the leaving group: iodide is the weakest base and the best leaving group.", "img": "organic-chemistry/substitution-elimination/images/P089_q.png", "q": "Rank 1-chlorobutane, 1-bromobutane and 1-iodobutane by their rate of reaction with NaCN in DMSO, and explain.", "a": "1-iodobutane > 1-bromobutane > 1-chlorobutane.", "why": "The rate of SN2 depends on the leaving group: iodide is the weakest base and the best leaving group.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P090", "title": "Solvent effects", "tag": "Solvent effects", "sub": "SN2/SN1 · difficulty 2", "text": "P090 Solvent effects SN2/SN1 Classify each solvent as protic or polar aprotic and say which substitution mechanism it favors: DMSO, methanol, acetonitrile, water, DMF, acetic acid. Polar aprotic (favor SN2): DMSO, acetonitrile, DMF. Protic (favor SN1): methanol, water, acetic acid. Protic solvents have an H on an electronegative atom; they stabilize ions and intermediates (SN1) but solvate and weaken anionic nucleophiles. Polar aprotic solvents leave the nucleophile unsolvated.", "img": "", "q": "Classify each solvent as protic or polar aprotic and say which substitution mechanism it favors: DMSO, methanol, acetonitrile, water, DMF, acetic acid.", "a": "Polar aprotic (favor SN2): DMSO, acetonitrile, DMF. Protic (favor SN1): methanol, water, acetic acid.", "why": "Protic solvents have an H on an electronegative atom; they stabilize ions and intermediates (SN1) but solvate and weaken anionic nucleophiles. Polar aprotic solvents leave the nucleophile unsolvated.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P091", "title": "Solvent effects", "tag": "Solvent effects", "sub": "SN2 · difficulty 2", "text": "P091 Solvent effects SN2 The SN2 reaction of 1-bromobutane with azide is about 1300 times faster in DMSO than in methanol. Explain. In methanol the azide ion is hydrogen-bonded to the solvent, which lowers its energy and raises the barrier. DMSO solvates the cation but not the anion, so the nucleophile is higher in energy and reacts faster. See the effect of polar aprotic solvents on nucleophile energy in the SN2 energy diagram.", "img": "", "q": "The SN2 reaction of 1-bromobutane with azide is about 1300 times faster in DMSO than in methanol. Explain.", "a": "In methanol the azide ion is hydrogen-bonded to the solvent, which lowers its energy and raises the barrier. DMSO solvates the cation but not the anion, so the nucleophile is higher in energy and reacts faster.", "why": "See the effect of polar aprotic solvents on nucleophile energy in the SN2 energy diagram.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P092", "title": "Kinetics", "tag": "Kinetics", "sub": "SN2 · difficulty 2", "text": "P092 Kinetics SN2 The reaction of 2-bromobutane with NaSH in DMSO follows the mechanism predicted for these conditions. Write the rate law. What happens to the rate if (a) [substrate] is doubled and [hydrosulfide] is unchanged, and (b) [hydrosulfide] is tripled and [substrate] is unchanged? SN2: rate = k[substrate][nucleophile]. (a) Rate doubles. (b) Rate triples. The rate law reflects the species in the rate-determining step.", "img": "", "q": "The reaction of 2-bromobutane with NaSH in DMSO follows the mechanism predicted for these conditions. Write the rate law. What happens to the rate if (a) [substrate] is doubled and [hydrosulfide] is unchanged, and (b) [hydrosulfide] is tripled and [substrate] is unchanged?", "a": "SN2: rate = k[substrate][nucleophile]. (a) Rate doubles. (b) Rate triples.", "why": "The rate law reflects the species in the rate-determining step.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P093", "title": "Kinetics", "tag": "Kinetics", "sub": "SN1 · difficulty 2", "text": "P093 Kinetics SN1 The reaction of 2-chloro-2-methylbutane with EtOH as the solvent follows the mechanism predicted for these conditions. Write the rate law. What happens to the rate if (a) [substrate] is doubled and [ethanol] is unchanged, and (b) [ethanol] is tripled and [substrate] is unchanged? SN1: rate = k[substrate]. (a) Rate doubles. (b) No change. The rate law reflects the species in the rate-determining step.", "img": "", "q": "The reaction of 2-chloro-2-methylbutane with EtOH as the solvent follows the mechanism predicted for these conditions. Write the rate law. What happens to the rate if (a) [substrate] is doubled and [ethanol] is unchanged, and (b) [ethanol] is tripled and [substrate] is unchanged?", "a": "SN1: rate = k[substrate]. (a) Rate doubles. (b) No change.", "why": "The rate law reflects the species in the rate-determining step.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P094", "title": "Kinetics", "tag": "Kinetics", "sub": "E2 · difficulty 2", "text": "P094 Kinetics E2 The reaction of 2-bromobutane with NaOEt in EtOH follows the mechanism predicted for these conditions. Write the rate law. What happens to the rate if (a) [substrate] is doubled and [ethoxide] is unchanged, and (b) [ethoxide] is tripled and [substrate] is unchanged? E2: rate = k[substrate][base]. (a) Rate doubles. (b) Rate triples. The rate law reflects the species in the rate-determining step.", "img": "", "q": "The reaction of 2-bromobutane with NaOEt in EtOH follows the mechanism predicted for these conditions. Write the rate law. What happens to the rate if (a) [substrate] is doubled and [ethoxide] is unchanged, and (b) [ethoxide] is tripled and [substrate] is unchanged?", "a": "E2: rate = k[substrate][base]. (a) Rate doubles. (b) Rate triples.", "why": "The rate law reflects the species in the rate-determining step.", "aimg": "", "meta": {"Source": "Standard elimination conventions (Zaitsev/Hofmann); not from the provided PDF"}}, {"k": "prob", "id": "P095", "title": "Kinetics", "tag": "Kinetics", "sub": "SN2 · difficulty 2", "text": "P095 Kinetics SN2 The reaction of 1-chlorobutane with NaI in acetone follows the mechanism predicted for these conditions. Write the rate law. What happens to the rate if (a) [substrate] is doubled and [iodide] is unchanged, and (b) [iodide] is tripled and [substrate] is unchanged? SN2: rate = k[substrate][nucleophile]. (a) Rate doubles. (b) Rate triples. The rate law reflects the species in the rate-determining step.", "img": "", "q": "The reaction of 1-chlorobutane with NaI in acetone follows the mechanism predicted for these conditions. Write the rate law. What happens to the rate if (a) [substrate] is doubled and [iodide] is unchanged, and (b) [iodide] is tripled and [substrate] is unchanged?", "a": "SN2: rate = k[substrate][nucleophile]. (a) Rate doubles. (b) Rate triples.", "why": "The rate law reflects the species in the rate-determining step.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P096", "title": "Classify the substrate", "tag": "Classify the substrate", "sub": "SN1/SN2 · difficulty 2", "text": "P096 Classify the substrate SN1/SN2 For each substrate, classify the α carbon (methyl, 1°, 2° or 3°), identify the leaving group, and state whether SN2, SN1, both or neither is feasible: (I) iodoethane (II) 2-bromo-2-methylbutane (III) 2-chlorobutane (IV) bromobenzene. I: 1°, I⁻, SN2 only. II: 3°, Br⁻, SN1 (SN2 impossible). III: 2°, Cl⁻, either (conditions decide). IV: aryl halide, Br⁻, neither. Methyl/primary favor SN2, tertiary favors SN1, secondary can go either way, and aryl/vinyl halides do not react.", "img": "organic-chemistry/substitution-elimination/images/P096_q.png", "q": "For each substrate, classify the α carbon (methyl, 1°, 2° or 3°), identify the leaving group, and state whether SN2, SN1, both or neither is feasible: (I) iodoethane (II) 2-bromo-2-methylbutane (III) 2-chlorobutane (IV) bromobenzene.", "a": "I: 1°, I⁻, SN2 only. II: 3°, Br⁻, SN1 (SN2 impossible). III: 2°, Cl⁻, either (conditions decide). IV: aryl halide, Br⁻, neither.", "why": "Methyl/primary favor SN2, tertiary favors SN1, secondary can go either way, and aryl/vinyl halides do not react.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P097", "title": "Classify the substrate", "tag": "Classify the substrate", "sub": "SN1/SN2 · difficulty 2", "text": "P097 Classify the substrate SN1/SN2 Label each carbon bearing a leaving group as 1°, 2° or 3° and say which substitution mechanism is favored by the substrate alone: (I) 1-bromobutane (II) 3-bromo-3-methylpentane (III) iodocyclohexane. I: 1°, SN2. II: 3°, SN1. III: 2°, either. This is the first of the four factors; secondary substrates need the nucleophile and solvent to decide.", "img": "organic-chemistry/substitution-elimination/images/P097_q.png", "q": "Label each carbon bearing a leaving group as 1°, 2° or 3° and say which substitution mechanism is favored by the substrate alone: (I) 1-bromobutane (II) 3-bromo-3-methylpentane (III) iodocyclohexane.", "a": "I: 1°, SN2. II: 3°, SN1. III: 2°, either.", "why": "This is the first of the four factors; secondary substrates need the nucleophile and solvent to decide.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P098", "title": "Which reacts faster?", "tag": "Which reacts faster?", "sub": "SN2 · difficulty 2", "text": "P098 Which reacts faster? SN2 Which compound reacts faster with NaN₃ in DMF, 1-bromobutane or 2-bromobutane? Which reacts faster with ethanol (solvolysis), 2-bromo-2-methylpropane or 2-bromopropane? 1-bromobutane (less hindered SN2). 2-bromo-2-methylpropane (more stable tertiary carbocation, SN1). SN2 rate falls as steric hindrance increases; SN1 rate rises with carbocation stability.", "img": "", "q": "Which compound reacts faster with NaN₃ in DMF, 1-bromobutane or 2-bromobutane? Which reacts faster with ethanol (solvolysis), 2-bromo-2-methylpropane or 2-bromopropane?", "a": "1-bromobutane (less hindered SN2). 2-bromo-2-methylpropane (more stable tertiary carbocation, SN1).", "why": "SN2 rate falls as steric hindrance increases; SN1 rate rises with carbocation stability.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P099", "title": "Energy diagrams", "tag": "Energy diagrams", "sub": "SN1 · difficulty 3", "text": "P099 Energy diagrams SN1 Sketch the reaction energy diagram for the SN1 solvolysis of 2-bromo-2-methylpropane in water. How many transition states and intermediates are there, and which step is rate-determining? Two steps give two transition states and one carbocation intermediate (plus a proton transfer at the end because water is neutral, so three steps). The first step, loss of bromide, is rate-determining. The number of humps equals the number of steps; the highest hump is the rate-determining step.", "img": "", "q": "Sketch the reaction energy diagram for the SN1 solvolysis of 2-bromo-2-methylpropane in water. How many transition states and intermediates are there, and which step is rate-determining?", "a": "Two steps give two transition states and one carbocation intermediate (plus a proton transfer at the end because water is neutral, so three steps). The first step, loss of bromide, is rate-determining.", "why": "The number of humps equals the number of steps; the highest hump is the rate-determining step.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "prob", "id": "P100", "title": "Energy diagrams", "tag": "Energy diagrams", "sub": "SN2 · difficulty 2", "text": "P100 Energy diagrams SN2 How does the energy diagram of an SN2 reaction differ from that of an SN1 reaction? Include the number of steps, transition states and intermediates. SN2: one step, one transition state, no intermediate. SN1: two core steps, two transition states and a carbocation intermediate. SN2 is concerted; SN1 is stepwise.", "img": "", "q": "How does the energy diagram of an SN2 reaction differ from that of an SN1 reaction? Include the number of steps, transition states and intermediates.", "a": "SN2: one step, one transition state, no intermediate. SN1: two core steps, two transition states and a carbocation intermediate.", "why": "SN2 is concerted; SN1 is stepwise.", "aimg": "", "meta": {"Source": "Klein Ch. 7 framework (four factors)"}}, {"k": "quiz", "id": "Q01", "title": "Quiz Q01 · Atom", "tag": "Atom", "sub": "Direct", "text": "Q01 Atom Direct Ethanolamine has three different kinds of hydrogen, labeled below. Which labeled H is the most acidic? Each conjugate base has its charge on a different atom: C, N or O. These are in the same row, so electronegativity decides. O is the most electronegative, so RO⁻ is the most stable base and the O–H is the most acidic. H₁ (the C–H on the carbon bearing O) H₂ (the N–H) H₃ (the O–H) All three are about equally acidic", "img": "organic-chemistry/acids-bases/img/q01.png", "q": "Ethanolamine has three different kinds of hydrogen, labeled below. Which labeled H is the most acidic?", "opts": [{"type": "text", "value": "H₁ (the C–H on the carbon bearing O)"}, {"type": "text", "value": "H₂ (the N–H)"}, {"type": "text", "value": "H₃ (the O–H)"}, {"type": "text", "value": "All three are about equally acidic"}], "a": "C", "why": "Each conjugate base has its charge on a different atom: C, N or O. These are in the same row, so electronegativity decides. O is the most electronegative, so RO⁻ is the most stable base and the O–H is the most acidic."}, {"k": "quiz", "id": "Q02", "title": "Quiz Q02 · Atom", "tag": "Atom", "sub": "Two-factor", "text": "Q02 Atom Two-factor Which labeled hydrogen in 3-mercaptopropan-1-ol is the most acidic? Compare RS⁻ with RO⁻. O and S are in the same column, so size is the dominant effect, not electronegativity. The larger S⁻ is more stable, so the S–H is more acidic. H₁ (the O–H), because O is more electronegative than S H₂ (the S–H), because S is larger than O and spreads the charge over a larger volume H₃ (the C–H next to S), because it is closest to the large S atom H₁ and H₂ are equally acidic because O and S are in the same column", "img": "organic-chemistry/acids-bases/img/q02.png", "q": "Which labeled hydrogen in 3-mercaptopropan-1-ol is the most acidic?", "opts": [{"type": "text", "value": "H₁ (the O–H), because O is more electronegative than S"}, {"type": "text", "value": "H₂ (the S–H), because S is larger than O and spreads the charge over a larger volume"}, {"type": "text", "value": "H₃ (the C–H next to S), because it is closest to the large S atom"}, {"type": "text", "value": "H₁ and H₂ are equally acidic because O and S are in the same column"}], "a": "B", "why": "Compare RS⁻ with RO⁻. O and S are in the same column, so size is the dominant effect, not electronegativity. The larger S⁻ is more stable, so the S–H is more acidic."}, {"k": "quiz", "id": "Q03", "title": "Quiz Q03 · Atom", "tag": "Atom", "sub": "Two-factor", "text": "Q03 Atom Two-factor Acetaminophen (Tylenol) is shown below. Which labeled H is the most acidic? H₁ and H₂ both give resonance-stabilized bases, so look at factor 1 first: the charge is on O in one and on N in the other. Same row, so the more electronegative O wins. H₃ and H₄ are C–H bonds, which is the weakest factor 1 outcome. H₁ (the phenol O–H), because O is more electronegative than N H₂ (the amide N–H), because the N⁻ charge is delocalized onto the carbonyl O H₃ (the aromatic C–H), because it is on an sp²-hybridized carbon H₄ (the CH₃ hydrogen), because it is next to a C=O", "img": "organic-chemistry/acids-bases/img/q03.png", "q": "Acetaminophen (Tylenol) is shown below. Which labeled H is the most acidic?", "opts": [{"type": "text", "value": "H₁ (the phenol O–H), because O is more electronegative than N"}, {"type": "text", "value": "H₂ (the amide N–H), because the N⁻ charge is delocalized onto the carbonyl O"}, {"type": "text", "value": "H₃ (the aromatic C–H), because it is on an sp²-hybridized carbon"}, {"type": "text", "value": "H₄ (the CH₃ hydrogen), because it is next to a C=O"}], "a": "A", "why": "H₁ and H₂ both give resonance-stabilized bases, so look at factor 1 first: the charge is on O in one and on N in the other. Same row, so the more electronegative O wins. H₃ and H₄ are C–H bonds, which is the weakest factor 1 outcome."}, {"k": "quiz", "id": "Q04", "title": "Quiz Q04 · Atom", "tag": "Atom", "sub": "Direct", "text": "Q04 Atom Direct Two anions are shown. Which is the stronger base, and why? Both charges are in the same row of the periodic table, so electronegativity decides. N is less electronegative than O, so N⁻ is less stable (stronger base). I, because O is more electronegative, so its charge is held more tightly II, because N is less electronegative than O, so the negative charge on N is less stable I, because O is larger than N They are equally basic because both anions have a lone pair", "img": "organic-chemistry/acids-bases/img/q04.png", "q": "Two anions are shown. Which is the stronger base, and why?", "opts": [{"type": "text", "value": "I, because O is more electronegative, so its charge is held more tightly"}, {"type": "text", "value": "II, because N is less electronegative than O, so the negative charge on N is less stable"}, {"type": "text", "value": "I, because O is larger than N"}, {"type": "text", "value": "They are equally basic because both anions have a lone pair"}], "a": "B", "why": "Both charges are in the same row of the periodic table, so electronegativity decides. N is less electronegative than O, so N⁻ is less stable (stronger base)."}, {"k": "quiz", "id": "Q05", "title": "Quiz Q05 · Resonance", "tag": "Resonance", "sub": "Direct", "text": "Q05 Resonance Direct 4-Hydroxybutanoic acid has the labeled hydrogens shown. Which is the most acidic? H₁ and H₂ both put the charge on O, so atom does not decide. The carboxylate is delocalized over two oxygens by resonance; the alkoxide is localized. H₃ is a C–H (atom favors O). H₂ (the alcohol O–H), because alcohols are more acidic than carboxylic acids H₃ (the C–H next to C=O), because it is next to a carbonyl H₁ and H₂ are equally acidic because both are on oxygen H₁ (the carboxylic acid O–H), because its conjugate base is resonance stabilized", "img": "organic-chemistry/acids-bases/img/q05.png", "q": "4-Hydroxybutanoic acid has the labeled hydrogens shown. Which is the most acidic?", "opts": [{"type": "text", "value": "H₂ (the alcohol O–H), because alcohols are more acidic than carboxylic acids"}, {"type": "text", "value": "H₃ (the C–H next to C=O), because it is next to a carbonyl"}, {"type": "text", "value": "H₁ and H₂ are equally acidic because both are on oxygen"}, {"type": "text", "value": "H₁ (the carboxylic acid O–H), because its conjugate base is resonance stabilized"}], "a": "D", "why": "H₁ and H₂ both put the charge on O, so atom does not decide. The carboxylate is delocalized over two oxygens by resonance; the alkoxide is localized. H₃ is a C–H (atom favors O)."}, {"k": "quiz", "id": "Q06", "title": "Quiz Q06 · Resonance", "tag": "Resonance", "sub": "Two-factor", "text": "Q06 Resonance Two-factor Which labeled hydrogen in the following compound is the most acidic? H₁ and H₂ are both N–H, so factor 1 ties. Deprotonating the amide N–H gives a base whose charge is delocalized onto the carbonyl O by resonance; the amine N⁻ is localized. H₃ and H₄ are C–H bonds and lose on factor 1. H₁ (the amine N–H) H₃ (the C–H next to C=O) H₂ (the amide N–H) H₄ (the C–H next to the amine N)", "img": "organic-chemistry/acids-bases/img/q06.png", "q": "Which labeled hydrogen in the following compound is the most acidic?", "opts": [{"type": "text", "value": "H₁ (the amine N–H)"}, {"type": "text", "value": "H₃ (the C–H next to C=O)"}, {"type": "text", "value": "H₂ (the amide N–H)"}, {"type": "text", "value": "H₄ (the C–H next to the amine N)"}], "a": "C", "why": "H₁ and H₂ are both N–H, so factor 1 ties. Deprotonating the amide N–H gives a base whose charge is delocalized onto the carbonyl O by resonance; the amine N⁻ is localized. H₃ and H₄ are C–H bonds and lose on factor 1."}, {"k": "quiz", "id": "Q07", "title": "Quiz Q07 · Resonance", "tag": "Resonance", "sub": "Direct", "text": "Q07 Resonance Direct Which labeled hydrogen is the most acidic? H₁ and H₂ both give O⁻, so factor 1 does not decide (H₃ is a C–H, which loses). Only the phenoxide is resonance stabilized; the benzylic alkoxide is not. H₁ (the phenol O–H), because the phenoxide charge is delocalized into the ring H₂ (the benzylic alcohol O–H), because the alkoxide is more electronegative H₃ (the benzylic C–H), because the carbanion is next to a ring All three are equally acidic", "img": "organic-chemistry/acids-bases/img/q07.png", "q": "Which labeled hydrogen is the most acidic?", "opts": [{"type": "text", "value": "H₁ (the phenol O–H), because the phenoxide charge is delocalized into the ring"}, {"type": "text", "value": "H₂ (the benzylic alcohol O–H), because the alkoxide is more electronegative"}, {"type": "text", "value": "H₃ (the benzylic C–H), because the carbanion is next to a ring"}, {"type": "text", "value": "All three are equally acidic"}], "a": "A", "why": "H₁ and H₂ both give O⁻, so factor 1 does not decide (H₃ is a C–H, which loses). Only the phenoxide is resonance stabilized; the benzylic alkoxide is not."}, {"k": "quiz", "id": "Q08", "title": "Quiz Q08 · Resonance", "tag": "Resonance", "sub": "Two-factor", "text": "Q08 Resonance Two-factor Ethyl acetoacetate has the labeled hydrogens shown. Which one is the most acidic? All four are C–H bonds, so factor 1 is a tie. Only removing H₂ gives a base whose charge is delocalized onto two carbonyl oxygens. H₁ gives a base delocalized onto only one. H₁ (the CH₃ next to the ketone) H₂ (the CH₂ between the two C=O groups) H₃ (the OCH₂ hydrogen) H₄ (the CH₃ of the ethyl group)", "img": "organic-chemistry/acids-bases/img/q08.png", "q": "Ethyl acetoacetate has the labeled hydrogens shown. Which one is the most acidic?", "opts": [{"type": "text", "value": "H₁ (the CH₃ next to the ketone)"}, {"type": "text", "value": "H₂ (the CH₂ between the two C=O groups)"}, {"type": "text", "value": "H₃ (the OCH₂ hydrogen)"}, {"type": "text", "value": "H₄ (the CH₃ of the ethyl group)"}], "a": "B", "why": "All four are C–H bonds, so factor 1 is a tie. Only removing H₂ gives a base whose charge is delocalized onto two carbonyl oxygens. H₁ gives a base delocalized onto only one."}, {"k": "quiz", "id": "Q09", "title": "Quiz Q09 · Resonance", "tag": "Resonance", "sub": "Two-factor", "text": "Q09 Resonance Two-factor Acetate is shown. Which set of curved arrows correctly converts this resonance structure into the other one? Arrow 1 starts on a lone pair of O⁻ and ends between O and C (forming the C=O π bond). Arrow 2 starts on the C=O π bond and ends on the other O (becoming a lone pair). Every arrow goes from electrons to where the electrons end up.", "img": "", "q": "Acetate is shown. Which set of curved arrows correctly converts this resonance structure into the other one?", "opts": [{"type": "img", "value": "organic-chemistry/acids-bases/img/q09_A.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q09_B.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q09_C.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q09_D.png"}], "a": "A", "why": "Arrow 1 starts on a lone pair of O⁻ and ends between O and C (forming the C=O π bond). Arrow 2 starts on the C=O π bond and ends on the other O (becoming a lone pair). Every arrow goes from electrons to where the electrons end up."}, {"k": "quiz", "id": "Q10", "title": "Quiz Q10 · Resonance", "tag": "Resonance", "sub": "Two-factor", "text": "Q10 Resonance Two-factor Which set of curved arrows correctly shows the charge of phenoxide moving onto an ortho carbon? Arrow 1: lone pair on O⁻ forms the C=O π bond. Arrow 2: the adjacent ring C=C π bond moves onto the ortho carbon as a lone pair. A single arrow leaves the ipso carbon with five bonds, and moving the electrons to a meta carbon is not a valid resonance shift. The delocalization of charge into the ring is why phenol is more acidic than an alcohol.", "img": "", "q": "Which set of curved arrows correctly shows the charge of phenoxide moving onto an ortho carbon?", "opts": [{"type": "img", "value": "organic-chemistry/acids-bases/img/q10_A.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q10_B.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q10_C.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q10_D.png"}], "a": "C", "why": "Arrow 1: lone pair on O⁻ forms the C=O π bond. Arrow 2: the adjacent ring C=C π bond moves onto the ortho carbon as a lone pair. A single arrow leaves the ipso carbon with five bonds, and moving the electrons to a meta carbon is not a valid resonance shift. The delocalization of charge into the ring is why phenol is more acidic than an alcohol."}, {"k": "quiz", "id": "Q11", "title": "Quiz Q11 · Resonance", "tag": "Resonance", "sub": "Two-factor", "text": "Q11 Resonance Two-factor Cyclopentadiene is shown. Which labeled hydrogen is the most acidic? All are C–H bonds. Removing H₁ gives the cyclopentadienyl anion, with the charge delocalized over five carbons by resonance. Removing a vinyl H (H₂ or H₃) puts the charge in an sp² orbital that does not overlap with the π system, so there is no resonance. H₂ (the vinyl H next to the CH₂) H₃ (the other vinyl H) All three are equally acidic H₁ (the CH₂ hydrogen)", "img": "organic-chemistry/acids-bases/img/q11.png", "q": "Cyclopentadiene is shown. Which labeled hydrogen is the most acidic?", "opts": [{"type": "text", "value": "H₂ (the vinyl H next to the CH₂)"}, {"type": "text", "value": "H₃ (the other vinyl H)"}, {"type": "text", "value": "All three are equally acidic"}, {"type": "text", "value": "H₁ (the CH₂ hydrogen)"}], "a": "D", "why": "All are C–H bonds. Removing H₁ gives the cyclopentadienyl anion, with the charge delocalized over five carbons by resonance. Removing a vinyl H (H₂ or H₃) puts the charge in an sp² orbital that does not overlap with the π system, so there is no resonance."}, {"k": "quiz", "id": "Q12", "title": "Quiz Q12 · Induction", "tag": "Induction", "sub": "Two-factor", "text": "Q12 Induction Two-factor Rank the carboxylic acids from LEAST acidic to MOST acidic. All three have the same atom and resonance. Cl withdraws electron density by induction and stabilizes the carboxylate. The effect weakens with distance: III (Cl on the α carbon) > II (Cl on the γ carbon) > I (no Cl). III < II < I I < II < III II < I < III I < III < II", "img": "organic-chemistry/acids-bases/img/q12.png", "q": "Rank the carboxylic acids from LEAST acidic to MOST acidic.", "opts": [{"type": "text", "value": "III < II < I"}, {"type": "text", "value": "I < II < III"}, {"type": "text", "value": "II < I < III"}, {"type": "text", "value": "I < III < II"}], "a": "B", "why": "All three have the same atom and resonance. Cl withdraws electron density by induction and stabilizes the carboxylate. The effect weakens with distance: III (Cl on the α carbon) > II (Cl on the γ carbon) > I (no Cl)."}, {"k": "quiz", "id": "Q13", "title": "Quiz Q13 · Induction", "tag": "Induction", "sub": "Two-factor", "text": "Q13 Induction Two-factor Which labeled hydrogen is the most acidic? Both conjugate bases have the charge on O with no resonance. The three F atoms on each CF₃ pull electron density through the σ bonds and stabilize the nearby O⁻. The other alkoxide is too far away to feel it. H₁, because the CF₃ groups stabilize the nearby alkoxide by induction H₂, because primary alcohols are less hindered H₂, because it is far from the electron-withdrawing groups H₁ and H₂ are equally acidic", "img": "organic-chemistry/acids-bases/img/q13.png", "q": "Which labeled hydrogen is the most acidic?", "opts": [{"type": "text", "value": "H₁, because the CF₃ groups stabilize the nearby alkoxide by induction"}, {"type": "text", "value": "H₂, because primary alcohols are less hindered"}, {"type": "text", "value": "H₂, because it is far from the electron-withdrawing groups"}, {"type": "text", "value": "H₁ and H₂ are equally acidic"}], "a": "A", "why": "Both conjugate bases have the charge on O with no resonance. The three F atoms on each CF₃ pull electron density through the σ bonds and stabilize the nearby O⁻. The other alkoxide is too far away to feel it."}, {"k": "quiz", "id": "Q14", "title": "Quiz Q14 · Induction", "tag": "Induction", "sub": "Two-factor", "text": "Q14 Induction Two-factor Which acid is the strongest? Same atom, no change in resonance. The halogen on the α carbon withdraws electron density by induction. F is the most electronegative, so FCH₂CO₂⁻ is the most stabilized.", "img": "", "q": "Which acid is the strongest?", "opts": [{"type": "img", "value": "organic-chemistry/acids-bases/img/q14_A.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q14_B.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q14_C.png"}, {"type": "img", "value": "organic-chemistry/acids-bases/img/q14_D.png"}], "a": "D", "why": "Same atom, no change in resonance. The halogen on the α carbon withdraws electron density by induction. F is the most electronegative, so FCH₂CO₂⁻ is the most stabilized."}, {"k": "quiz", "id": "Q15", "title": "Quiz Q15 · Orbitals", "tag": "Orbitals", "sub": "Direct", "text": "Q15 Orbitals Direct Which labeled hydrogen in the following compound is the most acidic? All are C–H bonds, with no resonance or induction available. Only the orbital differs: sp (alkyne) > sp² (vinyl) > sp³ (alkyl). The sp orbital has the most s character, holding the lone pair closest to the nucleus. H₂ (the internal vinyl H) H₃ (the terminal vinyl H) H₁ (the alkyne H) H₄ (the CH₂)", "img": "organic-chemistry/acids-bases/img/q15.png", "q": "Which labeled hydrogen in the following compound is the most acidic?", "opts": [{"type": "text", "value": "H₂ (the internal vinyl H)"}, {"type": "text", "value": "H₃ (the terminal vinyl H)"}, {"type": "text", "value": "H₁ (the alkyne H)"}, {"type": "text", "value": "H₄ (the CH₂)"}], "a": "C", "why": "All are C–H bonds, with no resonance or induction available. Only the orbital differs: sp (alkyne) > sp² (vinyl) > sp³ (alkyl). The sp orbital has t
